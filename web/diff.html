    document.getElementById("merge-remove-branch-label").innerHTML = texts.mergeRemoveBranch(names);
    const close = document.getElementById("merge-dialog-close");
    close.title = texts.mergeCancel;
    close.setAttribute("aria-label", texts.mergeCancel);
    document.getElementById("merge-dialog-cancel").textContent = texts.mergeCancel;
    const confirm = document.getElementById("merge-dialog-confirm");
    confirm.textContent = review.autoMerge ? texts.autoMergeButton : texts.merge;
    document.getElementById("merge-dialog").showModal();
    confirm.focus();
  }

  function initReviewActions() {
    if (mr.merge || !mr.iid) return;
    const approve = document.getElementById("approve");
    approve.addEventListener("click", () => approve.classList.contains("done")
      ? reviewAction("gitlab/unapprove", texts.unapproving)
      : reviewAction("gitlab/approve", texts.approving));
    const dialog = document.getElementById("merge-dialog");
    const merge = document.getElementById("merge");
    merge.addEventListener("click", () => merge.classList.contains("done")
      ? reviewAction("gitlab/cancel-auto-merge", texts.cancellingAutoMerge)
      : openMergeDialog());
    document.getElementById("merge-dialog-close").addEventListener("click", () => dialog.close());
    document.getElementById("merge-dialog-cancel").addEventListener("click", () => dialog.close());
    document.getElementById("merge-dialog-confirm").addEventListener("click", async () => {
      dialog.close();
      const auto = review.autoMerge;
      const squashOption = review.project?.squash_option;
      const merged = await reviewAction("gitlab/merge", texts.merging, {
        // The project decides when it never or always squashes: GitLab refuses any other choice.
        ...(squashOption === "never" || squashOption === "always" ? {} : { squash: document.getElementById("merge-squash").checked }),
        remove_source_branch: document.getElementById("merge-remove-branch").checked,
        ...(auto ? { auto_merge: true } : {}),
      });
      const done = merged?.state === "merged" ? texts.mergedDone : auto && merged ? texts.autoMergeSet : "";
      if (done) document.getElementById("review-actions-status").textContent = done;
    });
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") loadReviewRights();
    });
  }

  function initAi() {
    if (mr.merge || !mr.iid) return;
    let launchTargets = [];
    config().then(c => { launchTargets = c.launchTargets ?? []; }).catch(() => { /* no config, prompts are copied */ });
    MrAi.init({ lang, launchTargets: () => launchTargets });
    const aiMr = { iid: mr.iid, title: mr.title, source_branch: mr.branch, target_branch: mr.target, web_url: mr.url };
    const button = document.getElementById("ai-button");
    button.textContent = MrAi.t("ai");
    const render = () => {
      const { toFix } = MrAi.readFixContext(mr.iid);
      button.hidden = !MrAi.offered(toFix);
      button.classList.toggle("to-fix", toFix);
      button.title = MrAi.buttonTitle(toFix);
    };
    button.addEventListener("click", () => MrAi.open(
      aiMr,
      () => {
        render();
        return MrAi.readFixContext(mr.iid);
      }
    ));
    window.addEventListener("storage", event => {
      if (event.key === MrAi.FIX_CONTEXTS_KEY) render();
    });
    MrAi.loadCatalog().then(render);
  }

  function mrQuery() {
    return new URLSearchParams(mr.merge
      ? { iid: mr.iid, head: mr.head, merge: mr.merge, target: mr.target }
      : { branch: mr.branch, target: mr.target });
  }

  async function fetchText(url) {
    const response = await fetch(url);
    if (!response.ok) {
      const body = await response.json().catch(() => ({}));
      throw new Error(body.message || `HTTP ${response.status}`);
    }
    return response.text();
  }

  async function load() {
    if (!mr.branch || !mr.target) {
      showMessage(mrError ? `${texts.invalid} (${mrError})` : texts.invalid, true);
      return;
    }
    try {
      commits = JSON.parse(await fetchText(`git/commits?${mrQuery()}`));
    } catch (error) {
      commitsError = error.message;
    }
    const first = params.get("first");
    const last = params.get("last");
    const shas = commits?.map(c => c.sha) ?? [];
    if (first && last && shas.includes(first) && shas.indexOf(first) <= shas.indexOf(last)) {
      range = [shas.indexOf(first), shas.indexOf(last)];
      anchor = range[0];
    }
    renderRangeLabel();
    if (commits?.length) {
      seenAtOpen = readSeen();
      await loadPushes();
    }
    if (readNotesEnabled()) await ensureDiscussions();
    await loadDiff();
  }

  async function loadDiff() {
    const seq = ++loadSeq;
    const query = diffQuery();
    // The reviewed diff may have new commits: whole files are re-read with it.
    wholeFileDiffs.clear();
    let text;
    try {
      text = await fetchText(`git/diff?${query}`);
      await Promise.all([...wholeFiles].map(path => loadWholeFile(path.split(" → ")).catch(() => wholeFiles.delete(path))));
    } catch (error) {
      if (seq === loadSeq) showMessage(texts.failed(error.message), true);
      return;
    }
    if (seq !== loadSeq) return;
    diffText = text;
    render();
    markSeen();
  }

  // Tooltip of [data-tip] elements, after the same short delay as the browser's. Attached to the element, it
  // stays open when the mouse moves over it, long enough to select its text to copy it; an ongoing selection
  // keeps it open. A click elsewhere, a scroll or Escape closes it.
  const tip = Object.assign(document.createElement("div"), { className: "tip", hidden: true });
  tip.setAttribute("role", "tooltip");
  document.body.append(tip);
  let tipOwner = null;
  let tipTimer = 0;
  // Grace delay between leaving the element and reaching the tooltip.
  const TIP_LEAVE_MS = 300;

  const tipSelected = () => {
    const selection = getSelection();
    return !tip.hidden && !selection.isCollapsed && tip.contains(selection.anchorNode);
  };

  function hideTip() {
    clearTimeout(tipTimer);
    tipOwner = null;
    tip.hidden = true;
  }

  function leaveTip() {
    clearTimeout(tipTimer);
    tipTimer = setTimeout(() => {
      if (!tipSelected()) hideTip();
    }, TIP_LEAVE_MS);
  }

  function showTip(owner, text = owner.dataset.tip) {
    tip.textContent = text;
    tip.hidden = false;
    const box = owner.getBoundingClientRect();
    tip.style.top = `${box.bottom + tip.offsetHeight > innerHeight ? box.top - tip.offsetHeight + 1 : box.bottom - 1}px`;
    tip.style.left = `${Math.max(4, Math.min(box.left, innerWidth - tip.offsetWidth - 4))}px`;
  }

  document.addEventListener("mouseover", e => {
    const owner = e.target.closest("[data-tip]") ?? (tipOwner?.contains(e.target) ? tipOwner : null);
    if (tip.contains(e.target) || (owner && owner === tipOwner)) {
      if (!tip.hidden) clearTimeout(tipTimer);
      return;
    }
    if (tipSelected()) return;
    if (!owner) {
      if (tip.hidden) hideTip();
      else leaveTip();
      return;
    }
    hideTip();
    tipOwner = owner;
    tipTimer = setTimeout(() => showTip(owner), 500);
  });

  // Tooltip opened immediately by a click, on an element without [data-tip]: it closes like the others.
  function showTipFor(owner, text) {
    hideTip();
    tipOwner = owner;
    showTip(owner, text);
  }
  document.addEventListener("mousedown", e => {
    if (!tip.contains(e.target)) hideTip();
  });
  document.addEventListener("scroll", hideTip, true);
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && !tip.hidden) hideTip();
  });
  document.documentElement.addEventListener("mouseleave", leaveTip);

  document.getElementById("diff").addEventListener("click", e => {
    const lineNumber = e.target.closest("#diff-files td.d2h-code-side-linenumber, #diff-files td.d2h-code-linenumber");
    if (lineNumber) {
      if (e.shiftKey) getSelection()?.removeAllRanges();
      commentLine(lineNumber, e.shiftKey);
      return;
    }
    if (e.target.closest("[data-editor-cancel]")) {
      closeEditor();
      return;
    }
    if (e.target.closest("[data-range='new']")) {
      anchor = seenAtOpen + 1;
      selectRange([seenAtOpen + 1, commits.length - 1]);
      return;
    }
    if (e.target.closest("[data-range='all']")) {
      anchor = null;
      selectRange(null);
      return;
    }
    if (e.target.closest("[data-unpushed]")) {
      const first = commits.findIndex(c => c.local);
      anchor = first;
      selectRange([first, commits.length - 1]);
      return;
    }
    const push = e.target.closest("[data-push]");
    if (push) {
      const { first, last } = pushes[Number(push.dataset.push)];
      anchor = first;
      selectRange([first, last]);
      return;
    }
    const item = e.target.closest("#commit-list li[data-index]");
    if (!item) return;
    const index = Number(item.dataset.index);
    if (e.shiftKey && anchor !== null) {
      selectRange([Math.min(anchor, index), Math.max(anchor, index)]);
    } else {
      anchor = index;
      selectRange([index, index]);
    }
  });

  GitlabNotes.handleThreads(document.getElementById("diff"), { iid: mr.iid, lang, refresh: refreshThread });
  document.getElementById("diff").addEventListener("submit", e => {
    if (!e.target.matches(".note-editor")) return;
    e.preventDefault();
    publishNote(e.target);
  });
  document.getElementById("diff").addEventListener("keydown", e => {
    const form = e.target.closest?.(".note-editor");
    if (!form) return;
    if (e.key === "Escape") closeEditor();
    else if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) form.requestSubmit();
  });
  document.getElementById("format").addEventListener("click", e => {
    const button = e.target.closest("[data-format]");
    if (!button) return;
    saveFormat(button.dataset.format);
    render();
  });
  document.getElementById("text-size").addEventListener("click", e => {
    const button = e.target.closest("[data-text-step]");
    if (button) changeTextScale(Number(button.dataset.textStep));
  });
  // Dashboard A− / A+, or the page's in another tab: applied at once.
  addEventListener("storage", e => {
    if (e.key === DASHBOARD_TEXT_SCALE_KEY) {
      if (e.newValue) document.documentElement.style.setProperty("--text-scale", e.newValue);
      else document.documentElement.style.removeProperty("--text-scale");
    }
    if (e.key === DASHBOARD_TEXT_SCALE_KEY || e.key === TEXT_SCALE_KEY) applyTextScale(readTextScale());
  });
  document.getElementById("notes-toggle").addEventListener("click", () => {
    const enabled = !readNotesEnabled();
    saveEnabled(NOTES_KEY, enabled);
    if (enabled) showNotes();
    else {
      currentNote = -1;
      renderNotesToggle();
      render();
      renderNotesNav();
    }
  });
  document.getElementById("notes-nav").addEventListener("click", e => {
    const button = e.target.closest("[data-note-step]");
    if (button) goToNote(Number(button.dataset.noteStep));
  });
  renderNotesToggle();
  loadMr().then(() => {
    renderHeader();
    if (mr.author) renderAuthor();
    initAi();
    initReviewActions();
    load().then(loadReviewRights);
  });
</script>
</body>
</html>
