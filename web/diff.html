<script>
  // Dashboard theme and text size, set before the first render.
  try {
    const scale = Number(localStorage.getItem("mr-dashboard.textScale"));
    if (scale) document.documentElement.style.setProperty("--text-scale", scale);
    const ratio = Number(localStorage.getItem("mr-dashboard.diffTextRatio"));
    if (ratio) document.documentElement.style.setProperty("--diff-ratio", ratio);
    const theme = localStorage.getItem("mr-dashboard.theme");
    document.documentElement.dataset.theme = theme === "light" || theme === "dark" ? theme
      : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";

    document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";

  .d2h-file-wrapper.wrap-lines .d2h-code-line-ctn { white-space: pre-wrap; overflow-wrap: anywhere; }
  .d2h-file-wrapper.wrap-lines .d2h-file-side-diff { overflow-x: hidden; }
  /* Space held: open hand over the code, closed while dragging; text is not selected. */
  #diff-files.pan-ready { user-select: none; }
  #diff-files.pan-ready :is(.d2h-file-diff, .d2h-file-side-diff), #diff-files.pan-ready :is(.d2h-file-diff, .d2h-file-side-diff) * { cursor: grab !important; }
  #diff-files.panning :is(.d2h-file-diff, .d2h-file-side-diff), #diff-files.panning :is(.d2h-file-diff, .d2h-file-side-diff) * { cursor: grabbing !important; }
  /* ADDED / CHANGED / DELETED / RENAMED marker at the start of the header, fixed width: the file name starts
     at the same place whatever the marker, where the eye always finds it. */
  .d2h-tag {
    order: -1; flex: none; justify-content: center; box-sizing: border-box; width: 6.5em;
    margin: 0 0.6rem 0 0; font-size: 0.65rem;
  }
  .text-size { display: flex; align-items: center; gap: 0.25rem; }
  .text-size button { border-radius: 0.5rem; padding: 0.3em 0.6em; }
  .text-size button:disabled { opacity: 0.4; cursor: default; }
  .text-size output { min-width: 3.2em; text-align: center; font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  /* Commit and file tooltips: the browser's, tiny and wrapped into narrow lines, reads poorly. Here at the page's
     text size, each line unbroken as long as the screen is wide enough. */
  .tip {
    position: fixed; z-index: 30; box-sizing: border-box; user-select: text; cursor: text;
    width: max-content; max-width: calc(100vw - 1rem); padding: 0.4rem 0.65rem;
    font-size: 1rem; line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere;
    color: var(--text); background: var(--surface); border: 1px solid var(--border-strong); border-radius: 0.45rem;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.18);
  }
  .tip[hidden] { display: none; }
  /* File header stuck below the page header, which its own (stickyFileHeaders) would slide under. */
  .d2h-file-header { position: sticky; top: var(--header-height, 0); z-index: 2; }
  /* Selection and scrollbars in the page colors, not the browser's. */
  ::selection { background: color-mix(in srgb, var(--accent) 28%, transparent); }
  html { scrollbar-color: var(--border-strong) transparent; }
</style>
</head>

  // Dashboard language, kept by its FR / EN button: the URL usually provides it.
  function savedLang() {
    try {
      const lang = localStorage.getItem("mr-dashboard.lang");
      return lang in TEXTS ? lang : "en";
    } catch (ignored) {
      return "en";
    }
  }

  const texts = TEXTS[lang];
  // The URL carries only the MR number: the rest is read from GitLab (loadMr), always current.
  const mr = {
    iid: params.get("iid") ?? "",
    title: "",
    branch: "",
    target: "",
    url: "",
    author: "",
    // Merged MR: its last commit and its merge commit, as the source branch may be gone.
    head: "",
    merge: "",
  };
  MrTabs.claim("diff", mr.iid);
  showLoadedAt(document.getElementById("loaded-at"), lang);
  let mrError = null;
  let diffText = null;
  // MR commits, oldest to newest; displayed range as indices, null for the whole diff.
  let commits = null;
  let commitsError = null;
  let range = null;
  let anchor = null;
  // MR pushes, from its GitLab versions: [first, last] commit index and date.
  let pushes = [];
  // Last commit read when the page opened, not at each displayed range: otherwise new ones
  // would stop being new at first glance. -1: nothing read, or a commit no longer in the MR.
  let seenAtOpen = -1;
  let loadSeq = 0;
  // GitLab diff discussions, loaded when comments are first shown; null: not yet.
  let discussions = null;
  // Note HTML rendered by GitLab, by note id; a missing note is read as text.
  let notesHtml = new Map();
  let gitlabWeb = "";
  let discussionsError = null;
  // Latest GitLab version of the MR: the position of a still-valid note is moved to its latest
  // commit on each push, that of an outdated note stays on an older commit. A new note
  // is positioned on it.
  let latestVersion = null;
  // Lines to comment: their table (one side in side-by-side), the clicked line then the Shift+click one,
  // and the editor open under the last one.
  let selection = null;
  // Current comment thread of the ‹ › navigation, as an index in diff order; -1: none yet.
  let currentNote = -1;
  // File filter, kept from one diff render to the next (format, commit range, notes).
  // Filter in the URL: a reload reopens the diff with the same one.
  const fileFilter = { text: params.get("filter") ?? "", exclude: params.get("exclude") === "1" };

  function writeFilterToUrl() {
    const url = new URL(location.href);
    if (fileFilter.text.trim()) {
      url.searchParams.set("filter", fileFilter.text);
    } else {
      url.searchParams.delete("filter");
    }
    if (fileFilter.exclude) {
      url.searchParams.set("exclude", "1");
    } else {
      url.searchParams.delete("exclude");
    }
    history.replaceState(null, "", url);
  }
  // Clears the filter of the displayed diff; null until a file list is drawn.
  let clearFileFilter = null;
  // Files shown with line wrapping, by path: the choice survives diff renders.
  const wrappedFiles = new Set();
  // Files shown in full, by path, and their full-context diff by commit range and path.
  const wholeFiles = new Set();
  const wholeFileDiffs = new Map();
  // Beyond this, in added or removed lines, the diff is highlighted only as it nears the screen: highlighting
  // a large diff at once freezes the page and multiplies the elements it keeps in memory.
  const LARGE_DIFF_LINES = 2000;
  // Beyond this, a file opens collapsed, even in a small diff: a single lockfile or generated script is enough to weigh the page down.
  const LARGE_FILE_LINES = 1000;
  // Lines highlighted in one go, before yielding to scrolling.
  const HIGHLIGHT_SLICE = 200;
  // Expanded large files, by path: the choice survives diff renders.
  const unfoldedFiles = new Set();
  // Highlights the files of a large diff as they near the screen; null: diff highlighted at once.
  let highlightObserver = null;
  // Stops tracking review of the displayed diff, at the next render.
  let reviewTracking = null;
  // Height of threads placed in the diff: the empty line opposite follows it (collapsed thread, reply open…).
  let notesObserver = null;

  function escapeHtml(text) {
    return String(text).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  }

  function readFormat() {
    try {
      return localStorage.getItem(FORMAT_KEY) === "line-by-line" ? "line-by-line" : "side-by-side";
    } catch (ignored) {
      return "side-by-side";
    }
  }

  function saveFormat(format) {
    try {
      localStorage.setItem(FORMAT_KEY, format);
    } catch (ignored) { /* storage unavailable: the format is not kept */ }
  }

  function readTextScale() {
    try {
      const scale = Number(localStorage.getItem(TEXT_SCALE_KEY));
      return TEXT_SCALES.includes(scale) ? scale : DEFAULT_TEXT_SCALE;
    } catch (ignored) {
      return DEFAULT_TEXT_SCALE;
    }
  }

  function applyTextScale(scale) {
    document.documentElement.style.setProperty("--diff-ratio", scale);
    document.getElementById("text-scale").textContent = `${Math.round(scale * 100)} %`;
    for (const button of document.querySelectorAll("[data-text-step]")) {
      const next = TEXT_SCALES.indexOf(scale) + Number(button.dataset.textStep);
      button.disabled = next < 0 || next >= TEXT_SCALES.length;
    }
  }

  function changeTextScale(step) {
    const scale = TEXT_SCALES[TEXT_SCALES.indexOf(readTextScale()) + step];
    if (scale === undefined) return;
    try {
      localStorage.setItem(TEXT_SCALE_KEY, String(scale));
    } catch (ignored) { /* storage unavailable: the size applies to this tab only */ }
    applyTextScale(scale);
  }

  function showMessage(text, error) {
    document.getElementById("diff").innerHTML = `<p class="message${error ? " error" : ""}">${escapeHtml(text)}</p>`;
  }

  function render() {
    const format = readFormat();
    for (const button of document.querySelectorAll("[data-format]")) {
      button.setAttribute("aria-pressed", String(button.dataset.format === format));
    }
    if (diffText === null) return;
    selection = null;
    highlightObserver?.disconnect();
    highlightObserver = null;
    reviewTracking?.abort();
    reviewTracking = null;
    for (const id of ["diff-size", "large-diff", "review-progress", "review-bar"]) document.getElementById(id).hidden = true;
    const main = document.getElementById("diff");
    const listScroll = document.getElementById("commit-list")?.scrollTop ?? null;
    main.innerHTML = `<aside id="side"><section id="commits" hidden></section><div id="split" role="separator" aria-orientation="horizontal" title="${escapeHtml(texts.splitTitle)}"></div><div id="files"></div></aside><div id="diff-files"></div>`;
    main.classList.add("with-files");
    clearFileFilter = null;
    showPartialDiff(null);
    renderCommits(listScroll);
    const container = document.getElementById("diff-files");
    if (!diffText.trim()) {
      container.innerHTML = `<p class="message">${escapeHtml(range ? texts.emptyRange : texts.empty)}</p>`;
      return;
    }
    const ui = new Diff2HtmlUI(
      container,
      withWholeFiles(diffText),
      {
        outputFormat: format,
        drawFileList: true,
        fileListToggle: false,
        fileContentToggle: true,
        matching: "lines",
        synchronisedScroll: true,
        stickyFileHeaders: false,
        highlight: true,
        colorScheme: document.documentElement.dataset.theme === "dark" ? "dark" : "light",
      }
    );
    ui.draw();
    const changed = changedLines(container);
    highlight(ui, container, changed);
    trackReview(changed);
    addWrapToggles(container);
    addWholeFileToggles(container);
    showFileList(container);
    showDiffSize();
    if (readNotesEnabled()) placeNotes(container);
    // Diff notes hidden: a click on a line number shows them before commenting it.
    container.classList.toggle("can-comment", canComment() || (!readNotesEnabled() && !commentBlocker()));
  }

  // Highlighting of a single file, in slices of lines: in one block, a large file would freeze scrolling.
  // diff2html's walks the files of its target, then their lines: the target only presents it
  // one, and of that file only the current slice. A re-rendered diff stops the old one's.
  function highlightFile(ui, wrapper) {
    const lines = [...wrapper.querySelectorAll(".d2h-code-line-ctn")];
    const file = { getAttribute: name => wrapper.getAttribute(name), querySelectorAll: () => lines.splice(0, HIGHLIGHT_SLICE) };
    const slicer = Object.create(ui, { targetElement: { value: { querySelectorAll: () => [file] } } });
    const next = () => {
      if (!wrapper.isConnected) return;
      slicer.highlightCode();
      if (lines.length) setTimeout(next);
    };
    next();
  }

  // Large file collapsed behind a button; small diff highlighted at once, large diff as it nears the screen.
  // Added or removed lines of each file, without context.
  const changedLines = container => new Map([...container.querySelectorAll(".d2h-file-wrapper")].map(wrapper => [
    wrapper,
    wrapper.querySelectorAll(":is(.d2h-ins, .d2h-del) .d2h-code-line-ctn").length,
  ]));

  function highlight(ui, container, changed) {
    const wrappers = [...changed.keys()];
    const total = [...changed.values()].reduce((sum, lines) => sum + lines, 0);
    const large = total > LARGE_DIFF_LINES;
    const badge = document.getElementById("large-diff");
    badge.hidden = !large;
    badge.textContent = large ? texts.largeDiff({ lines: total }) : "";
    if (large) {
      highlightObserver = new IntersectionObserver(entries => {
        for (const entry of entries) {
          if (!entry.isIntersecting || entry.target.classList.contains("folded")) continue;
          highlightObserver.unobserve(entry.target);
          highlightFile(ui, entry.target);
        }
      }, { rootMargin: "100% 0px" });
    }
    for (const wrapper of wrappers) {
      const lines = changed.get(wrapper);
      if (lines > LARGE_FILE_LINES) fold(ui, wrapper, lines);
      else if (!large) highlightFile(ui, wrapper);
      if (large) highlightObserver.observe(wrapper);
    }
  }

  function fold(ui, wrapper, lines) {
    const path = wrapperPaths(wrapper).join(" → ");
    if (unfoldedFiles.has(path)) {
      if (!highlightObserver) highlightFile(ui, wrapper);
      return;
    }
    wrapper.classList.add("folded");
    const button = Object.assign(document.createElement("button"), { type: "button", className: "unfold" });
    button.textContent = texts.unfold({ lines });
    button.addEventListener("click", () => {
      unfoldedFiles.add(path);
      button.remove();
      wrapper.classList.remove("folded");
      if (!highlightObserver) {
        highlightFile(ui, wrapper);
        return;
      }
      // Already on screen, it would only be reported on leaving: observed again, it is highlighted at once.
      highlightObserver.unobserve(wrapper);
      highlightObserver.observe(wrapper);
    });
    wrapper.querySelector(".d2h-file-header").after(button);
  }

  // Added and removed lines, repeated in the header: the sum of the file list counters.
  function showDiffSize() {
    const sum = selector => [...document.querySelectorAll(`#files ${selector}`)]
      .reduce((total, count) => total + (Number(count.textContent.replace(/\D/g, "")) || 0), 0);
    const size = document.getElementById("diff-size");
    const [added, deleted] = size.children;
    added.textContent = `+${sum(".d2h-lines-added").toLocaleString(lang)}`;
    deleted.textContent = `−${sum(".d2h-lines-deleted").toLocaleString(lang)}`;
    size.title = texts.diffSize;
    size.hidden = false;
  }

  // "Wrap lines" checkbox before "Viewed", same look, in each file header.
  function addWrapToggles(container) {
    for (const wrapper of container.querySelectorAll(".d2h-file-wrapper")) {
      const viewed = wrapper.querySelector(".d2h-file-header .d2h-file-collapse");
      if (!viewed) continue;
      const path = wrapperPaths(wrapper).join(" → ");
      const label = document.createElement("label");
      label.className = "d2h-file-collapse wrap-toggle";
      label.title = texts.wrapLinesTitle;
      label.innerHTML = `<input class="d2h-file-collapse-input" type="checkbox"> ${escapeHtml(texts.wrapLines)}`;
      viewed.before(label);
      const input = label.querySelector("input");
      const observer = new ResizeObserver(() => alignWrappedRows(wrapper));
      const apply = () => {
        wrapper.classList.toggle("wrap-lines", input.checked);
        label.classList.toggle("d2h-selected", input.checked);
        if (input.checked) {
          for (const table of wrapper.querySelectorAll(".d2h-diff-table")) observer.observe(table);
        } else {
          observer.disconnect();
        }
        alignWrappedRows(wrapper);
      };
      input.checked = wrappedFiles.has(path);
      input.addEventListener("change", () => {
        if (input.checked) wrappedFiles.add(path);
        else wrappedFiles.delete(path);
        apply();
      });
      apply();
    }
  }

  // "Whole file" checkbox before "Wrap lines": the file is requested again with full context,
  // then replaces its own in the diff, which is redrawn; notes, filter and checkboxes follow as on any render.
  function addWholeFileToggles(container) {
    for (const wrapper of container.querySelectorAll(".d2h-file-wrapper")) {
      const anchor = wrapper.querySelector(".d2h-file-header .wrap-toggle");
      if (!anchor) continue;
      const paths = wrapperPaths(wrapper);
      const path = paths.join(" → ");
      const label = document.createElement("label");
      label.className = "d2h-file-collapse wrap-toggle";
      label.title = texts.wholeFileTitle;
      label.innerHTML = `<input class="d2h-file-collapse-input" type="checkbox"> ${escapeHtml(texts.wholeFile)}`;
      anchor.before(label);
      const input = label.querySelector("input");
      input.checked = wholeFiles.has(path);
      label.classList.toggle("d2h-selected", input.checked);
      input.addEventListener("change", async () => {
        input.disabled = true;
        if (input.checked) {
          try {
            await loadWholeFile(paths);
          } catch (error) {
            input.checked = false;
            input.disabled = false;
            label.classList.add("failed");
            label.title = texts.wholeFileFailed(error);
            return;
          }
          wholeFiles.add(path);
        } else {
          wholeFiles.delete(path);
        }
        rerenderKeeping(path);
      });
    }
  }

  // Displayed range, as a query: a whole-file diff is specific to the range.
  function diffQuery() {
    const query = mrQuery();
    if (range) {
      query.set("first", commits[range[0]].sha);
      query.set("last", commits[range[1]].sha);
    }
    return query;
  }

  const wholeFileKey = paths => `${diffQuery()}|${paths.join(" → ")}`;

  async function loadWholeFile(paths) {
    const key = wholeFileKey(paths);
    if (wholeFileDiffs.has(key)) return;
    const query = diffQuery();
    for (const path of new Set(paths)) query.append("path", path);
    wholeFileDiffs.set(key, await fetchText(`git/diff?${query}`));
  }

  // Diff split by file, on its "diff --git" lines; the first line of each identifies it.
  const splitFiles = text => text.split(/^(?=diff --git )/m);

  // Displayed diff: each file requested in full takes the place of its own.
  function withWholeFiles(text) {
    const replacements = new Map();
    for (const path of wholeFiles) {
      const whole = wholeFileDiffs.get(`${diffQuery()}|${path}`);
      for (const file of whole ? splitFiles(whole) : []) {
        if (file.startsWith("diff --git ")) replacements.set(file.slice(0, file.indexOf("\n")), file);
      }
    }
    if (!replacements.size) return text;
    return splitFiles(text).map(file => {
      const whole = replacements.get(file.slice(0, file.indexOf("\n")));
      return whole ? whole + (file.endsWith("\n") && !whole.endsWith("\n") ? "\n" : "") : file;
    }).join("");
  }

  // Redraws the diff keeping the header of the toggled file at the same place on screen.
  function rerenderKeeping(path) {
    const find = () => [...document.querySelectorAll("#diff-files .d2h-file-wrapper")]
      .find(wrapper => wrapperPaths(wrapper).join(" → ") === path);
    const top = find()?.getBoundingClientRect().top;
    render();
    const wrapper = find();
    if (wrapper && top !== undefined) window.scrollBy(0, wrapper.getBoundingClientRect().top - top);
  }

  // In side-by-side, each column is a separate table: a wrapped line on one side would shift everything
  // after it on the other. Each pair of lines takes the height of the taller one; comment
  // threads have their own alignment.
  function alignWrappedRows(wrapper) {
    const sides = [...wrapper.querySelectorAll(".d2h-file-side-diff tbody")];
    if (sides.length !== 2) return;
    const [left, right] = sides.map(tbody => [...tbody.children].filter(row => !row.classList.contains("note-row")));
    const rows = [...left, ...right];
    for (const row of rows) row.style.height = "";
    if (!wrapper.classList.contains("wrap-lines") || left.length !== right.length) return;
    const heights = left.map((row, i) => Math.max(row.offsetHeight, right[i].offsetHeight));
    left.forEach((row, i) => {
      if (row.offsetHeight !== right[i].offsetHeight) {
        row.style.height = `${heights[i]}px`;
        right[i].style.height = `${heights[i]}px`;
      }
    });
  }

  // The list drawn by diff2html moves into the panel; each file shows its name, then its directory.
  function showFileList(container) {
    const list = container.querySelector(".d2h-file-list-wrapper");
    if (!list) return;
    document.getElementById("files").append(list);
    const lines = new Map();
    for (const link of list.querySelectorAll("a.d2h-file-name")) {
      const path = link.textContent.trim();
      const cut = path.lastIndexOf("/") + 1;
      link.dataset.tip = path;
      link.innerHTML = `<span class="file-base">${escapeHtml(path.slice(cut))}</span>`
        + (cut ? `<span class="file-dir">${escapeHtml(path.slice(0, cut))}</span>` : "");
      lines.set(link.getAttribute("href").slice(1), link.closest(".d2h-file-list-line"));
    }
    addFileFilter(list, lines);
    followCurrentFile(container, lines);
  }

  // Filter field next to the list title: shows, or hides, only the files whose path matches.
  function addFileFilter(list, lines) {
    const title = list.querySelector(".d2h-file-list-title");
    if (!title) return;
    const box = document.createElement("span");
    box.className = "file-filter";
    box.innerHTML = `<input type="search" spellcheck="false" list="file-filters" placeholder="${escapeHtml(texts.filterPlaceholder)}" title="${escapeHtml(texts.filterTitle)}">`
      + `<datalist id="file-filters"></datalist><button type="button" title="${escapeHtml(texts.filterModeTitle)}"></button>`;
    title.after(box);
    const input = box.querySelector("input");
    const suggestions = box.querySelector("datalist");
    const suggest = () => {
      suggestions.innerHTML = rememberedFilters().map(f => `<option value="${escapeHtml(f.text)}"`
        + `${f.exclude ? ` label="${escapeHtml(texts.filterExcluded)}"` : ""}></option>`).join("");
    };
    // A filter counts as used once committed (Enter, leaving the field, picking a suggestion),
    // not on each keystroke: a partial entry must not be kept.
    const remember = () => {
      rememberFilter(fileFilter);
      suggest();
    };
    const mode = box.querySelector("button");
    const apply = () => {
      mode.textContent = fileFilter.exclude ? texts.filterExclude : texts.filterInclude;
      mode.setAttribute("aria-pressed", String(fileFilter.exclude));
      writeFilterToUrl();
      applyFileFilter(title, lines);
    };
    // Navigable threads change with the filter: ‹ › navigation restarts from the first.
    const change = () => {
      currentNote = -1;
      apply();
      renderNotesNav();
    };
    clearFileFilter = () => {
      input.value = fileFilter.text = "";
      change();
    };
    input.value = fileFilter.text;
    input.addEventListener("input", event => {
      fileFilter.text = input.value;
      // Suggestion picked from the list: it comes back with its mode.
      const picked = !(event instanceof InputEvent) || event.inputType === "insertReplacementText";
      const known = picked && rememberedFilters().find(f => f.text === input.value);
      if (known) fileFilter.exclude = known.exclude;
      change();
      if (known) remember();
    });
    input.addEventListener("change", remember);
    input.addEventListener("keydown", event => {
      if (event.key !== "Escape" || !input.value) return;
      event.stopPropagation();
      clearFileFilter();
    });
    mode.addEventListener("click", () => {
      fileFilter.exclude = !fileFilter.exclude;
      change();
      remember();
    });
    suggest();
    apply();
  }

  // Filters already used, from most to least likely to be reused: every use counts, recent ones
  // more. A filter used once is offered the same day then disappears; a frequent filter
  // survives a few days without use. Same principle as browsers' address bar.
  const FILTER_SUGGESTIONS = 8;
  const FILTERS_KEPT = 30;
  const HOUR_MS = 3600000;

  function filterScore(entry, now) {
    const age = now - entry.last;
    const recency = age < HOUR_MS ? 4 : age < 24 * HOUR_MS ? 2 : age < 7 * 24 * HOUR_MS ? 0.5 : 0.25;
    return entry.count * recency;
  }

  function readFilterHistory() {
    try {
      const saved = JSON.parse(localStorage.getItem(FILE_FILTERS_KEY));
      return Array.isArray(saved) ? saved.filter(e => typeof e?.text === "string" && Number.isFinite(e.count) && Number.isFinite(e.last)) : [];
    } catch (ignored) {
      return [];
    }
  }

  function rememberedFilters() {
    const now = Date.now();
    return readFilterHistory()
      .map(entry => ({ ...entry, score: filterScore(entry, now) }))
      .filter(entry => entry.score >= 1)
      .sort((a, b) => b.score - a.score || b.last - a.last)
      .slice(0, FILTER_SUGGESTIONS);
  }

  function rememberFilter({ text, exclude }) {
    const value = text.trim();
    if (!fileMatchers(value).length) return;
    const now = Date.now();
    const history = readFilterHistory();
    const entry = history.find(e => e.text === value && !!e.exclude === exclude);
    // Picking the filter already shown again, or leaving the field unchanged, is not one more use.
    if (entry && now - entry.last < 60000) return;
    if (entry) {
      entry.count++;
      entry.last = now;
    } else {
      history.push({ text: value, exclude, count: 1, last: now });
    }
    const kept = history.sort((a, b) => filterScore(b, now) - filterScore(a, now)).slice(0, FILTERS_KEPT);
    try {
      localStorage.setItem(FILE_FILTERS_KEY, JSON.stringify(kept));
    } catch (ignored) { /* storage unavailable: the filter is not kept */ }
  }

  // One filter per word, separated by spaces or commas; * matches any characters, anywhere
  // in the path. Case-sensitive as soon as it contains an uppercase letter, insensitive otherwise.
  function fileMatchers(text) {
    return text.trim().split(/[\s,]+/).filter(Boolean).map(term => new RegExp(
      term.split("*").map(part => part.replace(/[.+?^${}()|[\]\\]/g, "\\$&")).join(".*"),
      /\p{Lu}/u.test(term) ? "u" : "iu"
    ));
  }

  function applyFileFilter(title, lines) {
    const matchers = fileMatchers(fileFilter.text);
    let shown = 0;
    for (const [id, line] of lines) {
      const path = line.querySelector("a.d2h-file-name").dataset.tip;
      const visible = !matchers.length || matchers.some(m => m.test(path)) !== fileFilter.exclude;
      line.hidden = !visible;
      const wrapper = document.getElementById(id);
      if (wrapper) wrapper.hidden = !visible;
      if (visible) shown++;
    }
    title.textContent = title.textContent.replace(/\(.*\)/, `(${matchers.length ? `${shown}/` : ""}${lines.size})`);
    title.parentElement.querySelector(".file-filter input")?.classList.toggle("active", !!matchers.length);
    showPartialDiff(matchers.length && shown < lines.size ? { shown, total: lines.size, filter: fileFilter.text.trim(), exclude: fileFilter.exclude } : null);
  }

  // Header banner: the displayed diff is not the whole MR.
  function showPartialDiff(partial) {
    const banner = document.getElementById("partial-diff");
    if (banner.hidden === !partial && !partial) return;
    banner.hidden = !partial;
    if (partial) document.getElementById("partial-diff-text").textContent = texts.partialDiff(partial);
  }

  // Review progress: the share of changed lines that went past on screen. Each file keeps the greatest
  // depth reached by the bottom of the screen, applied to its changed lines as if they were
  // evenly spread: tracking each line would cost too much on a large diff. A file checked "Viewed" is
  // fully reviewed; a collapsed file only once expanded and read; a file hidden by the filter
  // stays in the total, so as not to give the illusion of a complete review. Only on-screen files are
  // measured, once scrolling settles: measuring during it would force a layout on fast scrolling,
  // and what merely scrolled past was not reviewed.
  function trackReview(changed) {
    const total = [...changed.values()].reduce((sum, lines) => sum + lines, 0);
    const label = document.getElementById("review-progress");
    const bar = document.getElementById("review-bar");
    label.hidden = bar.hidden = !total;
    if (!total) return;
    reviewTracking = new AbortController();
    const { signal } = reviewTracking;
    const key = reviewKey();
    const paths = new Map([...changed.keys()].map(wrapper => [wrapper, wrapperPaths(wrapper).join(" → ")]));
    const depths = new Map(Object.entries(readReview(key)));
    const visible = new Set();
    let timer = 0;
    const show = () => {
      let seen = 0;
      for (const [wrapper, lines] of changed) seen += lines * (depths.get(paths.get(wrapper)) ?? 0);
      const left = Math.round(total - seen);
      // Rounded down: 100 % only when everything is reviewed.
      const percent = left ? Math.min(Math.floor((seen / total) * 100), 99) : 100;
      label.textContent = texts.reviewProgress({ percent, left });
      label.title = texts.reviewProgressTitle;
      bar.firstElementChild.style.width = `${(seen / total) * 100}%`;
    };
    const reach = (wrapper, depth) => {
      const path = paths.get(wrapper);
      if (depth <= (depths.get(path) ?? 0)) return false;
      depths.set(path, depth);
      return true;
    };
    const measure = () => {
      let moved = false;
      for (const wrapper of visible) {
        if (wrapper.classList.contains("folded")) continue;
        const box = wrapper.getBoundingClientRect();
        moved = reach(wrapper, Math.min(Math.max((innerHeight - box.top) / box.height, 0), 1)) || moved;
      }
      if (!moved) return;
      show();
      writeReview(key, depths);
    };
    const schedule = () => {
      clearTimeout(timer);
      timer = setTimeout(measure, SCROLL_SETTLE_MS);
    };
    const observer = new IntersectionObserver(entries => {
      for (const entry of entries) {
        if (entry.isIntersecting) visible.add(entry.target);
        else visible.delete(entry.target);
      }
      schedule();
    });
    signal.addEventListener("abort", () => {
      observer.disconnect();
      clearTimeout(timer);
    });
    addEventListener("scroll", schedule, { passive: true, signal });
    addEventListener("resize", schedule, { passive: true, signal });
    for (const [wrapper, lines] of changed) {
      if (!lines) continue;
      observer.observe(wrapper);
      // An expanded file's content changes height without scrolling.
      wrapper.querySelector(".unfold")?.addEventListener("click", schedule, { signal });
      wrapper.querySelector('.d2h-file-collapse-input[name="viewed"]')?.addEventListener("change", event => {
        if (!event.target.checked || !reach(wrapper, 1)) return;
        show();
        writeReview(key, depths);
      }, { signal });
    }
    show();
  }

  // Progress specific to the MR's last commit, reset by a push for lack of knowing what it changed, and
  // to the displayed commit range: reviewing one commit is not reviewing the whole diff. null: unknown commits,
  // progress does not outlive the page.
  function reviewKey() {
    const head = mr.head || commits?.at(-1)?.sha;
    if (!head) return null;
    const shown = range ? `${commits[range[0]].sha}..${commits[range[1]].sha}` : "all";
    return `${mr.iid}:${head}:${shown}`;
  }

  function readReviews() {
    try {
      const saved = JSON.parse(localStorage.getItem(REVIEW_PROGRESS_KEY));
      return saved && typeof saved === "object" ? saved : {};
    } catch (ignored) {
      return {};
    }
  }

  function readReview(key) {
    const files = key && readReviews()[key]?.files;
    return files && typeof files === "object" ? files : {};
  }

  function writeReview(key, depths) {
    if (!key) return;
    const reviews = readReviews();
    reviews[key] = { at: Date.now(), files: Object.fromEntries(depths) };
    const kept = Object.entries(reviews).sort(([, a], [, b]) => (b.at ?? 0) - (a.at ?? 0)).slice(0, REVIEWS_KEPT);
    try {
      localStorage.setItem(REVIEW_PROGRESS_KEY, JSON.stringify(Object.fromEntries(kept)));
    } catch (ignored) { /* storage unavailable: progress does not outlive the page */ }
  }

  // The file at the top of the screen is highlighted in the list, which the panel keeps in view. The panel only
  // follows once scrolling settles: meanwhile, the observer only maintains the list of visible files,
  // measuring and scrolling nothing, so as not to force a layout for each file passing by.
  // A file picked in the list stays current while on screen: at the end of the diff, too short to
  // reach the top of the screen, it would otherwise leave the previous one there, and the list point at it.
  function followCurrentFile(container, lines) {
    const files = [...container.querySelectorAll(".d2h-file-wrapper")];
    const order = new Map(files.map((file, i) => [file, i]));
    const visible = new Set();
    const panel = document.getElementById("files");
    let current = null;
    let chosen = null;
    let timer = 0;
    const update = () => {
      if (chosen && !visible.has(chosen)) chosen = null;
      // The topmost visible file is the first in diff order.
      const top = chosen ?? [...visible].reduce((first, file) => (!first || order.get(file) < order.get(first) ? file : first), null);
      const line = top && lines.get(top.id);
      if (!line || line === current) return;
      current?.classList.remove("current");
      line.classList.add("current");
      current = line;
      const box = panel.getBoundingClientRect();
      const row = line.getBoundingClientRect();
      if (row.top < box.top) panel.scrollTop += row.top - box.top;
      else if (row.bottom > box.bottom) panel.scrollTop += row.bottom - box.bottom;
    };
    const observer = new IntersectionObserver(entries => {
      for (const entry of entries) {
        if (entry.isIntersecting) visible.add(entry.target);
        else visible.delete(entry.target);
      }
      clearTimeout(timer);
      timer = setTimeout(update, SCROLL_SETTLE_MS);
    }, { rootMargin: `-${document.querySelector("header").offsetHeight}px 0px 0px 0px` });
    for (const file of files) observer.observe(file);
    for (const [id, line] of lines) {
      line.addEventListener("click", () => {
        chosen = document.getElementById(id);
        visible.add(chosen);
        clearTimeout(timer);
        update();
      });
    }
  }

  function renderCommits(listScroll) {
    const section = document.getElementById("commits");
    if (commitsError) {
      section.hidden = false;
      section.innerHTML = `<div class="commits-warning">${escapeHtml(texts.commitsFailed(commitsError))}</div>`;
      return;
    }
    if (!commits?.length) return;
    section.hidden = false;
    const firstLocal = commits.findIndex(c => c.local);
    const selected = i => range && i >= range[0] && i <= range[1];
    const pushStarts = new Map(pushes.map((push, k) => [push.first, k]));
    const items = commits.map((c, i) => {
      const classes = [selected(i) ? "selected" : "", c.merge ? "merge" : "", c.local ? "local" : "", seenAtOpen >= 0 && i > seenAtOpen ? "new" : ""]
        .filter(Boolean).join(" ");
      const author = Avatars.gitlabName(c.author, c.email ?? "");
      const tooltip = `${c.sha.slice(0, 8)} · ${author} · ${formatDateTime(c.date)}\n${c.title}${c.merge ? `\n${texts.mergeCommit}` : ""}${c.local ? `\n${texts.localCommit}` : ""}`;
      const push = pushes[pushStarts.get(i)];
      const separator = push
        ? `<li class="push" data-push="${pushStarts.get(i)}" data-tip="${escapeHtml(texts.pushTitle)}">${escapeHtml(texts.push({
          date: formatDateTime(push.date),
          count: push.last - push.first + 1,
        }))}</li>`
        : "";
      const unpushedSeparator = i === firstLocal
        ? `<li class="push unpushed" data-unpushed data-tip="${escapeHtml(texts.unpushedTitle)}">${escapeHtml(texts.unpushed(commits.length - firstLocal))}</li>`
        : "";
      return `${separator}${unpushedSeparator}<li data-index="${i}"${classes ? ` class="${classes}"` : ""} data-tip="${escapeHtml(tooltip)}">`
        + `<span class="n">${i + 1}</span>`
        + `<span class="avatar" style="--avatar-color:${Avatars.color(author)}" aria-hidden="true">${escapeHtml(Avatars.initials(author))}</span>`
        + `<span class="t">${c.merge ? "⑂ " : ""}${escapeHtml(c.title)}</span>`
        + `<span class="a">${escapeHtml(age(c.date))}</span></li>`;
    }).join("");
    const warning = range && commits.slice(range[0], range[1] + 1).some(c => c.merge)
      ? `<div class="commits-warning">${escapeHtml(texts.mergeWarning)}</div>` : "";
    section.innerHTML = `<div class="commits-head"><strong>${escapeHtml(texts.commits(commits.length))}</strong>`
      + (seenAtOpen >= 0 && seenAtOpen < commits.length - 1
        ? `<button type="button" data-range="new" aria-pressed="${!!range && range[0] === seenAtOpen + 1 && range[1] === commits.length - 1}" title="${escapeHtml(texts.sinceSeenTitle)}">${escapeHtml(texts.sinceSeen(commits.length - 1 - seenAtOpen))}</button>`
        : "")
      + (pushes.length > 1 ? `<button type="button" data-push="${pushes.length - 1}" aria-pressed="${isPush(pushes.length - 1)}" title="${escapeHtml(texts.lastPushTitle)}">${escapeHtml(texts.lastPush)}</button>` : "")
      + `<button type="button" data-range="all" aria-pressed="${!range}" title="${escapeHtml(texts.allTitle)}">${escapeHtml(texts.all)}</button></div>`
      + `<div class="commits-hint">${escapeHtml(texts.hint)}</div>${warning}<ol id="commit-list">${items}</ol>`;
    const list = document.getElementById("commit-list");
    if (listScroll !== null) list.scrollTop = listScroll;
    else list.scrollTop = list.scrollHeight;
    applyCommitsShare(readCommitsShare());
  }

  function readCommitsShare() {
    try {
      const share = Number(localStorage.getItem(COMMITS_SHARE_KEY));
      return share > 0 && share < 1 ? share : null;
    } catch (ignored) {
      return null;
    }
  }

  function saveCommitsShare(share) {
    try {
      if (share === null) localStorage.removeItem(COMMITS_SHARE_KEY);
      else localStorage.setItem(COMMITS_SHARE_KEY, String(share));
    } catch (ignored) { /* storage unavailable: the split is not kept */ }
  }

  // Share of the panel height given to commits; null: natural height, capped by the stylesheet.
  function applyCommitsShare(share) {
    const section = document.getElementById("commits");
    if (!section) return;
    section.style.height = share === null ? "" : `${share * 100}%`;
    section.style.maxHeight = share === null ? "" : "none";
    section.style.flexShrink = share === null ? "" : "0";
  }

  document.addEventListener("pointerdown", event => {
    const split = event.target.closest?.("#split");
    if (!split || event.button !== 0) return;
    event.preventDefault();
    const side = document.getElementById("side");
    const section = document.getElementById("commits");
    const startY = event.clientY;
    const startHeight = section.getBoundingClientRect().height;
    const minHeight = 48;
    const maxHeight = side.clientHeight - split.offsetHeight - 96;
    let share = null;
    split.setPointerCapture(event.pointerId);
    split.classList.add("dragging");
    const move = moveEvent => {
      const height = Math.min(Math.max(startHeight + moveEvent.clientY - startY, minHeight), maxHeight);
      share = height / side.clientHeight;
      applyCommitsShare(share);
    };
    const end = () => {
      split.removeEventListener("pointermove", move);
      split.classList.remove("dragging");
      if (share !== null) saveCommitsShare(share);
    };
    split.addEventListener("pointermove", move);
    split.addEventListener("pointerup", end, { once: true });
    split.addEventListener("pointercancel", end, { once: true });
  });

  document.addEventListener("dblclick", event => {
    if (!event.target.closest?.("#split")) return;
    saveCommitsShare(null);
    applyCommitsShare(null);
  });

  // Space held over the diff, the code is grabbed by hand: dragging moves it under the mouse, like
  // a page on a phone, without reaching for the scrollbar at the bottom of a long file. The gesture keeps the axis
  // it started on, horizontally the file, vertically the page. Space released without dragging
  // scrolls down a page, as usual; without Space, click and selection stay those of the text.
  const PAN_AREAS = "#diff-files :is(.d2h-file-diff, .d2h-file-side-diff)";
  const PAN_AXIS_THRESHOLD_PX = 6;
  let pointerTarget = null;
  let panArmed = false;
  let panUsed = false;
  let clickSuppressed = false;

  function setPanArmed(armed) {
    panArmed = armed;
    document.getElementById("diff-files")?.classList.toggle("pan-ready", armed);
  }

  document.addEventListener("pointerover", event => {
    pointerTarget = event.target;
  });

  document.addEventListener("keydown", event => {
    if (event.code !== "Space" || event.ctrlKey || event.altKey || event.metaKey) return;
    if (event.target.closest?.("textarea, select, [contenteditable], input:not([type=checkbox], [type=radio], [type=button])")) return;
    if (!panArmed && !pointerTarget?.closest?.("#diff-files")) return;
    event.preventDefault();
    if (event.repeat || panArmed) return;
    panUsed = false;
    setPanArmed(true);
  });

  document.addEventListener("keyup", event => {
    if (event.code !== "Space" || !panArmed) return;
    setPanArmed(false);
    if (panUsed) return;
    const header = document.querySelector("header")?.offsetHeight ?? 0;
    scrollBy({ top: (event.shiftKey ? -1 : 1) * (innerHeight - header) * 0.875 });
  });

  addEventListener("blur", () => setPanArmed(false));

  document.addEventListener("pointerdown", event => {
    const area = panArmed && event.button === 0 ? event.target.closest?.(PAN_AREAS) : null;
    if (!area) return;
    event.preventDefault();
    panUsed = true;
    const start = { x: event.clientX, y: event.clientY, left: area.scrollLeft, top: scrollY };
    let axis = null;
    area.setPointerCapture(event.pointerId);
    document.getElementById("diff-files").classList.add("panning");
    const move = moveEvent => {
      const dx = moveEvent.clientX - start.x;
      const dy = moveEvent.clientY - start.y;
      if (!axis) {
        if (Math.hypot(dx, dy) < PAN_AXIS_THRESHOLD_PX) return;
        axis = Math.abs(dx) >= Math.abs(dy) ? "x" : "y";
      }
      if (axis === "x") area.scrollLeft = start.left - dx;
      else scrollTo(scrollX, start.top - dy);
    };
    const end = () => {
      area.removeEventListener("pointermove", move);
      document.getElementById("diff-files")?.classList.remove("panning");
      // The click following the release must neither open a comment nor tick a checkbox under the mouse.
      clickSuppressed = true;
      setTimeout(() => clickSuppressed = false);
    };
    area.addEventListener("pointermove", move);
    area.addEventListener("pointerup", end, { once: true });
    area.addEventListener("pointercancel", end, { once: true });
  });

  document.addEventListener("click", event => {
    if (!clickSuppressed) return;
    event.preventDefault();
    event.stopPropagation();
  }, true);

  function readEnabled(key) {
    try {
      return localStorage.getItem(key) === "on";
    } catch (ignored) {
      return false;
    }
  }

  function saveEnabled(
    key,
    enabled
  ) {
    try {
      localStorage.setItem(key, enabled ? "on" : "off");
    } catch (ignored) { /* storage unavailable: the choice is not kept */ }
  }

  const readNotesEnabled = () => readEnabled(NOTES_KEY);

  // Fixed labels, so as not to shift neighboring controls; the numbers go into the tooltip.
  function renderNotesToggle() {
    const notes = document.getElementById("notes-toggle");
    notes.setAttribute("aria-pressed", String(readNotesEnabled()));
    notes.textContent = texts.notes;
    notes.title = discussions ? `${texts.notesTitle} — ${texts.notesCount(discussions.length)}` : texts.notesTitle;
  }

  // All pages: GitLab serves at most 100 per call.
  async function loadDiscussions() {
    const project = await gitlabProject();
    const all = [];
    for (let page = 1, pages = 1; page <= pages; page++) {
      const response = await fetch(`gitlab/projects/${project}/merge_requests/${mr.iid}/discussions?per_page=100&page=${page}`);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      pages = Number(response.headers.get("X-Total-Pages")) || 1;
      all.push(...await response.json());
    }
    return all;
  }

  // GitLab rendering of notes, which the REST API does not provide: without it, notes stay readable as text.
  async function loadNotesHtml() {
    const { gitlabProject: path, gitlabWeb: web } = await config();
    gitlabWeb = web;
    const notes = await GitlabNotes.allNodes(async after => (await GitlabNotes.graphql(`{
      project(fullPath: ${JSON.stringify(path)}) { mergeRequest(iid: ${JSON.stringify(String(mr.iid))}) {
        notes(first: 100${after ? `, after: ${JSON.stringify(after)}` : ""}) { pageInfo { hasNextPage endCursor } nodes { id bodyHtml } }
      } }
    }`)).project.mergeRequest.notes);
    return new Map(notes.map(n => [GitlabNotes.noteId(n.id), n.bodyHtml]));
  }

  async function ensureDiscussions() {
    if (discussions !== null || discussionsError !== null) return;
    document.getElementById("diff-files")
      ?.insertAdjacentHTML("afterbegin", `<p class="notes-status" id="notes-status">${escapeHtml(texts.notesLoading)}</p>`);
    try {
      const [all, html] = await Promise.all([loadDiscussions(), loadNotesHtml().catch(() => new Map())]);
      discussions = all.filter(d => d.notes[0]?.type === "DiffNote" && d.notes[0].position?.position_type === "text");
      notesHtml = html;
    } catch (error) {
      discussionsError = error.message;
    }
    renderNotesToggle();
  }

  async function showNotes() {
    renderNotesToggle();
    await ensureDiscussions();
    render();
  }

  // Threads placed in the diff, in reading order; those of the "outside the diff" box are not included.
  // Nor are those of a file hidden by the filter.
  const placedNotes = () => [...document.querySelectorAll("#diff-files tr.note-row .note-thread")]
    .filter(note => !note.closest(".d2h-file-wrapper")?.hidden);

  function renderNotesNav() {
    const nav = document.getElementById("notes-nav");
    const count = placedNotes().length;
    nav.classList.toggle("off", !readNotesEnabled());
    const [previous, next] = nav.querySelectorAll("[data-note-step]");
    previous.title = texts.previousNote;
    next.title = texts.nextNote;
    previous.disabled = currentNote <= 0;
    next.disabled = currentNote >= count - 1;
    document.getElementById("note-position").textContent = `${currentNote < 0 ? "–" : currentNote + 1} / ${count}`;
    document.getElementById("note-position").title = texts.placedNotes(count);
  }

  function goToNote(step) {
    const notes = placedNotes();
    if (!notes.length) return;
    currentNote = Math.min(Math.max(currentNote + step, 0), notes.length - 1);
    notes.forEach((note, i) => note.classList.toggle("current", i === currentNote));
    notes[currentNote].open = true;
    notes[currentNote].closest(".d2h-file-wrapper.folded")?.querySelector(".unfold").click();
    notes[currentNote].scrollIntoView({ block: "start" });
    renderNotesNav();
  }

  // Side and lines of a note: the new file when it is on an added or unchanged line,
  // the old one when it is on a removed line. Several lines: from the first to the commented one.
  function notePlace(position) {
    const side = position.new_line != null ? "new" : "old";
    const last = side === "new" ? position.new_line : position.old_line;
    const start = position.line_range?.start;
    const first = (side === "new" ? start?.new_line : start?.old_line) ?? last;
    return { side, first: Math.min(first, last), last, path: side === "new" ? position.new_path : position.old_path };
  }

  // The right side shows the last commit in the full view or in a range ending at the last commit;
  // the left side, the MR's starting point in the full view only.
  function sideShowsMrEnds(side) {
    if (!range) return true;
    return side === "new" && !!commits && range[1] === commits.length - 1;
  }

  function threadHtml(discussion, where) {
    const [first, ...replies] = discussion.notes.filter(n => !n.system);
    if (!first) return "";
    const resolvable = discussion.notes.some(n => n.resolvable);
    const resolved = resolvable && discussion.notes.every(n => !n.resolvable || n.resolved);
    const state = resolved ? "resolved" : resolvable ? "unresolved" : "";
    const label = texts.lines(notePlace(first.position));
    const link = /^https:\/\//.test(mr.url)
      ? `<a href="${escapeHtml(`${mr.url}#note_${first.id}`)}" target="_blank" rel="noopener">${escapeHtml(texts.openInGitlab)}</a>` : "";
    const note = n => `<div class="note"><div class="note-meta"><strong>${escapeHtml(n.author?.name ?? "?")}</strong> · `
      + `<span title="${escapeHtml(formatDateTime(n.created_at))}">${escapeHtml(age(n.created_at))}</span></div>`
      + (notesHtml.has(n.id)
        ? `<div class="gl-body">${GitlabNotes.render(notesHtml.get(n.id), gitlabWeb)}</div></div>`
        : `<div class="note-body">${markdown(n.body)}</div></div>`);
    return `<details class="note-thread${state ? ` ${state}` : ""}" data-discussion="${escapeHtml(discussion.id)}"${resolved ? "" : " open"}>`
      + `<summary>${state ? `<span class="badge">${escapeHtml(texts[state])}</span>` : ""}`
      + `<span>${escapeHtml(label)}${replies.length ? ` · ${escapeHtml(texts.replies(replies.length))}` : ""}</span>${link}</summary>`
      + (where ? `<div class="note-where">${escapeHtml(where)}</div>` : "")
      + [first, ...replies].map(note).join("") + GitlabNotes.threadActionsHtml({ resolvable, resolved }, lang) + `</details>`;
  }

  // The bare minimum of GitLab markdown to read a note GitLab gave no rendering for: code
  // blocks, inline code, bold.
  // On already-escaped text, hence with no HTML coming from the note.
  function markdown(body) {
    return escapeHtml(body).split(/```[^\n]*\n?/).map((part, i) => i % 2
      ? `<pre><code>${part.replace(/\n$/, "")}</code></pre>`
      : part.replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>"))
      .join("");
  }

  // File path as diff2html shows it, including the "dir/{old → new}" rename form.
  function wrapperPaths(wrapper) {
    const name = wrapper.querySelector(".d2h-file-header .d2h-file-name")?.textContent.trim() ?? "";
    if (!name.includes("→")) return [name];
    const braces = name.match(/^(.*)\{(.*) → (.*)\}(.*)$/);
    if (braces) return [braces[1] + braces[2] + braces[4], braces[1] + braces[3] + braces[4]].map(p => p.replace("//", "/"));
    return name.split(" → ");
  }

  // Lines of one side of a file, by number: the left or right side in side-by-side, the old
  // or new column in line-by-line.
  function rowsByLine(wrapper, side) {
    const rows = new Map();
    const sides = wrapper.querySelectorAll(".d2h-file-side-diff");
    if (sides.length === 2) {
      for (const td of sides[side === "new" ? 1 : 0].querySelectorAll("td.d2h-code-side-linenumber")) {
        const n = Number(td.textContent.trim());
        if (n) rows.set(n, td.parentElement);
      }
    } else {
      for (const div of wrapper.querySelectorAll(side === "new" ? ".line-num2" : ".line-num1")) {
        const n = Number(div.textContent.trim());
        if (n) rows.set(n, div.closest("tr"));
      }
    }
    return rows;
  }

  // Note row under the commented line; in side-by-side, an empty row of the same height opposite keeps
  // both columns aligned.
  function insertNoteRow(row, html) {
    const noteRow = document.createElement("tr");
    noteRow.className = "note-row";
    noteRow.innerHTML = `<td colspan="2">${html}</td>`;
    row.after(noteRow);
    const sideDiff = row.closest(".d2h-file-side-diff");
    if (!sideDiff) return null;
    const sides = [...sideDiff.parentElement.querySelectorAll(".d2h-file-side-diff")];
    const other = sides.find(s => s !== sideDiff);
    const index = [...row.parentElement.children].indexOf(row);
    const facing = other?.querySelector("tbody")?.children[index];
    if (!facing) return null;
    const spacer = document.createElement("tr");
    spacer.className = "note-row note-spacer";
    spacer.innerHTML = '<td colspan="2"></td>';
    facing.after(spacer);
    return { noteRow, spacer };
  }

  function alignSpacers(pairs) {
    const heights = pairs.map(p => p.noteRow.offsetHeight);
    pairs.forEach((p, i) => { p.spacer.firstElementChild.style.height = `${heights[i]}px`; });
  }

  function placeNotes(container) {
    document.getElementById("notes-status")?.remove();
    if (discussionsError) {
      container.insertAdjacentHTML("afterbegin", `<p class="message error">${escapeHtml(texts.notesFailed(discussionsError))}</p>`);
      return;
    }
    if (!discussions) return;
    const wrappers = new Map();
    for (const wrapper of container.querySelectorAll(".d2h-file-wrapper")) {
      for (const path of wrapperPaths(wrapper)) wrappers.set(path, wrapper);
    }
    const rowCache = new Map();
    const rows = (wrapper, side) => {
      const key = `${wrapper.id}:${side}`;
      if (!rowCache.has(key)) rowCache.set(key, rowsByLine(wrapper, side));
      return rowCache.get(key);
    };
    const elsewhere = [];
    const pairs = [];
    const perFile = new Map();
    for (const discussion of discussions) {
      const position = discussion.notes[0].position;
      const place = notePlace(position);
      const where = place.path;
      if (latestVersion && position.head_sha !== latestVersion.head_commit_sha) {
        elsewhere.push(threadHtml(discussion, `${where} — ${texts.outdated}`));
        continue;
      }
      if (!sideShowsMrEnds(place.side)) {
        elsewhere.push(threadHtml(discussion, `${where} — ${texts.outOfRange}`));
        continue;
      }
      const wrapper = wrappers.get(place.path);
      const lineRows = wrapper && rows(wrapper, place.side);
      const row = lineRows?.get(place.last);
      if (!row) {
        elsewhere.push(threadHtml(discussion, `${where} — ${texts.notShown}`));
        continue;
      }
      for (let n = place.first; n <= place.last; n++) lineRows.get(n)?.classList.add("note-line");
      const pair = insertNoteRow(row, threadHtml(discussion));
      if (pair) pairs.push(pair);
      perFile.set(wrapper.id, (perFile.get(wrapper.id) ?? 0) + 1);
    }
    // A thread fits in the visible part of its column, even when long lines widen it.
    const column = container.querySelector(".d2h-file-side-diff, .d2h-file-diff");
    if (column) container.style.setProperty("--note-column", `${column.clientWidth}px`);
    alignSpacers(pairs);
    notesObserver?.disconnect();
    notesObserver = new ResizeObserver(() => alignSpacers(pairs));
    pairs.forEach(pair => notesObserver.observe(pair.noteRow));
    for (const [id, count] of perFile) {
      document.querySelector(`#files a.d2h-file-name[href="#${CSS.escape(id)}"] .file-base`)
        ?.insertAdjacentHTML("beforeend", `<span class="file-notes">💬 ${count}</span>`);
    }
    if (elsewhere.length) {
      container.insertAdjacentHTML("afterbegin", `<details class="notes-elsewhere"><summary>${escapeHtml(texts.notesElsewhere(elsewhere.length))}</summary>${elsewhere.join("")}</details>`);
    }
    currentNote = -1;
    renderNotesNav();
  }

  // Thread re-read from GitLab after a reply or a resolution, and redisplayed in place.
  async function refreshThread(id) {
    const project = await gitlabProject();
    const [response, html] = await Promise.all([
      fetch(`gitlab/projects/${project}/merge_requests/${mr.iid}/discussions/${id}`),
      loadNotesHtml().catch(() => notesHtml),
    ]);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const discussion = await response.json();
    notesHtml = html;
    discussions = discussions.map(d => d.id === id ? discussion : d);
    const thread = document.querySelector(`#diff-files [data-discussion="${CSS.escape(id)}"]`);
    if (!thread) return;
    const current = thread.classList.contains("current");
    thread.outerHTML = threadHtml(discussion, thread.querySelector(".note-where")?.textContent);
    if (current) document.querySelector(`#diff-files [data-discussion="${CSS.escape(id)}"]`)?.classList.add("current");
  }

  // A note is placed on the diff GitLab knows: that of its latest version, which the page shows
  // in full, without a commit range, when the local clone is up to date.
  function canComment() {
    return readNotesEnabled() && discussions !== null && !commentBlocker();
  }

  // What prevents commenting, diff notes shown or not: told to whoever clicks a line number.
  function commentBlocker() {
    if (discussionsError !== null) return texts.notesFailed(discussionsError);
    if (range) return texts.cannotCommentRange;
    if (mr.merge) return texts.cannotCommentMerged;
    if (!latestVersion) return texts.cannotCommentVersions;
    if (commits?.at(-1)?.sha !== latestVersion.head_commit_sha) return texts.cannotCommentOutdated;
    return null;
  }

  // A click on a line number comments it, or says why it cannot. Diff notes hidden: it shows them
  // first; once the diff is redrawn, the same line is found again and kept at the same screen height.
  async function commentLine(cell, extend) {
    if (!lineOf(cell.parentElement)) return;
    const blocker = commentBlocker();
    if (blocker) {
      showTipFor(cell, blocker);
      return;
    }
    if (readNotesEnabled()) {
      if (canComment()) selectLine(cell.parentElement, extend);
      return;
    }
    const spot = lineSpot(cell);
    saveEnabled(NOTES_KEY, true);
    await showNotes();
    // Heights of the redrawn diff set on the next frame, including the spacers opposite threads.
    await nextFrame();
    cell = findLine(spot);
    if (!cell) return;
    if (canComment()) selectLine(cell.parentElement, false);
    // After the editor, whose field, on taking focus, scrolls the diff.
    scrollBy(0, cell.getBoundingClientRect().top - spot.top);
    if (canComment()) return;
    // Unreadable discussions: the tooltip must not be closed by this scroll, reported on the next frame.
    await nextFrame();
    showTipFor(cell, commentBlocker());
  }

  const nextFrame = () => new Promise(resolve => requestAnimationFrame(() => setTimeout(resolve)));

  // A diff line, with what is needed to find it once the diff is redrawn: file, column, number and type.
  function lineSpot(cell) {
    const wrapper = cell.closest(".d2h-file-wrapper");
    return {
      path: wrapperPaths(wrapper).join(" → "),
      side: [...wrapper.querySelectorAll(".d2h-file-side-diff")].indexOf(cell.closest(".d2h-file-side-diff")),
      text: cell.textContent.trim(),
      className: cell.className,
      top: cell.getBoundingClientRect().top,
    };
  }

  function findLine(spot) {
    const wrapper = [...document.querySelectorAll("#diff-files .d2h-file-wrapper")]
      .find(w => wrapperPaths(w).join(" → ") === spot.path);
    const scope = spot.side < 0 ? wrapper : wrapper?.querySelectorAll(".d2h-file-side-diff")[spot.side];
    return [...scope?.querySelectorAll("td.d2h-code-side-linenumber, td.d2h-code-linenumber") ?? []]
      .find(cell => cell.className === spot.className && cell.textContent.trim() === spot.text) ?? null;
  }

  // Numbers of a diff line: the old one for a removed line, the new one for an added line,
  // both for an unchanged line; type in GitLab's sense, "new" for an added line, otherwise "old".
  function lineOf(row) {
    const number = (r, selector) => Number(r?.querySelector(selector)?.textContent.trim()) || null;
    const sideDiff = row.closest(".d2h-file-side-diff");
    const cell = row.querySelector(sideDiff ? "td.d2h-code-side-linenumber" : "td.d2h-code-linenumber");
    if (!cell) return null;
    let old;
    let current;
    if (sideDiff) {
      const index = [...row.parentElement.children].indexOf(row);
      const [left, right] = [...sideDiff.parentElement.querySelectorAll(".d2h-file-side-diff tbody")].map(t => t.children[index]);
      old = number(left, "td.d2h-code-side-linenumber");
      current = number(right, "td.d2h-code-side-linenumber");
    } else {
      old = number(row, ".line-num1");
      current = number(row, ".line-num2");
    }
    if (cell.classList.contains("d2h-ins")) return current && { old: null, new: current, type: "new" };
    if (cell.classList.contains("d2h-del")) return old && { old, new: null, type: "old" };
    if (cell.classList.contains("d2h-cntx")) return old && current && { old, new: current, type: "old" };
    return null;
  }

  function selectedRows() {
    const rows = [...selection.tbody.children];
    const [from, to] = [rows.indexOf(selection.anchor), rows.indexOf(selection.end)].sort((a, b) => a - b);
    return rows.slice(from, to + 1).filter(row => lineOf(row));
  }

  function selectLine(row, extend) {
    if (!canComment() || !lineOf(row)) return;
    const draft = selection?.editor?.noteRow.querySelector("textarea").value ?? "";
    if (extend && selection?.tbody === row.parentElement) selection.end = row;
    else {
      closeEditor();
      selection = { tbody: row.parentElement, anchor: row, end: row };
    }
    openEditor(draft);
  }

  function closeEditor() {
    if (!selection) return;
    for (const row of selection.tbody.querySelectorAll("tr.note-selected")) row.classList.remove("note-selected");
    selection.editor?.noteRow.remove();
    selection.editor?.spacer?.remove();
    selection.editor?.observer.disconnect();
    selection = null;
  }

  function openEditor(draft) {
    for (const row of selection.tbody.querySelectorAll("tr.note-selected")) row.classList.remove("note-selected");
    selection.editor?.noteRow.remove();
    selection.editor?.spacer?.remove();
    selection.editor?.observer.disconnect();
    const rows = selectedRows();
    rows.forEach(row => row.classList.add("note-selected"));
    const [first, last] = [lineOf(rows[0]), lineOf(rows.at(-1))];
    const side = last.new ? "new" : "old";
    const label = texts.newNote({ first: first[side] ?? first.new ?? first.old, last: last[side] });
    const pair = insertNoteRow(
      rows.at(-1),
      `<form class="note-editor"><div class="note-meta">${escapeHtml(label)}</div>`
      + `<textarea placeholder="${escapeHtml(texts.notePlaceholder)}"></textarea>`
      + `<div class="note-editor-actions"><span class="note-editor-error"></span>`
      + `<button type="button" data-editor-cancel>${escapeHtml(texts.cancelNote)}</button>`
      + `<button type="submit">${escapeHtml(texts.publishNote)}</button></div></form>`
    );
    const noteRow = pair?.noteRow ?? rows.at(-1).nextElementSibling;
    // The field grows while typing: the empty line opposite follows.
    const observer = new ResizeObserver(() => {
      if (pair) pair.spacer.firstElementChild.style.height = `${noteRow.offsetHeight}px`;
    });
    observer.observe(noteRow);
    selection.editor = { noteRow, spacer: pair?.spacer, observer };
    const textarea = noteRow.querySelector("textarea");
    textarea.value = draft;
    textarea.focus();
  }

  async function sha1(text) {
    const digest = await crypto.subtle.digest("SHA-1", new TextEncoder().encode(text));
    return [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2, "0")).join("");
  }

  // Position in GitLab API format, on the MR's latest version; a range designates its two
  // ends by their line_code, a hash of the path followed by both numbers, 0 for the missing one.
  async function notePosition(rows) {
    const paths = wrapperPaths(rows[0].closest(".d2h-file-wrapper"));
    const [first, last] = [lineOf(rows[0]), lineOf(rows.at(-1))];
    const position = {
      base_sha: latestVersion.base_commit_sha,
      start_sha: latestVersion.start_commit_sha,
      head_sha: latestVersion.head_commit_sha,
      old_path: paths[0],
      new_path: paths.at(-1),
      old_line: last.old,
      new_line: last.new,
    };
    if (rows.length === 1) return position;
    const hash = await sha1(position.new_path);
    const end = line => ({ line_code: `${hash}_${line.old ?? 0}_${line.new ?? 0}`, type: line.type, old_line: line.old, new_line: line.new });
    return { ...position, line_range: { start: end(first), end: end(last) } };
  }

  async function publishNote(form) {
    const body = form.querySelector("textarea").value;
    if (!body.trim()) return;
    const current = selection;
    const rows = selectedRows();
    const error = form.querySelector(".note-editor-error");
    const buttons = form.querySelectorAll("button, textarea");
    buttons.forEach(b => { b.disabled = true; });
    error.textContent = texts.publishing;
    try {
      const response = await fetch("gitlab/discussion", {
        method: "POST",
        headers: { "X-MR-Dashboard": "1", "Content-Type": "application/json" },
        body: JSON.stringify({ iid: Number(mr.iid), body, position: await notePosition(rows) }),
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(result.message ?? result.error ?? `HTTP ${response.status}`);
      discussions.push(result);
      rows.forEach(row => row.classList.replace("note-selected", "note-line"));
      current.editor.noteRow.firstElementChild.innerHTML = threadHtml(result);
      if (selection === current) selection = null;
      renderNotesToggle();
      renderNotesNav();
    } catch (failure) {
      buttons.forEach(b => { b.disabled = false; });
      error.textContent = texts.publishFailed(Array.isArray(failure.message) ? failure.message.join(", ") : failure.message);
    }
  }

  const seenKey = () => `mr-dashboard.diffSeen.${mr.iid}`;

  function readSeen() {
    try {
      return commits.findIndex(c => c.sha === localStorage.getItem(seenKey()));
    } catch (ignored) {
      return -1;
    }
  }

  // Keeps the most recent displayed commit, never going back: rereading an old commit does not make
  // the following ones new.
  function markSeen() {
    if (!commits?.length) return;
    const shown = range ? range[1] : commits.length - 1;
    if (shown <= readSeen()) return;
    try {
      localStorage.setItem(seenKey(), commits[shown].sha);
    } catch (ignored) { /* storage unavailable: nothing is kept */ }
  }

  const isPush = k => !!range && range[0] === pushes[k].first && range[1] === pushes[k].last;

  // Each GitLab version of the MR ends with the last pushed commit: the commits up to it,
  // since the previous push, arrived together. A version from before a rebase matches
  // no commit and merges into the next one. Without GitLab, no groups: the list stays usable.
  let configPromise = null;
  function config() {
    configPromise ??= fetch("config").then(r => r.json());
    return configPromise;
  }
  const gitlabProject = () => config().then(c => encodeURIComponent(c.gitlabProject));

  function renderAuthor() {
    const element = document.getElementById("mr-author");
    element.title = texts.author;
    element.innerHTML = `<span class="avatar" style="--avatar-color:${Avatars.color(mr.author)}" aria-hidden="true">${escapeHtml(Avatars.initials(mr.author))}</span>`
      + escapeHtml(mr.author);
    element.hidden = false;
  }

  async function loadMr() {
    if (!mr.iid) return;
    try {
      const detail = JSON.parse(await fetchText(`gitlab/projects/${await gitlabProject()}/merge_requests/${encodeURIComponent(mr.iid)}`));
      mr.title = detail.title.replace(/^Draft:\s*/i, "");
      mr.branch = detail.source_branch;
      mr.target = detail.target_branch;
      mr.url = detail.web_url;
      mr.author = detail.author?.name ?? "";
      if (detail.state === "merged" && detail.merge_commit_sha) {
        mr.head = detail.sha;
        mr.merge = detail.merge_commit_sha;
      }
    } catch (error) {
      mrError = error.message;
    }
  }

  async function loadPushes() {
    try {
      const project = await gitlabProject();
      const versions = JSON.parse(await fetchText(`gitlab/projects/${project}/merge_requests/${mr.iid}/versions`));
      const heads = new Map(versions.map(v => [v.head_commit_sha, v.created_at]));
      latestVersion = versions.reduce((a, b) => (a && a.created_at > b.created_at ? a : b), null);
      let first = 0;
      const found = [];
      // Local commits close the list and belong to no push: GitLab does not know them.
      const pushedCount = commits.filter(c => !c.local).length;
      commits.forEach((c, i) => {
        if (!heads.has(c.sha)) return;
        found.push({ first, last: i, date: heads.get(c.sha) });
        first = i + 1;
      });
      if (found.length && first < pushedCount) found.push({ first, last: pushedCount - 1, date: commits[pushedCount - 1].date });
      pushes = found;
    } catch (ignored) {
      pushes = [];
    }
  }

  // "3 h", "2 d": enough to place a commit in the life of the MR.
  function age(iso) {
    const minutes = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));
    if (minutes < 60) return `${minutes} min`;
    if (minutes < 48 * 60) return `${Math.round(minutes / 60)} h`;
    return `${Math.round(minutes / 1440)} ${lang === "fr" ? "j" : "d"}`;
  }

  function renderRangeLabel() {
    const label = document.getElementById("range");
    label.textContent = range && commits
      ? ` — ${texts.range({ first: range[0] + 1, last: range[1] + 1, total: commits.length })}`
      : "";
  }

  // Range in the URL: a reload or a shared link reopens the same one.
  function writeRangeToUrl() {
    const url = new URL(location.href);
    if (range) {
      url.searchParams.set("first", commits[range[0]].sha);
      url.searchParams.set("last", commits[range[1]].sha);
    } else {
      url.searchParams.delete("first");
      url.searchParams.delete("last");
    }
    history.replaceState(null, "", url);
  }

  function selectRange(next) {
    range = next;
    writeRangeToUrl();
    renderRangeLabel();
    loadDiff();
  }

  function renderHeader() {
    document.documentElement.lang = lang;
    const title = mr.title ? `!${mr.iid} ${mr.title}` : texts.title(mr);
    document.title = `${texts.pageKind} · ${title}`;
    document.getElementById("page-kind").textContent = texts.pageKind;
    document.getElementById("title").textContent = title;
    const branches = mr.merge ? texts.mergedBranches : texts.branches;
    document.getElementById("branches").innerHTML = branches({ branch: escapeHtml(mr.branch), target: escapeHtml(mr.target) })
      + '<span id="range"></span>';
    document.getElementById("side-by-side").textContent = texts.sideBySide;
    document.getElementById("line-by-line").textContent = texts.lineByLine;
    document.getElementById("text-size").title = texts.textSize;
    const [smaller, larger] = document.querySelectorAll("[data-text-step]");
    smaller.setAttribute("aria-label", texts.smaller);
    larger.setAttribute("aria-label", texts.larger);
    const comments = document.getElementById("comments-link");
    comments.textContent = texts.comments;
    comments.title = texts.commentsTitle;
    comments.href = `comments.html?${new URLSearchParams({ iid: mr.iid })}`;
    comments.dataset.iid = mr.iid;
    const close = document.getElementById("close-tab");
    close.textContent = texts.close;
    close.title = texts.closeTitle;
    close.dataset.closeRefused = texts.closeRefused;
    const showAll = document.getElementById("partial-diff-clear");
    showAll.textContent = texts.showAllFiles;
    showAll.addEventListener("click", () => clearFileFilter?.());
    const gitlab = document.getElementById("gitlab");
    if (/^https:\/\//.test(mr.url)) {
      gitlab.href = `${mr.url}/diffs`;
      gitlab.textContent = texts.gitlab;
      gitlab.hidden = false;
    }
    document.getElementById("loading").textContent = texts.loading;
    applyTextScale(readTextScale());
  }

  // Header height, followed by the file headers stuck below it: it changes with the text
  // size, the partial diff banner, the review progress, the window width.
  new ResizeObserver(([entry]) => {
    document.documentElement.style.setProperty("--header-height", `${entry.target.offsetHeight}px`);
  }).observe(document.querySelector("header"));

  // AI button: the catalog actions, as in the dashboard; the fix, only from the
  // prompt the dashboard computes and stores (see MrAi.readFixContext). Not on a merged MR.
  // Approve and Merge, for an open MR: what GitLab allows the token's user now, read again without the relay's cache
  // on each opening and each return to the tab, at the head commit this diff shows, which GitLab checks again.
  // project: the project's squash_option and merge_method, read once.
  // autoMerge: the merge offered waits for the pipeline.
  const review = { sha: null, busy: false, detail: null, project: null, autoMerge: false };

  function reviewedHead() {
    return commits?.filter(c => !c.local).at(-1)?.sha ?? null;
  }

  const freshJson = async url => {
    const response = await fetch(url, { headers: { "Cache-Control": "no-cache" } });
    const body = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(body.message || `HTTP ${response.status}`);
    return body;
  };

  async function loadReviewRights() {
    if (mr.merge || !mr.iid || review.busy) return;
    const head = reviewedHead();
    if (!head) return;
    const project = await gitlabProject();
    let detail, approvals;
    try {
      [detail, approvals] = await Promise.all([
        freshJson(`gitlab/projects/${project}/merge_requests/${encodeURIComponent(mr.iid)}`),
        freshJson(`gitlab/projects/${project}/merge_requests/${encodeURIComponent(mr.iid)}/approvals`),
      ]);
    } catch (ignored) {
      return;
    }
    // Merged or closed meanwhile: only the status of the last action stays, if any.
    if (detail.state !== "opened") {
      for (const id of ["approve", "merge"]) document.getElementById(id).hidden = true;
      document.getElementById("review-actions").hidden = !document.getElementById("review-actions-status").textContent;
      return;
    }
    review.sha = detail.sha;
    review.detail = detail;
    if (!review.project) review.project = await freshJson(`gitlab/projects/${project}`).catch(() => null);
    const stale = detail.sha !== head;
    const approve = document.getElementById("approve");
    approve.classList.toggle("done", !!approvals.user_has_approved);
    if (!approve.firstElementChild) {
      approve.innerHTML = `<span class="when-not-approved">${escapeHtml(texts.approve)}</span><span class="when-approved">${escapeHtml(texts.approved)}</span>`;
    }
    // Withdrawing an approval needs no up-to-date diff: only giving one does.
    approve.disabled = approvals.user_has_approved ? false : stale || !approvals.user_can_approve;
    approve.title = approvals.user_has_approved ? texts.unapproveTitle
      : stale ? texts.staleHead : approvals.user_can_approve ? texts.approveTitle : texts.cannotApprove;
    const merge = document.getElementById("merge");
    const status = detail.detailed_merge_status;
    if (!merge.firstElementChild) {
      merge.innerHTML = `<span class="when-not-approved">${escapeHtml(texts.merge)}</span><span class="when-approved">${escapeHtml(texts.autoMerge)}</span>`;
    }
    // A merge already set to come is cancelled with a click, as an approval is withdrawn; one is offered while only
    // the pipeline still runs.
    const autoMergeSet = !!detail.merge_when_pipeline_succeeds;
    review.autoMerge = !autoMergeSet && pipelineRunning(detail);
    merge.classList.toggle("done", autoMergeSet);
    merge.disabled = autoMergeSet ? !detail.user?.can_merge
      : stale || !detail.user?.can_merge || !(status === "mergeable" || review.autoMerge);
    merge.title = autoMergeSet ? texts.autoMergeSetTitle({ user: detail.merge_user?.name ?? "?" })
      : stale ? texts.staleHead
      : !detail.user?.can_merge ? texts.cannotMerge
      : review.autoMerge ? texts.autoMergeTitle
      : status !== "mergeable" ? texts.mergeStatus[status] ?? texts.mergeBlocked(status)
      : texts.mergeTitle(mr);
    document.getElementById("review-actions").hidden = false;
  }

  // Only the pipeline keeps the MR from being merged, and it may still succeed.
  function pipelineRunning(detail) {
    const active = ["created", "waiting_for_resource", "preparing", "pending", "running", "scheduled"];
    return ["ci_still_running", "ci_must_pass"].includes(detail.detailed_merge_status)
      && active.includes(detail.head_pipeline?.status);
  }

  async function reviewAction(path, pending, options = {}) {
    const status = document.getElementById("review-actions-status");
    const buttons = document.querySelectorAll("#review-actions button");
    review.busy = true;
    buttons.forEach(b => { b.disabled = true; });
    status.classList.remove("error");
    status.textContent = pending;
    try {
      const response = await fetch(path, {
        method: "POST",
        headers: { "X-MR-Dashboard": "1", "Content-Type": "application/json" },
        body: JSON.stringify({ iid: Number(mr.iid), sha: review.sha, ...options }),
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(result.message ?? result.error ?? `HTTP ${response.status}`);
      status.textContent = "";
      return result;
    } catch (failure) {
      status.classList.add("error");
      status.textContent = texts.reviewFailed(Array.isArray(failure.message) ? failure.message.join(", ") : failure.message);
      return null;
    } finally {
      review.busy = false;
      await loadReviewRights();
    }
  }

  // What the merge will do, and its two choices as GitLab offers them: the squash, as the project's squash_option
  // allows it (never: not offered; always: imposed), and the source branch removal, both checked as the MR says.
  function openMergeDialog() {
    const detail = review.detail;
    const count = commits?.filter(c => !c.local).length ?? 0;
    const names = { branch: escapeHtml(mr.branch), target: escapeHtml(mr.target) };
    const method = review.project?.merge_method;
    document.getElementById("merge-dialog-title").textContent = review.autoMerge ? texts.autoMergeConfirm(mr) : texts.mergeConfirm(mr);
    document.getElementById("merge-facts").innerHTML = [
      ...(review.autoMerge ? [texts.autoMergeFact] : []),
      texts.mergeInto(names),
      texts.mergeCommits(count),
      ...(texts.mergeMethod[method] ? [texts.mergeMethod[method]] : []),
    ].map(fact => `<li>${fact}</li>`).join("");
    const squashOption = review.project?.squash_option;
    const squash = document.getElementById("merge-squash");
    document.getElementById("merge-squash-option").hidden = squashOption === "never";
    squash.checked = squashOption === "always" || !!detail?.squash;
    squash.disabled = squashOption === "always";
    document.getElementById("merge-squash-label").textContent = squashOption === "always" ? texts.mergeSquashRequired : texts.mergeSquash;
    document.getElementById("merge-remove-branch").checked = !!detail?.force_remove_source_branch;
