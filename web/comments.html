<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Cdefs%3E%3ClinearGradient%20id='g'%20x1='0'%20y1='0'%20x2='1'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%234f46e5'/%3E%3Cstop%20offset='1'%20stop-color='%237c3aed'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width='64'%20height='64'%20rx='15'%20fill='url(%23g)'/%3E%3Ctext%20x='32'%20y='28'%20text-anchor='middle'%20font-family='system-ui,Segoe%20UI,Arial,sans-serif'%20font-size='26'%20font-weight='800'%20fill='%23fff'%3EMR%3C/text%3E%3Cg%20transform='translate(32%2045)%20scale(0.45)%20translate(-32%20-34)'%3E%3Cpath%20d='M14%2014h36a4%204%200%200%201%204%204v22a4%204%200%200%201-4%204H30L18%2054V44h-4a4%204%200%200%201-4-4V18a4%204%200%200%201%204-4z'%20fill='%23fff'/%3E%3C/g%3E%3C/svg%3E">
<title>Commentaires — MisteR Dashboard</title>
<script>
  // Dashboard theme and text size, set before the first render.
  try {
    const scale = Number(localStorage.getItem("mr-dashboard.textScale"));
    if (scale) document.documentElement.style.setProperty("--text-scale", scale);
    const theme = localStorage.getItem("mr-dashboard.theme");
    document.documentElement.dataset.theme = theme === "light" || theme === "dark" ? theme
      : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  } catch (ignored) {
    document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
</script>
<link rel="stylesheet" href="notes.css">
<link rel="stylesheet" href="avatars.css">
<link rel="stylesheet" href="shortcuts.css">
<style>
  :root {
    --bg: #dcdfe6;
    --surface: #eaecf1;
    --border: #cfd3dc;
    --border-strong: #bcc1cc;
    --text: #1b1d24;
    --muted: #585d6a;
    --link: #2356c7;
    --accent: #4f46e5;
    --accent-fg: #ffffff;
    --red-bg: #fdecec; --red-fg: #b42318; --red-line: #d92d20;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #111217;
    --surface: #1a1c23;
    --border: #2c2f3a;
    --border-strong: #3a3e4b;
    --text: #eceef3;
    --muted: #9ba1b0;
    --link: #86a9f7;
    --accent: #818cf8;
    --accent-fg: #0f1020;
    --red-bg: #3d1a1a; --red-fg: #ffb4ab; --red-line: #f97066;
  }
  /* Dashboard text size (same base, same A− / A+ setting), a bit larger: this is prose reading. */
  html { font-size: calc(clamp(13px, 0.75vw, 28px) * var(--text-scale, 1) * 1.15); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 1rem/1.5 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  a { color: var(--link); }
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; flex-direction: column; gap: 0.45rem;
    padding: 0.75rem 1rem; background: var(--surface); border-bottom: 1px solid var(--border);
  }
  /* Same layout as the diff header: title, then author and branches, links right of the title. */
  .title-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem 1.4rem; }
  header h1 { flex: 1 1 30rem; margin: 0; font-size: 1.05rem; overflow-wrap: anywhere; }
  /* Page kind, before the title: an MR's diff and comments share the same header. */
  .page-kind {
    display: inline-block; margin-right: 0.6em; padding: 0.1em 0.6em; border-radius: 0.4rem; vertical-align: 0.1em;
    font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--accent-fg); background: var(--accent);
  }
  .subtitle { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.3rem 1.4rem; }
  .subtitle .loaded-at { margin-left: auto; }
  .branches { color: var(--muted); font-size: 0.9rem; overflow-wrap: anywhere; }
  .branches code { font-size: 0.85rem; }
  .summary { color: var(--muted); font-size: 0.85rem; }
  /* MR author, badge included: who opened it, even in a tab opened long ago. */
  .mr-author { display: inline-flex; align-items: center; gap: 0.4em; font-size: 0.85rem; white-space: nowrap; }
  .mr-author[hidden] { display: none; }
  .mr-author .avatar { font-size: 0.7rem; }
  .loaded-at { color: var(--muted); font-size: 0.8rem; white-space: nowrap; }
  .loaded-at.stale { color: #ea8a0c; font-weight: 600; }
  .links { display: flex; gap: 0.5rem; }
  .links a {
    font-size: 0.85rem; text-decoration: none; color: var(--text); padding: 0.25em 0.8em;
    border: 1px solid var(--border-strong); border-radius: 0.5rem; background: var(--surface);
  }
  .links a[hidden] { display: none; }
  .links button {
    font: inherit; font-size: 0.85rem; color: var(--text); padding: 0.25em 0.8em; cursor: pointer;
    border: 1px solid var(--border-strong); border-radius: 0.5rem; background: var(--surface);
  }
  .links button.anonymize[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  main { box-sizing: border-box; margin: 0; padding: 1rem; display: flex; flex-direction: column; gap: 1.25rem; }
  .message { color: var(--muted); }
  .cached-banner {
    box-sizing: border-box; margin: 0.75rem 1rem 0; padding: 0.4rem 0.8rem;
    color: var(--muted); font-size: 0.85rem; border: 1px dashed var(--border-strong); border-radius: 0.5rem;
  }
  .cached-banner[hidden] { display: none; }
  .cached-banner.failed {
    display: flex; flex-wrap: wrap; align-items: center; gap: 0.2rem 1rem;
    color: var(--text); border: 1px solid #ea8a0c; background: var(--surface);
  }
  .cached-banner.failed strong { color: #ea8a0c; }
  .cached-banner .detail, .unavailable .detail { flex-basis: 100%; order: 1; color: var(--muted); font-size: 0.8rem; }
  .unavailable {
    margin-top: 1.5rem; padding: 1.2rem 1.4rem; background: var(--surface);
    border: 1px solid var(--red-line); border-radius: 0.5rem;
  }
  .unavailable h2 { margin: 0 0 0.4rem; font-size: 1.05rem; color: var(--red-fg); }
  .unavailable p { margin: 0 0 0.6rem; }
  .retry {
    font: inherit; font-size: 0.85rem; color: var(--text); padding: 0.25em 0.9em; cursor: pointer;
    border: 1px solid var(--border-strong); border-radius: 0.5rem; background: var(--bg);
  }
  .cached-banner .retry { margin-left: auto; }
  /* State carried by the badge and, for the only state needing action, by color: an ordinary or resolved
     thread stays neutral. */
  .thread {
    scroll-margin-top: 6.5rem;
    background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: 0.5rem; overflow: hidden;
  }
  .thread.resolved > summary { color: var(--muted); }
  /* Unresolved: the whole border in red, visible wherever you are in a long comment, and a tinted header. */
  .thread.unresolved { border: 2px solid var(--red-line); }
  .thread.unresolved > summary { background: var(--red-bg); }
  .thread.unresolved .badge { color: var(--red-fg); background: var(--surface); }
  .thread > summary {
    display: flex; flex-wrap: wrap; gap: 0.2rem 0.6rem; align-items: baseline; padding: 0.45rem 0.8rem;
    cursor: pointer; font-size: 0.85rem; color: var(--muted); border-bottom: 1px solid var(--border);
  }
  .thread:not([open]) > summary { border-bottom: none; }
  .thread > summary strong { color: var(--text); }
  .thread > summary a { margin-left: auto; }
  .badge { font-size: 0.72rem; font-weight: 600; padding: 0 0.4em; border-radius: 0.3rem; border: 1px solid currentColor; }
  .note { padding: 0.45rem 0.8rem; }
  .note-meta { margin-bottom: 0.3rem; font-size: 0.78rem; color: var(--muted); }
  .note-meta strong { color: var(--text); }
  /* Selection and scrollbars in the page colors, not the browser's. */
  ::selection { background: color-mix(in srgb, var(--accent) 28%, transparent); }
  html { scrollbar-color: var(--border-strong) transparent; }
</style>
</head>
<body>
<header>
  <div class="title-row">
    <h1><span class="page-kind" id="page-kind"></span><span id="title"></span></h1>
    <nav class="links">
      <a id="diff-link" target="_blank" data-tab="diff" hidden></a>
      <a id="gitlab-link" target="_blank" rel="noopener" hidden></a>
      <button type="button" id="anonymize" class="anonymize" data-anonymize aria-pressed="false">🕶</button>
      <div class="shortcuts" id="shortcuts"><button type="button" class="shortcuts-btn" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6.5 10h.01M10 10h.01M13.5 10h.01M17 10h.01M8 14h8"/></svg></button></div>
      <button type="button" id="close-tab" data-close-tab></button>
    </nav>
  </div>
  <div class="subtitle">
    <span class="mr-author" id="mr-author" hidden></span>
    <span class="branches" id="branches"></span>
    <span class="summary" id="summary"></span>
    <span class="loaded-at" id="loaded-at"></span>
  </div>
</header>
<p class="cached-banner" id="cached-banner" hidden></p>
<main id="comments"></main>
<script src="notes.js"></script>
<script src="tabs.js"></script>
<script src="shortcuts.js"></script>
<script src="dates.js"></script>
<script src="avatars.js"></script>
<script src="anonymize.js"></script>
<script src="version.js"></script>
<script>
  const TEXTS = {
    fr: {
      title: p => `!${p.iid}${p.title ? ` ${p.title}` : ""}`,
      pageKind: "Commentaires",
      branches: p => `<code>${p.branch}</code> vers <code>${p.target}</code>`,
      mergedBranches: p => `<code>${p.branch}</code> mergée dans <code>${p.target}</code>`,
      loading: "Chargement des commentaires GitLab…",
      unavailable: "Commentaires indisponibles",
      noCopy: "Ils n'ont encore jamais été chargés sur ce poste : aucune copie à montrer en attendant GitLab.",
      retry: "Réessayer",
      cachedUpdating: p => `Commentaires du ${p.date} à ${p.time} · mise à jour en cours…`,
      cachedSlow: p => `Copie du ${p.date} à ${p.time}, en lecture seule : GitLab ne répond pas, toujours en attente`,
      cachedFailed: p => `Copie du ${p.date} à ${p.time}, en lecture seule : la mise à jour a échoué`,
      cachedReadOnly: "Répondre et résoudre attendent la réponse de GitLab",
      none: "Aucun commentaire général sur cette MR : seuls des diff notes, ou rien.",
      summary: p => `${p.n} commentaire${p.n > 1 ? "s" : ""} hors diff notes${p.open ? ` · ${p.open} non résolu${p.open > 1 ? "s" : ""}` : ""}`,
      resolved: "Résolu",
      unresolved: "Non résolu",
      replies: n => `${n} réponse${n > 1 ? "s" : ""}`,
      diff: "Diff",
      diffTitle: "git diff de cette MR",
      gitlab: "Ouvrir dans GitLab",
      author: "Auteur de la MR",
      close: "✕ Fermer",
      closeTitle: "Fermer cet onglet",
      closeRefused: "Le navigateur refuse de fermer un onglet qu'il n'a pas ouvert depuis le dashboard : Ctrl+W",
      shortcuts: "Raccourcis clavier",
      browserShortcuts: "Navigateur",
      closeTabShortcut: "Fermer cet onglet",
      shortcutRows: [
        ["<kbd>n</kbd> <kbd>p</kbd>", "Fil non résolu suivant, précédent"],
        ["<kbd>r</kbd>", "Recharger depuis GitLab"],
        ["<kbd>Ctrl</kbd> <kbd>Entrée</kbd>", "Publier la réponse en cours"],
        ["<kbd>Échap</kbd>", "Annuler la réponse, fermer ce panneau"],
        ["<kbd>?</kbd>", "Cette liste"],
      ],
      openNote: "GitLab",
      anonymize: "Mode démo, pour des captures d'écran : noms, intitulés et branches remplacés à l'écran par des valeurs fictives, commentaires par du lorem ipsum. Un second clic rend l'affichage d'origine",
    },
    en: {
      title: p => `!${p.iid}${p.title ? ` ${p.title}` : ""}`,
      pageKind: "Comments",
      branches: p => `<code>${p.branch}</code> into <code>${p.target}</code>`,
      mergedBranches: p => `<code>${p.branch}</code> merged into <code>${p.target}</code>`,
      loading: "Loading GitLab comments…",
      unavailable: "Comments unavailable",
      noCopy: "They were never loaded on this computer: no copy to show while waiting for GitLab.",
      retry: "Retry",
      cachedUpdating: p => `Comments as of ${p.date} ${p.time} · updating…`,
      cachedSlow: p => `Copy from ${p.date} ${p.time}, read-only: GitLab does not answer, still waiting`,
      cachedFailed: p => `Copy from ${p.date} ${p.time}, read-only: the update failed`,
      cachedReadOnly: "Reply and resolve wait for GitLab's answer",
      none: "No general comment on this MR: only diff notes, or nothing.",
      summary: p => `${p.n} comment${p.n > 1 ? "s" : ""} besides diff notes${p.open ? ` · ${p.open} unresolved` : ""}`,
      resolved: "Resolved",
      unresolved: "Unresolved",
      replies: n => `${n} repl${n > 1 ? "ies" : "y"}`,
      diff: "Diff",
      diffTitle: "git diff of this MR",
      gitlab: "Open in GitLab",
      author: "Author of the MR",
      close: "✕ Close",
      closeTitle: "Close this tab",
      closeRefused: "The browser does not let the page close a tab it did not open from the dashboard: Ctrl+W",
      shortcuts: "Keyboard shortcuts",
      browserShortcuts: "Browser",
      closeTabShortcut: "Close this tab",
      shortcutRows: [
        ["<kbd>n</kbd> <kbd>p</kbd>", "Next, previous unresolved thread"],
        ["<kbd>r</kbd>", "Reload from GitLab"],
        ["<kbd>Ctrl</kbd> <kbd>Enter</kbd>", "Publish the reply being written"],
        ["<kbd>Esc</kbd>", "Cancel the reply, close this panel"],
        ["<kbd>?</kbd>", "This list"],
      ],
      openNote: "GitLab",
      anonymize: "Demo mode, for screenshots: names, titles and branches replaced on screen by fictitious values, comments by lorem ipsum. A second click restores the original display",
    },
  };
  const params = new URLSearchParams(location.search);
  const lang = params.get("lang") in TEXTS ? params.get("lang") : savedLang();

  // Dashboard language, remembered by its FR / EN button: the URL usually provides it.
  function savedLang() {
    try {
      const lang = localStorage.getItem("mr-dashboard.lang");
      return lang in TEXTS ? lang : "en";
    } catch (ignored) {
      return "en";
    }
  }

  const texts = TEXTS[lang];
  const iid = params.get("iid") ?? "";
  document.documentElement.lang = lang;
  MrTabs.claim("comments", iid);
  showLoadedAt(document.getElementById("loaded-at"), lang);
  const closeTab = document.getElementById("close-tab");
  closeTab.textContent = texts.close;
  closeTab.title = texts.closeTitle;
  closeTab.dataset.closeRefused = texts.closeRefused;
  document.getElementById("anonymize").title = texts.anonymize;
  MrShortcuts.fill(document.getElementById("shortcuts"), {
    label: texts.shortcuts,
    heading: texts.shortcuts,
    rows: texts.shortcutRows,
    browser: { heading: texts.browserShortcuts, rows: [[MrShortcuts.closeTabKeys, texts.closeTabShortcut]] },
    keys: { n: () => stepThread(1), p: () => stepThread(-1), r: () => load() },
  });

  // Next or previous unresolved thread from where the screen starts, under the header: where scrollIntoView puts a thread.
  function stepThread(step) {
    const threads = [...document.querySelectorAll(".thread.unresolved")];
    if (!threads.length) return false;
    const top = parseFloat(getComputedStyle(threads[0]).scrollMarginTop);
    const target = step > 0
      ? threads.find(thread => thread.getBoundingClientRect().top > top + 2)
      : threads.findLast(thread => thread.getBoundingClientRect().top < top - 2);
    if (!target) return false;
    target.scrollIntoView({ block: "start" });
  }
  // Displayed MR and comments, read by the anonymization mode; comment bodies are replaced entirely there.
  let shown = null;
  Anonymizer.attach({ data: () => shown, opaque: ".gl-body" });

  function escapeHtml(text) {
    return String(text).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  }

  // "3 h", "2 d": enough to place a comment in the MR's life.
  function age(iso) {
    const minutes = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));
    if (minutes < 60) return `${minutes} min`;
    if (minutes < 48 * 60) return `${Math.round(minutes / 60)} h`;
    return `${Math.round(minutes / 1440)} ${lang === "fr" ? "j" : "d"}`;
  }

  function showMessage(text) {
    document.getElementById("comments").innerHTML = `<p class="message">${escapeHtml(text)}</p>`;
  }

  function renderHeader(mr) {
    const title = texts.title({ iid, title: mr?.title.replace(/^Draft:\s*/i, "") });
    document.getElementById("page-kind").textContent = texts.pageKind;
    document.getElementById("title").textContent = title;
    document.title = `${texts.pageKind} · ${title} — MisteR Dashboard`;
    if (!mr) return;
    const branches = mr.state === "merged" ? texts.mergedBranches : texts.branches;
    document.getElementById("branches").innerHTML = branches({ branch: escapeHtml(mr.sourceBranch), target: escapeHtml(mr.targetBranch) });
    // Missing from a save older than its addition: shown on next load.
    const authorName = mr.author?.name;
    if (authorName) {
      const author = document.getElementById("mr-author");
      author.title = texts.author;
      author.innerHTML = `<span class="avatar" data-name="${escapeHtml(authorName)}" style="--avatar-color:${Avatars.color(authorName)}" aria-hidden="true">${escapeHtml(Avatars.initials(authorName))}</span>`
        + escapeHtml(authorName);
      author.hidden = false;
    }
    const gitlab = document.getElementById("gitlab-link");
    gitlab.textContent = texts.gitlab;
    gitlab.href = mr.webUrl;
    gitlab.hidden = false;
    // Same diff as from the dashboard: a merged MR is found by its commits, its branch may be gone.
    if (mr.state === "merged" && !mr.mergeCommitSha) return;
    const query = new URLSearchParams({ iid });
    const diff = document.getElementById("diff-link");
    diff.textContent = texts.diff;
    diff.title = texts.diffTitle;
    diff.href = `diff.html?${query}`;
    diff.dataset.iid = iid;
    diff.hidden = false;
  }

  function threadHtml(discussion, gitlabWeb) {
    const notes = discussion.notes.nodes.filter(n => !n.system);
    const [first, ...replies] = notes;
    const resolved = discussion.resolvable && discussion.resolved;
    const when = n => `<span title="${escapeHtml(formatDateTime(n.createdAt))}">${escapeHtml(age(n.createdAt))}</span>`;
    // Author and date of the first comment in the thread header; each reply carries its own.
    const note = (n, i) => `<div class="note">`
      + (i ? `<div class="note-meta"><strong>${escapeHtml(n.author?.name ?? "?")}</strong> · ${when(n)}</div>` : "")
      + `<div class="gl-body">${GitlabNotes.render(n.bodyHtml, gitlabWeb)}</div></div>`;
    const badge = discussion.resolvable ? `<span class="badge">${escapeHtml(resolved ? texts.resolved : texts.unresolved)}</span>` : "";
    const state = resolved ? " resolved" : discussion.resolvable ? " unresolved" : "";
    const id = GitlabNotes.discussionId(discussion.id);
    return `<details class="thread${state}" data-discussion="${escapeHtml(id)}"${resolved ? "" : " open"}>`
      + `<summary><strong>${escapeHtml(first.author?.name ?? "?")}</strong>`
      + `<span>${escapeHtml(formatDateTime(first.createdAt))} · ${when(first)}</span>`
      + badge + (replies.length ? `<span>${escapeHtml(texts.replies(replies.length))}</span>` : "")
      + `<a href="${escapeHtml(first.url)}" target="_blank" rel="noopener">${escapeHtml(texts.openNote)}</a></summary>`
      + notes.map(note).join("") + GitlabNotes.threadActionsHtml(discussion, lang) + `</details>`;
  }

  // General comments: those not attached to any line; GitLab system messages
  // (commits added, status changed) are not.
  async function fetchComments(config) {
    let mr = null;
    const discussions = await GitlabNotes.allNodes(async after => {
      const data = await GitlabNotes.graphql(`{ project(fullPath: ${JSON.stringify(config.gitlabProject)}) {
        mergeRequest(iid: ${JSON.stringify(iid)}) {
          title webUrl state sourceBranch targetBranch diffHeadSha mergeCommitSha author { name }
          discussions(first: 50${after ? `, after: ${JSON.stringify(after)}` : ""}) {
            pageInfo { hasNextPage endCursor }
            nodes { id resolvable resolved notes(first: 100) { nodes {
              system url createdAt author { name } position { positionType } bodyHtml
            } } }
          }
        }
      } }`);
      mr = data.project?.mergeRequest;
      if (!mr) throw new Error(`!${iid} ?`);
      return mr.discussions;
    });
    const general = discussions.filter(d => {
      const first = d.notes.nodes[0];
      return first && !first.position && d.notes.nodes.some(n => !n.system);
    });
    return { mr, general };
  }

  // Latest GitLab data of each viewed MR, to show it without waiting for GitLab, or despite it:
  // the last CACHED_MRS, per MR (the server origin already separates tracked projects).
  const CACHE_KEY = "mr-dashboard.comments";
  const CACHE_VERSION = 1;
  const CACHED_MRS = 30;
  // Beyond that, GitLab is flagged as slow; its response, if it arrives, still replaces the saved copy.
  const SLOW_MS = 15000;

  function readCache() {
    try {
      const saved = JSON.parse(localStorage.getItem(CACHE_KEY));
      return saved?.version === CACHE_VERSION ? saved.mrs : {};
    } catch (ignored) {
      return {};
    }
  }

  // Best effort: storage full ⇒ drop the least recently viewed MRs until it fits.
  function saveToCache(entry) {
    const mrs = { ...readCache(), [iid]: entry };
    const kept = Object.entries(mrs).sort(([, a], [, b]) => b.at.localeCompare(a.at)).slice(0, CACHED_MRS);
    while (kept.length) {
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify({ version: CACHE_VERSION, mrs: Object.fromEntries(kept) }));
        return;
      } catch (ignored) {
        kept.pop();
      }
    }
  }

  // Banner above the displayed copy; failure: true for a wait that is too long, or the cause of a
  // failure, shown small with a way to retry.
  function showBanner(
      text,
      failure
  ) {
    const banner = document.getElementById("cached-banner");
    banner.innerHTML = !text ? "" : !failure ? escapeHtml(text)
      : `<strong>${escapeHtml(text)}</strong>`
        // Retry only once the request has finished: a slow request still in flight may succeed.
        + (typeof failure === "string" ? `<span class="detail">${escapeHtml(failure)}</span>`
          + `<button type="button" class="retry">${escapeHtml(texts.retry)}</button>` : "");
    banner.title = text ? texts.cachedReadOnly : "";
    banner.classList.toggle("failed", Boolean(failure));
    banner.hidden = !text;
    banner.querySelector(".retry")?.addEventListener("click", load);
  }

  function showUnavailable(reason) {
    document.getElementById("comments").innerHTML = `<section class="unavailable">`
      + `<h2>${escapeHtml(texts.unavailable)}</h2><p>${escapeHtml(texts.noCopy)}</p>`
      + `<p class="detail">${escapeHtml(reason)}</p>`
      + `<button type="button" class="retry">${escapeHtml(texts.retry)}</button></section>`;
    document.querySelector(".unavailable .retry").addEventListener("click", load);
  }

  function cachedAt(entry) {
    const [date, time] = formatDateTime(entry.at).split(" ");
    return { date, time };
  }

  function renderSummary(general) {
    const open = general.filter(d => d.resolvable && !d.resolved).length;
    document.getElementById("summary").textContent = texts.summary({ n: general.length, open });
  }

  // Renders the MR and its comments; returns the container, or nothing when there is no comment.
  function render({ mr, general, gitlabWeb }) {
    shown = { mr, general, iid };
    renderHeader(mr);
    renderSummary(general);
    if (!general.length) {
      showMessage(texts.none);
      return null;
    }
    const container = document.getElementById("comments");
    container.innerHTML = general.map(d => threadHtml(d, gitlabWeb)).join("");
    scrollToAttention(container);
    return container;
  }

  // Opens on the first unresolved thread, or on the latest comments when none is left. The saved copy
  // and the fresh data render in turn: the second render only repeats the jump if the reader has not scrolled.
  let autoScrollY = null;
  function scrollToAttention(container) {
    if (autoScrollY !== null && Math.abs(window.scrollY - autoScrollY) > 2) return;
    const target = container.querySelector(".thread.unresolved");
    if (target) target.scrollIntoView({ block: "start" });
    else window.scrollTo(0, document.documentElement.scrollHeight);
    autoScrollY = window.scrollY;
  }

  // Saved copy shown read-only: a reply or resolution would start from a possibly stale state.
  function renderCached(entry) {
    render(entry)?.querySelectorAll(".thread-actions button").forEach(button => {
      button.disabled = true;
      button.title = texts.cachedReadOnly;
    });
    showLoadedAt(document.getElementById("loaded-at"), lang, entry.at);
  }

  // Reloading (R, Retry) renders into the same container: its listeners are added only once.
  let threadsHandled = false;

  async function load() {
    const cached = readCache()[iid];
    if (cached) {
      renderCached(cached);
      showBanner(texts.cachedUpdating(cachedAt(cached)));
    } else {
      showMessage(texts.loading);
      renderHeader(null);
    }
    const slow = cached && setTimeout(() => showBanner(texts.cachedSlow(cachedAt(cached)), true), SLOW_MS);
    try {
      const config = await (await fetch("config")).json();
      const { mr, general } = await fetchComments(config);
      const entry = { at: new Date().toISOString(), mr, general, gitlabWeb: config.gitlabWeb };
      saveToCache(entry);
      showBanner(null);
      showLoadedAt(document.getElementById("loaded-at"), lang, entry.at);
      const container = render(entry);
      if (!container || threadsHandled) return;
      threadsHandled = true;
      // After a reply or resolution: only this thread is re-rendered, the others keep their state.
      GitlabNotes.handleThreads(container, {
        iid,
        lang,
        refresh: async id => {
          const { mr: current, general: updated } = await fetchComments(config);
          saveToCache({ at: new Date().toISOString(), mr: current, general: updated, gitlabWeb: config.gitlabWeb });
          renderSummary(updated);
          const discussion = updated.find(d => GitlabNotes.discussionId(d.id) === id);
          const thread = container.querySelector(`[data-discussion="${CSS.escape(id)}"]`);
          if (discussion && thread) thread.outerHTML = threadHtml(discussion, config.gitlabWeb);
        },
      });
    } catch (error) {
      if (cached) showBanner(texts.cachedFailed(cachedAt(cached)), error.message);
      else showUnavailable(error.message);
    } finally {
      clearTimeout(slow);
    }
  }

  load();
</script>
</body>
</html>
