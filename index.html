<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MR ouvertes — signaux CI</title>
<style>
  :root {
    --bg: #f7f7f8;
    --surface: #ffffff;
    --border: #e3e3e8;
    --text: #1f1f24;
    --muted: #6b6b76;
    --link: #1f63c7;
    --red-bg: #fde8e8; --red-fg: #b3261e;
    --orange-bg: #fff1dc; --orange-fg: #9a5200;
    --green-bg: #e3f5e8; --green-fg: #1d6b35;
    --grey-bg: #ececf0; --grey-fg: #5b5b66;
    --blue-bg: #e6effc; --blue-fg: #1f4f99;
    --focus: #1f63c7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a;
      --surface: #1f1f25;
      --border: #33333c;
      --text: #ececf1;
      --muted: #9a9aa6;
      --link: #7aa7f0;
      --red-bg: #4a1f1d; --red-fg: #ffb4ab;
      --orange-bg: #47300f; --orange-fg: #ffc77a;
      --green-bg: #173a24; --green-fg: #8fd8a4;
      --grey-bg: #2c2c34; --grey-fg: #b4b4bf;
      --blue-bg: #1c2d4a; --blue-fg: #a9c6f5;
    }
  }
  * { box-sizing: border-box; }
  /* Toute la page est en rem : la taille de base suit la largeur d'écran (16 px en 1366, ~20 px en
     1920, ~25 px en 2560, 30 px au-delà), pour rester lisible sur un grand écran sans zoom manuel. */
  html { font-size: clamp(16px, 0.75vw + 6px, 30px); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 1rem/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px;
    padding: 16px 24px 8px;
  }
  header h1 { margin: 0; font-size: 1.45rem; font-weight: 600; }
  header .meta { color: var(--muted); font-size: 0.93rem; }
  header .spacer { flex: 1; }
  button {
    font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 6px; padding: 0.35em 0.85em; cursor: pointer;
  }
  button:hover { border-color: var(--muted); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .filters {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 8px 24px 12px; border-bottom: 1px solid var(--border);
  }
  .filters input[type=search], .filters select {
    font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 6px; padding: 0.35em 0.55em;
  }
  .filters input[type=search] { flex: 1 1 260px; min-width: 200px; }
  .filters label.check { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
  .active-labels { display: flex; flex-wrap: wrap; gap: 4px; }
  .active-labels .label { cursor: pointer; }
  .active-labels .label::after { content: " ×"; }
  .summary { padding: 8px 24px; color: var(--muted); font-size: 1rem; }
  .table-wrap { padding: 0 24px 32px; overflow-x: auto; }
  table.mrs {
    width: 100%; border-collapse: separate; border-spacing: 0;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  }
  table.mrs th, table.mrs td {
    padding: 0.55rem 0.8rem; border-bottom: 1px solid var(--border);
    text-align: left; vertical-align: middle;
  }
  table.mrs tbody tr:last-child td { border-bottom: 0; }
  table.mrs tbody tr:hover td { background: var(--bg); }
  table.mrs th {
    position: sticky; top: 0; z-index: 1; background: var(--surface);
    font-size: 0.93rem; font-weight: 600; color: var(--muted); white-space: nowrap;
  }
  table.mrs th button {
    all: unset; cursor: pointer; display: inline-flex; gap: 0.3em; align-items: center;
  }
  table.mrs th button:hover { color: var(--text); }
  table.mrs th button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  table.mrs th[aria-sort] { color: var(--text); }
  table.mrs th .arrow { font-size: 0.8em; min-width: 0.8em; }
  table.mrs th.num, table.mrs td.num { text-align: right; font-variant-numeric: tabular-nums; }
  table.mrs td.nowrap { white-space: nowrap; }
  table.mrs td.signal { white-space: nowrap; }
  table.mrs td.signal .stack { display: flex; flex-direction: column; align-items: flex-start; gap: 0.3rem; }
  .mr-cell { min-width: 22rem; }
  .mr-cell .title { font-weight: 600; font-size: 1.1rem; }
  .mr-cell .title .draft {
    font-weight: 500; font-size: 0.86rem; color: var(--grey-fg); background: var(--grey-bg);
    border-radius: 4px; padding: 1px 6px; margin-right: 6px; vertical-align: 1px;
  }
  .mr-cell .sub { color: var(--muted); font-size: 0.93rem; }
  .mr-cell .sub code { font-size: 0.86rem; background: var(--grey-bg); border-radius: 4px; padding: 0 4px; }
  .mr-cell .labels { margin-top: 0.25rem; }
  .ok { color: var(--muted); }
  .ok.good { color: var(--green-fg); }
  .muted { color: var(--muted); }
  .labels { display: flex; flex-wrap: wrap; gap: 4px; }
  .label {
    font-size: 0.93rem; border-radius: 1em; padding: 0.1em 0.65em;
    background: var(--blue-bg); color: var(--blue-fg); border: 0; cursor: pointer;
  }
  .pill {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 1.1rem; font-weight: 700; border-radius: 1.1em; padding: 0.3em 0.85em;
    white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  a.pill:hover { text-decoration: none; filter: brightness(0.95); }
  .pill.red { background: var(--red-bg); color: var(--red-fg); }
  .pill.orange { background: var(--orange-bg); color: var(--orange-fg); }
  .pill.green { background: var(--green-bg); color: var(--green-fg); }
  .pill.grey { background: var(--grey-bg); color: var(--grey-fg); font-weight: 500; }
  .pill.loading { background: var(--grey-bg); color: var(--grey-fg); font-weight: 500; opacity: .7; }
  .error-banner {
    margin: 12px 24px; padding: 10px 14px; border-radius: 8px;
    background: var(--red-bg); color: var(--red-fg);
  }
  .empty { padding: 32px 24px; color: var(--muted); text-align: center; }
  @media (max-width: 720px) {
    header, .filters, .summary { padding-left: 16px; padding-right: 16px; }
    .table-wrap { padding: 0 16px 24px; }
  }
</style>
</head>
<body>
<header>
  <h1>MR ouvertes</h1>
  <span class="meta" id="project"></span>
  <span class="spacer"></span>
  <span class="meta" id="refreshed"></span>
  <button id="refresh" type="button">Rafraîchir</button>
</header>

<div class="filters">
  <input type="search" id="q" placeholder="Rechercher : titre, !iid, branche, ticket…" aria-label="Recherche">
  <select id="target" aria-label="Branche cible"></select>
  <select id="author" aria-label="Auteur"></select>
  <select id="reviewer" aria-label="Reviewer"></select>
  <select id="assignee" aria-label="Assignee"></select>
  <select id="label" aria-label="Ajouter un label au filtre"></select>
  <select id="draft" aria-label="Draft">
    <option value="">Draft : toutes</option>
    <option value="no">Hors Draft</option>
    <option value="yes">Draft seules</option>
  </select>
  <label class="check"><input type="checkbox" id="alerts"> Avec alertes seulement</label>
  <div class="active-labels" id="activeLabels"></div>
</div>

<div id="errors"></div>
<div class="summary" id="summary"></div>
<div class="table-wrap">
  <table class="mrs">
    <thead><tr id="headers"></tr></thead>
    <tbody id="list"></tbody>
  </table>
</div>

<script>
"use strict";

const PIT_MARKER = "<!-- mutation-report -->";
const PENDING_JOB_STATUSES = new Set(["created", "pending", "running", "waiting_for_resource", "preparing", "scheduled", "manual"]);
const MAX_PARALLEL_MRS = 4;
const RETENTION_SETTING = "sonar.dbcleaner.daysBeforeDeletingInactiveBranchesAndPRs";
const DEFAULT_SONAR_RETENTION_DAYS = 5;
const PIPELINE_LOOK = {
  success: ["green", "Pipeline réussi"],
  failed: ["red", "Pipeline KO"],
  canceled: ["grey", "Pipeline annulé"],
  running: ["grey", "Pipeline en cours"],
  pending: ["grey", "Pipeline en attente"],
  created: ["grey", "Pipeline créé"],
  skipped: ["grey", "Pipeline ignoré"],
  manual: ["grey", "Pipeline manuel"],
};

const PIPELINE_RANK = { failed: 5, canceled: 4, running: 3, pending: 3, created: 3, manual: 2, skipped: 1, success: 0 };

// Ordre des colonnes, et pour chacune : valeur de tri (null = inconnue) et sens du premier clic.
// Les signaux trient par gravité décroissante au premier clic, pour faire remonter les alertes.
const COLUMNS = [
  { key: "title", label: "MR", firstDir: "asc", cellClass: "mr-cell", value: mr => mr.title.replace(/^Draft:\s*/i, ""), render: mrCell },
  { key: "author", label: "Auteur", firstDir: "asc", cellClass: "nowrap", value: mr => mr.author?.name ?? null, render: mr => escapeHtml(mr.author?.name ?? "?") },
  { key: "pipeline", label: "Pipeline", firstDir: "desc", cellClass: "signal",
    value: mr => { const s = signalsOf(mr); return s.pipeline ? PIPELINE_RANK[s.pipeline.status] ?? 3 : null; },
    render: pipelineCell },
  { key: "pit", label: "Mutants restants", firstDir: "desc", cellClass: "signal",
    help: "Mutants PIT survivants, non couverts ou en erreur, sur les classes modifiées par la MR",
    value: mr => { const p = signalsOf(mr).pit; return p?.state === "ok" ? 1000 * p.survived + p.noCoverage + p.errors : null; },
    render: pitCell },
  { key: "issues", label: "Issues Sonar", firstDir: "desc", cellClass: "signal",
    value: mr => { const x = signalsOf(mr).sonar; return sonarUsable(x) ? x.issues + (x.gate && x.gate !== "OK" ? 0.5 : 0) : null; },
    render: issuesCell },
  { key: "coverage", label: "Couverture", firstDir: "asc", cellClass: "signal",
    help: "Couverture Sonar du nouveau code de la MR",
    value: mr => { const x = signalsOf(mr).sonar; return sonarUsable(x) ? x.coverage : null; },
    render: coverageCell },
  { key: "commits", label: "Commits", firstDir: "desc", num: true, cellClass: "num", value: commitsCount, render: commitsCell },
  { key: "last_commit", label: "Dernier commit", firstDir: "desc", cellClass: "nowrap",
    help: "Date du commit le plus récent — un commentaire ne la fait pas bouger",
    value: lastCommitDate, render: mr => dateCell(lastCommitDate(mr), "Dernier commit") },
  { key: "threads", label: "Threads non résolus", firstDir: "desc", num: true, cellClass: "num",
    help: "Threads non résolus / threads résolubles au total",
    value: mr => { const t = signalsOf(mr).threads; return t && !t.error ? t.unresolved + t.total / 10000 : null; },
    render: threadsCell },
  { key: "comments", label: "Commentaires", firstDir: "desc", num: true, cellClass: "num", value: mr => mr.user_notes_count, render: mr => String(mr.user_notes_count) },
  { key: "activity", label: "Activité", firstDir: "desc", cellClass: "nowrap",
    help: "Dernière activité GitLab : commit, commentaire, label, approbation…",
    value: mr => mr.updated_at, render: mr => dateCell(mr.updated_at, "Dernière activité") },
  { key: "created", label: "Créée", firstDir: "desc", cellClass: "nowrap", value: mr => mr.created_at, render: mr => dateCell(mr.created_at, "Créée le") },
];
const DEFAULT_SORT = { key: "activity", dir: "desc" };

const state = {
  config: null,
  mrs: [],
  signals: new Map(),
  sonarPullRequests: new Map(),
  sonarRetentionDays: DEFAULT_SONAR_RETENTION_DAYS,
  filters: readFiltersFromUrl(),
};

const $ = id => document.getElementById(id);

function readFiltersFromUrl() {
  const p = new URLSearchParams(location.search);
  return {
    q: p.get("q") || "",
    target: p.has("target") ? p.get("target") : "develop",
    author: p.get("author") || "",
    reviewer: p.get("reviewer") || "",
    assignee: p.get("assignee") || "",
    labels: (p.get("labels") || "").split(",").filter(Boolean),
    draft: p.get("draft") || "",
    sort: COLUMNS.some(c => c.key === p.get("sort")) ? p.get("sort") : DEFAULT_SORT.key,
    dir: p.get("dir") === "asc" || p.get("dir") === "desc" ? p.get("dir") : DEFAULT_SORT.dir,
    alerts: p.get("alerts") === "1",
  };
}

function writeFiltersToUrl() {
  const f = state.filters;
  const p = new URLSearchParams();
  if (f.q) p.set("q", f.q);
  if (f.target !== "develop") p.set("target", f.target);
  if (f.author) p.set("author", f.author);
  if (f.reviewer) p.set("reviewer", f.reviewer);
  if (f.assignee) p.set("assignee", f.assignee);
  if (f.labels.length) p.set("labels", f.labels.join(","));
  if (f.draft) p.set("draft", f.draft);
  if (f.sort !== DEFAULT_SORT.key || f.dir !== DEFAULT_SORT.dir) {
    p.set("sort", f.sort);
    p.set("dir", f.dir);
  }
  if (f.alerts) p.set("alerts", "1");
  const query = p.toString();
  history.replaceState(null, "", query ? "?" + query : location.pathname);
}

async function api(path) {
  const response = await fetch(path);
  if (!response.ok) {
    let message = response.statusText;
    try {
      const body = await response.json();
      message = body.message || body.errors?.map(e => e.msg).join(", ") || message;
    } catch (ignored) { /* corps non JSON */ }
    const error = new Error(`${response.status} ${message}`);
    error.status = response.status;
    throw error;
  }
  return { body: await response.json(), headers: response.headers };
}

async function gitlabAll(path) {
  const results = [];
  let page = "1";
  while (page) {
    const separator = path.includes("?") ? "&" : "?";
    const { body, headers } = await api(`/gitlab/${path}${separator}per_page=100&page=${page}`);
    results.push(...body);
    page = headers.get("X-Next-Page");
  }
  return results;
}

const projectPath = () => `projects/${encodeURIComponent(state.config.gitlabProject)}`;

// ---------- Chargement ----------

async function refresh() {
  $("errors").innerHTML = "";
  $("refresh").disabled = true;
  try {
    state.config ??= (await api("/config")).body;
    $("project").textContent = state.config.gitlabProject;
    const [mrs] = await Promise.all([
      gitlabAll(`${projectPath()}/merge_requests?state=opened`),
      loadSonarPullRequests(),
    ]);
    state.mrs = mrs;
    state.signals = new Map(mrs.map(mr => [mr.iid, { loading: true }]));
    populateFilterOptions();
    render();
    $("refreshed").textContent = "mis à jour à " + new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
    await runLimited(mrs, MAX_PARALLEL_MRS, async mr => {
      state.signals.set(mr.iid, await loadSignals(mr));
      render();
    });
  } catch (error) {
    showError("Chargement des MR impossible : " + error.message);
  } finally {
    $("refresh").disabled = false;
  }
}

async function loadSonarPullRequests() {
  state.sonarPullRequests = new Map();
  if (!state.config.sonarEnabled) return;
  try {
    const { body } = await api(`/sonar/project_pull_requests/list?project=${encodeURIComponent(state.config.sonarProject)}`);
    for (const pr of body.pullRequests) state.sonarPullRequests.set(pr.key, pr);
    const retention = await api(`/sonar/settings/values?keys=${RETENTION_SETTING}&component=${encodeURIComponent(state.config.sonarProject)}`);
    state.sonarRetentionDays = Number(retention.body.settings[0]?.value) || DEFAULT_SONAR_RETENTION_DAYS;
  } catch (error) {
    showError("Sonar injoignable : " + error.message);
  }
}

async function runLimited(items, limit, task) {
  const queue = [...items];
  const workers = Array.from({ length: Math.min(limit, queue.length) }, async () => {
    while (queue.length) await task(queue.shift());
  });
  await Promise.all(workers);
}

async function loadSignals(mr) {
  const signals = {};
  [signals.commits, signals.threads] = await Promise.all([loadCommits(mr), loadThreads(mr)]);
  try {
    const detail = (await api(`/gitlab/${projectPath()}/merge_requests/${mr.iid}`)).body;
    signals.pipeline = detail.head_pipeline;
    const [jobs, notes] = await Promise.all([
      signals.pipeline
        ? gitlabAll(`${projectPath()}/pipelines/${signals.pipeline.id}/jobs?include_retried=false`)
        : Promise.resolve([]),
      api(`/gitlab/${projectPath()}/merge_requests/${mr.iid}/notes?per_page=100&order_by=updated_at&sort=desc`).then(r => r.body),
    ]);
    const job = name => jobs.filter(j => j.name === name).sort((a, b) => b.id - a.id)[0];
    signals.pit = pitSignal(job("mutation_test"), notes.find(n => n.body.startsWith(PIT_MARKER)), mr);
    signals.sonar = await sonarSignal(job("sonar"), mr);
  } catch (error) {
    signals.error = error.message;
  }
  return signals;
}

// Date du dernier commit = committed_date le plus récent, et non l'updated_at de la MR, que GitLab
// bouge aussi sur un commentaire, un label ou une approbation.
// Un thread = une discussion résoluble (commentaire de revue, diff note) ; les notes système et
// les commentaires simples non résolubles ne comptent pas, comme dans le compteur de GitLab.
async function loadThreads(mr) {
  try {
    const discussions = await gitlabAll(`${projectPath()}/merge_requests/${mr.iid}/discussions`);
    const resolvable = discussions.filter(d => d.notes.some(n => n.resolvable));
    const unresolved = resolvable.filter(d => d.notes.some(n => n.resolvable && !n.resolved));
    return { total: resolvable.length, unresolved: unresolved.length };
  } catch (error) {
    return { error: error.message };
  }
}

async function loadCommits(mr) {
  try {
    const commits = await gitlabAll(`${projectPath()}/merge_requests/${mr.iid}/commits`);
    const last = commits.map(c => c.committed_date).sort().at(-1) ?? null;
    return { count: commits.length, lastDate: last };
  } catch (error) {
    return { error: error.message };
  }
}

function pitSignal(job, note, mr) {
  const noteLink = note ? `${mr.web_url}#note_${note.id}` : mr.web_url;
  if (!job) return { state: "absent", label: "PIT non applicable", title: "Le dernier pipeline ne contient pas de job mutation_test", link: mr.web_url };
  if (PENDING_JOB_STATUSES.has(job.status)) return { state: "pending", label: "PIT en cours", title: `Job mutation_test : ${job.status}`, link: job.web_url };
  if (!note) return { state: "absent", label: "PIT sans note", title: `Job ${job.status}, aucune note ${PIT_MARKER} publiée`, link: job.web_url };
  // Seul un job en échec rend la note suspecte. Un job réussi republie la note, mais GitLab ne
  // bouge pas son updated_at si le contenu est identique : comparer les dates donnerait un faux
  // « périmé » à chaque résultat inchangé.
  if (job.status === "failed" && job.started_at && new Date(note.updated_at) < new Date(job.started_at)) {
    return { state: "stale", label: "PIT en échec", title: "Le dernier job mutation_test a échoué ; la note date d'un run précédent", link: job.web_url };
  }
  const counts = parsePitNote(note.body);
  if (!counts) return { state: "absent", label: "PIT illisible", title: "Tableau de la note PIT non reconnu", link: noteLink };
  return { state: "ok", ...counts, link: noteLink, jobFailed: job.status === "failed" };
}

function parsePitNote(body) {
  const row = body.split("\n").find(line => /^\|\s*\d/.test(line));
  if (!row) return null;
  const cells = row.split("|").slice(1, -1).map(cell => {
    const match = cell.match(/\d+(?:[.,]\d+)?/);
    return match ? Number(match[0].replace(",", ".")) : null;
  });
  const [total, killed, survived, noCoverage, errors, strength] = cells;
  return { total, killed, survived, noCoverage, errors, strength };
}

// Sans analyse Sonar, trois situations très différentes : le pipeline n'a pas de job sonar (non
// applicable), l'analyse a été purgée par le serveur faute de push récent (expirée — relancer le
// pipeline), ou le job n'a rien produit (introuvable — à investiguer).
function missingSonarAnalysis(job, mr) {
  if (!job) return { state: "absent", label: "Sonar non applicable", title: "Le dernier pipeline ne contient pas de job sonar", link: mr.web_url };
  const retentionMs = state.sonarRetentionDays * 24 * 3600 * 1000;
  if (job.status === "success" && job.finished_at && Date.now() - new Date(job.finished_at) > retentionMs) {
    return {
      state: "absent",
      label: "Sonar analyse expirée",
      title: `Sonar supprime l'analyse d'une MR sans push depuis ${state.sonarRetentionDays} jours ; relancer le pipeline pour la recalculer`,
      link: job.web_url,
    };
  }
  return { state: "absent", label: "Sonar introuvable", title: `Job sonar ${job.status}, mais aucune analyse Sonar pour cette MR`, link: job.web_url };
}

async function sonarSignal(job, mr) {
  if (!state.config.sonarEnabled) return { state: "disabled", label: "Sonar non configuré", title: "SONAR_TOKEN absent côté serveur" };
  const base = state.config.sonarWeb;
  const id = encodeURIComponent(state.config.sonarProject);
  const links = {
    dashboard: `${base}/dashboard?id=${id}&pullRequest=${mr.iid}`,
    issues: `${base}/project/issues?id=${id}&pullRequest=${mr.iid}&resolved=false`,
    coverage: `${base}/component_measures?id=${id}&pullRequest=${mr.iid}&metric=new_coverage`,
  };
  const pr = state.sonarPullRequests.get(String(mr.iid));
  if (!pr) return missingSonarAnalysis(job, mr);
  if (job && PENDING_JOB_STATUSES.has(job.status)) {
    return { state: "pending", label: "Sonar en cours", title: `Job sonar : ${job.status} — valeurs de l'analyse précédente masquées`, link: job.web_url };
  }
  const stale = job?.started_at && new Date(pr.analysisDate) < new Date(job.started_at);
  const project = encodeURIComponent(state.config.sonarProject);
  const [issues, measures] = await Promise.all([
    api(`/sonar/issues/search?componentKeys=${project}&pullRequest=${mr.iid}&resolved=false&ps=1`).then(r => r.body),
    api(`/sonar/measures/component?component=${project}&pullRequest=${mr.iid}&metricKeys=new_coverage,new_lines_to_cover,new_uncovered_lines,new_uncovered_conditions`).then(r => r.body),
  ]);
  const measure = key => {
    const m = measures.component.measures.find(x => x.metric === key);
    const value = m?.period?.value ?? m?.value;
    return value === undefined ? null : Number(value);
  };
  return {
    state: stale ? "stale" : "ok",
    gate: pr.status?.qualityGateStatus,
    issues: issues.total,
    coverage: measure("new_coverage"),
    linesToCover: measure("new_lines_to_cover"),
    uncoveredLines: measure("new_uncovered_lines"),
    uncoveredConditions: measure("new_uncovered_conditions"),
    analysisDate: pr.analysisDate,
    links,
    jobFailed: job?.status === "failed",
  };
}

// ---------- Cellules de signaux ----------

// Une cellule n'affiche une pastille que s'il y a quelque chose à voir (alerte, ou signal absent /
// en cours) ; un signal propre reste en texte discret, pour que les alertes ressortent d'un coup d'œil.

function signalsOf(mr) {
  return state.signals.get(mr.iid) || {};
}

function loadingOrError(s) {
  if (s.loading) return pill("loading", "…");
  if (s.error) return pill("grey", "Indisponible", s.error);
  return null;
}

function pipelineCell(mr) {
  const s = signalsOf(mr);
  const pending = loadingOrError(s);
  if (pending) return pending;
  if (!s.pipeline) return pill("grey", "Aucun");
  if (s.pipeline.status === "success") return `<a class="ok good" href="${escapeHtml(s.pipeline.web_url)}" target="_blank" rel="noopener" title="Pipeline #${s.pipeline.id} réussi">OK</a>`;
  const [tone, text] = PIPELINE_LOOK[s.pipeline.status] ?? ["grey", s.pipeline.status];
  return pill(tone, text.replace(/^Pipeline /, "").replace(/^./, c => c.toUpperCase()), `Pipeline #${s.pipeline.id}`, s.pipeline.web_url);
}

function pitCell(mr) {
  const s = signalsOf(mr);
  const pending = loadingOrError(s);
  if (pending) return pending;
  const pit = s.pit;
  if (!pit) return "";
  if (pit.state !== "ok") return pill("grey", pit.label.replace(/^PIT /, "").replace(/^./, c => c.toUpperCase()), pit.title, pit.link);
  const detail = `${pit.total} mutants — ${pit.killed} tués, ${pit.survived} survivants, ${pit.noCoverage} non couverts, ${pit.errors} en erreur` +
    (pit.strength != null ? ` — test strength ${pit.strength} %` : "");
  const out = [];
  if (pit.survived > 0) out.push(pill("red", `${pit.survived} survivant${plural(pit.survived)}`, detail, pit.link));
  if (pit.noCoverage > 0) out.push(pill("orange", `${pit.noCoverage} non couvert${plural(pit.noCoverage)}`, detail, pit.link));
  if (pit.errors > 0) out.push(pill("orange", `${pit.errors} en erreur`, detail, pit.link));
  if (pit.jobFailed) out.push(pill("orange", "Job en échec", "Le job mutation_test a échoué ; la note peut être partielle", pit.link));
  if (!out.length) return `<a class="ok good" href="${escapeHtml(pit.link)}" target="_blank" rel="noopener" title="${escapeHtml(detail)}">aucun</a>`;
  return `<div class="stack">${out.join("")}</div>`;
}

function sonarUsable(sonar) {
  return sonar && (sonar.state === "ok" || sonar.state === "stale");
}

function sonarUnusable(mr) {
  const s = signalsOf(mr);
  const pending = loadingOrError(s);
  if (pending) return pending;
  if (!s.sonar) return "";
  if (!sonarUsable(s.sonar)) return pill("grey", s.sonar.label.replace(/^Sonar /, "").replace(/^./, c => c.toUpperCase()), s.sonar.title, s.sonar.link);
  return null;
}

function issuesCell(mr) {
  const unusable = sonarUnusable(mr);
  if (unusable !== null) return unusable;
  const sonar = signalsOf(mr).sonar;
  const out = [];
  if (sonar.state === "stale") out.push(pill("grey", "Périmé", `Dernière analyse ${formatDate(sonar.analysisDate)}, antérieure au dernier job sonar`, sonar.links.dashboard));
  if (sonar.issues > 0) out.push(pill("red", `${sonar.issues} issue${plural(sonar.issues)}`, "Issues Sonar ouvertes sur la MR", sonar.links.issues));
  if (sonar.gate && sonar.gate !== "OK") out.push(pill("red", `Quality Gate ${sonar.gate}`, "Quality Gate Sonar non passé", sonar.links.dashboard));
  if (sonar.jobFailed) out.push(pill("orange", "Job en échec", "Le job sonar a échoué", sonar.links.dashboard));
  if (!out.length) return `<a class="ok good" href="${escapeHtml(sonar.links.issues)}" target="_blank" rel="noopener">aucune</a>`;
  return `<div class="stack">${out.join("")}</div>`;
}

function coverageCell(mr) {
  const unusable = sonarUnusable(mr);
  if (unusable !== null) return unusable;
  const sonar = signalsOf(mr).sonar;
  if (sonar.coverage == null) return `<span class="ok" title="Aucune ligne nouvelle à couvrir">—</span>`;
  const detail = `Couverture du nouveau code : ${sonar.linesToCover ?? "?"} lignes à couvrir, ${sonar.uncoveredLines ?? "?"} non couvertes, ${sonar.uncoveredConditions ?? "?"} conditions non couvertes`;
  if (sonar.coverage >= 100) return `<a class="ok good" href="${escapeHtml(sonar.links.coverage)}" target="_blank" rel="noopener" title="${escapeHtml(detail)}">100 %</a>`;
  return pill("orange", formatPercent(sonar.coverage), detail, sonar.links.coverage);
}

function commitsCount(mr) {
  const commits = signalsOf(mr).commits;
  return commits && !commits.error ? commits.count : null;
}

function lastCommitDate(mr) {
  return signalsOf(mr).commits?.lastDate ?? null;
}

function dateCell(iso, label) {
  if (!iso) return `<span class="muted">—</span>`;
  return `<span title="${escapeHtml(label + " : " + formatDate(iso))}">${relative(iso)}</span>`;
}

function pill(tone, text, title = "", link = null) {
  const tag = link ? "a" : "span";
  const href = link ? ` href="${escapeHtml(link)}" target="_blank" rel="noopener"` : "";
  return `<${tag} class="pill ${tone}"${href} title="${escapeHtml(title)}">${escapeHtml(text)}</${tag}>`;
}

function alertScore(mr) {
  const s = state.signals.get(mr.iid) || {};
  let score = 0;
  if (mr.has_conflicts) score += 100;
  if (s.pipeline && s.pipeline.status === "failed") score += 100;
  if (s.pit?.state === "ok") score += 10 * (s.pit.survived || 0) + (s.pit.noCoverage || 0) + (s.pit.errors || 0);
  if (s.sonar?.state === "ok" || s.sonar?.state === "stale") {
    score += 10 * (s.sonar.issues || 0);
    if (s.sonar.gate && s.sonar.gate !== "OK") score += 50;
    if (s.sonar.coverage != null && s.sonar.coverage < 100) score += Math.ceil(100 - s.sonar.coverage);
  }
  return score;
}

// ---------- Filtres ----------

function populateFilterOptions() {
  const people = key => {
    const map = new Map();
    for (const mr of state.mrs) {
      for (const u of [].concat(mr[key] || [])) if (u) map.set(u.username, u.name);
    }
    return [...map].sort((a, b) => a[1].localeCompare(b[1], "fr"));
  };
  fillSelect("author", "Auteur : tous", people("author"));
  fillSelect("reviewer", "Reviewer : tous", people("reviewers"));
  fillSelect("assignee", "Assignee : tous", people("assignees"));
  const targets = [...new Set(state.mrs.map(mr => mr.target_branch).concat(state.filters.target ? [state.filters.target] : []))].sort();
  fillSelect("target", "Cible : toutes", targets.map(t => [t, "→ " + t]));
  const labels = [...new Set(state.mrs.flatMap(mr => mr.labels))].sort((a, b) => a.localeCompare(b, "fr"));
  fillSelect("label", "Label : ajouter…", labels.filter(l => !state.filters.labels.includes(l)).map(l => [l, l]));
  $("label").value = "";
}

function fillSelect(id, placeholder, options) {
  const select = $(id);
  const current = id === "label" ? "" : state.filters[id];
  select.innerHTML = `<option value="">${escapeHtml(placeholder)}</option>` +
    options.map(([value, text]) => `<option value="${escapeHtml(value)}">${escapeHtml(text)}</option>`).join("");
  if (current && !options.some(([value]) => value === current)) {
    select.insertAdjacentHTML("beforeend", `<option value="${escapeHtml(current)}">${escapeHtml(current)}</option>`);
  }
  select.value = current;
}

function syncControlsFromState() {
  const f = state.filters;
  $("q").value = f.q;
  $("draft").value = f.draft;
  $("alerts").checked = f.alerts;
  $("activeLabels").innerHTML = f.labels
    .map(l => `<button type="button" class="label" data-remove-label="${escapeHtml(l)}" title="Retirer ce label du filtre">${escapeHtml(l)}</button>`)
    .join("");
}

function matches(mr) {
  const f = state.filters;
  if (f.target && mr.target_branch !== f.target) return false;
  if (f.author && mr.author?.username !== f.author) return false;
  if (f.reviewer && !mr.reviewers?.some(u => u.username === f.reviewer)) return false;
  if (f.assignee && !mr.assignees?.some(u => u.username === f.assignee)) return false;
  if (f.draft === "yes" && !mr.draft) return false;
  if (f.draft === "no" && mr.draft) return false;
  if (f.labels.some(l => !mr.labels.includes(l))) return false;
  if (f.alerts && alertScore(mr) === 0) return false;
  if (f.q) {
    const haystack = `!${mr.iid} ${mr.title} ${mr.source_branch} ${mr.author?.name ?? ""} ${mr.labels.join(" ")}`.toLowerCase();
    if (!f.q.toLowerCase().split(/\s+/).filter(Boolean).every(term => haystack.includes(term))) return false;
  }
  return true;
}

// ---------- Rendu ----------

function render() {
  syncControlsFromState();
  renderHeaders();
  const column = COLUMNS.find(c => c.key === state.filters.sort) ?? COLUMNS.find(c => c.key === DEFAULT_SORT.key);
  const visible = state.mrs.filter(matches).sort(comparator(column, state.filters.dir));
  const withAlerts = state.mrs.filter(mr => alertScore(mr) > 0).length;
  const loading = [...state.signals.values()].filter(s => s.loading).length;
  $("summary").textContent = `${visible.length} MR affichée${plural(visible.length)} sur ${state.mrs.length} ouvertes · ` +
    `${withAlerts} avec alertes` + (loading ? ` · signaux en cours de chargement (${loading})` : "");
  $("list").innerHTML = visible.length
    ? visible.map(renderRow).join("")
    : `<tr><td class="empty" colspan="${COLUMNS.length}">Aucune MR ne correspond aux filtres.</td></tr>`;
}

// Une valeur inconnue (signal en chargement, absent, en erreur) est toujours rangée en fin de liste,
// quel que soit le sens du tri : elle ne doit ni masquer ni passer pour un bon résultat.
function comparator(column, dir) {
  const sign = dir === "asc" ? 1 : -1;
  return (a, b) => {
    const va = column.value(a);
    const vb = column.value(b);
    if (va == null && vb == null) return b.updated_at.localeCompare(a.updated_at);
    if (va == null) return 1;
    if (vb == null) return -1;
    const order = typeof va === "string" ? va.localeCompare(vb, "fr") : va - vb;
    return sign * order || b.updated_at.localeCompare(a.updated_at);
  };
}

function renderHeaders() {
  $("headers").innerHTML = COLUMNS.map(column => {
    const active = state.filters.sort === column.key;
    const arrow = active ? (state.filters.dir === "asc" ? "▲" : "▼") : "";
    const ariaSort = active ? ` aria-sort="${state.filters.dir === "asc" ? "ascending" : "descending"}"` : "";
    return `<th class="${column.num ? "num" : ""}"${ariaSort} title="${escapeHtml(column.help ?? "")}">` +
      `<button type="button" data-sort="${column.key}">${escapeHtml(column.label)}<span class="arrow">${arrow}</span></button></th>`;
  }).join("");
}

function renderRow(mr) {
  return `<tr>${COLUMNS.map(c => `<td class="${c.cellClass ?? ""}">${c.render(mr)}</td>`).join("")}</tr>`;
}

function mrCell(mr) {
  const labels = mr.labels
    .map(l => `<button type="button" class="label" data-add-label="${escapeHtml(l)}" title="Filtrer sur ce label">${escapeHtml(l)}</button>`)
    .join("");
  const conflicts = mr.has_conflicts ? " " + pill("red", "Conflits", "La MR est en conflit avec sa branche cible", mr.web_url) : "";
  return `<div class="title">${mr.draft ? '<span class="draft">Draft</span>' : ""}<a href="${escapeHtml(mr.web_url)}" target="_blank" rel="noopener">${escapeHtml(mr.title.replace(/^Draft:\s*/i, ""))}</a>${conflicts}</div>
    <div class="sub">!${mr.iid} · <code>${escapeHtml(mr.source_branch)}</code> → <code>${escapeHtml(mr.target_branch)}</code></div>
    ${labels ? `<div class="labels">${labels}</div>` : ""}`;
}

function threadsCell(mr) {
  const threads = signalsOf(mr).threads;
  if (!threads) return `<span class="muted">…</span>`;
  if (threads.error) return `<span class="muted" title="${escapeHtml(threads.error)}">?</span>`;
  const text = `${threads.unresolved} / ${threads.total}`;
  const title = `${threads.unresolved} thread${plural(threads.unresolved)} non résolu${plural(threads.unresolved)} sur ${threads.total}`;
  if (threads.unresolved > 0) return pill("orange", text, title, mr.web_url);
  return `<span class="ok${threads.total ? " good" : ""}" title="${escapeHtml(title)}">${text}</span>`;
}

function commitsCell(mr) {
  const commits = signalsOf(mr).commits;
  if (!commits) return `<span class="muted">…</span>`;
  if (commits.error) return `<span class="muted" title="${escapeHtml(commits.error)}">?</span>`;
  return String(commits.count);
}

// ---------- Utilitaires ----------

const RELATIVE = new Intl.RelativeTimeFormat("fr", { numeric: "always" });

function relative(iso) {
  const seconds = (new Date(iso) - Date.now()) / 1000;
  const steps = [[60, "second"], [60, "minute"], [24, "hour"], [Infinity, "day"]];
  let value = seconds;
  for (const [size, unit] of steps) {
    if (Math.abs(value) < size) return RELATIVE.format(Math.round(value), unit);
    value /= size;
  }
}

const formatDate = iso => new Date(iso).toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" });
const formatPercent = value => value.toLocaleString("fr-FR", { maximumFractionDigits: 1 }) + " %";
const plural = n => (n > 1 ? "s" : "");

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

function showError(message) {
  $("errors").insertAdjacentHTML("beforeend", `<div class="error-banner">${escapeHtml(message)}</div>`);
}

// ---------- Événements ----------

function updateFilters(change) {
  Object.assign(state.filters, change);
  writeFiltersToUrl();
  if ("labels" in change) populateFilterOptions();
  render();
}

$("q").addEventListener("input", e => updateFilters({ q: e.target.value }));
for (const id of ["target", "author", "reviewer", "assignee", "draft"]) {
  $(id).addEventListener("change", e => updateFilters({ [id]: e.target.value }));
}
$("alerts").addEventListener("change", e => updateFilters({ alerts: e.target.checked }));
$("label").addEventListener("change", e => {
  if (e.target.value) updateFilters({ labels: [...state.filters.labels, e.target.value] });
});
document.addEventListener("click", e => {
  const header = e.target.closest("[data-sort]");
  if (header) {
    const column = COLUMNS.find(c => c.key === header.dataset.sort);
    const dir = state.filters.sort === column.key ? (state.filters.dir === "asc" ? "desc" : "asc") : column.firstDir;
    updateFilters({ sort: column.key, dir });
    return;
  }
  const add = e.target.closest("[data-add-label]");
  const remove = e.target.closest("[data-remove-label]");
  if (add && !state.filters.labels.includes(add.dataset.addLabel)) {
    updateFilters({ labels: [...state.filters.labels, add.dataset.addLabel] });
  } else if (remove) {
    updateFilters({ labels: state.filters.labels.filter(l => l !== remove.dataset.removeLabel) });
  }
});
$("refresh").addEventListener("click", refresh);

refresh();
</script>
