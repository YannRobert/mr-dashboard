    uncoveredConditions: measure("new_uncovered_conditions"),
    analysisDate: pr.analysisDate,
    links,
    jobFailed: job?.status === "failed",
    refreshing: running ? refreshingOf(job, pr.analysisDate) : null,
  };
}

function refreshingOf(job, valuesDate) {
  return { job: job.name, status: job.status, link: job.web_url, valuesDate };
}

// ---------- Cellules de signaux ----------

// Une cellule n'affiche une pastille que s'il y a quelque chose à voir (alerte, ou signal absent /
// en cours) ; un signal propre reste en texte discret, pour que les alertes ressortent d'un coup d'œil.

// Par l'état de la MR, et non par la vue affichée : les notifications lisent les MR ouvertes quelle
// que soit la vue.
function signalsOf(mr) {
  return (mr.state === "merged" ? state.merged.signals : state.signals).get(mr.iid) || {};
}

function loadingOrError(s) {
  if (s.loading) return pill("loading", "…");
  if (s.error) return pill("grey", t("unavailable"), s.error);
  return null;
}

// Libellé du badge GitLab tel quel (« Passed », « Warning », « Failed », « Blocked »…) plutôt qu'un
// vocabulaire propre au tableau de bord : c'est ce que l'on retrouve en ouvrant le pipeline.
function pipelineCell(mr) {
  const s = signalsOf(mr);
  const pending = loadingOrError(s);
  if (pending) return pending;
  if (!s.pipeline) return pill("grey", t("pipeline.none"));
  const { id, web_url: link } = s.pipeline;
  const { text, label, group } = pipelineStatus(s.pipeline);
  const title = t("pipeline.title", { id, label });
  if (group === "success") return `<a class="ok good" href="${escapeHtml(link)}" target="_blank" rel="noopener" title="${escapeHtml(title)}">${escapeHtml(text)}</a>`;
  return pill(PIPELINE_TONE[group] ?? "grey", text, title, link);
}

// head_pipeline porte detailed_status ; repli sur le statut brut s'il manquait.
function pipelineStatus(pipeline) {
  const detailed = pipeline.detailed_status;
  return detailed
    ? { text: detailed.text, label: detailed.label, group: detailed.group }
    : { text: pipeline.status, label: pipeline.status, group: pipeline.status };
}

function pitCell(mr) {
  const s = signalsOf(mr);
  const pending = loadingOrError(s);
  if (pending) return pending;
  const pit = s.pit;
  if (!pit) return "";
  if (pit.state !== "ok") return reasonPill("pit", pit);
  const detail = t("pit.detail", pit);
  const out = [];
  if (pit.survived > 0) out.push(pill("red", t("pit.survived", { n: pit.survived }), detail, pit.link));
  if (pit.noCoverage > 0) out.push(pill("orange", t("pit.noCoverage", { n: pit.noCoverage }), detail, pit.link));
  if (pit.errors > 0) out.push(pill("orange", t("pit.errors", { n: pit.errors }), detail, pit.link));
  if (pit.jobFailed) out.push(pill("orange", t("job.failed"), t("pit.jobFailed"), pit.link));
  return signalStack(pit, out, `<a class="ok good" href="${escapeHtml(pit.link)}" target="_blank" rel="noopener" title="${escapeHtml(detail)}">0</a>`);
}

// Signal inexploitable (absent, en cours, non configuré…) : sa raison, en pastille grise.
function reasonPill(kind, signal) {
  return pill("grey", t(`reason.${signal.reason}`), t(`${kind}.${signal.reason}`, signal.info), signal.link);
}

function sonarUsable(sonar) {
  return sonar && (sonar.state === "ok" || sonar.state === "stale");
}

function sonarUnusable(mr) {
  const s = signalsOf(mr);
  const pending = loadingOrError(s);
  if (pending) return pending;
  if (!s.sonar) return "";
  if (!sonarUsable(s.sonar)) return reasonPill("sonar", s.sonar);
  return null;
}

function issuesCell(mr) {
  const unusable = sonarUnusable(mr);
  if (unusable !== null) return unusable;
  const sonar = signalsOf(mr).sonar;
  const out = [];
  if (sonar.state === "stale") out.push(pill("grey", t("sonar.stale"), t("sonar.staleTitle", { date: formatDate(sonar.analysisDate) }), sonar.links.dashboard));
  if (sonar.issues > 0) out.push(pill("red", t("sonar.issues", { n: sonar.issues }), t("sonar.issuesTitle"), sonar.links.issues));
  if (sonar.gate && sonar.gate !== "OK") out.push(pill("red", t("sonar.gate", { gate: sonar.gate }), t("sonar.gateTitle"), sonar.links.dashboard));
  if (sonar.jobFailed) out.push(pill("orange", t("job.failed"), t("sonar.jobFailed"), sonar.links.dashboard));
  return signalStack(sonar, out, `<a class="ok good" href="${escapeHtml(sonar.links.issues)}" target="_blank" rel="noopener">0</a>`);
}

function coverageCell(mr) {
  const unusable = sonarUnusable(mr);
  if (unusable !== null) return unusable;
  const sonar = signalsOf(mr).sonar;
  if (sonar.coverage == null) return signalStack(sonar, [], `<span class="ok" title="${escapeHtml(t("coverage.none"))}">—</span>`);
  const detail = t("coverage.detail", {
    lines: sonar.linesToCover ?? "?",
    uncovered: sonar.uncoveredLines ?? "?",
    conditions: sonar.uncoveredConditions ?? "?",
  });
  if (sonar.coverage >= 100) return signalStack(sonar, [], `<a class="ok good" href="${escapeHtml(sonar.links.coverage)}" target="_blank" rel="noopener" title="${escapeHtml(detail)}">${formatPercent(100)}</a>`);
  return signalStack(sonar, [pill("orange", formatPercent(sonar.coverage), detail, sonar.links.coverage)], "");
}

function commitsCount(mr) {
  const commits = signalsOf(mr).commits;
  return commits && !commits.error ? commits.count : null;
}

// Date du dernier push, et non celle du commit : GitLab date une version de la MR à sa réception,
// alors que la date de commit vient du poste du développeur, qui peut l'avoir réglée à sa guise
// (horloge fausse, rebase, commit --date). La date de commit reste lisible dans l'infobulle.
function lastCommitDate(mr) {
  const commits = signalsOf(mr).commits;
  return commits?.pushDate ?? commits?.commitDate ?? null;
}

// Date d'auteur du plus ancien commit : conservée au rebase, elle date le début du développement.
function firstCommitDate(mr) {
  return signalsOf(mr).commits?.firstDate ?? null;
}

function elapsed(
  from,
  to
) {
  return from && to ? new Date(to) - new Date(from) : null;
}

function durationCell(
  from,
  to
) {
  if (!from || !to) return `<span class="muted">—</span>`;
  const title = t("duration.title", { from: formatDate(from), to: formatDate(to) });
  return `<span title="${escapeHtml(title)}">${escapeHtml(compactDuration(elapsed(from, to)))}</span>`;
}

function commitAgeHours(mr) {
  const iso = lastCommitDate(mr);
  return iso ? (gitlabNow() - new Date(iso)) / 3600000 : null;
}

function lastCommitCell(mr) {
  const hours = commitAgeHours(mr);
  const mood = hours == null ? null
    : hours < ACTIVE_COMMIT_HOURS ? ["⚡", "commit.active"]
    : hours > IDLE_COMMIT_HOURS ? ["😴", "commit.idle"]
    : null;
  const badge = mood ? `<span class="commit-mood" title="${escapeHtml(t(mood[1]))}">${mood[0]}</span>` : "";
  const commits = signalsOf(mr).commits;
  const pushDate = lastCommitDate(mr);
  if (!pushDate) return dateCell(null, "");
  const tooltip = t("date.lastCommit", {
    push: formatDate(pushDate),
    commit: commits.commitDate ? formatDate(commits.commitDate) : "—",
  });
  return `<span title="${escapeHtml(tooltip)}">${relative(pushDate)}</span>${badge}`;
}

// Une action simple est attendue (correction, rebase) et personne n'a poussé depuis STALLED_ALERT_HOURS.
function isStalled(mr) {
  if (mr.state === "merged") return false;
  const hours = commitAgeHours(mr);
  return hours != null && hours > STALLED_ALERT_HOURS && alertScore(mr) > 0;
}

function stalledPill(mr) {
  return isStalled(mr) ? pill("red", t("stalled"), t("stalled.title"), mr.web_url) : "";
}

function dateCell(iso, key) {
  if (!iso) return `<span class="muted">—</span>`;
  return `<span title="${escapeHtml(t(key, { date: formatDate(iso) }))}">${relative(iso)}</span>`;
}

// Valeurs d'un run précédent pendant qu'un nouveau job tourne : préfixées d'une pastille « En cours »,
// et jamais affichées en vert — un signal propre peut encore se dégrader à la fin du job.
function refreshingPill(signal) {
  const r = signal.refreshing;
  if (!r) return "";
  return pill("grey", t("refreshing"), t("refreshing.title", { job: r.job, status: r.status, date: formatDate(r.valuesDate) }), r.link);
}

function signalStack(signal, alerts, clean) {
  const head = refreshingPill(signal);
  if (!head && !alerts.length) return clean;
  const body = alerts.length ? alerts : [head ? clean.replace(' class="ok good"', ' class="ok"') : clean];
  return `<div class="stack">${[head, ...body].join("")}</div>`;
}

function pill(tone, text, title = "", link = null) {
  const tag = link ? "a" : "span";
  const href = link ? ` href="${escapeHtml(link)}" target="_blank" rel="noopener"` : "";
  return `<${tag} class="pill ${tone}"${href} title="${escapeHtml(title)}">${escapeHtml(text)}</${tag}>`;
}

function alertScore(mr) {
  const s = state.signals.get(mr.iid) || {};
  let score = 0;
  if (mr.has_conflicts) score += 100;
  if (s.pipeline && s.pipeline.status === "failed") score += 100;
  if (s.pit?.state === "ok") score += 10 * (s.pit.survived || 0) + (s.pit.noCoverage || 0) + (s.pit.errors || 0);
  if (s.sonar?.state === "ok" || s.sonar?.state === "stale") {
    score += 10 * (s.sonar.issues || 0);
    if (s.sonar.gate && s.sonar.gate !== "OK") score += 50;
    if (s.sonar.coverage != null && s.sonar.coverage < 100) score += Math.ceil(100 - s.sonar.coverage);
  }
  return score;
}

// ---------- Notifications ----------

// Problèmes d'une MR, chacun avec une gravité : il est « nouveau » s'il n'était pas notifié ou si sa gravité
// a augmenté. Un signal inconnu (en erreur, pas encore analysé) garde les problèmes déjà notifiés pour sa
// catégorie, pour ne pas les renotifier quand il redevient lisible.
function problemsOf(mr) {
  const s = signalsOf(mr);
  const problems = [];
  const unknown = new Set();
  // blocking : problème en rouge dans le tableau, qui empêche le merge ou le rend risqué ; les autres
  // sont en orange, à traiter sans urgence.
  const add = (
    key,
    severity,
    text,
    blocking = false
  ) => problems.push({ key, severity, text, blocking });
  if (mr.has_conflicts) add("conflicts", 1, t("problem.conflicts"), true);
  if (s.pipeline?.status === "failed") add("pipeline", 1, t("problem.pipeline", { id: s.pipeline.id }), true);
  if (sonarUsable(s.sonar)) {
    const sonar = s.sonar;
    if (sonar.issues > 0) add("sonar.issues", sonar.issues, t("problem.sonarIssues", { n: sonar.issues }), true);
    if (sonar.gate && sonar.gate !== "OK") add("sonar.gate", 1, t("problem.gate", { gate: sonar.gate }), true);
    if (sonar.coverage != null && sonar.coverage < 100) {
      add("sonar.coverage", Math.ceil(100 - sonar.coverage), t("problem.coverage", { value: formatPercent(sonar.coverage) }));
    }
  } else if (sonarTracked()) {
    unknown.add("sonar");
  }
  const pit = s.pit;
  if (pit?.state === "ok") {
    if (pit.survived > 0) add("pit.survived", pit.survived, t("problem.pitSurvived", { n: pit.survived }), true);
    if (pit.noCoverage > 0) add("pit.noCoverage", pit.noCoverage, t("problem.pitNoCoverage", { n: pit.noCoverage }));
    if (pit.errors > 0) add("pit.errors", pit.errors, t("problem.pitErrors", { n: pit.errors }));
  } else if (pitTracked()) {
    unknown.add("pit");
  }
  if (!s.threads || s.threads.error) unknown.add("threads");
  else if (s.threads.unresolved > 0) add("threads", s.threads.unresolved, t("problem.threads", { n: s.threads.unresolved }));
  // Retard signalé comme dans la colonne : dès qu'il passe en orange.
  const behind = s.behind;
  if (behind?.count == null) {
    unknown.add("behind");
  } else if (behind.count > 0 && behind.since) {
    const hours = (gitlabNow() - new Date(behind.since)) / 3600000;
    if (hours > BEHIND_ORANGE_HOURS) {
      add("behind", 1, t("problem.behind", {
        n: behind.count,
        target: mr.target_branch,
        duration: compactDuration(gitlabNow() - new Date(behind.since)),
      }));
    }
  }
  return { problems, unknown };
}

// Appelée à chaque nouvelles données et toutes les REMINDER_CHECK_MS, pour les rappels sur ses propres MR.
// Le premier passage (rien de notifié jusque-là) notifie ses propres MR une par une et résume celles des
// autres en une seule notification, plutôt qu'une rafale.
function notifyProblems() {
  if (!state.notify || !state.notifier || !state.me || Notification.permission !== "granted") return;
  // Pas de données complètes encore : l'état notifié serait réécrit à vide, et tout renotifié ensuite.
  if (!state.refreshedAt) return;
  const notified = readNotified();
  const first = notified == null;
  const next = {};
  const now = Date.now();
  let othersWithProblems = 0;
  for (const mr of state.mrs) {
    const before = notified?.[mr.iid];
    if (signalsOf(mr).loading) {
      if (before) next[mr.iid] = before;
      continue;
    }
    const { problems, unknown } = problemsOf(mr);
    const severities = Object.fromEntries(problems.map(p => [p.key, p.severity]));
    for (const [key, severity] of Object.entries(before?.problems ?? {})) {
      if (unknown.has(key.split(".")[0])) severities[key] ??= severity;
    }
    if (!Object.keys(severities).length) {
      closeNotification(mr.iid);
      continue;
    }
    const own = mr.author?.username === state.me;
    const fresh = problems.some(p => !(p.severity <= (before?.problems?.[p.key] ?? 0)));
    const reminderDue = own && problems.length > 0 && (!before || now - before.at >= OWN_REMINDER_MS);
    const show = own ? fresh || reminderDue : fresh && !first;
    if (!own && fresh && first) othersWithProblems++;
    next[mr.iid] = { problems: severities, at: show ? now : before?.at ?? now };
    if (show) showNotification(
      mr,
      problems,
      own
    );
  }
  for (const iid of state.notifications.keys()) {
    if (!(iid in next)) closeNotification(iid);
  }
  saveNotified(next);
  if (othersWithProblems) {
    new Notification(t("notify.others", { n: othersWithProblems }), { body: t("notify.othersBody"), tag: "mr-others" });
  }
}

// Même tag par MR : une nouvelle notification remplace la précédente au lieu de s'empiler, et renotify la
// fait réapparaître. Celles de ses propres MR restent affichées jusqu'à ce qu'on les ferme.
function showNotification(
  mr,
  problems,
  own
) {
  const tone = mark => (mark ? "🔴" : "🟠");
  const blocking = problems.some(p => p.blocking);
  const title = own
    ? t("notify.own", { iid: mr.iid, n: problems.length, tone: tone(blocking) })
    : t("notify.other", { iid: mr.iid, author: mr.author?.name ?? "?", tone: tone(blocking) });
  const notification = new Notification(title, {
    body: [mr.title, ...problems.map(p => `${tone(p.blocking)} ${p.text}`)].join("\n"),
    tag: `mr-${mr.iid}`,
    renotify: true,
    requireInteraction: own,
  });
  notification.onclick = () => {
    window.open(mr.web_url, "_blank", "noopener");
    notification.close();
  };
  state.notifications.set(mr.iid, notification);
}

function closeNotification(iid) {
  state.notifications.get(iid)?.close();
  state.notifications.delete(iid);
}

function readNotified() {
  try {
    return JSON.parse(localStorage.getItem(NOTIFIED_KEY));
  } catch (ignored) {
    return null;
  }
}

function saveNotified(notified) {
  try {
    localStorage.setItem(NOTIFIED_KEY, JSON.stringify(notified));
  } catch (ignored) { /* stockage indisponible : les problèmes seront renotifiés au prochain chargement */ }
}

function forgetNotified() {
  try {
    localStorage.removeItem(NOTIFIED_KEY);
  } catch (ignored) { /* stockage indisponible : rien à oublier */ }
}

// Tout ce que le dashboard a écrit dans le localStorage de cette origine (donc de ce profil : chaque
// port est une origine à part), puis rechargement : l'état en mémoire le réécrirait sinon aussitôt.
function clearStorage() {
  if (!confirm(t("clearStorage.confirm"))) return;
  try {
    Object.keys(localStorage).filter(key => key.startsWith(STORAGE_PREFIX)).forEach(key => localStorage.removeItem(key));
  } catch (ignored) { /* stockage indisponible : il n'y a rien à effacer */ }
  location.reload();
}

function readNotify() {
  try {
    return localStorage.getItem(NOTIFY_KEY) === "true";
  } catch (ignored) {
    return false;
  }
}

function saveNotify(enabled) {
  try {
    localStorage.setItem(NOTIFY_KEY, String(enabled));
  } catch (ignored) { /* stockage indisponible : la préférence vaut pour la session */ }
}

// announce : la case vient d'être cochée. Notification de confirmation, pour vérifier tout de suite que le
// navigateur et le système laissent passer les notifications, et oubli de ce qui a déjà été notifié, pour
// que tous les problèmes en cours soient renotifiés — y compris par l'onglet notifiant s'il en est un autre.
// L'oubli précède saveNotify : l'onglet notifiant relit l'état sur l'événement storage qu'elle déclenche.
async function setNotify(
  enabled,
  announce = false
) {
  if (enabled && Notification.permission !== "granted" && await Notification.requestPermission() !== "granted") {
    showError(t("notify.denied"));
    enabled = false;
  }
  state.notify = enabled;
  $("notify").checked = enabled;
  if (enabled && announce) forgetNotified();
  saveNotify(enabled);
  if (!enabled) {
    [...state.notifications.keys()].forEach(closeNotification);
    return;
  }
  if (announce) new Notification(t("notify.enabled"), { body: t("notify.enabledBody"), tag: "mr-enabled" });
  await loadMe();
  notifyProblems();
}

async function loadMe() {
  if (state.me) return;
  try {
    state.me = (await api("/gitlab/user")).body.username;
  } catch (error) {
    showError(t("notify.me", { message: error.message }));
  }
}

// Élection d'un onglet notifiant : le verrou est gardé tant que l'onglet vit, puis passe au suivant.
// Sans Web Locks, chaque onglet notifie.
function electNotifier() {
  const lead = () => {
    state.notifier = true;
    notifyProblems();
  };
  if (!navigator.locks) {
    lead();
    return;
  }
  navigator.locks.request(NOTIFIER_LOCK, () => {
    lead();
    return new Promise(() => { /* gardé jusqu'à la fermeture de l'onglet */ });
  });
}

// ---------- Filtres ----------

function populateFilterOptions() {
  const people = key => {
    const map = new Map();
    for (const mr of viewMrs()) {
      for (const u of [].concat(mr[key] || [])) if (u) map.set(u.username, u.name);
    }
    return [...map].sort((a, b) => a[1].localeCompare(b[1], locale()));
  };
  fillSelect("author", t("filter.anyAuthor"), people("author"));
  fillSelect("reviewer", t("filter.anyReviewer"), people("reviewers"));
  fillSelect("assignee", t("filter.anyAssignee"), people("assignees"));
  const targets = [...new Set(viewMrs().map(mr => mr.target_branch).concat(state.filters.target ? [state.filters.target] : []))].sort();
  fillSelect("target", t("filter.anyTarget"), targets.map(target => [target, "→ " + target]));
  const labels = [...new Set(viewMrs().flatMap(mr => mr.labels))].sort((a, b) => a.localeCompare(b, locale()));
  fillSelect("label", t("filter.addLabel"), labels.filter(l => !state.filters.labels.includes(l)).map(l => [l, l]));
  $("label").value = "";
}

function fillSelect(id, placeholder, options) {
  const select = $(id);
  const current = id === "label" ? "" : state.filters[id];
  select.innerHTML = `<option value="">${escapeHtml(placeholder)}</option>` +
    options.map(([value, text]) => `<option value="${escapeHtml(value)}">${escapeHtml(text)}</option>`).join("");
  if (current && !options.some(([value]) => value === current)) {
    select.insertAdjacentHTML("beforeend", `<option value="${escapeHtml(current)}">${escapeHtml(current)}</option>`);
  }
  select.value = current;
}

// Les MR mergées ne sont plus ni en Draft ni en alerte, et ne s'actualisent pas d'elles-mêmes.
function syncControlsFromState() {
  const f = state.filters;
  const merged = mergedView();
  for (const el of document.querySelectorAll("[data-view]")) el.setAttribute("aria-pressed", String(el.dataset.view === f.view));
  $("period").hidden = !merged;
  $("period").value = f.period;
  $("draft").hidden = merged;
  $("alerts-control").hidden = merged;
  $("autoRefresh-control").hidden = merged;
  $("q").value = f.q;
  $("draft").value = f.draft;
  $("alerts").checked = f.alerts;
  $("activeLabels").innerHTML = f.labels
    .map(l => `<button type="button" class="label" data-remove-label="${escapeHtml(l)}" title="${escapeHtml(t("label.remove"))}">${escapeHtml(l)}</button>`)
    .join("");
}

function matches(mr) {
  const f = state.filters;
  if (f.target && mr.target_branch !== f.target) return false;
  if (f.author && mr.author?.username !== f.author) return false;
  if (f.reviewer && !mr.reviewers?.some(u => u.username === f.reviewer)) return false;
  if (f.assignee && !mr.assignees?.some(u => u.username === f.assignee)) return false;
  const merged = mergedView();
  if (!merged && f.draft === "yes" && !mr.draft) return false;
  if (!merged && f.draft === "no" && mr.draft) return false;
  if (f.labels.some(l => !mr.labels.includes(l))) return false;
  if (!merged && f.alerts && alertScore(mr) === 0) return false;
  if (f.q) {
    const haystack = `!${mr.iid} ${mr.title} ${mr.source_branch} ${mr.author?.name ?? ""} ${mr.labels.join(" ")}`.toLowerCase();
    if (!f.q.toLowerCase().split(/\s+/).filter(Boolean).every(term => haystack.includes(term))) return false;
  }
  return true;
}

// ---------- Rendu ----------

function render() {
  renderBranchPipeline();
  syncControlsFromState();
  renderHeaders();
  const columns = shownColumns();
  const column = columns.find(c => c.key === state.filters.sort) ?? columns.find(c => c.key === defaultSort().key);
  const mrs = viewMrs();
  const visible = mrs.filter(matches).sort(comparator(column, state.filters.dir));
  const merged = state.merged;
  const mergedLoading = mergedView() && merged.loading;
  const loadingText = t(mergedNeedsAll() ? "summary.mergedLoadingAll" : "summary.mergedLoading");
  $("summary").innerHTML = mergedView()
    ? `<span class="stat">${t("summary.merged", { n: visible.length, loaded: mrs.length, total: merged.total ?? mrs.length })}</span>` +
      (mergedLoading ? `<span class="stat loading">${escapeHtml(loadingText)}</span>` : "")
    : openSummary(visible, mrs);
  $("summary").insertAdjacentHTML("beforeend", gitlabListLink());
  const more = $("merged-more");
  more.hidden = !mergedView() || (!merged.hasMore && !merged.loading) || Boolean(merged.error);
  more.textContent = merged.loading ? loadingText : t("merged.more", { n: MERGED_PAGE_SIZE });
  $("list").innerHTML = visible.length
    ? visible.map(renderRow).join("")
    : `<tr><td class="empty" colspan="${columns.length}">${escapeHtml(t(mergedLoading ? "summary.mergedLoading" : "empty"))}</td></tr>`;
  fitTitles();
}

// Un titre trop long pour sa ligne voit sa police réduite juste assez pour y tenir, jusqu'à
// TITLE_MIN_SCALE : au-delà, le « … » de la feuille de style prend le relais.
function fitTitles() {
  for (const link of document.querySelectorAll("#list .mr-cell .title a")) {
    link.style.fontSize = "";
    if (link.scrollWidth <= link.clientWidth) continue;
    link.style.fontSize = `${Math.max(TITLE_MIN_SCALE, Math.floor(link.clientWidth / link.scrollWidth * 1000) / 1000)}em`;
  }
}

function openSummary(
  visible,
  mrs
) {
  const withAlerts = mrs.filter(mr => alertScore(mr) > 0).length;
  const loading = [...state.signals.values()].filter(s => s.loading).length;
  return `<span class="stat">${t("summary.shown", { n: visible.length, total: mrs.length })}</span>` +
    `<span class="stat${withAlerts ? " alert" : ""}">${t("summary.alerts", { n: withAlerts })}</span>` +
    (loading ? `<span class="stat loading">${t("summary.loading", { n: loading })}</span>` : "");
}

const viewMrs = () => (mergedView() ? state.merged.mrs : state.mrs);

// Liste des MR de la vue courante dans GitLab, sans les filtres du dashboard.
function gitlabListLink() {
  if (!state.config) return "";
  const view = mergedView() ? "merged" : "opened";
  const url = `${state.config.gitlabWeb}/${state.config.gitlabProject}/-/merge_requests?state=${view}`;
  return `<a class="gitlab-list" href="${escapeHtml(url)}" target="_blank" rel="noopener" title="${escapeHtml(t(`gitlabList.${view}.title`))}">${escapeHtml(t("gitlabList"))} ↗</a>`;
}

// Une valeur inconnue (signal en chargement, absent, en erreur) est toujours rangée en fin de liste,
// quel que soit le sens du tri : elle ne doit ni masquer ni passer pour un bon résultat.
function comparator(column, dir) {
  const sign = dir === "asc" ? 1 : -1;
  return (a, b) => {
    const va = column.value(a);
    const vb = column.value(b);
    if (va == null && vb == null) return b.updated_at.localeCompare(a.updated_at);
    if (va == null) return 1;
    if (vb == null) return -1;
    const order = typeof va === "string" ? va.localeCompare(vb, locale()) : va - vb;
    return sign * order || b.updated_at.localeCompare(a.updated_at);
  };
}

function renderHeaders() {
  const groups = shownGroups()
    .map(g => `<th colspan="${g.columns.length}" class="g-${g.key}${g.key !== "mr" ? " g-first" : ""}"><span>${g.key === "mr" ? "&nbsp;" : escapeHtml(t(`group.${g.key}`))}</span></th>`)
    .join("");
  $("headers").innerHTML = `<tr class="groups">${groups}</tr><tr class="columns">` + shownColumns().map(column => {
    const active = state.filters.sort === column.key;
    const arrow = active ? (state.filters.dir === "asc" ? "▲" : "▼") : "";
    const ariaSort = active ? ` aria-sort="${state.filters.dir === "asc" ? "ascending" : "descending"}"` : "";
    const help = has(`help.${column.key}`) ? t(`help.${column.key}`) : "";
    if (column.sortable === false) return `<th class="${groupClass(column.key)}" title="${escapeHtml(help)}"><span class="col-label">${escapeHtml(t(`col.${column.key}`))}</span></th>`;
    return `<th class="${column.num ? "num" : ""} ${groupClass(column.key)}"${ariaSort} title="${escapeHtml(help)}">` +
      `<button type="button" data-sort="${column.key}"><span class="col-label">${escapeHtml(t(`col.${column.key}`)).replace(/\n/g, "<br>")}</span><span class="arrow">${arrow}</span></button></th>`;
  }).join("") + "</tr>";
}

function renderRow(mr) {
  return `<tr${isStalled(mr) ? ' class="stalled"' : ""}>${shownColumns().map(c => `<td class="${c.cellClass ?? ""} ${groupClass(c.key)}">${c.render(mr)}</td>`).join("")}</tr>`;
}

function authorCell(mr) {
  const name = mr.author?.name ?? "?";
  const [first, ...rest] = name.trim().split(/\s+/);
  const lines = [first, rest.join(" ")].filter(Boolean).map(line => `<span>${escapeHtml(line)}</span>`).join("");
  return `<span class="author"><span class="avatar" style="--avatar-color:${Avatars.color(name)}" aria-hidden="true">${escapeHtml(Avatars.initials(name))}</span><span class="author-name">${lines}</span></span>`;
}

function mrCell(mr) {
  const labels = mr.labels
    .map(l => `<button type="button" class="label" data-add-label="${escapeHtml(l)}" title="${escapeHtml(t("label.add"))}">${escapeHtml(l)}</button>`)
    .join("");
  const conflicts = mr.has_conflicts && mr.state !== "merged" ? " " + pill("red", t("conflicts"), t("conflicts.title"), mr.web_url) : "";
  return `<div class="title"><a href="${escapeHtml(mr.web_url)}" target="_blank" rel="noopener" title="${escapeHtml(mr.title.replace(/^Draft:\s*/i, ""))}">${escapeHtml(mr.title.replace(/^Draft:\s*/i, ""))}</a>${mr.draft ? '<span class="draft">Draft</span>' : ""}${conflicts}${stalledPill(mr)}${changesRequestedPill(mr)}${approvalPill(mr)}</div>
    <div class="sub" title="${escapeHtml(`${mr.source_branch} → ${mr.target_branch}`)}"><span class="iid">!${mr.iid}</span>${diffStat(mr)} · <code>${escapeHtml(mr.source_branch)}</code> → <code>${escapeHtml(mr.target_branch)}</code></div>
    ${labels ? `<div class="labels">${labels}</div>` : ""}`;
}

// Dans la sous-ligne du titre plutôt qu'en colonne : la taille de la MR n'ajoute aucune largeur au tableau.
function diffStat(mr) {
  const d = mr.diffStats;
  if (!d) return "";
  const n = value => value.toLocaleString(locale());
  const title = t("diff.title", { files: d.fileCount, additions: d.additions, deletions: d.deletions });
  return ` · <span class="diffstat" title="${escapeHtml(title)}">${escapeHtml(t("diff.files", { n: d.fileCount }))} ` +
    `<span class="add">+${n(d.additions)}</span> <span class="del">−${n(d.deletions)}</span></span>`;
}

// MR mergée : retrouvée par son merge commit, sa branche source est d'ordinaire supprimée.
function gitDiffButton(mr) {
  if (mr.state === "merged" && !mr.merge_commit_sha) return "";
  return `<button type="button" class="mr-action" data-git-diff="${mr.iid}" title="${escapeHtml(t("gitDiff.title"))}" aria-label="diff">${DIFF_ICON}</button>`;
}

// Une page, un + au-dessus d'un − : un fichier modifié.
const DIFF_ICON = `<svg viewBox="0 0 16 16" width="1.15em" height="1.15em" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">`
  + `<path d="M3.5 1.5h6l3 3v10h-9z"/><path d="M8 4.8v4M6 6.8h4" stroke="var(--green-fg)"/><path d="M6 11.5h4" stroke="var(--red-fg)"/></svg>`;

function commentsLink(mr) {
  const query = new URLSearchParams({ iid: mr.iid, lang: state.lang });
  return `<a class="mr-action" href="comments.html?${query}" target="_blank" data-tab="comments" data-iid="${mr.iid}" title="${escapeHtml(t("comments.title"))}">🗨</a>`;
}

function openGitDiff(mr) {
  const query = new URLSearchParams({
    iid: mr.iid,
    title: mr.title.replace(/^Draft:\s*/i, ""),
    branch: mr.source_branch,
    target: mr.target_branch,
    url: mr.web_url,
    lang: state.lang,
  });
  if (mr.state === "merged") {
    query.set("head", mr.sha);
    query.set("merge", mr.merge_commit_sha);
  }
  MrTabs.open(`diff.html?${query}`, "diff", mr.iid);
}

// ---------- Fetch du dépôt local ----------

// Fetch à la demande, ou dès qu'une MR a reçu des commits, est apparue ou a disparu, ou que la branche
// du pipeline a avancé : la copie locale suit GitLab au plus près, et reste utilisable s'il tombe.
const gitFetchEnabled = () => state.configLoaded && state.config?.gitFetchIntervalS !== undefined;

const gitFetchIntervalText = (before, after) => {
  const seconds = state.config?.gitFetchIntervalS;
  return seconds > 0 ? `${before}${Math.round(seconds / 60)}${after}` : "";
};

// Suspendu, le fetch automatique l'est pour le serveur, donc pour tous les onglets : la page lit son
// état au lieu de le garder dans le navigateur.
function fetchIfRepoChanged() {
  if (!gitFetchEnabled() || state.gitFetch.status?.auto === false) return;
  const seen = [...state.mrs.map(mr => `${mr.iid}:${mr.sha}`).sort(), state.branchPipeline?.sha ?? ""].join(" ");
  if (seen === state.gitFetch.seen) return;
  state.gitFetch.seen = seen;
  gitFetch(seen);
}

// Avec l'état des MR, le serveur ne fetch que s'il diffère du dernier qu'on lui a signalé : une page
// rechargée ou un autre onglet ne relance pas de fetch. Sans, le fetch part toujours (bouton).
async function gitFetch(signature) {
  state.gitFetch.running = true;
  renderGitFetch();
  try {
    state.gitFetch.status = (await api("/git/fetch", {
      method: "POST",
      headers: { "X-MR-Dashboard": "1", "Content-Type": "application/json" },
      body: JSON.stringify(signature === undefined ? {} : { signature }),
    })).body;
  } catch (error) {
    state.gitFetch.status = { last: { at: new Date().toISOString(), ok: false, message: error.message }, lastSuccess: state.gitFetch.status?.lastSuccess };
  } finally {
    state.gitFetch.running = false;
    renderGitFetch();
  }
}

async function setGitFetchAuto(enabled) {
  try {
    state.gitFetch.status = (await api("/git/auto", {
      method: "POST",
      headers: { "X-MR-Dashboard": "1", "Content-Type": "application/json" },
      body: JSON.stringify({ enabled }),
    })).body;
  } catch (error) {
    alert(error.message);
  }
  renderGitFetch();
}

// Le serveur fetch aussi de lui-même à intervalle régulier : son état est relu pour le montrer.
async function loadGitFetchStatus() {
  if (!gitFetchEnabled() || state.gitFetch.running) return;
  try {
    state.gitFetch.status = (await api("/git/status")).body;
    renderGitFetch();
  } catch (error) {
    console.error("Lecture de l'état du fetch impossible :", error);
  }
}

function renderGitFetch() {
  const enabled = gitFetchEnabled();
  $("git-fetch-control").hidden = !enabled;
  $("git-fetch-divider").hidden = !enabled;
  if (!enabled) return;
  const { status, running } = state.gitFetch;
  const time = iso => new Date(iso).toLocaleTimeString(locale(), { hour: "2-digit", minute: "2-digit" });
  const el = $("git-fetch-status");
  $("git-fetch").disabled = running || status?.running;
  $("git-fetch-auto").checked = status?.auto !== false;
  // Cite l'intervalle du serveur, connu après les textes statiques.
  $("git-fetch-auto").closest("label").title = t("gitFetch.autoTitle");
  renderGitFetchFreshness();
  el.className = "git-fetch-status";
  el.title = "";
  if (running || status?.running) {
    el.classList.add("running");
    el.textContent = t("gitFetch.running");
  } else if (!status?.last) {
    el.textContent = t("gitFetch.never");
  } else if (status.last.ok) {
    el.textContent = t("gitFetch.ok", { time: time(status.last.at) });
  } else {
    el.classList.add("failed");
    el.textContent = t("gitFetch.failed", { time: time(status.last.at) });
    el.title = t("gitFetch.failedTitle", { message: status.last.message, success: status.lastSuccess ? time(status.lastSuccess) : t("gitFetch.noSuccess") });
  }
}

// Même barre que l'actualisation auto, calée sur le prochain fetch automatique du serveur. Redessinée
// seulement quand cette échéance change : l'état relu toutes les 30 s ne relance pas l'animation.
function renderGitFetchFreshness() {
  const bar = $("git-fetch-freshness");
  const nextAt = state.gitFetch.running ? null : state.gitFetch.status?.nextAt;
  bar.hidden = !nextAt;
  // Une animation masquée repart de zéro à l'affichage : elle sera redessinée.
  if (!nextAt) delete bar.dataset.nextAt;
  if (!nextAt || bar.dataset.nextAt === nextAt) return;
  bar.dataset.nextAt = nextAt;
  // Relit l'état juste après l'échéance, sans attendre la relecture des 30 s, pour relancer la barre.
  clearTimeout(state.gitFetch.nextTimer);
  state.gitFetch.nextTimer = setTimeout(loadGitFetchStatus, Math.max(0, new Date(nextAt) - Date.now()) + 3000);
  const cycleMs = state.config.gitFetchIntervalS * 1000;
  drawFreshness(
    bar,
    new Date(nextAt).getTime() - cycleMs,
    cycleMs
  );
}

// ---------- Actions AI ----------

// Catalogue des actions du projet suivi (cf. ai_actions.py) : chacune un prompt dont la page remplace
// les variables. Relu à chaque ouverture du dialogue, pour essayer un prompt sans recharger la page.
async function loadAiActions() {
  try {
    state.aiActions = (await api("/ai/actions")).body;
  } catch (error) {
    state.aiActions = { actions: [], error: error.message };
  }
}

// Une branche en retard ou en conflit, un indicateur qualité imparfait ou un thread non résolu : seules
// les actions « to-fix » l'exigent, et le liseré rouge du bouton le signale.
function hasSomethingToFix(mr) {
  const s = signalsOf(mr);
  return mr.has_conflicts || s.behind?.count > 0 || qualityDefects(s).length > 0 || s.threads?.unresolved > 0;
}

function aiActionsFor(mr) {
  const toFix = hasSomethingToFix(mr);
  return (state.aiActions?.actions ?? []).filter(action => action.when !== "to-fix" || toFix);
}

// Place du bouton gardée quand aucune action n'est proposée : « diff » reste au même endroit d'une ligne à l'autre.
const aiPlaceholder = () => `<button type="button" class="mr-action ai placeholder" tabindex="-1" aria-hidden="true">${escapeHtml(t("ai"))}</button>`;

// Un catalogue illisible laisse le bouton partout : le dialogue dit pourquoi aucune action n'est proposée.
function aiButton(mr) {
  if (signalsOf(mr).loading || mr.state === "merged" || !state.aiActions) return "";
  if (!state.aiActions.error && !aiActionsFor(mr).length) return "";
  const toFix = hasSomethingToFix(mr);
  return `<button type="button" class="mr-action ai${toFix ? " to-fix" : ""}" data-ai="${mr.iid}" ` +
    `title="${escapeHtml(t(toFix ? "ai.title.toFix" : "ai.title"))}">${escapeHtml(t("ai"))}</button>`;
}

// Variables inconnues laissées telles quelles : le prompt affiché montre la faute de frappe.
function aiPrompt(
  action,
  mr
) {
  const values = {
    iid: () => mr.iid,
    title: () => mr.title,
    source_branch: () => mr.source_branch,
    target_branch: () => mr.target_branch,
    web_url: () => mr.web_url,
    fix_context: () => aiFixPrompt(mr),
  };
  return action.prompt.replace(/\{(\w+)\}/g, (variable, name) => Object.hasOwn(values, name) ? String(values[name]()) : variable);
}

// Alimente le prompt seul : en français quelle que soit la langue de l'interface, comme aiFixPrompt.
function qualityDefects(s) {
  const defects = [];
  if (s.pipeline?.status === "failed") defects.push(`le pipeline #${s.pipeline.id} est en échec${linkFr(s.pipeline.web_url)}`);
  if (sonarUsable(s.sonar)) {
    const sonar = s.sonar;
    if (sonar.issues > 0) defects.push(`${sonar.issues} issue${plural(sonar.issues)} Sonar ouverte${plural(sonar.issues)}${linkFr(sonar.links?.issues)}`);
    if (sonar.gate && sonar.gate !== "OK") defects.push(`Quality Gate Sonar ${sonar.gate}`);
    if (sonar.coverage != null && sonar.coverage < 100) defects.push(`couverture du nouveau code à ${formatPercentFr(sonar.coverage)}, objectif 100 %${linkFr(sonar.links?.coverage)}`);
  }
  const pit = s.pit;
  if (pit?.state === "ok") {
    if (pit.survived > 0) defects.push(`${pit.survived} mutant${plural(pit.survived)} PIT survivant${plural(pit.survived)}${linkFr(pit.link)}`);
    if (pit.noCoverage > 0) defects.push(`${pit.noCoverage} mutant${plural(pit.noCoverage)} PIT non couvert${plural(pit.noCoverage)}${linkFr(pit.link)}`);
    if (pit.errors > 0) defects.push(`${pit.errors} mutant${plural(pit.errors)} PIT en erreur${linkFr(pit.link)}`);
  }
  return defects;
}

// Lien vers le détail d'un indicateur : le correcteur y va droit, au lieu de le rechercher.
const linkFr = url => url ? ` : ${url}` : "";

// Seuls les indicateurs que le projet suivi produit : exiger un mutant de moins d'un projet sans PIT
// lancerait le correcteur sur un objectif impossible.
function perfectIndicators() {
  return [
    "pipeline vert",
    ...(sonarTracked() ? ["0 issue Sonar", "Quality Gate OK", "100 % de couverture du nouveau code"] : []),
    ...(pitTracked() ? ["aucun mutant survivant, non couvert ou en erreur"] : []),
  ];
}

function aiFixPrompt(mr) {
  const s = signalsOf(mr);
  const defects = qualityDefects(s);
  const unresolved = s.threads?.unresolved ?? 0;
  const running = s.sonar?.refreshing || s.pit?.refreshing || PENDING_JOB_STATUSES.has(s.pipeline?.status);
  const behind = s.behind?.count ?? 0;
  const parts = [`Sur la MR !${mr.iid} (\`${mr.source_branch}\` → \`${mr.target_branch}\`) :`];
  // Corrections d'abord, sur les valeurs du dernier pipeline terminé : mettre la branche à jour ne
  // corrige aucun indicateur, et attendre le pipeline qui suit la mise à jour retarderait d'autant les
  // corrections. Le tout part ensuite en un seul push, donc un seul pipeline.
  if (defects.length) {
    parts.push(
      "Corrige les indicateurs qualité imparfaits relevés par le dernier pipeline terminé, sans attendre de nouveau pipeline :\n" +
      defects.map(d => `- ${d}`).join("\n") +
      (running ? "\n(un pipeline est en cours : n'attends pas sa fin, vérifie seulement dans le code qu'un point n'est pas déjà corrigé sur la branche)" : "")
    );
  }
  if (unresolved > 0) {
    parts.push(
      `La MR a ${unresolved} thread${plural(unresolved)} non résolu${plural(unresolved)} : traite chacun des points ` +
      "dans la mesure du possible et du raisonnable."
    );
  }
  if (behind > 0 || mr.has_conflicts) {
    const late = behind > 0 ? ` (${behind} commit${plural(behind)} de retard)` : "";
    parts.push(
      `${defects.length || unresolved > 0 ? "Ensuite, mets" : "Mets"} à jour la branche de la MR en y mergeant \`origin/${mr.target_branch}\`${late}` +
      (mr.has_conflicts ? ", et résous les conflits que GitLab signale avec la cible." : ".")
    );
  }
  // Toute modification de la MR — mise à jour, correction, réponse à un thread — relance la CI et peut
  // dégrader un indicateur jusque-là parfait : la boucle de vérification vaut donc dans tous les cas.
  parts.push(
    "Pousse le tout en une fois sur la branche de la MR, puis attends la fin du pipeline et vérifie " +
    `l'état des indicateurs avec \`${state.config.signalsCommand} ${mr.iid}\`. Tant que les indicateurs ne sont pas ` +
    `parfaits (${perfectIndicators().join(", ")}), effectue les corrections nécessaires.`
  );
  return parts.join("\n\n");
}

async function openAi(mr) {
  await loadAiActions();
  render();
  const actions = aiActionsFor(mr);
  const dialog = $("ai-dialog");
  dialog.dataset.iid = mr.iid;
  $("ai-title").textContent = t("dialog.title", { iid: mr.iid });
  $("ai-error").hidden = !state.aiActions.error;
  $("ai-error").textContent = state.aiActions.error ? t("dialog.catalogError", { message: state.aiActions.error }) : "";
  $("ai-actions").innerHTML = actions.map(action =>
    `<button type="button" data-ai-action="${escapeHtml(action.id)}">${escapeHtml(action.label ?? t("ai.fix"))}</button>`
  ).join("");
  $("ai-actions").hidden = !actions.length;
  $("ai-orca").hidden = !state.config?.orcaEnabled;
  if (!dialog.open) dialog.showModal();
  selectAiAction(
    mr,
    actions[0]
  );
}

function selectAiAction(
  mr,
  action
) {
  const dialog = $("ai-dialog");
  dialog.dataset.action = action?.id ?? "";
  for (const button of $("ai-actions").querySelectorAll("[data-ai-action]")) {
    button.setAttribute("aria-pressed", String(button.dataset.aiAction === action?.id));
  }
  $("ai-text").value = action ? aiPrompt(action, mr) : "";
  $("ai-copied").textContent = "";
  for (const id of ["ai-orca", "ai-copy"]) $(id).disabled = !action;
  $("ai-text").select();
}

async function copyAiPrompt() {
  const text = $("ai-text").value;
  try {
    await navigator.clipboard.writeText(text);
  } catch (ignored) {
    $("ai-text").select();
    document.execCommand("copy");
  }
  $("ai-copied").textContent = t("dialog.copied");
}

// Le serveur ouvre un onglet Orca sur le worktree principal, qui lance Claude Code avec le prompt affiché.
async function openInOrca() {
  const status = $("ai-copied");
  $("ai-orca").disabled = true;
  status.textContent = t("dialog.orca.opening");
  try {
    const { body } = await api(
      "/orca/launch",
      {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-MR-Dashboard": "1" },
        body: JSON.stringify({
          iid: Number($("ai-dialog").dataset.iid),
          action: $("ai-dialog").dataset.action,
          prompt: $("ai-text").value,
        }),
      }
    );
    status.textContent = t(body.confirmed ? "dialog.orca.opened" : "dialog.orca.unconfirmed", body);
  } catch (error) {
    status.textContent = t("dialog.orca.failed", { message: error.message });
  } finally {
    $("ai-orca").disabled = false;
  }
}

function threadsCell(mr) {
  const threads = signalsOf(mr).threads;
  if (!threads) return `<span class="muted">…</span>`;
  if (threads.error) return `<span class="muted" title="${escapeHtml(threads.error)}">?</span>`;
  const text = `${threads.unresolved} / ${threads.total}`;
  const title = t("threads.title", { n: threads.unresolved, total: threads.total });
  if (threads.unresolved > 0) return pill("orange", text, title, mr.web_url);
  return `<span class="ok${threads.total ? " good" : ""}" title="${escapeHtml(title)}">${text}</span>`;
}

// Pastille à côté du titre, seulement si quelqu'un a approuvé : l'absence d'approbation est l'état
// ordinaire d'une MR en revue, elle n'a pas à occuper de place.
function approvalPill(mr) {
  const names = signalsOf(mr).approvals?.names;
  if (!names?.length) return "";
  const count = names.length;
  return pill("green", t("approved", { n: count }), t("approved.title", { names: names.join(", ") }), mr.web_url);
}

// En rouge : un reviewer bloque la MR tant qu'il n'a pas relu les changements demandés.
function changesRequestedPill(mr) {
  const names = signalsOf(mr).approvals?.changesRequested;
  if (!names?.length) return "";
  return pill("red", t("changesRequested", { n: names.length }), t("changesRequested.title", { names: names.join(", ") }), mr.web_url);
}

function commitsCell(mr) {
  const commits = signalsOf(mr).commits;
  if (!commits) return `<span class="muted">…</span>`;
  if (commits.error) return `<span class="muted" title="${escapeHtml(commits.error)}">?</span>`;
  return `<a href="${escapeHtml(mr.web_url)}/commits" target="_blank" rel="noopener" aria-label="${escapeHtml(t("commits.title"))}" aria-haspopup="dialog" data-commit-activity="${mr.iid}">${commits.count}</a>`;
}

// ---------- Activité des commits (survol du nombre de commits) ----------

// Délai avant ouverture : un simple passage de la souris sur la colonne — en allant vers le volet,
// notamment — ne doit ni rien charger, ni changer la MR affichée.
const COMMIT_ACTIVITY_OPEN_MS = 350;
// Géométrie du graphique, en unités du viewBox (le SVG s'adapte à la largeur de la popup).
const CA_W = 560;
const CA_H = 210;
const CA_MARGIN = { left: 30, right: 12, top: 12, bottom: 18 };
// Demi-largeur d'un libellé de jour, en unités du viewBox, et écart minimal entre deux minuits pour
// l'écrire.
const CA_DAY_LABEL_HALF_WIDTH = 15;
const CA_DAY_LABEL_MIN_SPACING = 38;
// Coche d'un merge, posée en travers de la courbe : courte, pour ne pas se confondre avec les traits
// des jours.
const CA_MERGE_HALF_HEIGHT = 6;
// Heures de bureau, à l'heure locale : la surface sous la courbe y est plus opaque.
const OFFICE_START_HOUR = 8;
const OFFICE_END_HOUR = 20;
// Commentaires rapprochés d'un même camp (auteur ou autres) fondus en un point : une revue postée
// d'un bloc compte des dizaines de diff notes à la même minute.
const COMMENT_BURST_MS = 30 * 60000;
// Comptes techniques qui commentent les MR (rapports PIT, Trivy, Sonar) : ni revue, ni réponse.
const BOT_USERNAME = /^(project|group)_\d+_bot|^sonarqube$/;

const commitActivity = { anchor: null, openTimer: 0, cache: new Map() };

// Rechargé seulement si la MR a reçu un push ou un commentaire depuis : nombre de commits, date du
// dernier push et nombre de commentaires servent de clé de cache.
function loadCommitActivity(mr) {
  const commits = signalsOf(mr).commits;
  const key = `${commits?.count}|${commits?.pushDate}|${mr.user_notes_count}`;
  const cached = commitActivity.cache.get(mr.iid);
  if (cached?.key === key) return cached.promise;
  const promise = Promise.all([
    gitlabAll(`${projectPath()}/merge_requests/${mr.iid}/commits`),
    gitlabAll(`${projectPath()}/merge_requests/${mr.iid}/notes?sort=asc&order_by=created_at`),
  ]).then(([commitList, notes]) => activityOf(
    mr,
    commitList,
    notes
  ));
  promise.catch(() => commitActivity.cache.delete(mr.iid));
  commitActivity.cache.set(mr.iid, { key, promise });
  return promise;
}

// Un merge (plus d'un parent) n'est pas du travail du développeur : c'est la cible ramenée dans la
// branche, souvent par le reviewer. Il est sorti de la courbe et montré comme un jalon.
function activityOf(
  mr,
  commitList,
  notes
) {
  const event = c => ({ date: new Date(c.authored_date).getTime(), sha: c.short_id, title: c.title, author: c.author_name });
  const byDate = (a, b) => a.date - b.date;
  const isMerge = c => (c.parent_ids?.length ?? 1) > 1;
  // La note de mutation est un rapport d'outil, même quand elle est publiée sous un compte personnel.
  const pitMarker = pitTracked() ? state.config.pitMarker : "";
  const isToolReport = n => BOT_USERNAME.test(n.author.username) || Boolean(pitMarker && n.body?.startsWith(pitMarker));
  const comments = notes
    .filter(n => !n.system && !isToolReport(n))
    .map(n => ({ date: new Date(n.created_at).getTime(), author: n.author.name, mine: n.author.username === mr.author.username }))
    .sort(byDate);
  return {
    commits: commitList.filter(c => !isMerge(c)).map(event).sort(byDate),
    merges: commitList.filter(isMerge).map(event).sort(byDate),
    comments,
  };
}

function commentBursts(comments) {
  const bursts = [];
  for (const comment of comments) {
    const burst = bursts.findLast(b => b.mine === comment.mine);
    if (burst && comment.date - burst.to <= COMMENT_BURST_MS) {
      burst.to = comment.date;
      burst.n++;
      burst.authors.add(comment.author);
    } else {
      bursts.push({ from: comment.date, to: comment.date, n: 1, mine: comment.mine, authors: new Set([comment.author]) });
    }
  }
  return bursts;
}

function scheduleCommitActivity(anchor) {
  // Même MR : le volet l'affiche déjà — la cellule a pu être recréée par un rendu du tableau.
  if (commitActivity.anchor?.dataset.commitActivity === anchor.dataset.commitActivity) {
    commitActivity.anchor = anchor;
    return;
  }
  clearTimeout(commitActivity.openTimer);
  commitActivity.openTimer = setTimeout(
    () => openCommitActivity(anchor),
    COMMIT_ACTIVITY_OPEN_MS
  );
}

function cancelCommitActivityOpen() {
  clearTimeout(commitActivity.openTimer);
}

function closeCommitActivity() {
  cancelCommitActivityOpen();
  commitActivity.anchor = null;
  $("commit-activity").hidden = true;
  document.body.style.paddingBottom = "";
}

async function openCommitActivity(anchor) {
  const mr = viewMrs().find(m => String(m.iid) === anchor.dataset.commitActivity);
  if (!mr) return;
  commitActivity.anchor = anchor;
  const body = $("ca-body");
  const head = `<div class="ca-head"><h2 id="ca-title">${escapeHtml(t("ca.title", { iid: mr.iid }))} ` +
    `<span class="ca-mr-title">${escapeHtml(mr.title)}</span></h2>` +
    `<button type="button" class="dismiss ca-close" data-ca-close aria-label="${escapeHtml(t("ca.close"))}">×</button>`;
  body.innerHTML = `${head}<span class="muted">${escapeHtml(t("ca.loading"))}</span></div>`;
  showCommitActivity();
  let content;
  try {
    const activity = await loadCommitActivity(mr);
    content = activity.commits.length
      ? renderCommitActivity(
        activity,
        head,
        mr.merged_at
      )
      : `${head}<span class="muted">${escapeHtml(t("ca.empty"))}</span></div>`;
  } catch (error) {
    content = `${head}<span class="muted">${escapeHtml(t("ca.error", { message: error.message }))}</span></div>`;
  }
  // Survol passé à une autre MR pendant le chargement : ce résultat n'est plus attendu.
  if (commitActivity.anchor !== anchor) return;
  body.innerHTML = content;
  showCommitActivity();
}

// Le volet recouvre le bas droit de la page : la marge qu'il réserve laisse défiler les dernières lignes au-dessus.
function showCommitActivity() {
  const panel = $("commit-activity");
  panel.hidden = false;
  document.body.style.paddingBottom = `calc(${panel.offsetHeight}px + 1rem)`;
}

// MR mergée : le graphique s'arrête à son merge — ou au dernier commentaire, posté après — au lieu de
// courir jusqu'à maintenant.
function renderCommitActivity(
  activity,
  head,
  mergedAtIso
) {
  const { commits, merges, comments } = activity;
  const mergedAt = mergedAtIso ? new Date(mergedAtIso).getTime() : null;
  const reference = mergedAt ?? gitlabNow();
  const dates = [...commits, ...merges, ...comments].map(e => e.date);
  const start = Math.min(...dates);
  const end = Math.max(reference, ...dates);
  // Le graphique part du minuit du premier jour : la journée d'arrivée du premier commit se lit entière.
  const midnight = new Date(start);
  midnight.setHours(0, 0, 0, 0);
  const summary = t(mergedAt ? "ca.summary.merged" : "ca.summary", {
    n: commits.length,
    merges: merges.length,
    span: compactDuration(end - start),
    last: compactDuration(reference - commits.at(-1).date),
  });
  const commentSummary = t("ca.comments.summary", {
    others: comments.filter(c => !c.mine).length,
    mine: comments.filter(c => c.mine).length,
  });
  return `${head}<span class="muted">${escapeHtml(summary)} · ${escapeHtml(commentSummary)}</span></div>` +
    `<p class="ca-note">${escapeHtml(t("ca.note"))}</p>` +
    cumulativeChart(
      activity,
      midnight.getTime(),
      end,
      mergedAt
    ) +
    caLegend(
      merges.length > 0,
      mergedAt !== null
    );
}

// Nombre de commits cumulé, en escalier jusqu'à maintenant. Chaque commentaire est posé sur la courbe
// à sa date : des marches juste après un point rouge sont des corrections de revue.
function cumulativeChart(
  activity,
  start,
  end,
  mergedAt
) {
  const { commits, merges, comments } = activity;
  const top = CA_MARGIN.top;
  const base = CA_H - CA_MARGIN.bottom;
  const span = Math.max(end - start, 60000);
  const x = time => CA_MARGIN.left + (time - start) / span * (CA_W - CA_MARGIN.left - CA_MARGIN.right);
  const y = n => base - n / commits.length * (base - top);
  const countAt = time => commits.filter(c => c.date <= time).length;
  let d = `M${x(start)},${base}`;
  commits.forEach((commit, i) => {
    d += `H${x(commit.date)}V${y(i + 1)}`;
  });
  d += `H${x(end)}`;
  const mergeLines = merges.map(merge => {
    const tip = caTitle(t("ca.merge", { title: merge.title, author: merge.author, date: formatDate(merge.date) }));
    const mx = x(merge.date);
    const my = y(countAt(merge.date));
    return `<line class="ca-merge" x1="${mx}" x2="${mx}" y1="${my - CA_MERGE_HALF_HEIGHT}" y2="${my + CA_MERGE_HALF_HEIGHT}"/>` +
      `<rect class="ca-hit" x="${mx - 4}" y="${my - CA_MERGE_HALF_HEIGHT - 2}" width="8" height="${2 * CA_MERGE_HALF_HEIGHT + 4}">${tip}</rect>`;
  }).join("");
  const mergedLine = mergedAt === null ? "" : (() => {
    const mx = x(mergedAt);
    const tip = caTitle(t("ca.merged", { date: formatDate(mergedAt) }));
    return `<line class="ca-merged" x1="${mx}" x2="${mx}" y1="${top}" y2="${base}"/>` +
      `<rect class="ca-hit" x="${mx - 4}" y="${top}" width="8" height="${base - top}">${tip}</rect>`;
  })();
  const commitHits = commits.map((commit, i) => {
    const tip = caTitle(t("ca.cumulCount", { n: i + 1, sha: commit.sha, title: commit.title, date: formatDate(commit.date) }));
    return `<circle class="ca-hit" cx="${x(commit.date)}" cy="${y(i + 1)}" r="5">${tip}</circle>`;
  }).join("");
  const dots = commentBursts(comments).map(burst => {
    const cx = x(burst.from);
    const cy = y(countAt(burst.from));
    const r = 4 + Math.min(4, Math.sqrt(burst.n) - 1);
    const tip = caTitle(t(burst.mine ? "ca.comments.mine" : "ca.comments.others", {
      n: burst.n,
      authors: [...burst.authors].join(", "),
      from: formatDate(burst.from),
      to: burst.n > 1 ? formatDate(burst.to) : "",
    }));
    return burst.mine
      ? `<path class="ca-mine" d="${caDiamond(cx, cy, r + 1)}">${tip}</path>`
      : `<circle class="ca-others" cx="${cx}" cy="${cy}" r="${r}">${tip}</circle>`;
  }).join("");
  return `<svg class="ca-chart" viewBox="0 0 ${CA_W} ${CA_H}" role="img" aria-labelledby="ca-title">` +
    `<text x="${CA_MARGIN.left - 5}" y="${top + 4}" text-anchor="end">${commits.length}</text>` +
    `<text x="${CA_MARGIN.left - 5}" y="${base}" text-anchor="end">0</text>` +
    caOfficeHoursClip(
      start,
      end,
      x,
      top,
      base
    ) +
    caWeekendBands(
      start,
      end,
      x,
      top,
      base
    ) +
    `<path class="ca-area" d="${d}V${base}Z"/>` +
    `<path class="ca-area office" d="${d}V${base}Z" clip-path="url(#ca-office-hours)"/>` +
    `<path class="ca-line" d="${d}"/>` +
    mergedLine + mergeLines + commitHits + dots +
    `<line class="ca-axis" x1="${CA_MARGIN.left}" x2="${CA_W - CA_MARGIN.right}" y1="${base}" y2="${base}"/>` +
    caDayTicks(start, end, x, base) +
    `</svg>`;
}

// Un trait sous l'axe à chaque minuit local, origine comprise. Le jour n'est écrit que si les traits
// sont assez espacés. Au ras d'un bord — l'origine, ou le jour qui vient de commencer —, il est calé sur
// ce bord plutôt que centré sur son trait, qu'il déborderait.
function caDayTicks(
  start,
  end,
  x,
  base
) {
  const midnight = new Date(start);
  midnight.setHours(0, 0, 0, 0);
  if (midnight.getTime() < start) midnight.setDate(midnight.getDate() + 1);
  const ticks = [];
  for (const day = midnight; day.getTime() < end; day.setDate(day.getDate() + 1)) {
    ticks.push(day.getTime());
  }
  const spacing = ticks.length > 1 ? x(ticks[1]) - x(ticks[0]) : x(end) - x(start);
  const labelled = spacing >= CA_DAY_LABEL_MIN_SPACING;
  return ticks.map(time => {
    const tx = x(time);
    const right = CA_W - CA_MARGIN.right;
    const anchor = tx > right - CA_DAY_LABEL_HALF_WIDTH ? `x="${right}" text-anchor="end"`
      : tx < CA_MARGIN.left + CA_DAY_LABEL_HALF_WIDTH ? `x="${CA_MARGIN.left}" text-anchor="start"`
      : `x="${tx}" text-anchor="middle"`;
    const label = labelled
      ? `<text ${anchor} y="${CA_H - 4}">${escapeHtml(new Date(time).toLocaleDateString(locale(), { weekday: "short", day: "numeric" }))}</text>`
      : "";
    return `<line class="ca-axis" x1="${tx}" x2="${tx}" y1="${base}" y2="${base + 4}"/>${label}`;
  }).join("");
}

// Plages de 8 h à 20 h de chaque jour affiché, qui découpent la surface opaque sous la courbe. Un seul
// graphique est affiché à la fois : l'identifiant fixe ne peut pas entrer en collision.
function caOfficeHoursClip(
  start,
  end,
  x,
  top,
  base
) {
  const rects = [];
  const day = new Date(start);
  day.setHours(0, 0, 0, 0);
  for (; day.getTime() < end; day.setDate(day.getDate() + 1)) {
    if (isWeekend(day)) continue;
    const from = new Date(day).setHours(OFFICE_START_HOUR);
    const to = new Date(day).setHours(OFFICE_END_HOUR);
    const x0 = x(Math.max(from, start));
    const x1 = x(Math.min(to, end));
    if (x1 > x0) rects.push(`<rect x="${x0}" y="${top}" width="${x1 - x0}" height="${base - top}"/>`);
  }
  return `<defs><clipPath id="ca-office-hours">${rects.join("")}</clipPath></defs>`;
}

// Samedis et dimanches grisés sur toute la hauteur, sous la courbe : une longue période sans commit
// s'explique d'un coup d'œil quand elle tombe sur un week-end. Ces jours-là n'ont pas d'heures de bureau.
function caWeekendBands(
  start,
  end,
  x,
  top,
  base
) {
  const rects = [];
  const day = new Date(start);
  day.setHours(0, 0, 0, 0);
  for (; day.getTime() < end; day.setDate(day.getDate() + 1)) {
    if (!isWeekend(day)) continue;
    const next = new Date(day);
    next.setDate(next.getDate() + 1);
    const x0 = x(Math.max(day.getTime(), start));
    const x1 = x(Math.min(next.getTime(), end));
    if (x1 > x0) rects.push(`<rect class="ca-weekend" x="${x0}" y="${top}" width="${x1 - x0}" height="${base - top}"/>`);
  }
  return rects.join("");
}

const isWeekend = date => date.getDay() === 0 || date.getDay() === 6;

// Deux camps, deux formes en plus des deux couleurs : rouge et vert se confondent pour un daltonien.
function caLegend(
  withMerges,
  merged
) {
  const item = (
    swatch,
    key,
    params
  ) => `<span class="ca-legend-item"><svg viewBox="0 0 16 12" aria-hidden="true">${swatch}</svg>${escapeHtml(t(key, params))}</span>`;
  return `<div class="ca-legend">` +
    item(`<path class="ca-line" d="M1,10H6V3H15"/>`, "ca.legend.commits") +
    item(
      `<rect class="ca-area" x="0" y="1" width="8" height="10"/><rect class="ca-area office" x="8" y="1" width="8" height="10"/>`,
      "ca.legend.office",
      { from: OFFICE_START_HOUR, to: OFFICE_END_HOUR }
    ) +
    item(`<rect class="ca-weekend" x="0" y="1" width="16" height="10"/>`, "ca.legend.weekend") +
    item(`<circle class="ca-others" cx="8" cy="6" r="4"/>`, "ca.legend.others") +
    item(`<path class="ca-mine" d="${caDiamond(8, 6, 5)}"/>`, "ca.legend.mine") +
    (withMerges ? item(`<path class="ca-line" d="M1,6H15"/><line class="ca-merge" x1="8" x2="8" y1="1" y2="11"/>`, "ca.legend.merge") : "") +
    (merged ? item(`<line class="ca-merged" x1="8" x2="8" y1="0" y2="12"/>`, "ca.legend.merged") : "") +
    `</div>`;
}

function caDiamond(
  cx,
  cy,
  r
) {
  return `M${cx},${cy - r}L${cx + r},${cy}L${cx},${cy + r}L${cx - r},${cy}Z`;
}

function caTitle(text) {
  return `<title>${escapeHtml(text)}</title>`;
}

function behindCell(mr) {
  const s = signalsOf(mr);
  if (s.loading) return `<span class="muted">…</span>`;
  const behind = s.behind;
  if (!behind || behind.count == null) return `<span class="muted" title="${escapeHtml(behind?.error ?? s.error ?? "")}">?</span>`;
  if (behind.count === 0) return `<span class="ok good" title="${escapeHtml(t("behind.upToDate", { target: mr.target_branch }))}">${escapeHtml(t("behind.none"))}</span>`;
  // Le nombre et son ancienneté sur une ligne, l'unité en petit dessous : la colonne ne prend que la
  // largeur de son libellé le plus court.
  const count = `<span title="${escapeHtml(t("behind.count", { n: behind.count, target: mr.target_branch }))}">${behind.count}</span>`;
  const hours = behind.since ? (gitlabNow() - new Date(behind.since)) / 3600000 : 0;
  const tone = hours > BEHIND_ORANGE_HOURS ? "late-orange" : "muted";
  const since = behind.since
    ? `<span class="${tone}" title="${escapeHtml(t("behind.since", { date: formatDate(behind.since), next: behind.next, base: behind.base }))}">(${compactDuration(gitlabNow() - new Date(behind.since))})</span>`
    : `<span class="muted" title="${escapeHtml(behind.error ?? "")}">(?)</span>`;
  return `<div>${count} ${since}</div><div class="behind-unit">${escapeHtml(t("behind.unit", { n: behind.count }))}</div>`;
}

// ---------- Pipeline de la branche suivie ----------

// Tant que le dernier pipeline de la branche tourne, il est relu seul toutes les BRANCH_PIPELINE_POLL_MS ;
// la relecture s'arrête d'elle-même quand il est terminé.
function scheduleBranchPipelinePoll() {
  clearTimeout(state.branchPipelineTimer);
  state.branchPipelineTimer = null;
  const p = state.branchPipeline;
  if (!p || p.error || !isActive(p)) return;
  state.branchPipelineTimer = setTimeout(pollBranchPipeline, BRANCH_PIPELINE_POLL_MS);
}

async function pollBranchPipeline() {
  // Une mise à jour complète en cours rapportera le pipeline elle-même.
  if (state.refreshing) {
    scheduleBranchPipelinePoll();
    return;
  }
  try {
    state.branchPipeline = await fetchBranchPipeline();
    renderBranchPipeline();
    fetchIfRepoChanged();
    // Sauvegardé à la date de la dernière mise à jour complète, et seulement si la sauvegarde est encore
    // celle qu'affiche cet onglet : un autre onglet a pu en écrire une plus récente depuis.
    if (readSnapshot()?.at.getTime() === state.refreshedAt?.getTime()) {
      saveSnapshot({
        at: state.refreshedAt,
        config: state.config,
        mrs: state.mrs,
        branchPipeline: state.branchPipeline,
        signals: state.signals,
      });
    }
  } catch (error) {
    console.error("Relecture du pipeline de la branche impossible :", error);
  }
  scheduleBranchPipelinePoll();
}

function readBuildHistory() {
  try {
    const saved = JSON.parse(localStorage.getItem(BUILD_HISTORY_KEY));
    return Array.isArray(saved?.builds) ? saved : null;
  } catch (ignored) {
    return null;
  }
}

// Sans effet si l'historique de ce projet et de cette branche a moins de BUILD_HISTORY_TTL_MS : tous
// les onglets le partagent par localStorage.
async function refreshBuildHistoryIfStale() {
  const { gitlabProject: project, pipelineBranch: branch } = state.config;
  if (!branch || state.buildHistoryLoading) return;
  const current = readBuildHistory() ?? state.buildHistory;
  const sameTarget = current?.project === project && current?.branch === branch;
  if (sameTarget && Date.now() - new Date(current.at) < BUILD_HISTORY_TTL_MS) {
    state.buildHistory = current;
    return;
  }
  state.buildHistoryLoading = true;
  try {
    const builds = await loadBuildHistory(
      project,
      branch
    );
    state.buildHistory = { project, branch, at: new Date().toISOString(), builds };
    try {
      localStorage.setItem(BUILD_HISTORY_KEY, JSON.stringify(state.buildHistory));
    } catch (ignored) { /* stockage plein ou bloqué : rechargé au prochain chargement */ }
    renderBranchPipeline();
  } catch (error) {
    console.error("Historique des builds indisponible :", error);
  } finally {
    state.buildHistoryLoading = false;
  }
}

// Du plus ancien au plus récent : { id, d: durée en secondes, c: date de création }.
async function loadBuildHistory(
  project,
  branch
) {
  const query = `query($project: ID!, $branch: String!, $after: String) {
    project(fullPath: $project) {
      pipelines(ref: $branch, status: SUCCESS, first: 100, after: $after) {
        pageInfo { hasNextPage endCursor }
        nodes { id duration createdAt }
      }
    }
  }`;
  const builds = [];
  let after = null;
  do {
    const variables = JSON.stringify({ project, branch, after });
    const { body } = await api(`/graphql?query=${encodeURIComponent(query)}&variables=${encodeURIComponent(variables)}`);
    if (body.errors?.length) throw new Error(body.errors.map(e => e.message).join(", "));
    const page = body.data.project.pipelines;
    for (const node of page.nodes) {
      if (node.duration) builds.push({ id: node.id.split("/").pop(), d: node.duration, c: node.createdAt });
    }
    after = page.pageInfo.hasNextPage ? page.pageInfo.endCursor : null;
  } while (after && builds.length < BUILD_HISTORY_SIZE);
  return builds.slice(0, BUILD_HISTORY_SIZE).reverse();
}

// Barres depuis zéro : l'échelle ne grossit pas les écarts. Un seul <path>, un trait vertical par
// build, pour ne pas ajouter un élément au DOM par build.
function buildHistoryChart() {
  const history = state.buildHistory;
  if (!history?.builds.length || history.branch !== state.config.pipelineBranch) return "";
  const durations = history.builds.map(build => build.d);
  const max = Math.max(...durations);
  const min = Math.min(...durations);
  const bars = durations.map((duration, index) => {
    const height = Math.max(1, Math.round(duration / max * BUILD_HISTORY_HEIGHT));
    return `M${index + 0.5} ${BUILD_HISTORY_HEIGHT}v-${height}`;
  }).join("");
  const summary = t("buildHistory.title", {
    count: durations.length,
    from: formatDate(history.builds[0].c),
    to: formatDate(history.builds.at(-1).c),
    min: minutesSeconds(min),
    max: minutesSeconds(max),
    at: formatDate(history.at),
  });
  const svg = `<svg class="bp-history-bars" width="${durations.length}" height="${BUILD_HISTORY_HEIGHT}" viewBox="0 0 ${durations.length} ${BUILD_HISTORY_HEIGHT}" shape-rendering="crispEdges" role="img" aria-label="${escapeHtml(summary)}"><path d="${bars}"/></svg>`;
  const scale = `<span class="bp-history-scale"><span>${escapeHtml(minutesSeconds(max))}</span><span>${escapeHtml(minutesSeconds(min))}</span></span>`;
  return `<span class="bp-history">${svg}${scale}</span>`;
}

function withBuildDurations(project) {
  const pipeline = project.pipelines?.nodes[0];
  if (!pipeline) return null;
  const buildDurations = (project.successfulPipelines?.nodes ?? []).map(node => node.duration).filter(Boolean);
  const previous = isActive(pipeline) ? latestConclusive(project) : null;
  return { ...pipeline, buildDurations, previous };
}

// Le plus récent du dernier réussi et du dernier en échec.
function latestConclusive(project) {
  const candidates = [project.lastSuccess?.nodes[0], project.lastFailure?.nodes[0]].filter(Boolean);
  return candidates.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))[0] ?? null;
}

function isActive(pipeline) {
  return ACTIVE_PIPELINE_GROUPS.has(pipeline.detailedStatus.group);
}

function renderBranchPipeline() {
  const section = $("branch-pipeline");
  const branch = state.config?.pipelineBranch;
  const p = state.branchPipeline;
  section.hidden = mergedView() || !branch || p === undefined;
  if (section.hidden) return;
  const heading = `<h2 id="branch-pipeline-title">${t("branchPipeline.title", { branch: `<code>${escapeHtml(branch)}</code>` })}</h2>`;
  const pipelinesUrl = `${state.config.gitlabWeb}/${state.config.gitlabProject}/-/pipelines?${new URLSearchParams({ ref: branch, scope: "all" })}`;
  const allLink = `<a class="bp-all" href="${escapeHtml(pipelinesUrl)}" target="_blank" rel="noopener" title="${escapeHtml(t("branchPipeline.allTitle", { branch }))}">${escapeHtml(t("branchPipeline.all"))} ↗</a>`;
  const title = `<div class="bp-title">${heading}${allLink}${p?.error ? "" : buildDurationsLine(p?.buildDurations)}${buildHistoryChart()}</div>`;
  if (!p) {
    section.innerHTML = `${title}<div class="bp-card muted">${escapeHtml(t("branchPipeline.none"))}</div>`;
    return;
  }
  if (p.error) {
    section.innerHTML = `${title}<div class="bp-card">${pill("grey", t("unavailable"), p.error)}</div>`;
    return;
  }
  const current = pipelineCard(p, "");
  const previous = p.previous ? pipelineCard(p.previous, `<span class="bp-label">${escapeHtml(t("branchPipeline.previous"))}</span>`) : "";
  section.innerHTML = `${title}${current}${previous}`;
}

function pipelineCard(
  p,
  label
) {
  const web = path => state.config.gitlabWeb + path;
  const link = (path, html, cls = "") => `<a${cls ? ` class="${cls}"` : ""} href="${escapeHtml(web(path))}" target="_blank" rel="noopener">${html}</a>`;
  const id = p.id.split("/").pop();
  const status = p.detailedStatus;
  let duration = null;
  if (p.duration) duration = compactDuration(p.duration * 1000);
  else if (p.startedAt) duration = t("branchPipeline.running", { duration: compactDuration(gitlabNow() - new Date(p.startedAt)) });
  const head = [
    label,
    pill(PIPELINE_TONE[status.group] ?? "grey", status.text, t("pipeline.title", { id, label: status.label }), web(p.path)),
    link(p.path, `#${escapeHtml(id)}`),
    p.commit ? link(p.commit.webPath, escapeHtml(p.commit.title), "bp-commit") : "",
    `<code>${escapeHtml(p.sha)}</code>`,
    p.user ? `<span class="muted">${escapeHtml(p.user.name)}</span>` : "",
    duration ? `<span class="muted" title="${escapeHtml(t("branchPipeline.durationTitle"))}">⏱ ${escapeHtml(duration)}</span>` : "",
    `<span class="muted" title="${escapeHtml(formatDate(p.createdAt))}">${escapeHtml(t("branchPipeline.ago", { age: compactDuration(gitlabNow() - new Date(p.createdAt)) }))}</span>`,
  ].filter(Boolean).join("");
  const stages = p.stages.nodes.map(stage => {
    const jobs = stage.jobs.nodes.map(job => {
      const jobDuration = job.duration ? ` — ${compactDuration(job.duration * 1000)}` : "";
      const tooltip = escapeHtml(`${job.name} : ${job.detailedStatus.text}${jobDuration}`);
      return `<li><a class="bp-job" href="${escapeHtml(web(job.webPath))}" target="_blank" rel="noopener" title="${tooltip}">${stageIcon(job.detailedStatus.group)}${escapeHtml(job.name)}</a></li>`;
    }).join("");
    const tooltip = escapeHtml(`${stage.name} : ${stage.detailedStatus.label}`);
    return `<li class="bp-stage"><div class="bp-stage-head" title="${tooltip}">${stageIcon(stage.detailedStatus.group)}${escapeHtml(stage.name)}</div><ul class="bp-jobs">${jobs}</ul></li>`;
  }).join("");
  const open = state.branchPipelineOpen.get(pipelineOpenKey(p)) ?? defaultPipelineOpen(p);
  return `<details class="bp-card" data-pipeline-key="${escapeHtml(pipelineOpenKey(p))}"${open ? " open" : ""}><summary class="bp-head">${head}</summary><ol class="bp-stages">${stages}</ol></details>`;
}

// Réussi : replié, la ligne de tête suffit. Tout autre statut se déplie pour montrer où ça bloque.
const defaultPipelineOpen = p => p.detailedStatus.group !== "success";
const pipelineOpenKey = p => `${p.id}:${p.detailedStatus.group}`;

function buildDurationsLine(durations) {
  if (!durations?.length) return "";
  const min = Math.min(...durations);
  const max = Math.max(...durations);
  const range = min === max
    ? t("branchPipeline.buildsSame", { duration: minutesSeconds(min) })
    : t("branchPipeline.buildsRange", { min: minutesSeconds(min), max: minutesSeconds(max) });
  const tooltip = t("branchPipeline.buildsTitle", { count: durations.length, durations: durations.map(minutesSeconds).join(", ") });
  return `<span class="bp-builds" title="${escapeHtml(tooltip)}">${escapeHtml(t("branchPipeline.builds", { branch: state.config.pipelineBranch, range }))}</span>`;
}

// 612 s ⇒ « 10'12" ».
function minutesSeconds(seconds) {
  return `${Math.floor(seconds / 60)}'${String(Math.round(seconds % 60)).padStart(2, "0")}"`;
}

function stageIcon(group) {
  const [icon, tone] = STAGE_ICONS[group] ?? STAGE_ICON_DEFAULT;
  return `<span class="bp-icon ${tone}" aria-hidden="true">${icon}</span>`;
}

// ---------- Utilitaires ----------

// « - 4h » plutôt que « il y a 4 heures » : la colonne se lit plus vite sans le préfixe répété, et reste
// étroite. Les jours gardent leur mot, court dans les deux langues.
const durationFormat = unit => new Intl.NumberFormat(locale(), { style: "unit", unit, unitDisplay: "long" });

// Entre 1 h et 3 h, « 2h59 » : l'heure arrondie (« 3h ») y écraserait une précision encore utile.
function relative(iso) {
  const seconds = (new Date(iso) - gitlabNow()) / 1000;
  const sign = seconds < 0 ? "- " : "";
  const minutes = Math.floor(Math.abs(seconds) / 60);
  if (minutes < 1) return `${sign}< 1 min`;
  if (minutes < 60) return `${sign}${minutes} min`;
  if (minutes < 180) return `${sign}${Math.floor(minutes / 60)}h${String(minutes % 60).padStart(2, "0")}`;
  const hours = Math.round(minutes / 60);
  if (hours < 24) return `${sign}${hours}h`;
  return `${sign}${durationFormat("day").format(Math.round(hours / 24))}`;
}

// « < 1 min », « 20 min », « 1h20 », « 2 j 3h » (« 2 d 3h » en anglais) : plus précis que relative() à l'échelle d'une journée de retard.
function compactDuration(ms) {
  const minutes = Math.max(0, Math.floor(ms / 60000));
  if (minutes < 1) return "< 1 min";
  if (minutes < 60) return `${minutes} min`;
  const hours = Math.floor(minutes / 60);
  if (hours < 24) return `${hours}h${minutes % 60 ? String(minutes % 60).padStart(2, "0") : ""}`;
  const rest = hours % 24;
  return `${Math.floor(hours / 24)} ${t("unit.day")}${rest ? ` ${rest}h` : ""}`;
}

const formatDate = formatDateTime;
const formatPercent = value => (value / 100).toLocaleString(locale(), { style: "percent", maximumFractionDigits: 1 });
// Formes françaises fixes, pour le prompt et les traductions françaises.
const formatPercentFr = value => value.toLocaleString("fr-FR", { maximumFractionDigits: 1 }) + " %";
const plural = n => (n > 1 ? "s" : "");

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

function showError(message) {
  $("errors").insertAdjacentHTML("beforeend", `<div class="error-banner">${escapeHtml(message)}</div>`);
}

// ---------- Événements ----------

// Filtres et tri sont partagés entre les vues ; un tri sur une colonne absente de la nouvelle vue
// reprend le tri par défaut de celle-ci.
function setView(view) {
  if (view === state.filters.view) return;
  const sortShown = viewGroups(view).some(g => g.columns.includes(state.filters.sort));
  closeCommitActivity();
  const sort = sortShown ? {} : { sort: DEFAULT_SORTS[view].key, dir: DEFAULT_SORTS[view].dir };
  updateFilters({ view, ...sort });
  populateFilterOptions();
  syncRefreshButton();
  renderStatus();
  renderFreshness();
  if (view === "merged") loadMerged();
}

function updateFilters(change) {
  Object.assign(state.filters, change);
  writeFiltersToUrl();
  if ("labels" in change) populateFilterOptions();
  render();
  maybeLoadMoreMerged();
}

$("q").addEventListener("input", e => updateFilters({ q: e.target.value }));
for (const id of ["target", "author", "reviewer", "assignee", "draft"]) {
  $(id).addEventListener("change", e => updateFilters({ [id]: e.target.value }));
}
$("period").addEventListener("change", e => {
  updateFilters({ period: e.target.value });
  loadMerged();
});
$("alerts").addEventListener("change", e => updateFilters({ alerts: e.target.checked }));
// « toggle » ne remonte pas : écouté en capture. Revenir au défaut efface le choix manuel.
$("branch-pipeline").addEventListener("toggle", e => {
  const key = e.target.dataset?.pipelineKey;
  if (!key) return;
  const p = [state.branchPipeline, state.branchPipeline?.previous].find(c => c && pipelineOpenKey(c) === key);
  if (!p || e.target.open === defaultPipelineOpen(p)) state.branchPipelineOpen.delete(key);
  else state.branchPipelineOpen.set(key, e.target.open);
}, true);
$("label").addEventListener("change", e => {
  if (e.target.value) updateFilters({ labels: [...state.filters.labels, e.target.value] });
});
document.addEventListener("click", e => {
  const header = e.target.closest("[data-sort]");
  if (header) {
    const column = COLUMNS.find(c => c.key === header.dataset.sort);
    const dir = state.filters.sort === column.key ? (state.filters.dir === "asc" ? "desc" : "asc") : column.firstDir;
    updateFilters({ sort: column.key, dir });
    return;
  }
  const lang = e.target.closest("[data-lang]");
  if (lang) {
    setLang(lang.dataset.lang);
    return;
  }
  const textStep = e.target.closest("[data-text-step]");
  if (textStep) {
    changeTextScale(Number(textStep.dataset.textStep));
    return;
  }
  const theme = e.target.closest("[data-theme-choice]");
  if (theme) {
    state.theme = theme.dataset.themeChoice;
    saveTheme(state.theme);
    applyTheme();
    return;
  }
  const view = e.target.closest("[data-view]");
  if (view) {
    setView(view.dataset.view);
    return;
  }
  const gitDiff = e.target.closest("[data-git-diff]");
  if (gitDiff) {
    const mrs = mergedView() ? state.merged.mrs : state.mrs;
    openGitDiff(mrs.find(mr => String(mr.iid) === gitDiff.dataset.gitDiff));
    return;
  }
  const ai = e.target.closest("[data-ai]");
  if (ai) {
    openAi(state.mrs.find(mr => String(mr.iid) === ai.dataset.ai));
    return;
  }
  const add = e.target.closest("[data-add-label]");
  const remove = e.target.closest("[data-remove-label]");
  if (add && !state.filters.labels.includes(add.dataset.addLabel)) {
    updateFilters({ labels: [...state.filters.labels, add.dataset.addLabel] });
  } else if (remove) {
    updateFilters({ labels: state.filters.labels.filter(l => l !== remove.dataset.removeLabel) });
  }
});
// Volet d'activité des commits : ouvert au survol ou au focus du nombre de commits, il reste ouvert
// quand la souris le rejoint et ne se ferme que par ×, Échap ou un clic hors de lui.
document.addEventListener("mouseover", e => {
  const anchor = e.target.closest("[data-commit-activity]");
  if (anchor) scheduleCommitActivity(anchor);
});
document.addEventListener("mouseout", e => {
  const anchor = e.target.closest("[data-commit-activity]");
  if (anchor && !anchor.contains(e.relatedTarget)) cancelCommitActivityOpen();
});
document.addEventListener("focusin", e => {
  const anchor = e.target.closest("[data-commit-activity]");
  if (anchor) scheduleCommitActivity(anchor);
});
document.addEventListener("click", e => {
  if (!commitActivity.anchor) return;
  if (e.target.closest("[data-ca-close]") || !e.target.closest("#commit-activity, [data-commit-activity]")) closeCommitActivity();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && commitActivity.anchor) closeCommitActivity();
});
// Page préc. / Page suiv. faites ici plutôt que par le navigateur : le focus reste sur le dernier
// filtre touché, et une liste déroulante y change de valeur au lieu de faire défiler. Le pas
// retranche aussi les en-têtes collants, sous lesquels le navigateur ferait passer des lignes.
document.addEventListener("keydown", e => {
  if (e.key !== "PageDown" && e.key !== "PageUp") return;
  if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
