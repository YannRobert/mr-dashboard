  for (const button of document.querySelectorAll("[data-text-step]")) {
    const next = TEXT_SCALES.indexOf(scale) + Number(button.dataset.textStep);
    button.disabled = next < 0 || next >= TEXT_SCALES.length;
  }
}

function changeTextScale(step) {
  const scale = TEXT_SCALES[TEXT_SCALES.indexOf(readTextScale()) + step];
  if (scale === undefined) return;
  try {
    if (scale === 1) localStorage.removeItem(TEXT_SCALE_KEY);
    else localStorage.setItem(TEXT_SCALE_KEY, String(scale));
  } catch (ignored) { /* stockage indisponible : la taille reste celle par défaut */ }
  applyTextScale();
}

// Prochaine actualisation auto = début de la dernière + AUTO_REFRESH_MS : un « Rafraîchir » manuel relance le cycle.
function scheduleAutoRefresh() {
  clearTimeout(state.autoRefreshTimer);
  state.autoRefreshTimer = state.autoRefresh && state.cycleStart
    ? setTimeout(() => sharedRefresh({ onlyIfDue: true }), Math.max(0, state.cycleStart.getTime() + AUTO_REFRESH_MS - Date.now()))
    : null;
  renderFreshness();
}

// Recréer les segments relance leurs animations ; le délai négatif les place au temps déjà écoulé.
// Le segment le plus à droite s'éteint au bout d'une minute, le plus à gauche à l'actualisation.
function renderFreshness() {
  const bar = $("freshness");
  bar.hidden = !state.autoRefresh || !state.cycleStart || mergedView();
  if (bar.hidden) return;
  drawFreshness(
    bar,
    state.cycleStart.getTime(),
    AUTO_REFRESH_MS
  );
}

function drawFreshness(
  bar,
  cycleStart,
  cycleMs
) {
  const elapsed = Math.min(Date.now() - cycleStart, cycleMs);
  bar.style.setProperty("--cycle", `${cycleMs}ms`);
  bar.style.setProperty("--delay", `${-elapsed}ms`);
  bar.innerHTML = Array.from(
    { length: FRESHNESS_SEGMENTS },
    (_, i) => `<i style="--off:${cycleMs * (FRESHNESS_SEGMENTS - i) / FRESHNESS_SEGMENTS}ms"></i>`
  ).join("");
}

// Une seule requête GraphQL, par page de 100, pour toutes les MR ouvertes : la taille (l'API REST ne
// donne que le nombre de fichiers), les commits, le dernier push, les approbations, les compteurs de
// threads et les jobs du pipeline de tête — autant de requêtes REST en moins pour chaque MR.
const GRAPHQL_MR_FIELDS = `
  iid
  diffStatsSummary { additions deletions fileCount }
  commitCount
  commits(first: 1) { nodes { committedDate authoredDate } }
  mergeRequestDiffs(first: 1) { nodes { createdAt } }
  approvedBy { nodes { name username } }
  reviewers { nodes { name mergeRequestInteraction { reviewState } } }
  resolvableDiscussionsCount
  resolvedDiscussionsCount`;
const GRAPHQL_OPEN_MR_FIELDS = `${GRAPHQL_MR_FIELDS}
  headPipeline { id jobs(retried: false) { nodes { id name status startedAt finishedAt webPath } } }`;
// Une MR mergée n'a plus de pipeline à suivre ; son plus ancien commit date le début du développement.
const GRAPHQL_MERGED_MR_FIELDS = `${GRAPHQL_MR_FIELDS}
  firstCommit: commits(last: 1) { nodes { authoredDate } }`;
// Dernier pipeline de la branche suivie, et durées de ses derniers pipelines réussis (les échecs,
// interrompus en cours de route, fausseraient la fourchette). Requête à part de celle des MR : GitLab
// plafonne la complexité d'une requête à 250, et ses trois pipelines détaillés en pèsent une bonne part.
const SUCCESSFUL_BUILDS_SAMPLE = 5;
// Pipeline en cours ⇒ le précédent abouti (réussi ou en échec) s'affiche aussi. Demandé par statut
// plutôt qu'en lisant les N derniers : une rafale de pushes annule autant de pipelines qu'elle veut.
const ACTIVE_PIPELINE_GROUPS = new Set([
  "running", "pending", "created", "preparing", "waiting-for-resource", "waiting-for-callback", "scheduled",
]);
const GRAPHQL_PIPELINE_DETAIL = `
    nodes {
      id path duration createdAt startedAt
      detailedStatus { text label group }
      sha(format: SHORT)
      user { name }
      commit { title webPath }
      stages {
        nodes {
          name
          detailedStatus { label group }
          jobs { nodes { name webPath duration detailedStatus { text group } } }
        }
      }
    }`;
const GRAPHQL_BRANCH_PIPELINE = `
  successfulPipelines: pipelines(ref: $branch, status: SUCCESS, first: ${SUCCESSFUL_BUILDS_SAMPLE}) {
    nodes { duration }
  }
  pipelines(ref: $branch, first: 1) { ${GRAPHQL_PIPELINE_DETAIL} }
  lastSuccess: pipelines(ref: $branch, status: SUCCESS, first: 1) { ${GRAPHQL_PIPELINE_DETAIL} }
  lastFailure: pipelines(ref: $branch, status: FAILED, first: 1) { ${GRAPHQL_PIPELINE_DETAIL} }`;

async function loadGraphqlMergeRequests(report) {
  const nodes = new Map();
  const query = `query($project: ID!, $after: String) {
    project(fullPath: $project) {
      mergeRequests(state: opened, first: 100, after: $after) {
        pageInfo { hasNextPage endCursor }
        nodes { ${GRAPHQL_OPEN_MR_FIELDS} }
      }
    }
  }`;
  try {
    let after = null;
    do {
      const variables = JSON.stringify({ project: state.config.gitlabProject, after });
      const { body } = await api(`/graphql?query=${encodeURIComponent(query)}&variables=${encodeURIComponent(variables)}`);
      if (body.errors?.length) throw new Error(body.errors.map(e => e.message).join(", "));
      const page = body.data.project.mergeRequests;
      for (const mr of page.nodes) nodes.set(mr.iid, mr);
      after = page.pageInfo.hasNextPage ? page.pageInfo.endCursor : null;
    } while (after);
  } catch (error) {
    report(t("error.graphql", { message: error.message }));
  }
  return nodes;
}

// null sans branche suivie ; l'erreur est rendue plutôt que levée, pour s'afficher à la place du pipeline.
async function loadBranchPipeline() {
  if (!state.config.pipelineBranch) return null;
  try {
    return await fetchBranchPipeline();
  } catch (error) {
    return { error: error.message };
  }
}

async function fetchBranchPipeline() {
  const query = `query($project: ID!, $branch: String!) {
    project(fullPath: $project) { ${GRAPHQL_BRANCH_PIPELINE} }
  }`;
  const variables = JSON.stringify({ project: state.config.gitlabProject, branch: state.config.pipelineBranch });
  const { body } = await api(`/graphql?query=${encodeURIComponent(query)}&variables=${encodeURIComponent(variables)}`);
  if (body.errors?.length) throw new Error(body.errors.map(e => e.message).join(", "));
  return withBuildDurations(body.data.project);
}

async function loadSonarPullRequests(report) {
  state.sonarPullRequests = new Map();
  if (!state.config.sonarEnabled) return;
  try {
    const { body } = await api(`/sonar/project_pull_requests/list?project=${encodeURIComponent(state.config.sonarProject)}`);
    for (const pr of body.pullRequests) state.sonarPullRequests.set(pr.key, pr);
    // Réglage du serveur Sonar, qui ne bouge pas d'une actualisation à l'autre : lu une fois par page.
    if (!state.sonarRetentionRead) {
      const retention = await api(`/sonar/settings/values?keys=${RETENTION_SETTING}&component=${encodeURIComponent(state.config.sonarProject)}`);
      state.sonarRetentionDays = Number(retention.body.settings[0]?.value) || DEFAULT_SONAR_RETENTION_DAYS;
      state.sonarRetentionRead = true;
    }
  } catch (error) {
    report(t("error.sonar", { message: error.message }));
  }
}

// next choisit dans la file l'élément à traiter, au moment où un emplacement se libère.
async function runLimited(
  items,
  limit,
  task,
  next = queue => queue[0]
) {
  const queue = [...items];
  const workers = Array.from({ length: Math.min(limit, queue.length) }, async () => {
    while (queue.length) {
      const item = next(queue);
      queue.splice(queue.indexOf(item), 1);
      await task(item);
    }
  });
  await Promise.all(workers);
}

// Les MR affichées d'abord, de haut en bas du tableau, pour que l'attente porte sur celles qu'on regarde.
// Réévalué à chaque prise : un filtre ou un tri changé pendant l'actualisation est suivi aussitôt.
function shownFirst(queue) {
  return queue.filter(matches).sort(tableComparator())[0] ?? queue[0];
}

// Tout part en parallèle : le détail de la MR n'attend ni la note PIT ni les commits, et la chaîne
// détail → retard sur la cible → Sonar fixe seule la durée. Sans données GraphQL (requête en échec),
// commits, approbations et jobs retombent sur l'API REST ; les threads, eux, sont indisponibles.
async function loadSignals(mr) {
  const signals = {};
  const graphql = mr.graphql;
  const pitNoteLoading = pitTracked() ? loadPitNote(mr) : Promise.resolve(undefined);
  // Attendue plus bas : évite un rejet non traité si le détail échoue avant.
  pitNoteLoading.catch(() => {});
  const basics = Promise.all([
    graphql ? graphqlCommits(graphql) : loadCommits(mr),
    graphqlThreads(graphql),
    graphql ? graphqlApprovals(graphql) : loadApprovals(mr),
  ]);
  try {
    const detail = (await api(`/gitlab/${projectPath()}/merge_requests/${mr.iid}?include_diverged_commits_count=true`)).body;
    signals.pipeline = detail.head_pipeline;
    // Jobs GraphQL retenus seulement s'ils sont bien ceux du pipeline de tête lu à l'instant.
    const graphqlJobs = signals.pipeline && graphql?.headPipeline?.id === `gid://gitlab/Ci::Pipeline/${signals.pipeline.id}`
      ? graphql.headPipeline.jobs.nodes.map(restJob)
      : null;
    const [behind, jobs, pitNote, previousPipeline] = await Promise.all([
      loadBehind(mr, detail.diverged_commits_count),
      graphqlJobs ? Promise.resolve(graphqlJobs)
      : signals.pipeline
        ? gitlabAll(`${projectPath()}/pipelines/${signals.pipeline.id}/jobs?include_retried=false`)
        : Promise.resolve([]),
      pitNoteLoading,
      signals.pipeline && PENDING_JOB_STATUSES.has(signals.pipeline.status)
        ? loadPreviousPipeline(
          mr,
          signals.pipeline.id
        )
        : Promise.resolve(null),
    ]);
    signals.behind = behind;
    signals.previousPipeline = previousPipeline;
    const job = name => jobs.filter(j => j.name === name).sort((a, b) => b.id - a.id)[0];
    if (pitTracked()) signals.pit = pitSignal(job(state.config.pitJob), pitNote, mr);
    if (sonarTracked()) signals.sonar = await sonarSignal(job(state.config.sonarJob), mr);
  } catch (error) {
    signals.error = error.message;
  }
  [signals.commits, signals.threads, signals.approvals] = await basics;
  return signals;
}

// Une MR dont la mise à jour échoue garde, à l'écran comme dans la sauvegarde, ses derniers bons signaux,
// datés, plus ceux que la mise à jour a malgré tout rapportés (GraphQL peut répondre quand l'API REST
// échoue).
function keepPrevious(
  previous,
  failed,
  previousAt
) {
  const fresh = ["commits", "threads", "approvals"]
    .filter(key => failed[key] && !failed[key].error)
    .map(key => [key, failed[key]]);
  return {
    ...previous,
    ...Object.fromEntries(fresh),
    staleSince: previous.staleSince ?? previousAt?.toISOString() ?? null,
    staleError: failed.error,
  };
}

// GitLab injoignable : nombre de commits, date du dernier et retard sur la cible repris du clone local,
// à jour du dernier fetch, quand GitLab n'en a rien donné ou que ce fetch est plus récent que ses données.
async function withLocalGit(
  mr,
  signals,
  dataAt
) {
  let local;
  try {
    const query = new URLSearchParams({ branch: mr.source_branch, target: mr.target_branch });
    const response = await fetch(`/git/branch?${query}`);
    if (!response.ok) return signals;
    local = await response.json();
  } catch (ignored) {
    return signals;
  }
  const newer = !dataAt || (local.fetchedAt && new Date(local.fetchedAt) > new Date(dataAt));
  const pick = (current, value) => (!current || current.error || current.count == null || newer ? value : current);
  return {
    ...signals,
    commits: pick(signals.commits, {
      count: local.count,
      commitDate: local.commitDate,
      authorDate: local.authorDate,
      pushDate: sameDate(signals.commits?.commitDate, local.commitDate) ? signals.commits.pushDate : null,
      localAt: local.fetchedAt,
    }),
    behind: pick(signals.behind, { ...local.behind, localAt: local.fetchedAt }),
  };
}

// Le clone local ne connaît pas la date du push : celle de GitLab vaut tant que la tête de branche est la même.
function sameDate(
  first,
  second
) {
  return Boolean(first && second) && new Date(first).getTime() === new Date(second).getTime();
}

const localNote = signal => (signal?.localAt === undefined ? ""
  : "\n" + t("local.title", { date: signal.localAt ? formatDate(signal.localAt) : "—" }));

// Pipeline de tête en cours : le dernier pipeline terminé de la MR reste sa dernière valeur connue. Un
// pipeline annulé ou sauté ne dit rien du code : on remonte au précédent.
//
// Tant que le pipeline de tête reste le même, ce précédent est repris sans relire GitLab : seul un pipeline
// plus ancien encore en cours, qui finirait après, le laisserait périmé jusqu'au prochain pipeline de tête.
async function loadPreviousPipeline(
  mr,
  headId
) {
  const previous = state.signals.get(mr.iid);
  if (!state.bypassCache && previous?.pipeline?.id === headId && previous.previousPipeline) {
    return previous.previousPipeline;
  }
  try {
    const pipelines = (await api(`/gitlab/${projectPath()}/merge_requests/${mr.iid}/pipelines?per_page=20`)).body;
    const previous = pipelines.find(p => p.id !== headId && ["success", "failed"].includes(p.status));
    return previous ? (await api(`/gitlab/${projectPath()}/pipelines/${previous.id}`)).body : null;
  } catch (ignored) {
    return null;
  }
}

// Un thread = une discussion résoluble (commentaire de revue, diff note) : les compteurs de GitLab,
// qui ignorent notes système et commentaires simples, sans charger les discussions.
function graphqlThreads(node) {
  if (!node) return { error: t("error.graphql", { message: "—" }) };
  return { total: node.resolvableDiscussionsCount, unresolved: node.resolvableDiscussionsCount - node.resolvedDiscussionsCount };
}

// Note PIT sans charger toutes les discussions : notes les plus récemment mises à jour d'abord, lues
// page par page jusqu'à la première qui porte le marqueur.
async function loadPitNote(mr) {
  let page = "1";
  while (page) {
    const { body, headers } = await api(
      `/gitlab/${projectPath()}/merge_requests/${mr.iid}/notes?sort=desc&order_by=updated_at&per_page=20&page=${page}`
    );
    const note = body.find(n => n.body.startsWith(state.config.pitMarker));
    if (note) return note;
    page = headers.get("X-Next-Page");
  }
  return undefined;
}

// Le retard court depuis que la cible a bougé après le dernier commit commun : c'est la date de son
// successeur sur l'historique first-parent de la cible (le commit de merge, pour une MR mergée), et non
// celle du plus ancien commit manquant — un commit de feature mergé plus tard garde sa date d'origine.
//
// Ce successeur ne change pas tant que la MR garde son dernier commit et sa cible : la cible ne fait qu'avancer,
// le dernier commit commun reste le même. Un rebase ou un push change le commit, une MR empilée dont la parente
// est mergée change de cible : la date est alors relue. Seul un push forcé sur la cible la laisse périmée.
async function loadBehind(mr, count) {
  if (count == null) return { error: t("error.behindCount") };
  if (count === 0) return { count, since: null };
  const previous = state.signals.get(mr.iid)?.behind;
  if (previous?.since && previous.localAt === undefined && previous.sha === mr.sha && previous.target === mr.target_branch) {
    return { ...previous, count };
  }
  try {
    const refs = [mr.sha, mr.target_branch].map(ref => `refs%5B%5D=${encodeURIComponent(ref)}`).join("&");
    const base = (await api(`/gitlab/${projectPath()}/repository/merge_base?${refs}`)).body;
    const commits = await gitlabAll(
      `${projectPath()}/repository/commits?ref_name=${encodeURIComponent(mr.target_branch)}` +
      `&first_parent=true&since=${encodeURIComponent(base.committed_date)}`
    );
    const next = commits.find(c => c.parent_ids[0] === base.id) ?? commits.filter(c => c.id !== base.id).at(-1);
    return {
      count,
      since: next?.committed_date ?? null,
      base: base.short_id,
      next: next?.short_id ?? null,
      sha: mr.sha,
      target: mr.target_branch,
    };
  } catch (error) {
    return { count, error: error.message };
  }
}

// Aucune approbation n'est exigée sur le projet : GitLab répond alors « approved: true » pour toute MR,
// même sans approbateur. Seule la liste des approbateurs dit si quelqu'un a réellement approuvé.
async function loadApprovals(mr) {
  try {
    const [approvals, reviewers] = await Promise.all([
      api(`/gitlab/${projectPath()}/merge_requests/${mr.iid}/approvals`),
      api(`/gitlab/${projectPath()}/merge_requests/${mr.iid}/reviewers`),
    ]);
    return {
      names: approvals.body.approved_by.map(a => a.user.name),
      usernames: approvals.body.approved_by.map(a => a.user.username),
      changesRequested: reviewers.body.filter(r => r.state === "requested_changes").map(r => r.user.name),
    };
  } catch (error) {
    return { error: error.message };
  }
}

// Dates du dernier commit et du dernier push, et non l'updated_at de la MR, que GitLab bouge aussi sur
// un commentaire, un label ou une approbation. Le premier commit renvoyé par GraphQL est la tête de la
// branche, la première version de diff le dernier push.
function graphqlCommits(node) {
  return {
    count: node.commitCount,
    commitDate: node.commits.nodes[0]?.committedDate ?? null,
    authorDate: node.commits.nodes[0]?.authoredDate ?? null,
    pushDate: node.mergeRequestDiffs.nodes[0]?.createdAt ?? null,
  };
}

// changesRequested : reviewers dont la revue en cours demande des changements, état que GitLab garde
// jusqu'à leur prochaine revue (approbation ou nouvelle revue).
function graphqlApprovals(node) {
  return {
    names: node.approvedBy.nodes.map(a => a.name),
    usernames: node.approvedBy.nodes.map(a => a.username),
    changesRequested: node.reviewers.nodes
      .filter(r => r.mergeRequestInteraction?.reviewState === "REQUESTED_CHANGES")
      .map(r => r.name),
  };
}

// Job GraphQL remis dans la forme de l'API REST, que lisent pitSignal et sonarSignal.
function restJob(job) {
  return {
    id: Number(job.id.split("/").pop()),
    name: job.name,
    status: job.status.toLowerCase(),
    started_at: job.startedAt,
    finished_at: job.finishedAt,
    web_url: state.config.gitlabWeb + job.webPath,
  };
}

async function loadCommits(mr) {
  try {
    const [commits, versions] = await Promise.all([
      gitlabAll(`${projectPath()}/merge_requests/${mr.iid}/commits`),
      api(`/gitlab/${projectPath()}/merge_requests/${mr.iid}/versions?per_page=1`).then(response => response.body),
    ]);
    return {
      count: commits.length,
      commitDate: commits.map(c => c.committed_date).sort().at(-1) ?? null,
      authorDate: commits[0]?.authored_date ?? null,
      pushDate: versions[0]?.created_at ?? null,
    };
  } catch (error) {
    return { error: error.message };
  }
}

function pitSignal(job, note, mr) {
  const noteLink = note ? `${mr.web_url}#note_${note.id}` : mr.web_url;
  if (!job) return { state: "absent", reason: "notApplicable", link: mr.web_url };
  const running = PENDING_JOB_STATUSES.has(job.status);
  // Job en cours : la note du run précédent reste la dernière valeur connue — l'afficher, marquée
  // « en cours », plutôt que de la masquer. Sans note, il n'y a rien à montrer.
  if (running && !note) return { state: "pending", reason: "pending", info: { status: job.status }, link: job.web_url };
  if (!note) return { state: "absent", reason: "noNote", info: { status: job.status, marker: state.config.pitMarker }, link: job.web_url };
  // Seul un job en échec rend la note suspecte. Un job réussi republie la note, mais GitLab ne
  // bouge pas son updated_at si le contenu est identique : comparer les dates donnerait un faux
  // « périmé » à chaque résultat inchangé.
  if (job.status === "failed" && job.started_at && new Date(note.updated_at) < new Date(job.started_at)) {
    return { state: "stale", reason: "failed", link: job.web_url };
  }
  const counts = parsePitNote(note.body);
  if (!counts) return { state: "absent", reason: "unreadable", link: noteLink };
  return {
    state: "ok",
    ...counts,
    link: noteLink,
    jobFailed: job.status === "failed",
    refreshing: running ? refreshingOf(job, note.updated_at) : null,
  };
}

function parsePitNote(body) {
  const row = body.split("\n").find(line => /^\|\s*\d/.test(line));
  if (!row) return null;
  const cells = row.split("|").slice(1, -1).map(cell => {
    const match = cell.match(/\d+(?:[.,]\d+)?/);
    return match ? Number(match[0].replace(",", ".")) : null;
  });
  const [total, killed, survived, noCoverage, errors, strength] = cells;
  return { total, killed, survived, noCoverage, errors, strength };
}

// Sans analyse Sonar, trois situations très différentes : le pipeline n'a pas de job sonar (non
// applicable), l'analyse a été purgée par le serveur faute de push récent (expirée — relancer le
// pipeline), ou le job n'a rien produit (introuvable — à investiguer).
function missingSonarAnalysis(job, mr) {
  if (!job) return { state: "absent", reason: "notApplicable", link: mr.web_url };
  if (PENDING_JOB_STATUSES.has(job.status)) {
    return { state: "pending", reason: "pending", info: { status: job.status }, link: job.web_url };
  }
  const retentionMs = state.sonarRetentionDays * 24 * 3600 * 1000;
  if (job.status === "success" && job.finished_at && gitlabNow() - new Date(job.finished_at) > retentionMs) {
    return { state: "absent", reason: "expired", info: { days: state.sonarRetentionDays }, link: job.web_url };
  }
  return { state: "absent", reason: "notFound", info: { status: job.status }, link: job.web_url };
}

// Issues et couverture ne changent qu'avec une nouvelle analyse : tant que la date d'analyse reste celle
// des valeurs déjà lues, elles sont reprises sans interroger Sonar. Une issue acceptée ou marquée faux
// positif dans Sonar, sans nouvelle analyse, n'apparaît qu'au bouton « Rafraîchir ».
async function sonarValues(
  mr,
  analysisDate
) {
  const previous = state.signals.get(mr.iid)?.sonar;
  if (!state.bypassCache && previous?.analysisDate === analysisDate && previous.issues !== undefined) {
    const { issues, coverage, linesToCover, uncoveredLines, uncoveredConditions } = previous;
    return { issues, coverage, linesToCover, uncoveredLines, uncoveredConditions };
  }
  const project = encodeURIComponent(state.config.sonarProject);
  const [issues, measures] = await Promise.all([
    api(`/sonar/issues/search?componentKeys=${project}&pullRequest=${mr.iid}&resolved=false&ps=1`).then(r => r.body),
    api(`/sonar/measures/component?component=${project}&pullRequest=${mr.iid}&metricKeys=new_coverage,new_lines_to_cover,new_uncovered_lines,new_uncovered_conditions`).then(r => r.body),
  ]);
  const measure = key => {
    const m = measures.component.measures.find(x => x.metric === key);
    const value = m?.period?.value ?? m?.value;
    return value === undefined ? null : Number(value);
  };
  return {
    issues: issues.total,
    coverage: measure("new_coverage"),
    linesToCover: measure("new_lines_to_cover"),
    uncoveredLines: measure("new_uncovered_lines"),
    uncoveredConditions: measure("new_uncovered_conditions"),
  };
}

async function sonarSignal(job, mr) {
  if (!state.config.sonarEnabled) return { state: "disabled", reason: "disabled" };
  const base = state.config.sonarWeb;
  const id = encodeURIComponent(state.config.sonarProject);
  const links = {
    dashboard: `${base}/dashboard?id=${id}&pullRequest=${mr.iid}`,
    issues: `${base}/project/issues?id=${id}&pullRequest=${mr.iid}&resolved=false`,
    coverage: `${base}/component_measures?id=${id}&pullRequest=${mr.iid}&metric=new_coverage`,
  };
  const pr = state.sonarPullRequests.get(String(mr.iid));
  if (!pr) return missingSonarAnalysis(job, mr);
  // Job en cours : l'analyse précédente reste la dernière valeur connue, affichée et marquée
  // « en cours ». Elle est forcément antérieure au job : ce n'est pas un « périmé ».
  const running = job && PENDING_JOB_STATUSES.has(job.status);
  const stale = !running && job?.started_at && new Date(pr.analysisDate) < new Date(job.started_at);
  return {
    state: stale ? "stale" : "ok",
    gate: pr.status?.qualityGateStatus,
    ...await sonarValues(
      mr,
      pr.analysisDate
    ),
    analysisDate: pr.analysisDate,
    links,
    jobFailed: job?.status === "failed",
    refreshing: running ? refreshingOf(job, pr.analysisDate) : null,
  };
}

function refreshingOf(job, valuesDate) {
  return { job: job.name, status: job.status, link: job.web_url, valuesDate };
}

// ---------- Cellules de signaux ----------

// Une cellule n'affiche une pastille que s'il y a quelque chose à voir (alerte, ou signal absent /
// en cours) ; un signal propre reste en texte discret, pour que les alertes ressortent d'un coup d'œil.

// Par l'état de la MR, et non par la vue affichée : les notifications lisent les MR ouvertes quelle
// que soit la vue.
function signalsOf(mr) {
  return (mr.state === "merged" ? state.merged.signals : state.signals).get(mr.iid) || {};
}

function loadingOrError(s) {
  if (s.loading) return pill("loading", "…");
  if (s.error) return pill("grey", t("unavailable"), s.error);
  return null;
}

// Libellé du badge GitLab tel quel (« Passed », « Warning », « Failed », « Blocked »…) plutôt qu'un
// vocabulaire propre au tableau de bord : c'est ce que l'on retrouve en ouvrant le pipeline.
function pipelineCell(mr) {
  const s = signalsOf(mr);
  const pending = loadingOrError(s);
  if (pending) return pending;
  if (!s.pipeline) return pill("grey", t("pipeline.none"));
  if (!PENDING_JOB_STATUSES.has(s.pipeline.status)) return pipelinePill(s.pipeline);
  // En cours : le résultat du pipeline précédent, puis « En cours » en petit.
  const { id, web_url: link } = s.pipeline;
  const { label } = pipelineStatus(s.pipeline);
  const value = s.previousPipeline
    ? pipelinePill(s.previousPipeline).replace(' class="ok good"', ' class="ok"')
    : `<span class="muted">—</span>`;
  const title = s.previousPipeline
    ? t("pipeline.runningTitle", { id, label, previous: s.previousPipeline.id })
    : t("pipeline.title", { id, label });
  return `<div class="stack">${value}${runningNote(title, link)}</div>`;
}

function pipelinePill(pipeline) {
  const { id, web_url: link } = pipeline;
  const { text, label, group } = pipelineStatus(pipeline);
  const title = t("pipeline.title", { id, label });
  if (group === "success") return `<a class="ok good" href="${escapeHtml(link)}" target="_blank" rel="noopener" title="${escapeHtml(title)}">${escapeHtml(text)}</a>`;
  return pill(PIPELINE_TONE[group] ?? "grey", text, title, link);
}

// Sous la dernière valeur connue : un job ou un pipeline tourne, la valeur va bientôt changer.
function runningNote(
  title,
  link
) {
  return `<a class="running-note" href="${escapeHtml(link)}" target="_blank" rel="noopener" title="${escapeHtml(title)}">${escapeHtml(t("refreshing"))}</a>`;
}

// head_pipeline porte detailed_status ; repli sur le statut brut s'il manquait.
function pipelineStatus(pipeline) {
  const detailed = pipeline.detailed_status;
  return detailed
    ? { text: detailed.text, label: detailed.label, group: detailed.group }
    : { text: pipeline.status, label: pipeline.status, group: pipeline.status };
}

function pitCell(mr) {
  const s = signalsOf(mr);
  const pending = loadingOrError(s);
  if (pending) return pending;
  const pit = s.pit;
  if (!pit) return "";
  if (pit.state !== "ok") return reasonPill("pit", pit);
  const detail = t("pit.detail", pit);
  const out = [];
  if (pit.survived > 0) out.push(pill("red", t("pit.survived", { n: pit.survived }), detail, pit.link));
  if (pit.noCoverage > 0) out.push(pill("orange", t("pit.noCoverage", { n: pit.noCoverage }), detail, pit.link));
  if (pit.errors > 0) out.push(pill("orange", t("pit.errors", { n: pit.errors }), detail, pit.link));
  if (pit.jobFailed) out.push(pill("orange", t("job.failed"), t("pit.jobFailed"), pit.link));
  return signalStack(pit, out, `<a class="ok good" href="${escapeHtml(pit.link)}" target="_blank" rel="noopener" title="${escapeHtml(detail)}">0</a>`);
}

// Signal inexploitable (absent, en cours, non configuré…) : sa raison, en pastille grise.
function reasonPill(kind, signal) {
  if (signal.reason === "pending") {
    return `<div class="stack"><span class="muted">—</span>${runningNote(t(`${kind}.pending`, signal.info), signal.link)}</div>`;
  }
  return pill("grey", t(`reason.${signal.reason}`), t(`${kind}.${signal.reason}`, signal.info), signal.link);
}

function sonarUsable(sonar) {
  return sonar && (sonar.state === "ok" || sonar.state === "stale");
}

function sonarUnusable(mr) {
  const s = signalsOf(mr);
  const pending = loadingOrError(s);
  if (pending) return pending;
  if (!s.sonar) return "";
  if (!sonarUsable(s.sonar)) return reasonPill("sonar", s.sonar);
  return null;
}

function issuesCell(mr) {
  const unusable = sonarUnusable(mr);
  if (unusable !== null) return unusable;
  const sonar = signalsOf(mr).sonar;
  const out = [];
  if (sonar.state === "stale") out.push(pill("grey", t("sonar.stale"), t("sonar.staleTitle", { date: formatDate(sonar.analysisDate) }), sonar.links.dashboard));
  if (sonar.issues > 0) out.push(pill("red", t("sonar.issues", { n: sonar.issues }), t("sonar.issuesTitle"), sonar.links.issues));
  if (sonar.gate && sonar.gate !== "OK") out.push(pill("red", t("sonar.gate", { gate: sonar.gate }), t("sonar.gateTitle"), sonar.links.dashboard));
  if (sonar.jobFailed) out.push(pill("orange", t("job.failed"), t("sonar.jobFailed"), sonar.links.dashboard));
  return signalStack(sonar, out, `<a class="ok good" href="${escapeHtml(sonar.links.issues)}" target="_blank" rel="noopener">0</a>`);
}

function coverageCell(mr) {
  const unusable = sonarUnusable(mr);
  if (unusable !== null) return unusable;
  const sonar = signalsOf(mr).sonar;
  if (sonar.coverage == null) return signalStack(sonar, [], `<span class="ok" title="${escapeHtml(t("coverage.none"))}">—</span>`);
  const detail = t("coverage.detail", {
    lines: sonar.linesToCover ?? "?",
    uncovered: sonar.uncoveredLines ?? "?",
    conditions: sonar.uncoveredConditions ?? "?",
  });
  if (sonar.coverage >= 100) return signalStack(sonar, [], `<a class="ok good" href="${escapeHtml(sonar.links.coverage)}" target="_blank" rel="noopener" title="${escapeHtml(detail)}">${formatPercent(100)}</a>`);
  return signalStack(sonar, [pill("orange", formatPercent(sonar.coverage), detail, sonar.links.coverage)], "");
}

function commitsCount(mr) {
  const commits = signalsOf(mr).commits;
  return commits && !commits.error ? commits.count : null;
}

// Date du dernier push, et non celle du commit : GitLab date une version de la MR à sa réception,
// alors que la date de commit vient du poste du développeur, qui peut l'avoir réglée à sa guise
// (horloge fausse, rebase, commit --date). La date de commit reste lisible dans l'infobulle.
function lastCommitDate(mr) {
  const commits = signalsOf(mr).commits;
  return commits?.pushDate ?? commits?.commitDate ?? null;
}

// Date d'auteur du plus ancien commit : conservée au rebase, elle date le début du développement.
function firstCommitDate(mr) {
  return signalsOf(mr).commits?.firstDate ?? null;
}

function elapsed(
  from,
  to
) {
  return from && to ? new Date(to) - new Date(from) : null;
}

function durationCell(
  from,
  to
) {
  if (!from || !to) return `<span class="muted">—</span>`;
  const title = t("duration.title", { from: formatDate(from), to: formatDate(to) });
  return `<span title="${escapeHtml(title)}">${escapeHtml(compactDuration(elapsed(from, to)))}</span>`;
}

function commitAgeHours(mr) {
  const iso = lastCommitDate(mr);
  return iso ? (gitlabNow() - new Date(iso)) / 3600000 : null;
}

function lastCommitCell(mr) {
  const hours = commitAgeHours(mr);
  const mood = hours == null ? null
    : hours < ACTIVE_COMMIT_HOURS ? ["⚡", "commit.active"]
    : hours > IDLE_COMMIT_HOURS ? ["😴", "commit.idle"]
    : null;
  const badge = mood ? `<span class="commit-mood" title="${escapeHtml(t(mood[1]))}">${mood[0]}</span>` : "";
  const commits = signalsOf(mr).commits;
  const pushDate = lastCommitDate(mr);
  if (!pushDate) return dateCell(null, "");
  const tooltip = t("date.lastCommit", {
    push: commits.pushDate ? formatDate(commits.pushDate) : "—",
    commit: commits.authorDate ? formatDate(commits.authorDate) : "—",
  }) + localNote(commits);
  const local = commits.localAt !== undefined ? ' class="local"' : "";
  const commitAge = isCommitGapWorthShowing(commits)
    ? `<div class="commit-age">${escapeHtml(t("date.commitAge", { age: relative(commits.authorDate) }))}</div>`
    : "";
  return `<span${local} title="${escapeHtml(tooltip)}">${relative(pushDate)}</span>${badge}${commitAge}`;
}

function isCommitGapWorthShowing(commits) {
  if (!commits.pushDate || !commits.authorDate) return false;
  const gapMinutes = (new Date(commits.pushDate) - new Date(commits.authorDate)) / 60000;
  const pushAgeMinutes = (gitlabNow() - new Date(commits.pushDate)) / 60000;
  return gapMinutes >= COMMIT_GAP_ALWAYS_MINUTES
    || (gapMinutes >= COMMIT_GAP_MIN_MINUTES && gapMinutes >= COMMIT_GAP_MIN_RATIO * pushAgeMinutes);
}

// Une action simple est attendue (correction, rebase) et personne n'a poussé depuis STALLED_ALERT_HOURS.
function isStalled(mr) {
  if (mr.state === "merged") return false;
  const hours = commitAgeHours(mr);
  return hours != null && hours > STALLED_ALERT_HOURS && alertScore(mr) > 0;
}

function staleSignalsPill(mr) {
  const s = signalsOf(mr);
  if (!s.staleError) return "";
  const date = s.staleSince ? formatDate(s.staleSince) : "—";
  return pill("grey", t("signals.stale"), t("signals.stale.title", { date, message: s.staleError }));
}

function stalledPill(mr) {
  return isStalled(mr) ? pill("red", t("stalled"), t("stalled.title"), mr.web_url) : "";
}

function dateCell(iso, key) {
  if (!iso) return `<span class="muted">—</span>`;
  return `<span title="${escapeHtml(t(key, { date: formatDate(iso) }))}">${relative(iso)}</span>`;
}

// Valeurs d'un run précédent pendant qu'un nouveau job tourne : suivies d'un « En cours » en petit, et
// jamais affichées en vert — un signal propre peut encore se dégrader à la fin du job.
function refreshingNote(signal) {
  const r = signal.refreshing;
  if (!r) return "";
  return runningNote(t("refreshing.title", { job: r.job, status: r.status, date: formatDate(r.valuesDate) }), r.link);
}

function signalStack(signal, alerts, clean) {
  const note = refreshingNote(signal);
  if (!note && !alerts.length) return clean;
  const body = alerts.length ? alerts : [note ? clean.replace(' class="ok good"', ' class="ok"') : clean];
  return `<div class="stack">${[...body, note].join("")}</div>`;
}

function pill(tone, text, title = "", link = null) {
  const tag = link ? "a" : "span";
  const href = link ? ` href="${escapeHtml(link)}" target="_blank" rel="noopener"` : "";
  return `<${tag} class="pill ${tone}"${href} title="${escapeHtml(title)}">${escapeHtml(text)}</${tag}>`;
}

function alertScore(mr) {
  const s = state.signals.get(mr.iid) || {};
  let score = 0;
  if (mr.has_conflicts) score += 100;
  if (s.pipeline && s.pipeline.status === "failed") score += 100;
  if (s.pit?.state === "ok") score += 10 * (s.pit.survived || 0) + (s.pit.noCoverage || 0) + (s.pit.errors || 0);
  if (s.sonar?.state === "ok" || s.sonar?.state === "stale") {
    score += 10 * (s.sonar.issues || 0);
    if (s.sonar.gate && s.sonar.gate !== "OK") score += 50;
    if (s.sonar.coverage != null && s.sonar.coverage < 100) score += Math.ceil(100 - s.sonar.coverage);
  }
  return score;
}

// ---------- Notifications ----------

// Problèmes d'une MR, chacun avec une gravité : il est « nouveau » s'il n'était pas notifié ou si sa gravité
// a augmenté. Un signal inconnu (en erreur, pas encore analysé) garde les problèmes déjà notifiés pour sa
// catégorie, pour ne pas les renotifier quand il redevient lisible.
function problemsOf(mr) {
  const s = signalsOf(mr);
  const problems = [];
  const unknown = new Set();
  // blocking : problème en rouge dans le tableau, qui empêche le merge ou le rend risqué ; les autres
  // sont en orange, à traiter sans urgence.
  const add = (
    key,
    severity,
    text,
    blocking = false
  ) => problems.push({ key, severity, text, blocking });
  if (mr.has_conflicts) add("conflicts", 1, t("problem.conflicts"), true);
  if (s.pipeline?.status === "failed") add("pipeline", 1, t("problem.pipeline", { id: s.pipeline.id }), true);
  if (sonarUsable(s.sonar)) {
    const sonar = s.sonar;
    if (sonar.issues > 0) add("sonar.issues", sonar.issues, t("problem.sonarIssues", { n: sonar.issues }), true);
    if (sonar.gate && sonar.gate !== "OK") add("sonar.gate", 1, t("problem.gate", { gate: sonar.gate }), true);
    if (sonar.coverage != null && sonar.coverage < 100) {
      add("sonar.coverage", Math.ceil(100 - sonar.coverage), t("problem.coverage", { value: formatPercent(sonar.coverage) }));
    }
  } else if (sonarTracked()) {
    unknown.add("sonar");
  }
  const pit = s.pit;
  if (pit?.state === "ok") {
    if (pit.survived > 0) add("pit.survived", pit.survived, t("problem.pitSurvived", { n: pit.survived }), true);
    if (pit.noCoverage > 0) add("pit.noCoverage", pit.noCoverage, t("problem.pitNoCoverage", { n: pit.noCoverage }));
    if (pit.errors > 0) add("pit.errors", pit.errors, t("problem.pitErrors", { n: pit.errors }));
  } else if (pitTracked()) {
    unknown.add("pit");
  }
  if (!s.threads || s.threads.error) unknown.add("threads");
  else if (s.threads.unresolved > 0) add("threads", s.threads.unresolved, t("problem.threads", { n: s.threads.unresolved }));
  // Retard signalé comme dans la colonne : dès qu'il passe en orange.
  const behind = s.behind;
  if (behind?.count == null) {
    unknown.add("behind");
  } else if (behind.count > 0 && behind.since) {
    const hours = (gitlabNow() - new Date(behind.since)) / 3600000;
    if (hours > BEHIND_ORANGE_HOURS) {
      add("behind", 1, t("problem.behind", {
        n: behind.count,
        target: mr.target_branch,
        duration: compactDuration(gitlabNow() - new Date(behind.since)),
      }));
    }
  }
  return { problems, unknown };
}

// Appelée à chaque nouvelles données et toutes les REMINDER_CHECK_MS, pour les rappels sur ses propres MR.
// Le premier passage (rien de notifié jusque-là) notifie ses propres MR une par une et résume celles des
// autres en une seule notification, plutôt qu'une rafale. Les sons suivent la même détection, notifications
// cochées ou non, et un seul par passage : le plus important.
function notifyProblems() {
  const notifying = state.notify && "Notification" in window && Notification.permission === "granted";
  if (!(notifying || state.sound) || !state.notifier || !state.me) return;
  // Pas de données complètes encore : l'état notifié serait réécrit à vide, et tout renotifié ensuite.
  if (!state.refreshedAt) return;
  const notified = readNotified();
  const first = notified == null;
  const next = {};
  const now = Date.now();
  let othersWithProblems = 0;
  let ownFreshBlocking = false;
  for (const mr of state.mrs) {
    const before = notified?.[mr.iid];
    if (signalsOf(mr).loading) {
      if (before) next[mr.iid] = before;
      continue;
    }
    const { problems, unknown } = problemsOf(mr);
    const severities = Object.fromEntries(problems.map(p => [p.key, p.severity]));
    for (const [key, severity] of Object.entries(before?.problems ?? {})) {
      if (unknown.has(key.split(".")[0])) severities[key] ??= severity;
    }
    if (!Object.keys(severities).length) {
      closeNotification(mr.iid);
      continue;
    }
    const own = mr.author?.username === state.me;
    const isFresh = p => !(p.severity <= (before?.problems?.[p.key] ?? 0));
    const fresh = problems.some(isFresh);
    if (own && !first && problems.some(p => p.blocking && isFresh(p))) ownFreshBlocking = true;
    const reminderDue = own && problems.length > 0 && (!before || now - before.at >= OWN_REMINDER_MS);
    const show = own ? fresh || reminderDue : fresh && !first;
    if (!own && fresh && first) othersWithProblems++;
    next[mr.iid] = { problems: severities, at: show ? now : before?.at ?? now };
    if (show && notifying) showNotification(
      mr,
      problems,
      own
    );
  }
  for (const iid of state.notifications.keys()) {
    if (!(iid in next)) closeNotification(iid);
  }
  saveNotified(next);
  if (othersWithProblems && notifying) {
    new Notification(t("notify.others", { n: othersWithProblems }), { body: t("notify.othersBody"), tag: "mr-others" });
  }
  const approvalSound = notifyApprovals(notifying);
  const brokenSound = notifyBranchPipeline(notifying);
  const sound = ownFreshBlocking ? "alert" : brokenSound ?? approvalSound;
  if (sound && state.sound) ringSound(sound);
  announceMerges(sound);
}

// Pipeline abouti le plus récent de la branche suivie : le dernier, ou le précédent tant que le dernier
// tourne. Son passage en échec est notifié et rend le son à jouer ; son retour au vert ferme la
// notification, sans rien jouer. Le premier passage ne fait que relever l'état en place.
function notifyBranchPipeline(notifying) {
  const p = state.branchPipeline;
  const conclusive = p && !p.error ? (isActive(p) ? p.previous : p) : null;
  const group = conclusive?.detailedStatus.group;
  if (group !== "success" && group !== "failed") return null;
  const failed = group === "failed";
  const seen = readStored(BRANCH_PIPELINE_SEEN_KEY);
  if (seen?.id === conclusive.id) return null;
  saveStored(
    BRANCH_PIPELINE_SEEN_KEY,
    { id: conclusive.id, failed }
  );
  if (!failed) {
    state.branchNotification?.close();
    state.branchNotification = null;
    return null;
  }
  if (!seen || seen.failed) return null;
  if (notifying) showBranchBroken(conclusive);
  return "broken";
}

function showBranchBroken(p) {
  const title = t("branchBroken", { branch: state.config.pipelineBranch, id: p.id.split("/").pop() });
  const body = [p.commit?.title, p.user?.name].filter(Boolean).join(" — ");
  const notification = new Notification(Anonymizer.text(title), { body: Anonymizer.text(body), tag: "branch-pipeline", renotify: true, requireInteraction: true });
  notification.onclick = () => {
    window.open(state.config.gitlabWeb + p.path, "_blank", "noopener");
    notification.close();
  };
  state.branchNotification = notification;
}

// MR sorties des ouvertes depuis le passage précédent : GitLab dit lesquelles sont mergées (les autres
// sont fermées), et une mergée fait jouer un son bref, sans notification, si le passage n'en a pas joué
// d'autre. Le premier passage ne fait que relever les MR ouvertes.
async function announceMerges(passSound) {
  const seen = readStored(MERGES_SEEN_KEY);
  const open = state.mrs.map(mr => mr.iid);
  const announced = seen?.announced ?? [];
  const gone = (seen?.open ?? []).filter(iid => !open.includes(iid) && !announced.includes(iid));
  saveStored(
    MERGES_SEEN_KEY,
    { open, announced }
  );
  if (!gone.length) return;
  try {
    const merged = await gitlabAll(`${projectPath()}/merge_requests?state=merged&${gone.map(iid => `iids%5B%5D=${iid}`).join("&")}`);
    if (!merged.length) return;
    const latest = readStored(MERGES_SEEN_KEY) ?? { open };
    saveStored(
      MERGES_SEEN_KEY,
      { ...latest, announced: [...merged.map(mr => mr.iid), ...announced].slice(0, MERGES_ANNOUNCED_MAX) }
    );
    if (!passSound && state.sound) ringSound("merged");
  } catch (error) {
    console.error("MR mergées introuvables :", error);
  }
}

function readStored(key) {
  try {
    return JSON.parse(localStorage.getItem(key));
  } catch (ignored) {
    return null;
  }
}

function saveStored(
  key,
  value
) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (ignored) { /* stockage indisponible : l'état sera relevé au prochain chargement */ }
}

// Approbateurs apparus depuis le passage précédent : notification de succès, hors soi-même, et le son à
// jouer (cloche sur ses propres MR et quand on approuve celle d'un autre, un tintement sinon). Le premier passage ne fait que
// relever les approbations en place. Une MR dont les approbations sont en cours de chargement ou en
// erreur garde ce qui en était vu.
function notifyApprovals(notifying) {
  const seen = readApprovalsSeen();
  const next = {};
  let sound = null;
  for (const mr of state.mrs) {
    const { loading, approvals } = signalsOf(mr);
    const before = seen?.[mr.iid];
    if (loading || !approvals?.usernames) {
      if (before) next[mr.iid] = before;
      continue;
    }
    next[mr.iid] = approvals.usernames;
    if (!seen) continue;
    const added = approvals.usernames.flatMap((username, i) => ((before ?? []).includes(username) ? [] : [{ username, name: approvals.names[i] }]));
    const own = mr.author?.username === state.me;
    // Approuver la MR d'un autre, c'est payer la tournée : la cloche, sans notification.
    if (!own && added.some(a => a.username === state.me)) sound = "bell";
    const newcomers = added.filter(a => a.username !== state.me).map(a => a.name);
    if (!newcomers.length) continue;
    sound = own ? "bell" : sound ?? "ding";
    if (notifying) showApproval(
      mr,
      newcomers,
      own
    );
  }
  saveApprovalsSeen(next);
  return sound;
}

function showApproval(
  mr,
  names,
  own
) {
  const title = own
    ? t("approved.own", { iid: mr.iid, names: names.join(", ") })
    : t("approved.other", { iid: mr.iid, author: mr.author?.name ?? "?", names: names.join(", ") });
  const notification = new Notification(Anonymizer.text(title), {
    body: Anonymizer.text(mr.title),
    tag: `mr-approved-${mr.iid}`,
    renotify: true,
    requireInteraction: own,
  });
  notification.onclick = () => {
    window.open(mr.web_url, "_blank", "noopener");
    notification.close();
  };
}

function readApprovalsSeen() {
  try {
    return JSON.parse(localStorage.getItem(APPROVALS_SEEN_KEY));
  } catch (ignored) {
    return null;
  }
}

function saveApprovalsSeen(seen) {
  try {
    localStorage.setItem(APPROVALS_SEEN_KEY, JSON.stringify(seen));
  } catch (ignored) { /* stockage indisponible : les approbations seront relevées au prochain chargement */ }
}

function forgetApprovalsSeen() {
  try {
    localStorage.removeItem(APPROVALS_SEEN_KEY);
  } catch (ignored) { /* stockage indisponible : rien à oublier */ }
}

// Sons synthétisés par Web Audio, sans fichier : un seul contexte, créé au premier son. Le navigateur ne
// le laisse jouer qu'après un geste dans la page (clic, touche) : unlockAudio le reprend au premier.
let audio = null;

function audioContext() {
  audio ??= new AudioContext();
  return audio;
}

function unlockAudio() {
  rememberSoundTab();
  if (state.sound && audioContext().state === "suspended") audio.resume();
}

const soundChannel = window.BroadcastChannel ? new BroadcastChannel(SOUND_CHANNEL) : null;
soundChannel?.addEventListener("message", ({ data }) => {
  if (data.tab === TAB_ID) playSound(data.name);
});

function soundTab() {
  try {
    return localStorage.getItem(SOUND_TAB_KEY);
  } catch (ignored) {
    return null;
  }
}

function rememberSoundTab() {
  try {
    if (localStorage.getItem(SOUND_TAB_KEY) !== TAB_ID) localStorage.setItem(SOUND_TAB_KEY, TAB_ID);
  } catch (ignored) { /* stockage indisponible : chaque onglet joue ses sons */ }
}

// Fermé, l'onglet du dernier clic ne joue plus rien : l'onglet notifiant reprend alors les sons.
function forgetSoundTab() {
  try {
    if (localStorage.getItem(SOUND_TAB_KEY) === TAB_ID) localStorage.removeItem(SOUND_TAB_KEY);
  } catch (ignored) { /* stockage indisponible : rien à oublier */ }
}

// Joué par l'onglet du dernier clic ou de la dernière touche, seul autorisé à coup sûr par le navigateur ;
// par celui-ci faute d'un tel onglet.
function ringSound(name) {
  const tab = soundTab();
  if (soundChannel && tab && tab !== TAB_ID) soundChannel.postMessage({ name, tab });
  else playSound(name);
}

// Note amortie : attaque brève puis décroissance exponentielle, à partir de at secondes.
function tone(
  ctx,
  output,
  { frequency, at, duration, gain, type = "sine" }
) {
  const oscillator = ctx.createOscillator();
  const envelope = ctx.createGain();
  const start = ctx.currentTime + at;
  oscillator.type = type;
  oscillator.frequency.value = frequency;
  envelope.gain.setValueAtTime(0.0001, start);
  envelope.gain.exponentialRampToValueAtTime(gain, start + 0.005);
  envelope.gain.exponentialRampToValueAtTime(0.0001, start + duration);
  oscillator.connect(envelope).connect(output);
  oscillator.start(start);
  oscillator.stop(start + duration + 0.05);
}

// Partiels inharmoniques d'une cloche : la fondamentale résonne, les aigus s'éteignent vite.
const BELL_PARTIALS = [[1, 0.5, 1.6], [2.76, 0.25, 0.9], [5.4, 0.12, 0.5], [8.93, 0.06, 0.3]];

function strike(
  ctx,
  output,
  frequency,
  at
) {
  BELL_PARTIALS.forEach(([ratio, gain, duration]) => tone(
    ctx,
    output,
    { frequency: frequency * ratio, at, duration, gain }
  ));
}

// Sirène d'alerte : glissando continu qui monte et redescend entre SIREN_LOW et SIREN_HIGH Hz, en
// SIREN_CYCLES cycles de SIREN_CYCLE secondes. Une dent de scie filtrée en passe-bas lui donne le
// timbre plein d'une sirène mécanique, sans l'aigreur d'un signal carré.
const SIREN_LOW = 620;
const SIREN_HIGH = 1240;
const SIREN_CYCLE = 1.4;
const SIREN_CYCLES = 3;

function siren(
  ctx,
  output
) {
  const oscillator = ctx.createOscillator();
  const filter = ctx.createBiquadFilter();
  const envelope = ctx.createGain();
  const start = ctx.currentTime;
  const end = start + SIREN_CYCLE * SIREN_CYCLES;
  oscillator.type = "sawtooth";
  oscillator.frequency.setValueAtTime(SIREN_LOW, start);
  for (let i = 0; i < SIREN_CYCLES; i++) {
    const cycle = start + i * SIREN_CYCLE;
    oscillator.frequency.linearRampToValueAtTime(SIREN_HIGH, cycle + SIREN_CYCLE * 0.55);
    oscillator.frequency.linearRampToValueAtTime(SIREN_LOW, cycle + SIREN_CYCLE);
  }
  filter.type = "lowpass";
  filter.frequency.value = 2200;
  envelope.gain.setValueAtTime(0.0001, start);
  envelope.gain.exponentialRampToValueAtTime(0.22, start + 0.15);
  envelope.gain.setValueAtTime(0.22, end - 0.4);
  envelope.gain.exponentialRampToValueAtTime(0.0001, end);
  oscillator.connect(filter).connect(envelope).connect(output);
  oscillator.start(start);
  oscillator.stop(end + 0.05);
}

// Coup sourd et sec : attaque franche puis décroissance immédiate, sans tenue, la hauteur chutant de from
// à to Hz comme une grosse caisse. La dent de scie filtrée garde des harmoniques audibles sur de petits
// haut-parleurs, qui rendent mal la fondamentale.
function thud(
  ctx,
  output,
  { from, to, at, duration }
) {
  const oscillator = ctx.createOscillator();
  const filter = ctx.createBiquadFilter();
  const envelope = ctx.createGain();
  const start = ctx.currentTime + at;
  const end = start + duration;
  oscillator.type = "sawtooth";
  oscillator.frequency.setValueAtTime(from, start);
  oscillator.frequency.exponentialRampToValueAtTime(to, end);
  filter.type = "lowpass";
  filter.frequency.value = 700;
  envelope.gain.setValueAtTime(0.0001, start);
  envelope.gain.exponentialRampToValueAtTime(0.55, start + 0.004);
  envelope.gain.exponentialRampToValueAtTime(0.0001, end);
  oscillator.connect(filter).connect(envelope).connect(output);
  oscillator.start(start);
  oscillator.stop(end + 0.05);
}

const SOUNDS = {
  // Cloche de bar, plusieurs coups : sa MR est approuvée.
  bell: (ctx, output) => [0, 0.28, 0.56, 0.84, 1.12, 1.4].forEach(at => strike(
    ctx,
    output,
    1046,
    at
  )),
  // Un seul coup clair et bref : la MR d'un autre est approuvée.
  ding: (ctx, output) => tone(
    ctx,
    output,
    { frequency: 1318, at: 0, duration: 0.6, gain: 0.2 }
  ),
  // « Boum-boum » sec et grave, deux coups descendants : nouveau problème bloquant sur sa MR.
  alert: (ctx, output) => {
    thud(
      ctx,
      output,
      { from: 150, to: 110, at: 0, duration: 0.16 }
    );
    thud(
      ctx,
      output,
      { from: 110, to: 65, at: 0.19, duration: 0.3 }
    );
  },
  // Sirène : le pipeline de la branche suivie passe en échec.
  broken: siren,
  // Arpège majeur montant, do-mi-sol-do, la dernière note tenue : une MR est mergée.
  merged: (ctx, output) => [[523, 0], [659, 0.09], [784, 0.18], [1046, 0.27]].forEach(([frequency, at], i, notes) => tone(
    ctx,
    output,
    { frequency, at, duration: i === notes.length - 1 ? 0.7 : 0.18, gain: 0.2, type: "triangle" }
  )),
};

// Sonie visée pour chaque son, en LUFS : la sonie momentanée de l'UIT-R BS.1770 (pondération K, fenêtre de
// 400 ms), la plus forte du son. Chacun est rendu une fois hors ligne, mesuré, puis joué au gain qui l'y
// ramène : les sons, si différents qu'ils soient, sortent tous à peu près aussi fort.
const SOUND_LOUDNESS_TARGET = -27;
const SOUND_MEASURE_RATE = 48000;
const SOUND_MEASURE_SECONDS = 5;
// Gain des sons quand la mesure est impossible (pas d'OfflineAudioContext).
const SOUND_FALLBACK_GAIN = 0.6;
// Filtres de la pondération K, coefficients de la norme à 48 kHz : plateau qui relève les aigus, puis
// passe-haut qui écarte l'infragrave.
const K_WEIGHTING = [
  { b: [1.53512485958697, -2.69169618940638, 1.19839281085285], a: [-1.69065929318241, 0.73248077421585] },
  { b: [1, -2, 1], a: [-1.99004745483398, 0.99007225036621] },
];
const soundGains = new Map();

function soundGain(name) {
  if (!soundGains.has(name)) {
    soundGains.set(name, measureSound(name)
      .then(loudness => 10 ** ((SOUND_LOUDNESS_TARGET - loudness) / 20))
      .catch(() => SOUND_FALLBACK_GAIN));
  }
  return soundGains.get(name);
}

async function measureSound(name) {
  const ctx = new OfflineAudioContext(1, SOUND_MEASURE_RATE * SOUND_MEASURE_SECONDS, SOUND_MEASURE_RATE);
  SOUNDS[name](ctx, ctx.destination);
  const rendered = await ctx.startRendering();
  return momentaryLoudness(kWeighted(rendered.getChannelData(0)));
}

function kWeighted(samples) {
  let x = samples;
  for (const { b, a } of K_WEIGHTING) {
    const y = new Float64Array(x.length);
    let x1 = 0;
    let x2 = 0;
    let y1 = 0;
    let y2 = 0;
    for (let i = 0; i < x.length; i++) {
      y[i] = b[0] * x[i] + b[1] * x1 + b[2] * x2 - a[0] * y1 - a[1] * y2;
      x2 = x1;
      x1 = x[i];
      y2 = y1;
      y1 = y[i];
    }
    x = y;
  }
  return x;
}

function momentaryLoudness(samples) {
  const window = Math.round(SOUND_MEASURE_RATE * 0.4);
  let sum = 0;
  let loudest = 0;
  for (let i = 0; i < samples.length; i++) {
    sum += samples[i] ** 2;
    if (i >= window) sum -= samples[i - window] ** 2;
    loudest = Math.max(loudest, sum);
  }
  return -0.691 + 10 * Math.log10(loudest / window);
}

// Rend l'état du contexte audio une fois le son lancé (« running » : il est parti vers la sortie du
// système), ou l'erreur : l'écoute des sons le montre, les autres appels l'ignorent.
async function playSound(name) {
  try {
    const ctx = audioContext();
    const output = ctx.createGain();
    output.gain.value = await soundGain(name);
    output.connect(ctx.destination);
    SOUNDS[name](ctx, output);
    if (ctx.state === "suspended") await ctx.resume();
    return { state: ctx.state };
  } catch (error) {
    return { error };
  }
}

function readSound() {
  try {
    return localStorage.getItem(SOUND_KEY) === "true";
  } catch (ignored) {
    return false;
  }
}

function saveSound(enabled) {
  try {
    localStorage.setItem(SOUND_KEY, String(enabled));
  } catch (ignored) { /* stockage indisponible : la préférence vaut pour la session */ }
}

// announce : la case vient d'être cochée. La cloche fait vérifier tout de suite que le son passe, et les
// approbations en place sont relevées sans être annoncées.
async function setSound(
  enabled,
  announce = false
) {
  state.sound = enabled;
  $("sound").checked = enabled;
  if (enabled && announce) {
    forgetApprovalsSeen();
    playSound("bell");
  }
  saveSound(enabled);
  if (!enabled) return;
  await loadMe();
  notifyProblems();
}

// Même tag par MR : une nouvelle notification remplace la précédente au lieu de s'empiler, et renotify la
// fait réapparaître. Celles de ses propres MR restent affichées jusqu'à ce qu'on les ferme.
function showNotification(
  mr,
  problems,
  own
) {
  const tone = mark => (mark ? "🔴" : "🟠");
  const blocking = problems.some(p => p.blocking);
  const title = own
    ? t("notify.own", { iid: mr.iid, n: problems.length, tone: tone(blocking) })
    : t("notify.other", { iid: mr.iid, author: mr.author?.name ?? "?", tone: tone(blocking) });
  const notification = new Notification(Anonymizer.text(title), {
    body: Anonymizer.text([mr.title, ...problems.map(p => `${tone(p.blocking)} ${p.text}`)].join("\n")),
    tag: `mr-${mr.iid}`,
    renotify: true,
    requireInteraction: own,
  });
  notification.onclick = () => {
    window.open(mr.web_url, "_blank", "noopener");
    notification.close();
  };
  state.notifications.set(mr.iid, notification);
}

function closeNotification(iid) {
  state.notifications.get(iid)?.close();
  state.notifications.delete(iid);
}

function readNotified() {
  try {
    return JSON.parse(localStorage.getItem(NOTIFIED_KEY));
  } catch (ignored) {
    return null;
  }
}

function saveNotified(notified) {
  try {
    localStorage.setItem(NOTIFIED_KEY, JSON.stringify(notified));
  } catch (ignored) { /* stockage indisponible : les problèmes seront renotifiés au prochain chargement */ }
}

function forgetNotified() {
  try {
    localStorage.removeItem(NOTIFIED_KEY);
  } catch (ignored) { /* stockage indisponible : rien à oublier */ }
}

// Tout ce que le dashboard a écrit dans le localStorage de cette origine (donc de ce profil : chaque
// port est une origine à part), puis rechargement : l'état en mémoire le réécrirait sinon aussitôt.
function clearStorage() {
  if (!confirm(t("clearStorage.confirm"))) return;
  try {
    Object.keys(localStorage).filter(key => key.startsWith(STORAGE_PREFIX)).forEach(key => localStorage.removeItem(key));
  } catch (ignored) { /* stockage indisponible : il n'y a rien à effacer */ }
  location.reload();
}

function readNotify() {
  try {
    return localStorage.getItem(NOTIFY_KEY) === "true";
  } catch (ignored) {
    return false;
  }
}

function saveNotify(enabled) {
  try {
    localStorage.setItem(NOTIFY_KEY, String(enabled));
  } catch (ignored) { /* stockage indisponible : la préférence vaut pour la session */ }
}

// announce : la case vient d'être cochée. Notification de confirmation, pour vérifier tout de suite que le
// navigateur et le système laissent passer les notifications, et oubli de ce qui a déjà été notifié, pour
// que tous les problèmes en cours soient renotifiés — y compris par l'onglet notifiant s'il en est un autre.
// L'oubli précède saveNotify : l'onglet notifiant relit l'état sur l'événement storage qu'elle déclenche.
async function setNotify(
  enabled,
  announce = false
) {
  if (enabled && Notification.permission !== "granted" && await Notification.requestPermission() !== "granted") {
    showError(t("notify.denied"));
    enabled = false;
  }
  state.notify = enabled;
  $("notify").checked = enabled;
  if (enabled && announce) {
    forgetNotified();
    forgetApprovalsSeen();
  }
  saveNotify(enabled);
  if (!enabled) {
    [...state.notifications.keys()].forEach(closeNotification);
    return;
  }
  if (announce) new Notification(t("notify.enabled"), { body: t("notify.enabledBody"), tag: "mr-enabled" });
  await loadMe();
  notifyProblems();
}

// Utilisateur du jeton GitLab, gardé dans le navigateur : il ne change pas d'un chargement à l'autre, et
// notifications et sons le demandent ensemble au démarrage. « Effacer les données locales » l'oublie.
let mePromise = null;

function loadMe() {
  if (state.me) return Promise.resolve();
  try {
    state.me = localStorage.getItem(ME_KEY);
  } catch (ignored) { /* stockage indisponible : demandé à GitLab */ }
  if (state.me) return Promise.resolve();
  mePromise ??= api("/gitlab/user")
    .then(({ body }) => {
      state.me = body.username;
      try {
        localStorage.setItem(ME_KEY, state.me);
      } catch (ignored) { /* stockage indisponible : redemandé au prochain chargement */ }
    })
    .catch(error => showError(t("notify.me", { message: error.message })))
    .finally(() => { mePromise = null; });
  return mePromise;
}

// Élection d'un onglet notifiant : le verrou est gardé tant que l'onglet vit, puis passe au suivant.
// Sans Web Locks, chaque onglet notifie.
function electNotifier() {
  const lead = () => {
    state.notifier = true;
    notifyProblems();
  };
  if (!navigator.locks) {
    lead();
    return;
  }
  navigator.locks.request(NOTIFIER_LOCK, () => {
    lead();
    return new Promise(() => { /* gardé jusqu'à la fermeture de l'onglet */ });
  });
}

// ---------- Filtres ----------

function populateFilterOptions() {
  rememberPeopleNames();
  const people = key => {
    const map = new Map();
    for (const mr of viewMrs()) {
      for (const u of [].concat(mr[key] || [])) if (u) map.set(u.username, u.name);
    }
    return [...map].sort((a, b) => a[1].localeCompare(b[1], locale()));
  };
  fillPeopleFilter("author", t("filter.anyAuthor"), people("author"));
  fillPeopleFilter("reviewer", t("filter.anyReviewer"), people("reviewers"));
  fillPeopleFilter("assignee", t("filter.anyAssignee"), people("assignees"));
  const targets = [...new Set(viewMrs().map(mr => mr.target_branch).concat(state.filters.target ? [state.filters.target] : []))].sort();
  fillSelect("target", t("filter.anyTarget"), targets.map(target => [target, "→ " + target]));
  const labels = [...new Set(viewMrs().flatMap(mr => mr.labels))].sort((a, b) => a.localeCompare(b, locale()));
  fillSelect("label", t("filter.addLabel"), labels.filter(l => !state.filters.labels.includes(l)).map(l => [l, l]));
  $("label").value = "";
}

const PEOPLE_FILTERS = ["author", "reviewer", "assignee"];
// Personnes proposées par chaque filtre, [username, nom], et son libellé « tous ».
const peopleFilters = {};

// Une personne filtrée absente des MR affichées (lien partagé, autre vue, aucune MR ouverte) reste proposée,
// sous son nom s'il est connu, demandé à GitLab sinon, et sous son username en attendant.
function fillPeopleFilter(
  id,
  placeholder,
  people
) {
  const current = state.filters[id];
  const absent = current && !people.some(([username]) => username === current);
  if (absent && !peopleNames.has(current)) lookUpPersonName(current);
  peopleFilters[id] = {
    placeholder,
    people: absent ? [...people, [current, peopleNames.get(current) ?? current]] : people,
  };
  renderPeopleFilter(id);
}

// Noms des personnes déjà vues, par username, retenus dans le navigateur : ouvertes ou mergées, auteurs,
// relecteurs ou assignés.
const PEOPLE_NAMES_KEY = "mr-dashboard.peopleNames";
const peopleNames = readPeopleNames();
const peopleNameLookups = new Set();

function readPeopleNames() {
  try {
    return new Map(Object.entries(JSON.parse(localStorage.getItem(PEOPLE_NAMES_KEY)) ?? {}));
  } catch (ignored) {
    return new Map();
  }
}

function savePeopleNames() {
  try {
    localStorage.setItem(PEOPLE_NAMES_KEY, JSON.stringify(Object.fromEntries(peopleNames)));
  } catch (ignored) { /* stockage indisponible : les noms seront redemandés au prochain chargement */ }
}

function rememberPeopleNames() {
  let changed = false;
  for (const mr of [...state.mrs, ...state.merged.mrs]) {
    for (const u of [mr.author, ...(mr.reviewers ?? []), ...(mr.assignees ?? [])]) {
      if (u?.username && u.name && peopleNames.get(u.username) !== u.name) {
        peopleNames.set(u.username, u.name);
        changed = true;
      }
    }
  }
  if (changed) savePeopleNames();
}

// Une fois par username et par page : un username inconnu de GitLab reste affiché tel quel.
async function lookUpPersonName(username) {
  if (peopleNameLookups.has(username)) return;
  peopleNameLookups.add(username);
  try {
    const [user] = (await api(`/gitlab/users?${new URLSearchParams({ username })}`)).body;
    if (!user?.name) return;
    peopleNames.set(username, user.name);
    savePeopleNames();
    populateFilterOptions();
  } catch (ignored) { /* GitLab injoignable : le username reste affiché */ }
}

const personHtml = name => avatar(name) + `<span>${escapeHtml(name)}</span>`;

function renderPeopleFilter(id) {
  const filter = peopleFilters[id];
  if (!filter) return;
  const current = state.filters[id];
  const person = filter.people.find(([username]) => username === current);
  const root = document.querySelector(`[data-people="${id}"]`);
  root.querySelector("button").innerHTML = person ? personHtml(person[1]) : `<span>${escapeHtml(filter.placeholder)}</span>`;
  root.querySelector("ul").innerHTML = [["", null], ...filter.people]
    .map(([username, name]) => `<li role="option" tabindex="-1" data-value="${escapeHtml(username)}" aria-selected="${username === current}">`
      + (name === null ? `<span>${escapeHtml(filter.placeholder)}</span>` : personHtml(name)) + "</li>")
    .join("");
}

function openPeopleList(root) {
  closePeopleLists();
  root.querySelector("ul").hidden = false;
  root.querySelector("button").setAttribute("aria-expanded", "true");
  (root.querySelector('li[aria-selected="true"]') ?? root.querySelector("li"))?.focus();
}

function closePeopleLists() {
  for (const root of document.querySelectorAll(".people-filter")) {
    root.querySelector("ul").hidden = true;
    root.querySelector("button").setAttribute("aria-expanded", "false");
  }
}

function choosePerson(li) {
  const root = li.closest(".people-filter");
  closePeopleLists();
  root.querySelector("button").focus();
  updateFilters({ [root.dataset.people]: li.dataset.value });
}

const avatar = name => `<span class="avatar" data-name="${escapeHtml(name)}" style="--avatar-color:${Avatars.color(name)}" aria-hidden="true">${escapeHtml(Avatars.initials(name))}</span>`;

function fillSelect(id, placeholder, options) {
  const select = $(id);
  const current = id === "label" ? "" : state.filters[id];
  select.innerHTML = `<option value="">${escapeHtml(placeholder)}</option>` +
    options.map(([value, text]) => `<option value="${escapeHtml(value)}">${escapeHtml(text)}</option>`).join("");
  if (current && !options.some(([value]) => value === current)) {
    select.insertAdjacentHTML("beforeend", `<option value="${escapeHtml(current)}">${escapeHtml(current)}</option>`);
  }
  select.value = current;
}

// Les MR mergées ne sont plus ni en Draft ni en alerte, et ne s'actualisent pas d'elles-mêmes.
function syncControlsFromState() {
  const f = state.filters;
  const merged = mergedView();
  for (const el of document.querySelectorAll("[data-view]")) el.setAttribute("aria-pressed", String(el.dataset.view === f.view));
  $("period").hidden = !merged;
  $("period").value = f.period;
  $("draft").hidden = merged;
  $("alerts-control").hidden = merged;
  $("autoRefresh-control").hidden = merged;
  $("q").value = f.q;
  $("draft").value = f.draft;
  $("alerts").checked = f.alerts;
  PEOPLE_FILTERS.forEach(renderPeopleFilter);
  $("reset-filters").disabled = !filtersActive();
  $("activeLabels").innerHTML = f.labels
    .map(l => `<button type="button" class="label" data-remove-label="${escapeHtml(l)}" title="${escapeHtml(t("label.remove"))}">${escapeHtml(l)}</button>`)
    .join("");
}

function matches(mr) {
  const f = state.filters;
  if (f.target && mr.target_branch !== f.target) return false;
  if (f.author && mr.author?.username !== f.author) return false;
  if (f.reviewer && !mr.reviewers?.some(u => u.username === f.reviewer)) return false;
  if (f.assignee && !mr.assignees?.some(u => u.username === f.assignee)) return false;
  const merged = mergedView();
  if (!merged && f.draft === "yes" && !mr.draft) return false;
  if (!merged && f.draft === "no" && mr.draft) return false;
  if (f.labels.some(l => !mr.labels.includes(l))) return false;
  if (!merged && f.alerts && alertScore(mr) === 0) return false;
  if (f.q && !matchesQuery(mr, f.q)) return false;
  return true;
}

// Virgule = ou, espace = et ; « !249 » vise la MR 249 seule, « 249 » cherche partout.
function matchesQuery(mr, q) {
  const haystack = `${mr.title} ${mr.source_branch} ${mr.author?.name ?? ""} ${mr.labels.join(" ")}`.toLowerCase();
  const matchesTerm = term => /^!\d+$/.test(term) ? term === `!${mr.iid}` : `!${mr.iid} ${haystack}`.includes(term);
  const alternatives = q.toLowerCase().split(",")
    .map(alternative => alternative.split(/\s+/).filter(Boolean))
    .filter(terms => terms.length);
  return !alternatives.length || alternatives.some(terms => terms.every(matchesTerm));
}

// ---------- Rendu ----------

function render() {
  renderBranchPipeline();
  syncControlsFromState();
  renderHeaders();
  const columns = shownColumns();
  const mrs = viewMrs();
  const visible = mrs.filter(matches).sort(tableComparator());
  const merged = state.merged;
  const mergedLoading = mergedView() && merged.loading;
  const loadingText = t(mergedNeedsAll() ? "summary.mergedLoadingAll" : "summary.mergedLoading");
  $("summary").innerHTML = mergedView()
    ? `<span class="stat">${t("summary.merged", { n: visible.length, loaded: mrs.length, total: merged.total ?? mrs.length })}</span>` +
      (mergedLoading ? `<span class="stat loading">${escapeHtml(loadingText)}</span>` : "")
    : openSummary(visible, mrs);
  $("summary").insertAdjacentHTML("beforeend", gitlabListLink());
  const more = $("merged-more");
  more.hidden = !mergedView() || (!merged.hasMore && !merged.loading) || Boolean(merged.error);
  more.textContent = merged.loading ? loadingText : t("merged.more", { n: MERGED_PAGE_SIZE });
  $("list").innerHTML = visible.length
    ? visible.map(renderRow).join("")
    : `<tr><td class="empty" colspan="${columns.length}">${escapeHtml(t(mergedLoading ? "summary.mergedLoading" : "empty"))}</td></tr>`;
  fitTitles();
}

// Un titre trop long pour sa ligne voit sa police réduite juste assez pour y tenir, jusqu'à
// TITLE_MIN_SCALE : au-delà, le « … » de la feuille de style prend le relais.
function fitTitles() {
  for (const link of document.querySelectorAll("#list .mr-cell .title a")) {
    link.style.fontSize = "";
    if (link.scrollWidth <= link.clientWidth) continue;
    link.style.fontSize = `${Math.max(TITLE_MIN_SCALE, Math.floor(link.clientWidth / link.scrollWidth * 1000) / 1000)}em`;
  }
}

function openSummary(
  visible,
  mrs
) {
  const withAlerts = mrs.filter(mr => alertScore(mr) > 0).length;
  const loading = [...state.signals.values()].filter(s => s.loading).length;
  return `<span class="stat">${t("summary.shown", { n: visible.length, total: mrs.length })}</span>` +
    `<span class="stat${withAlerts ? " alert" : ""}">${t("summary.alerts", { n: withAlerts })}</span>` +
    (loading ? `<span class="stat loading">${t("summary.loading", { n: loading })}</span>` : "");
}

const viewMrs = () => (mergedView() ? state.merged.mrs : state.mrs);

// Liste des MR de la vue courante dans GitLab, sans les filtres du dashboard.
function gitlabListLink() {
  if (!state.config) return "";
  const view = mergedView() ? "merged" : "opened";
  const url = `${state.config.gitlabWeb}/${state.config.gitlabProject}/-/merge_requests?state=${view}`;
  return `<a class="gitlab-list" href="${escapeHtml(url)}" target="_blank" rel="noopener" title="${escapeHtml(t(`gitlabList.${view}.title`))}">${escapeHtml(t("gitlabList"))} ↗</a>`;
}

// Une valeur inconnue (signal en chargement, absent, en erreur) est toujours rangée en fin de liste,
// quel que soit le sens du tri : elle ne doit ni masquer ni passer pour un bon résultat.
function tableComparator() {
  const columns = shownColumns();
  const column = columns.find(c => c.key === state.filters.sort) ?? columns.find(c => c.key === defaultSort().key);
  return comparator(column, state.filters.dir);
}

function comparator(column, dir) {
  const sign = dir === "asc" ? 1 : -1;
  return (a, b) => {
    const va = column.value(a);
    const vb = column.value(b);
    if (va == null && vb == null) return b.updated_at.localeCompare(a.updated_at);
    if (va == null) return 1;
    if (vb == null) return -1;
    const order = typeof va === "string" ? va.localeCompare(vb, locale()) : va - vb;
    return sign * order || b.updated_at.localeCompare(a.updated_at);
  };
}

function renderHeaders() {
  const groups = shownGroups()
    .map(g => `<th colspan="${g.columns.length}" class="g-${g.key}${g.key !== "mr" ? " g-first" : ""}"><span>${g.key === "mr" ? "&nbsp;" : escapeHtml(t(`group.${g.key}`))}</span></th>`)
    .join("");
  $("headers").innerHTML = `<tr class="groups">${groups}</tr><tr class="columns">` + shownColumns().map(column => {
    const active = state.filters.sort === column.key;
    const arrow = active ? (state.filters.dir === "asc" ? "▲" : "▼") : "";
    const ariaSort = active ? ` aria-sort="${state.filters.dir === "asc" ? "ascending" : "descending"}"` : "";
    const help = has(`help.${column.key}`) ? t(`help.${column.key}`) : "";
    if (column.sortable === false) return `<th class="${groupClass(column.key)}" title="${escapeHtml(help)}"><span class="col-label">${escapeHtml(t(`col.${column.key}`))}</span></th>`;
    return `<th class="${column.num ? "num" : ""} ${groupClass(column.key)}"${ariaSort} title="${escapeHtml(help)}">` +
      `<button type="button" data-sort="${column.key}"><span class="col-label">${escapeHtml(t(`col.${column.key}`)).replace(/\n/g, "<br>")}</span><span class="arrow">${arrow}</span></button></th>`;
  }).join("") + "</tr>";
}

function renderRow(mr) {
  return `<tr${isStalled(mr) ? ' class="stalled"' : ""}>${shownColumns().map(c => `<td class="${c.cellClass ?? ""} ${groupClass(c.key)}">${c.render(mr)}</td>`).join("")}</tr>`;
}

function authorCell(mr) {
  const name = mr.author?.name ?? "?";
  const [first, ...rest] = name.trim().split(/\s+/);
  const lines = [first, rest.join(" ")].filter(Boolean).map(line => `<span>${escapeHtml(line)}</span>`).join("");
  return `<span class="author">${avatar(name)}<span class="author-name">${lines}</span></span>`;
}

function mrCell(mr) {
  const labels = mr.labels
    .map(l => `<button type="button" class="label" data-add-label="${escapeHtml(l)}" title="${escapeHtml(t("label.add"))}">${escapeHtml(l)}</button>`)
    .join("");
  const conflicts = mr.has_conflicts && mr.state !== "merged" ? " " + pill("red", t("conflicts"), t("conflicts.title"), mr.web_url) : "";
  return `<div class="title"><a href="${escapeHtml(mr.web_url)}" target="_blank" rel="noopener" title="${escapeHtml(mr.title.replace(/^Draft:\s*/i, ""))}">${escapeHtml(mr.title.replace(/^Draft:\s*/i, ""))}</a>${mr.draft ? '<span class="draft">Draft</span>' : ""}${conflicts}${stalledPill(mr)}${staleSignalsPill(mr)}${changesRequestedPill(mr)}${approvalPill(mr)}</div>
    <div class="sub" title="${escapeHtml(`${mr.source_branch} → ${mr.target_branch}`)}"><span class="iid">!${mr.iid}</span>${diffStat(mr)} · <code>${escapeHtml(mr.source_branch)}</code> → <code>${escapeHtml(mr.target_branch)}</code></div>
    ${labels ? `<div class="labels">${labels}</div>` : ""}`;
}

// Dans la sous-ligne du titre plutôt qu'en colonne : la taille de la MR n'ajoute aucune largeur au tableau.
function diffStat(mr) {
  const d = mr.diffStats;
  if (!d) return "";
  const n = value => value.toLocaleString(locale());
  const title = t("diff.title", { files: d.fileCount, additions: d.additions, deletions: d.deletions });
  return ` · <span class="diffstat" title="${escapeHtml(title)}">${escapeHtml(t("diff.files", { n: d.fileCount }))} ` +
    `<span class="add">+${n(d.additions)}</span> <span class="del">−${n(d.deletions)}</span></span>`;
}

// MR mergée : retrouvée par son merge commit, sa branche source est d'ordinaire supprimée.
function gitDiffButton(mr) {
  if (mr.state === "merged" && !mr.merge_commit_sha) return "";
  return `<button type="button" class="mr-action" data-git-diff="${mr.iid}" title="${escapeHtml(t("gitDiff.title"))}" aria-label="diff">${DIFF_ICON}</button>`;
}

// Une page, un + au-dessus d'un − : un fichier modifié.
const DIFF_ICON = `<svg viewBox="0 0 16 16" width="1.15em" height="1.15em" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">`
  + `<path d="M3.5 1.5h6l3 3v10h-9z"/><path d="M8 4.8v4M6 6.8h4" stroke="var(--green-fg)"/><path d="M6 11.5h4" stroke="var(--red-fg)"/></svg>`;

function commentsLink(mr) {
  const query = new URLSearchParams({ iid: mr.iid, lang: state.lang });
  return `<a class="mr-action" href="comments.html?${query}" target="_blank" data-tab="comments" data-iid="${mr.iid}" title="${escapeHtml(t("comments.title"))}">🗨</a>`;
}

function openGitDiff(mr) {
  const query = new URLSearchParams({
    iid: mr.iid,
    title: mr.title.replace(/^Draft:\s*/i, ""),
    branch: mr.source_branch,
    target: mr.target_branch,
    url: mr.web_url,
    author: mr.author?.name ?? "",
    lang: state.lang,
  });
  if (mr.state === "merged") {
    query.set("head", mr.sha);
    query.set("merge", mr.merge_commit_sha);
  }
  MrTabs.open(`diff.html?${query}`, "diff", mr.iid);
}

// ---------- Fetch du dépôt local ----------

// Fetch à la demande, ou dès qu'une MR a reçu des commits, est apparue ou a disparu, ou que la branche
// du pipeline a avancé : la copie locale suit GitLab au plus près, et reste utilisable s'il tombe.
const gitFetchEnabled = () => state.configLoaded && state.config?.gitFetchIntervalS !== undefined;

const gitFetchIntervalText = (before, after) => {
  const seconds = state.config?.gitFetchIntervalS;
  return seconds > 0 ? `${before}${Math.round(seconds / 60)}${after}` : "";
};

// Suspendu, le fetch automatique l'est pour le serveur, donc pour tous les onglets : la page lit son
// état au lieu de le garder dans le navigateur.
function fetchIfRepoChanged() {
  if (!gitFetchEnabled() || state.gitFetch.status?.auto === false) return;
  const seen = [...state.mrs.map(mr => `${mr.iid}:${mr.sha}`).sort(), state.branchPipeline?.sha ?? ""].join(" ");
  if (seen === state.gitFetch.seen) return;
  state.gitFetch.seen = seen;
  gitFetch(seen);
}

// Avec l'état des MR, le serveur ne fetch que s'il diffère du dernier qu'on lui a signalé : une page
// rechargée ou un autre onglet ne relance pas de fetch. Sans, le fetch part toujours (bouton).
async function gitFetch(signature) {
  state.gitFetch.running = true;
  renderGitFetch();
  try {
    state.gitFetch.status = (await api("/git/fetch", {
      method: "POST",
      headers: { "X-MR-Dashboard": "1", "Content-Type": "application/json" },
      body: JSON.stringify(signature === undefined ? {} : { signature }),
    })).body;
  } catch (error) {
    state.gitFetch.status = { last: { at: new Date().toISOString(), ok: false, message: error.message }, lastSuccess: state.gitFetch.status?.lastSuccess };
  } finally {
    state.gitFetch.running = false;
    renderGitFetch();
  }
}

async function setGitFetchAuto(enabled) {
  try {
    state.gitFetch.status = (await api("/git/auto", {
      method: "POST",
      headers: { "X-MR-Dashboard": "1", "Content-Type": "application/json" },
      body: JSON.stringify({ enabled }),
    })).body;
  } catch (error) {
    alert(error.message);
  }
  renderGitFetch();
}

// Le serveur fetch aussi de lui-même à intervalle régulier : son état est relu pour le montrer.
async function loadGitFetchStatus() {
  if (!gitFetchEnabled() || state.gitFetch.running) return;
  try {
    state.gitFetch.status = (await api("/git/status")).body;
    renderGitFetch();
  } catch (error) {
    console.error("Lecture de l'état du fetch impossible :", error);
  }
}
