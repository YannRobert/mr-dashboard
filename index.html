const has = key => key in I18N[state.lang] || key in I18N.fr;

function t(key, params = {}) {
  const entry = I18N[state.lang][key] ?? I18N.fr[key];
  if (entry === undefined) return key;
  return typeof entry === "function" ? entry(params) : entry;
}

const locale = () => LOCALES[state.lang];

function browserLang() {
  return (navigator.language || "").toLowerCase().startsWith("fr") ? "fr" : "en";
}

function readLangFromUrl() {
  const lang = new URLSearchParams(location.search).get("lang");
  return LANGS.includes(lang) ? lang : browserLang();
}

function applyStaticTexts() {
  document.documentElement.lang = state.lang;
  document.title = t("page.title");
  for (const el of document.querySelectorAll("[data-i18n]")) el.textContent = t(el.dataset.i18n);
  for (const el of document.querySelectorAll("[data-i18n-placeholder]")) el.placeholder = t(el.dataset.i18nPlaceholder);
  for (const el of document.querySelectorAll("[data-i18n-aria-label]")) el.setAttribute("aria-label", t(el.dataset.i18nAriaLabel));
  for (const el of document.querySelectorAll("[data-i18n-title]")) el.title = t(el.dataset.i18nTitle);
  for (const el of document.querySelectorAll("[data-lang]")) el.setAttribute("aria-pressed", String(el.dataset.lang === state.lang));
}

// Âge des données, progression d'une mise à jour en cours, dernier échec, et bouton d'affichage
// d'une mise à jour terminée pendant que la page était affichée.
function renderStatus() {
  const time = date => date.toLocaleTimeString(locale(), { hour: "2-digit", minute: "2-digit" });
  const parts = [];
  const at = state.refreshedAt;
  if (at) {
    // Deux lignes à coupure fixe : laissé au retour à la ligne automatique, le texte se coupait à un
    // endroit différent selon la largeur de l'en-tête.
    parts.push(`<span>${escapeHtml(t("refreshed.time", { time: time(at) }))}</span>`);
    parts.push(`<span>${escapeHtml(t("refreshed.date", { date: at.toLocaleDateString(locale()), age: compactDuration(Date.now() - at) }))}</span>`);
  }
  // Progression et échec partagent la troisième ligne : l'échec précédent est remplacé par la
  // progression le temps de la nouvelle tentative, qui dira s'il persiste.
  if (state.progress) parts.push(`<span class="progress">${escapeHtml(t("progress", state.progress))}</span>`);
  else if (state.lastFailure) {
    parts.push(`<span class="failed" title="${escapeHtml(state.lastFailure.message)}">${escapeHtml(t("failed", { time: time(state.lastFailure.at) }))}</span>`);
  }
  $("refreshed").innerHTML = parts.join("");
}

// Les signaux gardent une raison et ses paramètres, pas un texte : changer de langue re-rend tout
// sans recharger.
function setLang(lang) {
  if (lang === state.lang) return;
  state.lang = lang;
  writeFiltersToUrl();
  applyStaticTexts();
  renderStatus();
  populateFilterOptions();
  render();
}

function readFiltersFromUrl() {
  const p = new URLSearchParams(location.search);
  return {
    q: p.get("q") || "",
    target: p.has("target") ? p.get("target") : "develop",
    author: p.get("author") || "",
    reviewer: p.get("reviewer") || "",
    assignee: p.get("assignee") || "",
    labels: (p.get("labels") || "").split(",").filter(Boolean),
    draft: p.get("draft") || "",
    sort: COLUMNS.some(c => c.key === p.get("sort")) ? p.get("sort") : DEFAULT_SORT.key,
    dir: p.get("dir") === "asc" || p.get("dir") === "desc" ? p.get("dir") : DEFAULT_SORT.dir,
    alerts: p.get("alerts") === "1",
  };
}

function writeFiltersToUrl() {
  const f = state.filters;
  const p = new URLSearchParams();
  if (f.q) p.set("q", f.q);
  if (f.target !== "develop") p.set("target", f.target);
  if (f.author) p.set("author", f.author);
  if (f.reviewer) p.set("reviewer", f.reviewer);
  if (f.assignee) p.set("assignee", f.assignee);
  if (f.labels.length) p.set("labels", f.labels.join(","));
  if (f.draft) p.set("draft", f.draft);
  if (f.sort !== DEFAULT_SORT.key || f.dir !== DEFAULT_SORT.dir) {
    p.set("sort", f.sort);
    p.set("dir", f.dir);
  }
  if (f.alerts) p.set("alerts", "1");
  if (state.lang !== browserLang()) p.set("lang", state.lang);
  const query = p.toString();
  history.replaceState(null, "", query ? "?" + query : location.pathname);
}

async function api(
  path,
  init
) {
  const response = await fetch(
    path,
    init
  );
  if (!response.ok) {
    let message = response.statusText;
    try {
      const body = await response.json();
      message = body.message || body.errors?.map(e => e.msg).join(", ") || message;
    } catch (ignored) { /* corps non JSON */ }
    const error = new Error(`${response.status} ${message}`);
    error.status = response.status;
    throw error;
  }
  return { body: await response.json(), headers: response.headers };
}

async function gitlabAll(path) {
  const results = [];
  let page = "1";
  while (page) {
    const separator = path.includes("?") ? "&" : "?";
    const { body, headers } = await api(`/gitlab/${path}${separator}per_page=100&page=${page}`);
    results.push(...body);
    page = headers.get("X-Next-Page");
  }
  return results;
}

const projectPath = () => `projects/${encodeURIComponent(state.config.gitlabProject)}`;

// ---------- Chargement ----------

// Le premier chargement s'affiche au fil de l'eau : il n'y a rien d'autre à montrer. Les suivants
// chargent un instantané complet à part, sans toucher au tableau, puis le substituent d'un bloc.
async function refresh() {
  if (state.refreshing) return;
  const initial = !state.refreshedAt;
  const snapshot = { at: new Date(), errors: [], initial };
  const report = message => (initial ? showError(message) : snapshot.errors.push(message));
  state.refreshing = true;
  $("refresh").disabled = true;
  if (initial) $("errors").innerHTML = "";
  try {
    state.config ??= (await api("/config")).body;
    $("project").textContent = state.config.gitlabProject;
    const [mrs, diffStats] = await Promise.all([
      gitlabAll(`${projectPath()}/merge_requests?state=opened`),
      loadDiffStats(report),
      loadSonarPullRequests(report),
    ]);
    for (const mr of mrs) mr.diffStats = diffStats.get(String(mr.iid));
    snapshot.mrs = mrs;
    snapshot.signals = new Map(mrs.map(mr => [mr.iid, { loading: true }]));
    if (initial) {
      state.mrs = snapshot.mrs;
      state.signals = snapshot.signals;
      populateFilterOptions();
      render();
    }
    state.progress = { done: 0, total: mrs.length };
    renderStatus();
    await runLimited(mrs, MAX_PARALLEL_MRS, async mr => {
      snapshot.signals.set(mr.iid, await loadSignals(mr));
      state.progress.done++;
      if (initial) render();
      renderStatus();
    });
    state.lastFailure = null;
    applySnapshot(snapshot);
    saveSnapshot(snapshot);
  } catch (error) {
    if (initial) showError(t("error.load", { message: error.message }));
    else state.lastFailure = { at: new Date(), message: error.message };
  } finally {
    state.refreshing = false;
    state.progress = null;
    state.cycleStart = snapshot.at;
    $("refresh").disabled = false;
    renderStatus();
    scheduleAutoRefresh();
  }
}

function applySnapshot(snapshot) {
  state.mrs = snapshot.mrs;
  state.signals = snapshot.signals;
  state.refreshedAt = snapshot.at;
  if (!snapshot.initial) {
    $("errors").innerHTML = "";
    snapshot.errors.forEach(showError);
  }
  populateFilterOptions();
  render();
  renderStatus();
  notifyProblems();
}

// Sauvegarde best effort : stockage plein ou bloqué ⇒ on retire l'ancienne plutôt que de rejouer plus tard
// des données plus vieilles que nécessaire.
function saveSnapshot(snapshot) {
  try {
    localStorage.setItem(SNAPSHOT_KEY, JSON.stringify({
      version: SNAPSHOT_VERSION,
      at: snapshot.at.toISOString(),
      mrs: snapshot.mrs,
      signals: [...snapshot.signals],
    }));
  } catch (ignored) {
    forgetSnapshot();
  }
}

function readSnapshot() {
  try {
    const saved = JSON.parse(localStorage.getItem(SNAPSHOT_KEY));
    if (saved?.version !== SNAPSHOT_VERSION) return null;
    return { at: new Date(saved.at), mrs: saved.mrs, signals: new Map(saved.signals), errors: [] };
  } catch (ignored) {
    forgetSnapshot();
    return null;
  }
}

function forgetSnapshot() {
  try {
    localStorage.removeItem(SNAPSHOT_KEY);
  } catch (ignored) { /* stockage indisponible : rien à retirer */ }
}

// Mise à jour mutualisée entre onglets : sous le verrou, un onglet qui trouve une sauvegarde plus récente
// que ce qu'il affiche (faite par un autre onglet pendant qu'il attendait) la reprend au lieu d'interroger
// GitLab ; une échéance automatique que la mise à jour d'un autre onglet a repoussée est replanifiée.
// Le bouton « Rafraîchir » n'y passe pas : il interroge toujours.
async function sharedRefresh({ onlyIfDue = false } = {}) {
  const run = async () => {
    if (adoptNewerSnapshot()) return;
    if (onlyIfDue && !refreshDue()) {
      scheduleAutoRefresh();
      return;
    }
    await refresh();
  };
  if (navigator.locks) await navigator.locks.request(REFRESH_LOCK, run);
  else await run();
}

// Marge d'une seconde : un minuteur peut se déclencher un rien avant l'échéance calculée.
function refreshDue() {
  return !state.cycleStart || Date.now() >= state.cycleStart.getTime() + AUTO_REFRESH_MS - 1000;
}

// Reprend la sauvegarde si elle est plus récente que les données affichées, et recale le cycle
// d'actualisation dessus : tous les onglets suivent ainsi la dernière mise à jour, d'où qu'elle vienne.
function adoptNewerSnapshot() {
  const saved = readSnapshot();
  if (!saved || (state.refreshedAt && saved.at <= state.refreshedAt)) return false;
  applySnapshot(saved);
  state.cycleStart = saved.at;
  scheduleAutoRefresh();
  return true;
}

function readAutoRefresh() {
  try {
    return localStorage.getItem(AUTO_REFRESH_KEY) !== "false";
  } catch (ignored) {
    return true;
  }
}

function saveAutoRefresh(enabled) {
  try {
    localStorage.setItem(AUTO_REFRESH_KEY, String(enabled));
  } catch (ignored) { /* stockage indisponible : la préférence vaut pour la session */ }
}

// Prochaine actualisation auto = début de la dernière + AUTO_REFRESH_MS : un « Rafraîchir » manuel relance le cycle.
function scheduleAutoRefresh() {
  clearTimeout(state.autoRefreshTimer);
  state.autoRefreshTimer = state.autoRefresh && state.cycleStart
    ? setTimeout(() => sharedRefresh({ onlyIfDue: true }), Math.max(0, state.cycleStart.getTime() + AUTO_REFRESH_MS - Date.now()))
    : null;
  renderFreshness();
}

// Recréer les segments relance leurs animations ; le délai négatif les place au temps déjà écoulé.
// Le segment le plus à droite s'éteint au bout d'une minute, le plus à gauche à l'actualisation.
function renderFreshness() {
  const bar = $("freshness");
  bar.hidden = !state.autoRefresh || !state.cycleStart;
  if (bar.hidden) return;
  const elapsed = Math.min(Date.now() - state.cycleStart, AUTO_REFRESH_MS);
  bar.style.setProperty("--cycle", `${AUTO_REFRESH_MS}ms`);
  bar.style.setProperty("--delay", `${-elapsed}ms`);
  bar.innerHTML = Array.from(
    { length: FRESHNESS_SEGMENTS },
    (_, i) => `<i style="--off:${AUTO_REFRESH_MS * (FRESHNESS_SEGMENTS - i) / FRESHNESS_SEGMENTS}ms"></i>`
  ).join("");
}

// Taille de chaque MR ouverte : l'API REST ne donne que le nombre de fichiers, GraphQL donne aussi
// les lignes ajoutées et supprimées, pour toutes les MR en une requête par page de 100.
async function loadDiffStats(report) {
  const stats = new Map();
  const query = `query($project: ID!, $after: String) {
    project(fullPath: $project) {
      mergeRequests(state: opened, first: 100, after: $after) {
        pageInfo { hasNextPage endCursor }
        nodes { iid diffStatsSummary { additions deletions fileCount } }
      }
    }
  }`;
  try {
    let after = null;
    do {
      const variables = JSON.stringify({ project: state.config.gitlabProject, after });
      const { body } = await api(`/graphql?query=${encodeURIComponent(query)}&variables=${encodeURIComponent(variables)}`);
      if (body.errors?.length) throw new Error(body.errors.map(e => e.message).join(", "));
      const page = body.data.project.mergeRequests;
      for (const mr of page.nodes) stats.set(mr.iid, mr.diffStatsSummary);
      after = page.pageInfo.hasNextPage ? page.pageInfo.endCursor : null;
    } while (after);
  } catch (error) {
    report(t("error.diffStats", { message: error.message }));
  }
  return stats;
}

async function loadSonarPullRequests(report) {
  state.sonarPullRequests = new Map();
  if (!state.config.sonarEnabled) return;
  try {
    const { body } = await api(`/sonar/project_pull_requests/list?project=${encodeURIComponent(state.config.sonarProject)}`);
    for (const pr of body.pullRequests) state.sonarPullRequests.set(pr.key, pr);
    const retention = await api(`/sonar/settings/values?keys=${RETENTION_SETTING}&component=${encodeURIComponent(state.config.sonarProject)}`);
    state.sonarRetentionDays = Number(retention.body.settings[0]?.value) || DEFAULT_SONAR_RETENTION_DAYS;
  } catch (error) {
    report(t("error.sonar", { message: error.message }));
  }
}

async function runLimited(items, limit, task) {
  const queue = [...items];
  const workers = Array.from({ length: Math.min(limit, queue.length) }, async () => {
    while (queue.length) await task(queue.shift());
  });
  await Promise.all(workers);
}

async function loadSignals(mr) {
  const signals = {};
  // Les discussions portent toutes les notes : elles servent aux threads et à la note PIT.
  const discussions = gitlabAll(`${projectPath()}/merge_requests/${mr.iid}/discussions`);
  [signals.commits, signals.threads, signals.approvals] = await Promise.all([loadCommits(mr), loadThreads(discussions), loadApprovals(mr)]);
  try {
    const detail = (await api(`/gitlab/${projectPath()}/merge_requests/${mr.iid}?include_diverged_commits_count=true`)).body;
    signals.pipeline = detail.head_pipeline;
    const [behind, jobs, pitNote] = await Promise.all([
      loadBehind(mr, detail.diverged_commits_count),
      signals.pipeline
        ? gitlabAll(`${projectPath()}/pipelines/${signals.pipeline.id}/jobs?include_retried=false`)
        : Promise.resolve([]),
      discussions.then(latestPitNote),
    ]);
    signals.behind = behind;
    const job = name => jobs.filter(j => j.name === name).sort((a, b) => b.id - a.id)[0];
    signals.pit = pitSignal(job(state.config.pitJob), pitNote, mr);
    signals.sonar = await sonarSignal(job(state.config.sonarJob), mr);
  } catch (error) {
    signals.error = error.message;
  }
  return signals;
}

// Date du dernier commit = committed_date le plus récent, et non l'updated_at de la MR, que GitLab
// bouge aussi sur un commentaire, un label ou une approbation.
// Un thread = une discussion résoluble (commentaire de revue, diff note) ; les notes système et
// les commentaires simples non résolubles ne comptent pas, comme dans le compteur de GitLab.
async function loadThreads(discussionsLoading) {
  try {
    const discussions = await discussionsLoading;
    const resolvable = discussions.filter(d => d.notes.some(n => n.resolvable));
    const unresolved = resolvable.filter(d => d.notes.some(n => n.resolvable && !n.resolved));
    return { total: resolvable.length, unresolved: unresolved.length };
  } catch (error) {
    return { error: error.message };
  }
}

// Note PIT la plus récemment mise à jour, comme le faisait la lecture des notes triées par updated_at.
function latestPitNote(discussions) {
  return discussions
    .flatMap(d => d.notes)
    .filter(n => n.body.startsWith(state.config.pitMarker))
    .sort((a, b) => b.updated_at.localeCompare(a.updated_at))[0];
}

// Le retard court depuis que la cible a bougé après le dernier commit commun : c'est la date de son
// successeur sur l'historique first-parent de la cible (le commit de merge, pour une MR mergée), et non
// celle du plus ancien commit manquant — un commit de feature mergé plus tard garde sa date d'origine.
async function loadBehind(mr, count) {
  if (count == null) return { error: t("error.behindCount") };
  if (count === 0) return { count, since: null };
  try {
    const refs = [mr.sha, mr.target_branch].map(ref => `refs%5B%5D=${encodeURIComponent(ref)}`).join("&");
    const base = (await api(`/gitlab/${projectPath()}/repository/merge_base?${refs}`)).body;
    const commits = await gitlabAll(
      `${projectPath()}/repository/commits?ref_name=${encodeURIComponent(mr.target_branch)}` +
      `&first_parent=true&since=${encodeURIComponent(base.committed_date)}`
    );
    const next = commits.find(c => c.parent_ids[0] === base.id) ?? commits.filter(c => c.id !== base.id).at(-1);
    return { count, since: next?.committed_date ?? null, base: base.short_id, next: next?.short_id ?? null };
  } catch (error) {
    return { count, error: error.message };
  }
}

// Aucune approbation n'est exigée sur le projet : GitLab répond alors « approved: true » pour toute MR,
// même sans approbateur. Seule la liste des approbateurs dit si quelqu'un a réellement approuvé.
async function loadApprovals(mr) {
  try {
    const approvals = (await api(`/gitlab/${projectPath()}/merge_requests/${mr.iid}/approvals`)).body;
    return { names: approvals.approved_by.map(a => a.user.name) };
  } catch (error) {
    return { error: error.message };
  }
}

async function loadCommits(mr) {
  try {
    const commits = await gitlabAll(`${projectPath()}/merge_requests/${mr.iid}/commits`);
    const last = commits.map(c => c.committed_date).sort().at(-1) ?? null;
    return { count: commits.length, lastDate: last };
  } catch (error) {
    return { error: error.message };
  }
}

function pitSignal(job, note, mr) {
  const noteLink = note ? `${mr.web_url}#note_${note.id}` : mr.web_url;
  if (!job) return { state: "absent", reason: "notApplicable", link: mr.web_url };
  const running = PENDING_JOB_STATUSES.has(job.status);
  // Job en cours : la note du run précédent reste la dernière valeur connue — l'afficher, marquée
  // « en cours », plutôt que de la masquer. Sans note, il n'y a rien à montrer.
  if (running && !note) return { state: "pending", reason: "pending", info: { status: job.status }, link: job.web_url };
  if (!note) return { state: "absent", reason: "noNote", info: { status: job.status, marker: state.config.pitMarker }, link: job.web_url };
  // Seul un job en échec rend la note suspecte. Un job réussi republie la note, mais GitLab ne
  // bouge pas son updated_at si le contenu est identique : comparer les dates donnerait un faux
  // « périmé » à chaque résultat inchangé.
  if (job.status === "failed" && job.started_at && new Date(note.updated_at) < new Date(job.started_at)) {
    return { state: "stale", reason: "failed", link: job.web_url };
  }
  const counts = parsePitNote(note.body);
  if (!counts) return { state: "absent", reason: "unreadable", link: noteLink };
  return {
    state: "ok",
    ...counts,
    link: noteLink,
    jobFailed: job.status === "failed",
    refreshing: running ? refreshingOf(job, note.updated_at) : null,
  };
}

function parsePitNote(body) {
  const row = body.split("\n").find(line => /^\|\s*\d/.test(line));
  if (!row) return null;
  const cells = row.split("|").slice(1, -1).map(cell => {
    const match = cell.match(/\d+(?:[.,]\d+)?/);
    return match ? Number(match[0].replace(",", ".")) : null;
  });
  const [total, killed, survived, noCoverage, errors, strength] = cells;
  return { total, killed, survived, noCoverage, errors, strength };
}

// Sans analyse Sonar, trois situations très différentes : le pipeline n'a pas de job sonar (non
// applicable), l'analyse a été purgée par le serveur faute de push récent (expirée — relancer le
// pipeline), ou le job n'a rien produit (introuvable — à investiguer).
function missingSonarAnalysis(job, mr) {
  if (!job) return { state: "absent", reason: "notApplicable", link: mr.web_url };
  if (PENDING_JOB_STATUSES.has(job.status)) {
    return { state: "pending", reason: "pending", info: { status: job.status }, link: job.web_url };
  }
  const retentionMs = state.sonarRetentionDays * 24 * 3600 * 1000;
  if (job.status === "success" && job.finished_at && Date.now() - new Date(job.finished_at) > retentionMs) {
    return { state: "absent", reason: "expired", info: { days: state.sonarRetentionDays }, link: job.web_url };
  }
  return { state: "absent", reason: "notFound", info: { status: job.status }, link: job.web_url };
}

async function sonarSignal(job, mr) {
  if (!state.config.sonarEnabled) return { state: "disabled", reason: "disabled" };
  const base = state.config.sonarWeb;
  const id = encodeURIComponent(state.config.sonarProject);
  const links = {
    dashboard: `${base}/dashboard?id=${id}&pullRequest=${mr.iid}`,
    issues: `${base}/project/issues?id=${id}&pullRequest=${mr.iid}&resolved=false`,
    coverage: `${base}/component_measures?id=${id}&pullRequest=${mr.iid}&metric=new_coverage`,
  };
  const pr = state.sonarPullRequests.get(String(mr.iid));
  if (!pr) return missingSonarAnalysis(job, mr);
  // Job en cours : l'analyse précédente reste la dernière valeur connue, affichée et marquée
  // « en cours ». Elle est forcément antérieure au job : ce n'est pas un « périmé ».
  const running = job && PENDING_JOB_STATUSES.has(job.status);
  const stale = !running && job?.started_at && new Date(pr.analysisDate) < new Date(job.started_at);
  const project = encodeURIComponent(state.config.sonarProject);
  const [issues, measures] = await Promise.all([
    api(`/sonar/issues/search?componentKeys=${project}&pullRequest=${mr.iid}&resolved=false&ps=1`).then(r => r.body),
    api(`/sonar/measures/component?component=${project}&pullRequest=${mr.iid}&metricKeys=new_coverage,new_lines_to_cover,new_uncovered_lines,new_uncovered_conditions`).then(r => r.body),
  ]);
  const measure = key => {
    const m = measures.component.measures.find(x => x.metric === key);
    const value = m?.period?.value ?? m?.value;
    return value === undefined ? null : Number(value);
  };
  return {
    state: stale ? "stale" : "ok",
    gate: pr.status?.qualityGateStatus,
    issues: issues.total,
    coverage: measure("new_coverage"),
    linesToCover: measure("new_lines_to_cover"),
    uncoveredLines: measure("new_uncovered_lines"),
    uncoveredConditions: measure("new_uncovered_conditions"),
    analysisDate: pr.analysisDate,
    links,
    jobFailed: job?.status === "failed",
    refreshing: running ? refreshingOf(job, pr.analysisDate) : null,
  };
}

function refreshingOf(job, valuesDate) {
  return { job: job.name, status: job.status, link: job.web_url, valuesDate };
}

// ---------- Cellules de signaux ----------

// Une cellule n'affiche une pastille que s'il y a quelque chose à voir (alerte, ou signal absent /
// en cours) ; un signal propre reste en texte discret, pour que les alertes ressortent d'un coup d'œil.

function signalsOf(mr) {
  return state.signals.get(mr.iid) || {};
}

function loadingOrError(s) {
  if (s.loading) return pill("loading", "…");
  if (s.error) return pill("grey", t("unavailable"), s.error);
  return null;
}

// Libellé du badge GitLab tel quel (« Passed », « Warning », « Failed », « Blocked »…) plutôt qu'un
// vocabulaire propre au tableau de bord : c'est ce que l'on retrouve en ouvrant le pipeline.
function pipelineCell(mr) {
  const s = signalsOf(mr);
  const pending = loadingOrError(s);
  if (pending) return pending;
  if (!s.pipeline) return pill("grey", t("pipeline.none"));
  const { id, web_url: link } = s.pipeline;
  const { text, label, group } = pipelineStatus(s.pipeline);
  const title = t("pipeline.title", { id, label });
  if (group === "success") return `<a class="ok good" href="${escapeHtml(link)}" target="_blank" rel="noopener" title="${escapeHtml(title)}">${escapeHtml(text)}</a>`;
  return pill(PIPELINE_TONE[group] ?? "grey", text, title, link);
}

// head_pipeline porte detailed_status ; repli sur le statut brut s'il manquait.
function pipelineStatus(pipeline) {
  const detailed = pipeline.detailed_status;
  return detailed
    ? { text: detailed.text, label: detailed.label, group: detailed.group }
    : { text: pipeline.status, label: pipeline.status, group: pipeline.status };
}

function pitCell(mr) {
  const s = signalsOf(mr);
  const pending = loadingOrError(s);
  if (pending) return pending;
  const pit = s.pit;
  if (!pit) return "";
  if (pit.state !== "ok") return reasonPill("pit", pit);
  const detail = t("pit.detail", pit);
  const out = [];
  if (pit.survived > 0) out.push(pill("red", t("pit.survived", { n: pit.survived }), detail, pit.link));
  if (pit.noCoverage > 0) out.push(pill("orange", t("pit.noCoverage", { n: pit.noCoverage }), detail, pit.link));
  if (pit.errors > 0) out.push(pill("orange", t("pit.errors", { n: pit.errors }), detail, pit.link));
  if (pit.jobFailed) out.push(pill("orange", t("job.failed"), t("pit.jobFailed"), pit.link));
  return signalStack(pit, out, `<a class="ok good" href="${escapeHtml(pit.link)}" target="_blank" rel="noopener" title="${escapeHtml(detail)}">0</a>`);
}

// Signal inexploitable (absent, en cours, non configuré…) : sa raison, en pastille grise.
function reasonPill(kind, signal) {
  return pill("grey", t(`reason.${signal.reason}`), t(`${kind}.${signal.reason}`, signal.info), signal.link);
}

function sonarUsable(sonar) {
  return sonar && (sonar.state === "ok" || sonar.state === "stale");
}

function sonarUnusable(mr) {
  const s = signalsOf(mr);
  const pending = loadingOrError(s);
  if (pending) return pending;
  if (!s.sonar) return "";
  if (!sonarUsable(s.sonar)) return reasonPill("sonar", s.sonar);
  return null;
}

function issuesCell(mr) {
  const unusable = sonarUnusable(mr);
  if (unusable !== null) return unusable;
  const sonar = signalsOf(mr).sonar;
  const out = [];
  if (sonar.state === "stale") out.push(pill("grey", t("sonar.stale"), t("sonar.staleTitle", { date: formatDate(sonar.analysisDate) }), sonar.links.dashboard));
  if (sonar.issues > 0) out.push(pill("red", t("sonar.issues", { n: sonar.issues }), t("sonar.issuesTitle"), sonar.links.issues));
  if (sonar.gate && sonar.gate !== "OK") out.push(pill("red", t("sonar.gate", { gate: sonar.gate }), t("sonar.gateTitle"), sonar.links.dashboard));
  if (sonar.jobFailed) out.push(pill("orange", t("job.failed"), t("sonar.jobFailed"), sonar.links.dashboard));
  return signalStack(sonar, out, `<a class="ok good" href="${escapeHtml(sonar.links.issues)}" target="_blank" rel="noopener">0</a>`);
}

function coverageCell(mr) {
  const unusable = sonarUnusable(mr);
  if (unusable !== null) return unusable;
  const sonar = signalsOf(mr).sonar;
  if (sonar.coverage == null) return signalStack(sonar, [], `<span class="ok" title="${escapeHtml(t("coverage.none"))}">—</span>`);
  const detail = t("coverage.detail", {
    lines: sonar.linesToCover ?? "?",
    uncovered: sonar.uncoveredLines ?? "?",
    conditions: sonar.uncoveredConditions ?? "?",
  });
  if (sonar.coverage >= 100) return signalStack(sonar, [], `<a class="ok good" href="${escapeHtml(sonar.links.coverage)}" target="_blank" rel="noopener" title="${escapeHtml(detail)}">${formatPercent(100)}</a>`);
  return signalStack(sonar, [pill("orange", formatPercent(sonar.coverage), detail, sonar.links.coverage)], "");
}

function commitsCount(mr) {
  const commits = signalsOf(mr).commits;
  return commits && !commits.error ? commits.count : null;
}

function lastCommitDate(mr) {
  return signalsOf(mr).commits?.lastDate ?? null;
}

function commitAgeHours(mr) {
  const iso = lastCommitDate(mr);
  return iso ? (Date.now() - new Date(iso)) / 3600000 : null;
}

function lastCommitCell(mr) {
  const hours = commitAgeHours(mr);
  const mood = hours == null ? null
    : hours < ACTIVE_COMMIT_HOURS ? ["⚡", "commit.active"]
    : hours > IDLE_COMMIT_HOURS ? ["😴", "commit.idle"]
    : null;
  const badge = mood ? `<span class="commit-mood" title="${escapeHtml(t(mood[1]))}">${mood[0]}</span>` : "";
  return dateCell(lastCommitDate(mr), "date.lastCommit") + badge;
}

// Une action simple est attendue (correction, rebase) et personne n'a poussé depuis STALLED_ALERT_HOURS.
function isStalled(mr) {
  const hours = commitAgeHours(mr);
  return hours != null && hours > STALLED_ALERT_HOURS && alertScore(mr) > 0;
}

function stalledPill(mr) {
  return isStalled(mr) ? pill("red", t("stalled"), t("stalled.title"), mr.web_url) : "";
}

function dateCell(iso, key) {
  if (!iso) return `<span class="muted">—</span>`;
  return `<span title="${escapeHtml(t(key, { date: formatDate(iso) }))}">${relative(iso)}</span>`;
}

// Valeurs d'un run précédent pendant qu'un nouveau job tourne : préfixées d'une pastille « En cours »,
// et jamais affichées en vert — un signal propre peut encore se dégrader à la fin du job.
function refreshingPill(signal) {
  const r = signal.refreshing;
  if (!r) return "";
  return pill("grey", t("refreshing"), t("refreshing.title", { job: r.job, status: r.status, date: formatDate(r.valuesDate) }), r.link);
}

function signalStack(signal, alerts, clean) {
  const head = refreshingPill(signal);
  if (!head && !alerts.length) return clean;
  const body = alerts.length ? alerts : [head ? clean.replace(' class="ok good"', ' class="ok"') : clean];
  return `<div class="stack">${[head, ...body].join("")}</div>`;
}

function pill(tone, text, title = "", link = null) {
  const tag = link ? "a" : "span";
  const href = link ? ` href="${escapeHtml(link)}" target="_blank" rel="noopener"` : "";
  return `<${tag} class="pill ${tone}"${href} title="${escapeHtml(title)}">${escapeHtml(text)}</${tag}>`;
}

function alertScore(mr) {
  const s = state.signals.get(mr.iid) || {};
  let score = 0;
  if (mr.has_conflicts) score += 100;
  if (s.pipeline && s.pipeline.status === "failed") score += 100;
  if (s.pit?.state === "ok") score += 10 * (s.pit.survived || 0) + (s.pit.noCoverage || 0) + (s.pit.errors || 0);
  if (s.sonar?.state === "ok" || s.sonar?.state === "stale") {
    score += 10 * (s.sonar.issues || 0);
    if (s.sonar.gate && s.sonar.gate !== "OK") score += 50;
    if (s.sonar.coverage != null && s.sonar.coverage < 100) score += Math.ceil(100 - s.sonar.coverage);
  }
  return score;
}

// ---------- Notifications ----------

// Problèmes d'une MR, chacun avec une gravité : il est « nouveau » s'il n'était pas notifié ou si sa gravité
// a augmenté. Un signal inconnu (en erreur, pas encore analysé) garde les problèmes déjà notifiés pour sa
// catégorie, pour ne pas les renotifier quand il redevient lisible.
function problemsOf(mr) {
  const s = signalsOf(mr);
  const problems = [];
  const unknown = new Set();
  const add = (key, severity, text) => problems.push({ key, severity, text });
  if (mr.has_conflicts) add("conflicts", 1, t("problem.conflicts"));
  if (s.pipeline?.status === "failed") add("pipeline", 1, t("problem.pipeline", { id: s.pipeline.id }));
  if (sonarUsable(s.sonar)) {
    const sonar = s.sonar;
    if (sonar.issues > 0) add("sonar.issues", sonar.issues, t("problem.sonarIssues", { n: sonar.issues }));
    if (sonar.gate && sonar.gate !== "OK") add("sonar.gate", 1, t("problem.gate", { gate: sonar.gate }));
    if (sonar.coverage != null && sonar.coverage < 100) {
      add("sonar.coverage", Math.ceil(100 - sonar.coverage), t("problem.coverage", { value: formatPercent(sonar.coverage) }));
    }
  } else {
    unknown.add("sonar");
  }
  const pit = s.pit;
  if (pit?.state === "ok") {
    if (pit.survived > 0) add("pit.survived", pit.survived, t("problem.pitSurvived", { n: pit.survived }));
    if (pit.noCoverage > 0) add("pit.noCoverage", pit.noCoverage, t("problem.pitNoCoverage", { n: pit.noCoverage }));
    if (pit.errors > 0) add("pit.errors", pit.errors, t("problem.pitErrors", { n: pit.errors }));
  } else {
    unknown.add("pit");
  }
  if (!s.threads || s.threads.error) unknown.add("threads");
  else if (s.threads.unresolved > 0) add("threads", s.threads.unresolved, t("problem.threads", { n: s.threads.unresolved }));
  // Retard signalé comme dans la colonne : dès qu'il passe en orange.
  const behind = s.behind;
  if (behind?.count == null) {
    unknown.add("behind");
  } else if (behind.count > 0 && behind.since) {
    const hours = (Date.now() - new Date(behind.since)) / 3600000;
    if (hours > BEHIND_ORANGE_HOURS) {
      add("behind", hours > BEHIND_RED_HOURS ? 2 : 1, t("problem.behind", {
        n: behind.count,
        target: mr.target_branch,
        duration: compactDuration(Date.now() - new Date(behind.since)),
      }));
    }
  }
  return { problems, unknown };
}

// Appelée à chaque nouvelles données et toutes les REMINDER_CHECK_MS, pour les rappels sur ses propres MR.
// Le premier passage (rien de notifié jusque-là) notifie ses propres MR une par une et résume celles des
// autres en une seule notification, plutôt qu'une rafale.
function notifyProblems() {
  if (!state.notify || !state.notifier || !state.me || Notification.permission !== "granted") return;
  // Pas de données complètes encore : l'état notifié serait réécrit à vide, et tout renotifié ensuite.
  if (!state.refreshedAt) return;
  const notified = readNotified();
  const first = notified == null;
  const next = {};
  const now = Date.now();
  let othersWithProblems = 0;
  for (const mr of state.mrs) {
    const before = notified?.[mr.iid];
    if (signalsOf(mr).loading) {
      if (before) next[mr.iid] = before;
      continue;
    }
    const { problems, unknown } = problemsOf(mr);
    const severities = Object.fromEntries(problems.map(p => [p.key, p.severity]));
    for (const [key, severity] of Object.entries(before?.problems ?? {})) {
      if (unknown.has(key.split(".")[0])) severities[key] ??= severity;
    }
    if (!Object.keys(severities).length) {
      closeNotification(mr.iid);
      continue;
    }
    const own = mr.author?.username === state.me;
    const fresh = problems.some(p => !(p.severity <= (before?.problems?.[p.key] ?? 0)));
    const reminderDue = own && problems.length > 0 && (!before || now - before.at >= OWN_REMINDER_MS);
    const show = own ? fresh || reminderDue : fresh && !first;
    if (!own && fresh && first) othersWithProblems++;
    next[mr.iid] = { problems: severities, at: show ? now : before?.at ?? now };
    if (show) showNotification(
      mr,
      problems,
      own
    );
  }
  for (const iid of state.notifications.keys()) {
    if (!(iid in next)) closeNotification(iid);
  }
  saveNotified(next);
  if (othersWithProblems) {
    new Notification(t("notify.others", { n: othersWithProblems }), { body: t("notify.othersBody"), tag: "mr-others" });
  }
}

// Même tag par MR : une nouvelle notification remplace la précédente au lieu de s'empiler, et renotify la
// fait réapparaître. Celles de ses propres MR restent affichées jusqu'à ce qu'on les ferme.
function showNotification(
  mr,
  problems,
  own
) {
  const title = own
    ? t("notify.own", { iid: mr.iid, n: problems.length })
    : t("notify.other", { iid: mr.iid, author: mr.author?.name ?? "?" });
  const notification = new Notification(title, {
    body: [mr.title, ...problems.map(p => `• ${p.text}`)].join("\n"),
    tag: `mr-${mr.iid}`,
    renotify: true,
    requireInteraction: own,
  });
  notification.onclick = () => {
    window.open(mr.web_url, "_blank", "noopener");
    notification.close();
  };
  state.notifications.set(mr.iid, notification);
}

function closeNotification(iid) {
  state.notifications.get(iid)?.close();
  state.notifications.delete(iid);
}

function readNotified() {
  try {
    return JSON.parse(localStorage.getItem(NOTIFIED_KEY));
  } catch (ignored) {
    return null;
  }
}

function saveNotified(notified) {
  try {
    localStorage.setItem(NOTIFIED_KEY, JSON.stringify(notified));
  } catch (ignored) { /* stockage indisponible : les problèmes seront renotifiés au prochain chargement */ }
}

function forgetNotified() {
  try {
    localStorage.removeItem(NOTIFIED_KEY);
  } catch (ignored) { /* stockage indisponible : rien à oublier */ }
}

function readNotify() {
  try {
    return localStorage.getItem(NOTIFY_KEY) === "true";
  } catch (ignored) {
    return false;
  }
}

function saveNotify(enabled) {
  try {
    localStorage.setItem(NOTIFY_KEY, String(enabled));
  } catch (ignored) { /* stockage indisponible : la préférence vaut pour la session */ }
}

// announce : la case vient d'être cochée. Notification de confirmation, pour vérifier tout de suite que le
// navigateur et le système laissent passer les notifications, et oubli de ce qui a déjà été notifié, pour
// que tous les problèmes en cours soient renotifiés — y compris par l'onglet notifiant s'il en est un autre.
// L'oubli précède saveNotify : l'onglet notifiant relit l'état sur l'événement storage qu'elle déclenche.
async function setNotify(
  enabled,
  announce = false
) {
  if (enabled && Notification.permission !== "granted" && await Notification.requestPermission() !== "granted") {
    showError(t("notify.denied"));
    enabled = false;
  }
  state.notify = enabled;
  $("notify").checked = enabled;
  if (enabled && announce) forgetNotified();
  saveNotify(enabled);
  if (!enabled) {
    [...state.notifications.keys()].forEach(closeNotification);
    return;
  }
  if (announce) new Notification(t("notify.enabled"), { body: t("notify.enabledBody"), tag: "mr-enabled" });
  await loadMe();
  notifyProblems();
}

async function loadMe() {
  if (state.me) return;
  try {
    state.me = (await api("/gitlab/user")).body.username;
  } catch (error) {
    showError(t("notify.me", { message: error.message }));
  }
}

// Élection d'un onglet notifiant : le verrou est gardé tant que l'onglet vit, puis passe au suivant.
// Sans Web Locks, chaque onglet notifie.
function electNotifier() {
  const lead = () => {
    state.notifier = true;
    notifyProblems();
  };
  if (!navigator.locks) {
    lead();
    return;
  }
  navigator.locks.request(NOTIFIER_LOCK, () => {
    lead();
    return new Promise(() => { /* gardé jusqu'à la fermeture de l'onglet */ });
  });
}

// ---------- Filtres ----------

function populateFilterOptions() {
  const people = key => {
    const map = new Map();
    for (const mr of state.mrs) {
      for (const u of [].concat(mr[key] || [])) if (u) map.set(u.username, u.name);
    }
    return [...map].sort((a, b) => a[1].localeCompare(b[1], locale()));
  };
  fillSelect("author", t("filter.anyAuthor"), people("author"));
  fillSelect("reviewer", t("filter.anyReviewer"), people("reviewers"));
  fillSelect("assignee", t("filter.anyAssignee"), people("assignees"));
  const targets = [...new Set(state.mrs.map(mr => mr.target_branch).concat(state.filters.target ? [state.filters.target] : []))].sort();
  fillSelect("target", t("filter.anyTarget"), targets.map(target => [target, "→ " + target]));
  const labels = [...new Set(state.mrs.flatMap(mr => mr.labels))].sort((a, b) => a.localeCompare(b, locale()));
  fillSelect("label", t("filter.addLabel"), labels.filter(l => !state.filters.labels.includes(l)).map(l => [l, l]));
  $("label").value = "";
}

function fillSelect(id, placeholder, options) {
  const select = $(id);
  const current = id === "label" ? "" : state.filters[id];
  select.innerHTML = `<option value="">${escapeHtml(placeholder)}</option>` +
    options.map(([value, text]) => `<option value="${escapeHtml(value)}">${escapeHtml(text)}</option>`).join("");
  if (current && !options.some(([value]) => value === current)) {
    select.insertAdjacentHTML("beforeend", `<option value="${escapeHtml(current)}">${escapeHtml(current)}</option>`);
  }
  select.value = current;
}

function syncControlsFromState() {
  const f = state.filters;
  $("q").value = f.q;
  $("draft").value = f.draft;
  $("alerts").checked = f.alerts;
  $("activeLabels").innerHTML = f.labels
    .map(l => `<button type="button" class="label" data-remove-label="${escapeHtml(l)}" title="${escapeHtml(t("label.remove"))}">${escapeHtml(l)}</button>`)
    .join("");
}

function matches(mr) {
  const f = state.filters;
  if (f.target && mr.target_branch !== f.target) return false;
  if (f.author && mr.author?.username !== f.author) return false;
  if (f.reviewer && !mr.reviewers?.some(u => u.username === f.reviewer)) return false;
  if (f.assignee && !mr.assignees?.some(u => u.username === f.assignee)) return false;
  if (f.draft === "yes" && !mr.draft) return false;
  if (f.draft === "no" && mr.draft) return false;
  if (f.labels.some(l => !mr.labels.includes(l))) return false;
  if (f.alerts && alertScore(mr) === 0) return false;
  if (f.q) {
    const haystack = `!${mr.iid} ${mr.title} ${mr.source_branch} ${mr.author?.name ?? ""} ${mr.labels.join(" ")}`.toLowerCase();
    if (!f.q.toLowerCase().split(/\s+/).filter(Boolean).every(term => haystack.includes(term))) return false;
  }
  return true;
}

// ---------- Rendu ----------

function render() {
  syncControlsFromState();
  renderHeaders();
  const column = COLUMNS.find(c => c.key === state.filters.sort) ?? COLUMNS.find(c => c.key === DEFAULT_SORT.key);
  const visible = state.mrs.filter(matches).sort(comparator(column, state.filters.dir));
  const withAlerts = state.mrs.filter(mr => alertScore(mr) > 0).length;
  const loading = [...state.signals.values()].filter(s => s.loading).length;
  $("summary").innerHTML =
    `<span class="stat">${t("summary.shown", { n: visible.length, total: state.mrs.length })}</span>` +
    `<span class="stat${withAlerts ? " alert" : ""}">${t("summary.alerts", { n: withAlerts })}</span>` +
    (loading ? `<span class="stat loading">${t("summary.loading", { n: loading })}</span>` : "");
  $("list").innerHTML = visible.length
    ? visible.map(renderRow).join("")
    : `<tr><td class="empty" colspan="${COLUMNS.length}">${escapeHtml(t("empty"))}</td></tr>`;
}

// Une valeur inconnue (signal en chargement, absent, en erreur) est toujours rangée en fin de liste,
// quel que soit le sens du tri : elle ne doit ni masquer ni passer pour un bon résultat.
function comparator(column, dir) {
  const sign = dir === "asc" ? 1 : -1;
  return (a, b) => {
    const va = column.value(a);
    const vb = column.value(b);
    if (va == null && vb == null) return b.updated_at.localeCompare(a.updated_at);
    if (va == null) return 1;
    if (vb == null) return -1;
    const order = typeof va === "string" ? va.localeCompare(vb, locale()) : va - vb;
    return sign * order || b.updated_at.localeCompare(a.updated_at);
  };
}

function renderHeaders() {
  const groups = COLUMN_GROUPS
    .map(g => `<th colspan="${g.columns.length}" class="g-${g.key}${g.key !== "mr" ? " g-first" : ""}"><span>${g.key === "mr" ? "&nbsp;" : escapeHtml(t(`group.${g.key}`))}</span></th>`)
    .join("");
  $("headers").innerHTML = `<tr class="groups">${groups}</tr><tr class="columns">` + COLUMNS.map(column => {
    const active = state.filters.sort === column.key;
    const arrow = active ? (state.filters.dir === "asc" ? "▲" : "▼") : "";
    const ariaSort = active ? ` aria-sort="${state.filters.dir === "asc" ? "ascending" : "descending"}"` : "";
    const help = has(`help.${column.key}`) ? t(`help.${column.key}`) : "";
    return `<th class="${column.num ? "num" : ""} ${groupClass(column.key)}"${ariaSort} title="${escapeHtml(help)}">` +
      `<button type="button" data-sort="${column.key}"><span class="col-label">${escapeHtml(t(`col.${column.key}`)).replace(/\n/g, "<br>")}</span><span class="arrow">${arrow}</span></button></th>`;
  }).join("") + "</tr>";
}

function renderRow(mr) {
  return `<tr${isStalled(mr) ? ' class="stalled"' : ""}>${COLUMNS.map(c => `<td class="${c.cellClass ?? ""} ${groupClass(c.key)}">${c.render(mr)}</td>`).join("")}</tr>`;
}

function authorCell(mr) {
  const name = mr.author?.name ?? "?";
  const initials = name.split(/\s+/).map(part => part[0] ?? "").join("").slice(0, 2).toUpperCase();
  const hue = [...name].reduce((sum, char) => (sum * 31 + char.charCodeAt(0)) % 360, 7);
  return `<span class="author"><span class="avatar" style="--hue:${hue}" aria-hidden="true">${escapeHtml(initials)}</span>${escapeHtml(name)}</span>`;
}

function mrCell(mr) {
  const labels = mr.labels
    .map(l => `<button type="button" class="label" data-add-label="${escapeHtml(l)}" title="${escapeHtml(t("label.add"))}">${escapeHtml(l)}</button>`)
    .join("");
  const conflicts = mr.has_conflicts ? " " + pill("red", t("conflicts"), t("conflicts.title"), mr.web_url) : "";
  return `<div class="title-row"><div class="title">${mr.draft ? '<span class="draft">Draft</span>' : ""}<a href="${escapeHtml(mr.web_url)}" target="_blank" rel="noopener">${escapeHtml(mr.title.replace(/^Draft:\s*/i, ""))}</a>${conflicts}</div><div class="title-actions">${stalledPill(mr)}${approvalPill(mr)}${aiFixButton(mr)}</div></div>
    <div class="sub"><span class="iid">!${mr.iid}</span> · <code>${escapeHtml(mr.source_branch)}</code> → <code>${escapeHtml(mr.target_branch)}</code>${diffStat(mr)}</div>
    ${labels ? `<div class="labels">${labels}</div>` : ""}`;
}

// Dans la sous-ligne du titre plutôt qu'en colonne : la taille de la MR n'ajoute aucune largeur au tableau.
function diffStat(mr) {
  const d = mr.diffStats;
  if (!d) return "";
  const n = value => value.toLocaleString(locale());
  const title = t("diff.title", { files: d.fileCount, additions: d.additions, deletions: d.deletions });
  return ` · <span class="diffstat" title="${escapeHtml(title)}">${escapeHtml(t("diff.files", { n: d.fileCount }))} ` +
    `<span class="add">+${n(d.additions)}</span> <span class="del">−${n(d.deletions)}</span></span>`;
}

// ---------- Prompt de correction ----------

// Le bouton n'apparaît que s'il y a quelque chose à corriger : une branche en retard ou en conflit, un
// indicateur qualité imparfait ou un thread non résolu. Le prompt ne cite que ce qui l'est, avec les
// valeurs affichées dans le tableau.
function aiFixButton(mr) {
  const s = signalsOf(mr);
  if (s.loading) return "";
  const outdated = mr.has_conflicts || s.behind?.count > 0;
  if (!outdated && !qualityDefects(s).length && !(s.threads?.unresolved > 0)) return "";
  return `<button type="button" class="ai-fix" data-ai-fix="${mr.iid}" title="${escapeHtml(t("aiFix.title"))}">${escapeHtml(t("aiFix"))}</button>`;
}

// Alimente le prompt seul : en français quelle que soit la langue de l'interface, comme aiFixPrompt.
function qualityDefects(s) {
  const defects = [];
  if (s.pipeline?.status === "failed") defects.push(`le pipeline #${s.pipeline.id} est en échec`);
  if (sonarUsable(s.sonar)) {
    const sonar = s.sonar;
    if (sonar.issues > 0) defects.push(`${sonar.issues} issue${plural(sonar.issues)} Sonar ouverte${plural(sonar.issues)}`);
    if (sonar.gate && sonar.gate !== "OK") defects.push(`Quality Gate Sonar ${sonar.gate}`);
    if (sonar.coverage != null && sonar.coverage < 100) defects.push(`couverture du nouveau code à ${formatPercentFr(sonar.coverage)} (objectif 100 %)`);
  }
  const pit = s.pit;
  if (pit?.state === "ok") {
    if (pit.survived > 0) defects.push(`${pit.survived} mutant${plural(pit.survived)} PIT survivant${plural(pit.survived)}`);
    if (pit.noCoverage > 0) defects.push(`${pit.noCoverage} mutant${plural(pit.noCoverage)} PIT non couvert${plural(pit.noCoverage)}`);
    if (pit.errors > 0) defects.push(`${pit.errors} mutant${plural(pit.errors)} PIT en erreur`);
  }
  return defects;
}

function aiFixPrompt(mr) {
  const s = signalsOf(mr);
  const defects = qualityDefects(s);
  const unresolved = s.threads?.unresolved ?? 0;
  const running = s.sonar?.refreshing || s.pit?.refreshing || PENDING_JOB_STATUSES.has(s.pipeline?.status);
  const behind = s.behind?.count ?? 0;
  const parts = [`Sur la MR !${mr.iid} (\`${mr.source_branch}\` → \`${mr.target_branch}\`) :`];
  // La mise à jour passe avant tout le reste : les corrections se font sur la base à jour, et les
  // indicateurs ne sont fiables qu'une fois la cible intégrée.
  if (behind > 0 || mr.has_conflicts) {
    const late = behind > 0 ? ` (${behind} commit${plural(behind)} de retard)` : "";
    parts.push(
      `${defects.length || unresolved > 0 ? "Avant toute chose, mets" : "Mets"} à jour la branche de la MR en y mergeant \`origin/${mr.target_branch}\`${late}` +
      (mr.has_conflicts ? ", et résous les conflits que GitLab signale avec la cible." : ".")
    );
  }
  if (defects.length) {
    parts.push(
      "Corrige les indicateurs qualité actuellement imparfaits :\n" + defects.map(d => `- ${d}`).join("\n") +
      (running ? "\n(valeurs du dernier pipeline terminé : un pipeline est en cours, commence par vérifier leur état)" : "")
    );
  }
  if (unresolved > 0) {
    parts.push(
      `La MR a ${unresolved} thread${plural(unresolved)} non résolu${plural(unresolved)} : traite chacun des points ` +
      "dans la mesure du possible et du raisonnable."
    );
  }
  // Toute modification de la MR — mise à jour, correction, réponse à un thread — relance la CI et peut
  // dégrader un indicateur jusque-là parfait : la boucle de vérification vaut donc dans tous les cas.
  parts.push(
    "Une fois les modifications effectuées et poussées sur la branche de la MR, attends la fin du pipeline puis vérifie " +
    `l'état des indicateurs avec \`${state.config.signalsCommand} ${mr.iid}\`. Tant que les indicateurs ne sont pas ` +
    "parfaits (pipeline vert, 0 issue Sonar, Quality Gate OK, 100 % de couverture du nouveau code, aucun mutant " +
    "survivant, non couvert ou en erreur), effectue les corrections nécessaires."
  );
  return parts.join("\n\n");
}

function openAiFix(mr) {
  $("ai-dialog").dataset.iid = mr.iid;
  $("ai-title").textContent = t("dialog.title", { iid: mr.iid });
  $("ai-text").value = aiFixPrompt(mr);
  $("ai-copied").textContent = "";
  $("ai-orca").hidden = !state.config?.orcaEnabled;
  $("ai-orca").disabled = false;
  $("ai-dialog").showModal();
  $("ai-text").select();
}

async function copyAiPrompt() {
  const text = $("ai-text").value;
  try {
    await navigator.clipboard.writeText(text);
  } catch (ignored) {
    $("ai-text").select();
    document.execCommand("copy");
  }
  $("ai-copied").textContent = t("dialog.copied");
}

// Le serveur ouvre un onglet Orca sur le worktree principal, qui lance Claude Code avec le prompt affiché.
async function openInOrca() {
  const status = $("ai-copied");
  $("ai-orca").disabled = true;
  status.textContent = t("dialog.orca.opening");
  try {
    const { body } = await api(
      "/orca/fix",
      {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-MR-Dashboard": "1" },
        body: JSON.stringify({ iid: Number($("ai-dialog").dataset.iid), prompt: $("ai-text").value }),
      }
    );
    status.textContent = t(body.confirmed ? "dialog.orca.opened" : "dialog.orca.unconfirmed", body);
  } catch (error) {
    status.textContent = t("dialog.orca.failed", { message: error.message });
  } finally {
    $("ai-orca").disabled = false;
  }
}

function threadsCell(mr) {
  const threads = signalsOf(mr).threads;
  if (!threads) return `<span class="muted">…</span>`;
  if (threads.error) return `<span class="muted" title="${escapeHtml(threads.error)}">?</span>`;
  const text = `${threads.unresolved} / ${threads.total}`;
  const title = t("threads.title", { n: threads.unresolved, total: threads.total });
  if (threads.unresolved > 0) return pill("orange", text, title, mr.web_url);
  return `<span class="ok${threads.total ? " good" : ""}" title="${escapeHtml(title)}">${text}</span>`;
}

// Pastille à côté du titre, seulement si quelqu'un a approuvé : l'absence d'approbation est l'état
// ordinaire d'une MR en revue, elle n'a pas à occuper de place.
function approvalPill(mr) {
  const names = signalsOf(mr).approvals?.names;
  if (!names?.length) return "";
  const count = names.length;
  return pill("green", t("approved", { n: count }), t("approved.title", { names: names.join(", ") }), mr.web_url);
}

function commitsCell(mr) {
  const commits = signalsOf(mr).commits;
  if (!commits) return `<span class="muted">…</span>`;
  if (commits.error) return `<span class="muted" title="${escapeHtml(commits.error)}">?</span>`;
  return `<a href="${escapeHtml(mr.web_url)}/commits" target="_blank" rel="noopener" title="${escapeHtml(t("commits.title"))}">${commits.count}</a>`;
}

function behindCell(mr) {
  const s = signalsOf(mr);
  if (s.loading) return `<span class="muted">…</span>`;
  const behind = s.behind;
  if (!behind || behind.count == null) return `<span class="muted" title="${escapeHtml(behind?.error ?? s.error ?? "")}">?</span>`;
  if (behind.count === 0) return `<span class="ok good" title="${escapeHtml(t("behind.upToDate", { target: mr.target_branch }))}">${escapeHtml(t("behind.none"))}</span>`;
  const count = `<div title="${escapeHtml(t("behind.count", { n: behind.count, target: mr.target_branch }))}">${escapeHtml(t("behind.late", { n: behind.count }))}</div>`;
  const hours = behind.since ? (Date.now() - new Date(behind.since)) / 3600000 : 0;
  const tone = hours > BEHIND_RED_HOURS ? "late-red" : hours > BEHIND_ORANGE_HOURS ? "late-orange" : "muted";
  const since = behind.since
    ? `<div class="${tone}" title="${escapeHtml(t("behind.since", { date: formatDate(behind.since), next: behind.next, base: behind.base }))}">(${compactDuration(Date.now() - new Date(behind.since))})</div>`
    : `<div class="muted" title="${escapeHtml(behind.error ?? "")}">(?)</div>`;
  return count + since;
}

// ---------- Utilitaires ----------

// « - 4 heures » plutôt que « il y a 4 heures » : la colonne se lit plus vite sans le préfixe répété.
const durationFormat = unit => new Intl.NumberFormat(locale(), { style: "unit", unit, unitDisplay: "long" });

function relative(iso) {
  const seconds = (new Date(iso) - Date.now()) / 1000;
  const steps = [[60, "second"], [60, "minute"], [24, "hour"], [Infinity, "day"]];
  let value = seconds;
  for (const [size, unit] of steps) {
    if (Math.abs(value) < size) return `${value < 0 ? "- " : ""}${durationFormat(unit).format(Math.abs(Math.round(value)))}`;
    value /= size;
  }
}

// « < 1 min », « 20 min », « 1h20 », « 2 j 3h » (« 2 d 3h » en anglais) : plus précis que relative() à l'échelle d'une journée de retard.
function compactDuration(ms) {
  const minutes = Math.max(0, Math.floor(ms / 60000));
  if (minutes < 1) return "< 1 min";
  if (minutes < 60) return `${minutes} min`;
  const hours = Math.floor(minutes / 60);
  if (hours < 24) return `${hours}h${minutes % 60 ? String(minutes % 60).padStart(2, "0") : ""}`;
  const rest = hours % 24;
  return `${Math.floor(hours / 24)} ${t("unit.day")}${rest ? ` ${rest}h` : ""}`;
}

const formatDate = iso => new Date(iso).toLocaleString(locale(), { dateStyle: "short", timeStyle: "short" });
const formatPercent = value => (value / 100).toLocaleString(locale(), { style: "percent", maximumFractionDigits: 1 });
// Formes françaises fixes, pour le prompt et les traductions françaises.
const formatPercentFr = value => value.toLocaleString("fr-FR", { maximumFractionDigits: 1 }) + " %";
const plural = n => (n > 1 ? "s" : "");

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

function showError(message) {
  $("errors").insertAdjacentHTML("beforeend", `<div class="error-banner">${escapeHtml(message)}</div>`);
}

// ---------- Événements ----------

function updateFilters(change) {
  Object.assign(state.filters, change);
  writeFiltersToUrl();
  if ("labels" in change) populateFilterOptions();
  render();
}

$("q").addEventListener("input", e => updateFilters({ q: e.target.value }));
for (const id of ["target", "author", "reviewer", "assignee", "draft"]) {
  $(id).addEventListener("change", e => updateFilters({ [id]: e.target.value }));
}
$("alerts").addEventListener("change", e => updateFilters({ alerts: e.target.checked }));
$("label").addEventListener("change", e => {
  if (e.target.value) updateFilters({ labels: [...state.filters.labels, e.target.value] });
});
document.addEventListener("click", e => {
  const header = e.target.closest("[data-sort]");
  if (header) {
    const column = COLUMNS.find(c => c.key === header.dataset.sort);
    const dir = state.filters.sort === column.key ? (state.filters.dir === "asc" ? "desc" : "asc") : column.firstDir;
    updateFilters({ sort: column.key, dir });
    return;
  }
  const lang = e.target.closest("[data-lang]");
  if (lang) {
    setLang(lang.dataset.lang);
    return;
  }
  const aiFix = e.target.closest("[data-ai-fix]");
  if (aiFix) {
    openAiFix(state.mrs.find(mr => String(mr.iid) === aiFix.dataset.aiFix));
    return;
  }
  const add = e.target.closest("[data-add-label]");
  const remove = e.target.closest("[data-remove-label]");
  if (add && !state.filters.labels.includes(add.dataset.addLabel)) {
    updateFilters({ labels: [...state.filters.labels, add.dataset.addLabel] });
  } else if (remove) {
    updateFilters({ labels: state.filters.labels.filter(l => l !== remove.dataset.removeLabel) });
  }
});
$("refresh").addEventListener("click", () => refresh());
$("autoRefresh").addEventListener("change", e => {
  state.autoRefresh = e.target.checked;
  saveAutoRefresh(state.autoRefresh);
  scheduleAutoRefresh();
});
// N'est émis que dans les autres onglets : celui qui a sauvegardé affiche déjà ces données.
window.addEventListener("storage", e => {
  if (e.key === SNAPSHOT_KEY) adoptNewerSnapshot();
  // Suit la case cochée dans un autre onglet, sans resauvegarder ni redemander l'autorisation.
  if (e.key === NOTIFY_KEY && "Notification" in window) {
    state.notify = e.newValue === "true" && Notification.permission === "granted";
    $("notify").checked = state.notify;
    if (state.notify) loadMe().then(notifyProblems);
    else [...state.notifications.keys()].forEach(closeNotification);
  }
});
setInterval(renderStatus, 30 * 1000);
$("ai-copy").addEventListener("click", copyAiPrompt);
$("ai-orca").addEventListener("click", openInOrca);
$("ai-close").addEventListener("click", () => $("ai-dialog").close());

applyStaticTexts();
$("autoRefresh").checked = state.autoRefresh;
scheduleAutoRefresh();
if ("Notification" in window) {
  $("notify").addEventListener("change", e => setNotify(
    e.target.checked,
    true
  ));
  if (readNotify() && Notification.permission === "granted") setNotify(true);
  else if (readNotify()) showError(t("notify.denied"));
  electNotifier();
  setInterval(notifyProblems, REMINDER_CHECK_MS);
} else {
  $("notify-control").previousElementSibling.remove();
  $("notify-control").remove();
}
// Données sauvegardées : affichées tout de suite avec leur âge, puis remplacées d'un bloc par la mise à
// jour lancée derrière. Sans elles, premier chargement au fil de l'eau.
const saved = readSnapshot();
if (saved) applySnapshot(saved);
sharedRefresh();
</script>
</body>
</html>
