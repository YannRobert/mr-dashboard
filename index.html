  if (e.target.closest?.("textarea, [contenteditable], #commit-activity")) return;
  e.preventDefault();
  const step = innerHeight - document.querySelector("table.mrs").tHead.offsetHeight - PAGE_SCROLL_OVERLAP_PX;
  scrollBy({ top: e.key === "PageDown" ? step : -step });
});
window.addEventListener("scroll", maybeLoadMoreMerged, { passive: true });
window.addEventListener("resize", maybeLoadMoreMerged);
// Largeur de la colonne changée (fenêtre, zoom, taille du texte) : les titres sont réajustés. Leur
// réduction ne touche que la hauteur du tableau, qui ne relance donc rien.
let fittedTableWidth = 0;
new ResizeObserver(([entry]) => {
  if (entry.contentRect.width === fittedTableWidth) return;
  fittedTableWidth = entry.contentRect.width;
  fitTitles();
}).observe(document.querySelector("table.mrs"));
$("clear-storage").addEventListener("click", clearStorage);
$("refresh").addEventListener("click", () => (mergedView() ? loadMerged({ force: true }) : refresh()));
$("autoRefresh").addEventListener("change", e => {
  state.autoRefresh = e.target.checked;
  saveAutoRefresh(state.autoRefresh);
  scheduleAutoRefresh();
});
// N'est émis que dans les autres onglets : celui qui a sauvegardé affiche déjà ces données.
window.addEventListener("storage", e => {
  if (e.key === SNAPSHOT_KEY) adoptNewerSnapshot();
  // Suit la case cochée dans un autre onglet, sans resauvegarder ni redemander l'autorisation.
  if (e.key === NOTIFY_KEY && "Notification" in window) {
    state.notify = e.newValue === "true" && Notification.permission === "granted";
    $("notify").checked = state.notify;
    if (state.notify) loadMe().then(notifyProblems);
    else [...state.notifications.keys()].forEach(closeNotification);
  }
  if (e.key === THEME_KEY) {
    state.theme = readTheme();
    applyTheme();
  }
  if (e.key === TEXT_SCALE_KEY) applyTextScale();
});
systemDark.addEventListener("change", () => {
  state.theme = readTheme();
  applyTheme();
});
setInterval(renderStatus, 30 * 1000);
setInterval(loadGitFetchStatus, 30 * 1000);
$("git-fetch").addEventListener("click", () => gitFetch());
$("git-fetch-auto").addEventListener("change", e => setGitFetchAuto(e.target.checked));
$("ai-copy").addEventListener("click", copyAiPrompt);
$("ai-actions").addEventListener("click", e => {
  const button = e.target.closest("[data-ai-action]");
  if (!button) return;
  const mr = state.mrs.find(m => String(m.iid) === $("ai-dialog").dataset.iid);
  selectAiAction(
    mr,
    aiActionsFor(mr).find(action => action.id === button.dataset.aiAction)
  );
});
$("ai-orca").addEventListener("click", openInOrca);
$("ai-close").addEventListener("click", () => $("ai-dialog").close());

applyStaticTexts();
applyTheme();
applyTextScale();
$("autoRefresh").checked = state.autoRefresh;
scheduleAutoRefresh();
if ("Notification" in window) {
  $("notify").addEventListener("change", e => setNotify(
    e.target.checked,
    true
  ));
  if (readNotify() && Notification.permission === "granted") setNotify(true);
  else if (readNotify()) showError(t("notify.denied"));
  electNotifier();
  setInterval(notifyProblems, REMINDER_CHECK_MS);
} else {
  $("notify-control").previousElementSibling.remove();
  $("notify-control").remove();
}
// Données sauvegardées : affichées tout de suite avec leur âge, et GitLab n'est interrogé que si
// l'actualisation est due, cycle compté depuis la sauvegarde : recharger la page ne le sollicite pas.
// Sans elles, premier chargement au fil de l'eau.
// Une sauvegarde illisible par cette version de la page (forme d'une version antérieure, données
// inattendues) est jetée : elle ne doit jamais empêcher la mise à jour de partir.
const saved = readSnapshot();
if (saved) {
  try {
    applySnapshot(saved);
  } catch (error) {
    console.error("Sauvegarde du dashboard illisible, ignorée :", error);
    forgetSnapshot();
    Object.assign(state, { mrs: [], signals: new Map(), branchPipeline: undefined, refreshedAt: null });
    if (!state.configLoaded) state.config = null;
  }
}
if (state.refreshedAt) {
  state.cycleStart = state.refreshedAt;
  ensureConfig()
    .then(fetchIfRepoChanged)
    .catch(error => showError(t("error.load", { message: error.message })));
  sharedRefresh({ onlyIfDue: true });
} else sharedRefresh();
if (mergedView()) loadMerged();
</script>
</body>
</html>
