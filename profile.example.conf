# MisteR Dashboard profile, read by start.sh: copy it to ~/.config/mr-dashboard/profiles/<name>.conf
# and start it with `start.sh <name>`.
#
# A profile is a bash file; each variable becomes a server.py option. server.py has no default that
# points to a project: an empty required variable stops the startup, and the log says which one.
#
#   PORT              listening port, distinct for each profile to run them together (empty: 8765)
#   GITLAB_HOST       GitLab server URL (required)
#   GITLAB_PROJECT    GitLab project path, not encoded (required)
#   PIPELINE_BRANCH   branch whose latest pipeline is shown below the MR table (required)
#   TARGET_BRANCH     target branch filtered when the page opens (empty: all)
#   SONAR_ENABLED     true, or false for a project without SonarQube analysis: Sonar columns hidden,
#                     SONAR_HOST, SONAR_PROJECT and SONAR_JOB ignored
#   SONAR_HOST        SonarQube server URL (required if SONAR_ENABLED=true)
#   SONAR_PROJECT     SonarQube project key (required if SONAR_ENABLED=true)
#   SONAR_JOB         name of the CI job that runs the analysis (required if SONAR_ENABLED=true)
#   PIT_ENABLED       true, or false for a project without mutation testing: PIT column hidden,
#                     PIT_JOB and PIT_MARKER ignored
#   PIT_JOB           name of the CI job that posts the mutation note (required if PIT_ENABLED=true)
#   PIT_MARKER        beginning of the mutation note posted on the MR (required if PIT_ENABLED=true)
#   REPO_DIR          local git clone of the project, where Orca opens the fix session and git actions
#                     run (required)
#   GIT_FETCH_INTERVAL seconds between two automatic git fetches of REPO_DIR, 0 for none (empty: 300)

PORT=8765
GITLAB_HOST=https://gitlab.example.com
GITLAB_PROJECT=group/project
PIPELINE_BRANCH=main
TARGET_BRANCH=
SONAR_ENABLED=true
SONAR_HOST=https://sonarqube.example.com
SONAR_PROJECT=group-project
SONAR_JOB=sonar
PIT_ENABLED=false
PIT_JOB=
PIT_MARKER=
REPO_DIR=~/src/project
GIT_FETCH_INTERVAL=
