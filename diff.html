<title>Diff de MR</title>
<script>
  // Thème du dashboard et taille du texte, posés avant le premier rendu.
  try {
    const scale = Number(localStorage.getItem("mr-dashboard.textScale"));
    if (scale) document.documentElement.style.setProperty("--text-scale", scale);
    const ratio = Number(localStorage.getItem("mr-dashboard.diffTextRatio"));
    if (ratio) document.documentElement.style.setProperty("--diff-ratio", ratio);
    const theme = localStorage.getItem("mr-dashboard.theme");
    document.documentElement.dataset.theme = theme === "light" || theme === "dark" ? theme
      : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  } catch (ignored) {
    document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
</script>
<link rel="stylesheet" href="vendor/diff2html/diff2html.min.css">

<style>
  :root {
    --bg: #f3f4f7;
    --surface: #ffffff;
    --border: #e4e6ec;
    --border-strong: #d2d5de;
    --text: #1b1d24;
    --muted: #6a6f7d;
    --link: #2356c7;
    --accent: #4f46e5;
    --accent-2: #7c3aed;
    --accent-fg: #ffffff;
    --red-bg: #fdecec; --red-fg: #b42318; --red-line: #d92d20;
    --orange-bg: #fff4e0; --orange-fg: #93510a; --orange-line: #f79009;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #111217;
    --surface: #1a1c23;
    --border: #2c2f3a;
    --border-strong: #3a3e4b;
    --text: #eceef3;
    --muted: #9ba1b0;
    --link: #86a9f7;
    --accent: #818cf8;
    --accent-2: #a78bfa;
    --accent-fg: #0f1020;
    --red-bg: #3d1a1a; --red-fg: #ffb4ab; --red-line: #f97066;
    --orange-bg: #3d2a10; --orange-fg: #ffc77a; --orange-line: #fdb022;
  }
  /* Taille du texte : celle du dashboard (même base, même réglage A− / A+), multipliée par celle de la page, réglée
     par ses propres A− / A+ — 125 % par défaut, le code se lisant de plus près qu'un tableau. Sans le zoom du
     navigateur, qui vaut pour tout le site et agrandirait aussi le dashboard. */
  html { font-size: calc(clamp(13px, 0.75vw, 28px) * var(--text-scale, 1) * var(--diff-ratio, 1.25)); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 1rem/1.45 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  a { color: var(--link); }
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; flex-direction: column; gap: 0.45rem;
    padding: 0.75rem 1rem; background: var(--surface); border-bottom: 1px solid var(--border);
  }
  /* Une ligne par ensemble — titre, branches, commandes alignées à droite — pour qu'ils ne se mélangent pas au gré des retours à la ligne. */
  header .controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 0.5rem 1.4rem; }
  header h1 { margin: 0; font-size: 1.05rem; overflow-wrap: anywhere; }
  .branches { color: var(--muted); font-size: 0.9rem; overflow-wrap: anywhere; }
  .branches code { font-size: 0.85rem; }
  .format { display: flex; gap: 0; }
  button {
    font: inherit; font-size: 0.9rem; color: var(--text); background: var(--surface);
    border: 1px solid var(--border-strong); padding: 0.3em 0.8em; cursor: pointer;
  }
  .format button:first-child { border-radius: 0.5rem 0 0 0.5rem; }
  .format button:last-child { border-radius: 0 0.5rem 0.5rem 0; border-left: none; }
  .toggle { border-radius: 0.5rem; }
  a.toggle {
    display: inline-block; font-size: 0.9rem; color: var(--text); background: var(--surface); text-decoration: none;
    border: 1px solid var(--border-strong); padding: 0.3em 0.8em;
  }
  .notes-nav { display: flex; align-items: center; gap: 0.25rem; }
  /* Place gardée même masquée : afficher ‹ › ne décale pas les autres commandes. */
  .notes-nav.off { visibility: hidden; }
  .notes-nav button { border-radius: 0.5rem; padding: 0.3em 0.6em; }
  .notes-nav button:disabled { opacity: 0.4; cursor: default; }
  .notes-nav output { min-width: 4.5em; text-align: center; font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .note-thread { scroll-margin-top: calc(var(--header-height, 0px) + 3rem); }
  .note-thread.current { outline: 2px solid var(--accent); outline-offset: 1px; }
  .format button[aria-pressed="true"], .toggle[aria-pressed="true"] {
    color: var(--accent-fg); border-color: transparent; font-weight: 600;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
  }
  /* Pas de gras à l'activation : un bouton qui s'élargit décale les commandes à sa gauche. */
  .toggle[aria-pressed="true"] { font-weight: inherit; }
  main { padding: 1rem; }
  /* Liste des fichiers dans un panneau toujours visible, qui défile seul ; sa largeur se règle par son coin. */
  main.with-files { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 1rem; align-items: start; }
  /* Commits au-dessus des fichiers, dans le même panneau : chacun défile pour son compte. */
  #side {
    position: sticky; top: calc(var(--header-height, 0px) + 1rem);
    display: flex; flex-direction: column;
    height: calc(100vh - var(--header-height, 0px) - 2rem); overflow: hidden; resize: horizontal;
    width: 22rem; min-width: 12rem; max-width: 60vw;
  }
  #files {
    flex: 1 1 auto; min-height: 6rem; overflow: auto;
    background: var(--surface); border: 1px solid var(--border); border-radius: 0.5rem;
  }
  #commits {
    flex: 0 1 auto; max-height: 40%; display: flex; flex-direction: column; min-height: 0;
    background: var(--surface); border: 1px solid var(--border); border-radius: 0.5rem;
  }
  #commits[hidden], #commits[hidden] + #split { display: none; }
  /* Poignée entre commits et fichiers : glisser règle leur répartition, double-clic la rétablit. */
  #split { flex: 0 0 0.6rem; cursor: row-resize; touch-action: none; display: flex; align-items: center; justify-content: center; }
  #split::before { content: ""; width: 2.5rem; height: 3px; border-radius: 2px; background: var(--border); }
  #split:hover::before, #split.dragging::before { background: var(--accent); }
  .commits-head {
    display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap;
    padding: 0.4rem 0.6rem; border-bottom: 1px solid var(--border); font-size: 0.8rem;
  }
  .commits-head strong { margin-right: auto; }
  .commits-head button { font-size: 0.75rem; padding: 0.1em 0.5em; border-radius: 0.4rem; }
  .commits-head button[aria-pressed="true"] { color: var(--accent-fg); border-color: transparent; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
  .commits-head button:disabled { opacity: 0.4; cursor: default; }
  .commits-hint { padding: 0.25rem 0.6rem; font-size: 0.7rem; color: var(--muted); border-bottom: 1px solid var(--border); }
  .commits-warning { padding: 0.3rem 0.6rem; font-size: 0.75rem; color: var(--red-fg); background: var(--red-bg); }
  #commit-list { list-style: none; margin: 0; padding: 0; overflow: auto; min-height: 0; }
  #commit-list li {
    display: grid; grid-template-columns: 2.2em auto minmax(0, 1fr) auto; gap: 0 0.4rem; align-items: baseline;
    padding: 0.2rem 0.6rem; font-size: 0.78rem; cursor: pointer; user-select: none;
    border-left: 3px solid transparent;
  }
  #commit-list li:hover { background: color-mix(in srgb, var(--accent) 7%, transparent); }
  #commit-list li.selected { background: color-mix(in srgb, var(--accent) 16%, transparent); border-left-color: var(--accent); }
  #commit-list li.merge { color: var(--muted); font-style: italic; }
  #commit-list li.push {
    display: flex; gap: 0.4rem; padding: 0.3rem 0.6rem 0.15rem; font-size: 0.7rem; font-weight: 600;
    color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; border-top: 1px solid var(--border);
  }
  #commit-list li.push:first-child { border-top: 0; }
  #commit-list li.push:hover { color: var(--link); }
  #commit-list li.new .n { color: var(--accent); font-weight: 700; }
  #commit-list .n { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
  #commit-list .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #commit-list .a { color: var(--muted); font-size: 0.7rem; white-space: nowrap; }
  /* Pastille à peine plus haute que le texte, alignée en colonne : la couleur suffit à distinguer les auteurs. */
  #commit-list .avatar { align-self: center; font-size: 0.5rem; width: 1.9em; height: 1.9em; }
  #commit-list li.merge .avatar { opacity: 0.6; }
  #files .d2h-file-list-wrapper { margin: 0; border: none; }
  #files .d2h-file-list-header { padding: 0.4rem 0.75rem; font-size: 0.85rem; border-bottom: 1px solid var(--border); }
  #files .d2h-file-list-header { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
  .file-filter { display: flex; align-items: center; gap: 0.3rem; flex: 1 1 10rem; min-width: 0; }
  .file-filter input {
    flex: 1 1 auto; min-width: 0; padding: 0.15em 0.45em; font: 0.78rem Menlo, Consolas, monospace;
    color: var(--text); background: var(--bg); border: 1px solid var(--border-strong); border-radius: 0.35rem;
  }
  #files .d2h-file-list-line[hidden], .d2h-file-wrapper[hidden] { display: none; }
  .file-filter input.active { border: 2px solid var(--orange-line); background: var(--orange-bg); }
  /* Filtre actif : rappelé dans l'en-tête collé, visible où qu'on soit dans le diff, pour ne pas croire avoir tout relu. */
  .partial-diff {
    display: flex; align-items: center; flex-wrap: wrap; gap: 0.4rem 0.8rem; padding: 0.35rem 0.75rem;
    font-size: 0.85rem; font-weight: 600; color: var(--orange-fg); background: var(--orange-bg);
    border: 1px solid var(--orange-line); border-left-width: 4px; border-radius: 0.5rem;
  }
  .partial-diff[hidden] { display: none; }
  .partial-diff button { font-size: 0.8rem; border-radius: 0.4rem; padding: 0.15em 0.6em; }
  .file-filter button { font-size: 0.72rem; padding: 0.1em 0.5em; border-radius: 0.4rem; white-space: nowrap; }
  .file-filter button[aria-pressed="true"] { color: var(--red-fg); background: var(--red-bg); }
  #files .d2h-file-list-line { padding: 0.25rem 0.75rem; border-bottom: 1px solid var(--border); }
  #files .d2h-file-list-line.current { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  #files .d2h-file-name-wrapper { font-size: 0.78rem; min-width: 0; }
  #files .d2h-file-name { display: flex; flex-direction: column; min-width: 0; text-decoration: none; }
  #files .file-base { font-weight: 600; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
  #files .file-dir { font-size: 0.7rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
  #diff-files { min-width: 0; }
  .d2h-file-wrapper { scroll-margin-top: calc(var(--header-height, 0px) + 0.5rem); }
  @media (max-width: 900px) {
    main.with-files { display: block; }
    #side { position: static; width: auto; max-width: none; height: auto; max-height: 60vh; resize: none; margin-bottom: 1rem; }
  }
  /* Discussions GitLab sous la ligne commentée ; collées à gauche, la colonne pouvant défiler sur des lignes longues. */
  tr.note-row > td { padding: 0; background: var(--bg); }
  .note-thread {
    position: sticky; left: 0; box-sizing: border-box; max-width: min(46rem, calc(var(--note-column, 100%) - 1rem)); margin: 0.35rem 0.5rem;
    border: 1px solid var(--border-strong); border-left: 3px solid var(--accent); border-radius: 0.5rem;
    background: var(--surface); font: 0.8rem/1.4 "Inter", system-ui, sans-serif; white-space: normal; text-align: left;
  }
  .note-thread.resolved { border-left-color: var(--muted); }
  /* Non résolue : tout le cadre en rouge, visible où qu'on en soit dans une longue discussion. */
  .note-thread.unresolved { border: 2px solid var(--red-line); border-left-width: 4px; }
  .note-thread.unresolved .badge { color: var(--red-fg); background: var(--red-bg); }
  /* Commenter : un clic sur un numéro de ligne, Maj+clic pour une plage. */
  #diff-files.can-comment td.d2h-code-side-linenumber, #diff-files.can-comment td.d2h-code-linenumber { cursor: pointer; }
  #diff-files.can-comment td.d2h-code-side-linenumber:hover, #diff-files.can-comment td.d2h-code-linenumber:hover { color: var(--accent); }
  tr.note-selected > td { box-shadow: inset 0 0 0 999px color-mix(in srgb, var(--accent) 16%, transparent); }
  .note-editor {
    position: sticky; left: 0; box-sizing: border-box; max-width: min(46rem, calc(var(--note-column, 100%) - 1rem)); margin: 0.35rem 0.5rem;
    display: flex; flex-direction: column; gap: 0.4rem; padding: 0.4rem 0.6rem;
    border: 1px solid var(--border-strong); border-left: 3px solid var(--accent); border-radius: 0.5rem;
    background: var(--surface); font: 0.8rem/1.4 "Inter", system-ui, sans-serif; white-space: normal; text-align: left;
  }
  .note-editor textarea {
    box-sizing: border-box; width: 100%; min-height: 5rem; resize: vertical; padding: 0.35rem 0.5rem;
    font: 0.85rem/1.4 Menlo, Consolas, monospace; color: var(--text); background: var(--bg);
    border: 1px solid var(--border-strong); border-radius: 0.35rem;
  }
  .note-editor-actions { display: flex; align-items: center; justify-content: flex-end; gap: 0.5rem; }
  .note-editor-actions button { border-radius: 0.5rem; font-size: 0.8rem; }
  .note-editor-actions button[type="submit"] { color: var(--accent-fg); background: var(--accent); border-color: var(--accent); }
  .note-editor-actions button:disabled { opacity: 0.5; cursor: default; }
  .note-editor-error { margin-right: auto; color: var(--red-fg); overflow-wrap: anywhere; }
  .note-thread > summary { display: flex; gap: 0.5rem; align-items: baseline; padding: 0.3rem 0.6rem; cursor: pointer; color: var(--muted); }
  .note-thread > summary a { margin-left: auto; }
  .note-thread .badge { font-size: 0.7rem; font-weight: 600; padding: 0 0.4em; border-radius: 0.3rem; border: 1px solid currentColor; }
  .note { padding: 0.3rem 0.6rem; border-top: 1px solid var(--border); }
  .note-meta { color: var(--muted); font-size: 0.72rem; }
  .note-meta strong { color: var(--text); }
  .note-body { white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text); }
  .note-body code { font: 0.9em Menlo, Consolas, monospace; padding: 0 0.2em; border-radius: 0.25rem; background: var(--bg); }
  .note-body pre { margin: 0.2rem 0; padding: 0.3rem 0.5rem; border-radius: 0.35rem; background: var(--bg); white-space: pre; overflow-x: auto; }
  .note-body pre code { padding: 0; background: none; }
  tr.note-line > td:last-child { box-shadow: inset 3px 0 0 var(--accent); }
  .notes-elsewhere { margin-bottom: 1rem; background: var(--surface); border: 1px solid var(--border); border-radius: 0.5rem; }
  .notes-elsewhere > summary { padding: 0.5rem 0.75rem; cursor: pointer; font-size: 0.85rem; font-weight: 600; }
  .notes-elsewhere .note-thread { position: static; max-width: none; }
  .notes-elsewhere .note-where { padding: 0.3rem 0.6rem 0; font-size: 0.75rem; color: var(--muted); overflow-wrap: anywhere; }
  .notes-status { font-size: 0.8rem; color: var(--muted); }
  .file-notes { margin-left: 0.4rem; font-size: 0.72rem; color: var(--muted); white-space: nowrap; }
  .message { color: var(--muted); }
  .message.error { color: var(--red-fg); background: var(--red-bg); padding: 0.75rem 1rem; border-radius: 0.5rem; }
  .d2h-file-list-wrapper, .d2h-file-wrapper { border-radius: 0.5rem; }
  /* diff2html fixe ses tailles en pixels, plus petites que le dashboard : ramenées à la taille de la page. */
  .d2h-diff-table { font-size: 0.875rem; }
  .d2h-file-header { height: auto; min-height: 2.2rem; align-items: center; }
  .d2h-file-name-wrapper { font-size: 0.95rem; }
  .d2h-file-stats { font-size: 0.875rem; }
  .d2h-file-collapse { font-size: 0.8rem; }
  .d2h-tag { font-size: 0.65rem; }
  .text-size { display: flex; align-items: center; gap: 0.25rem; }
  .text-size button { border-radius: 0.5rem; padding: 0.3em 0.6em; }
  .text-size button:disabled { opacity: 0.4; cursor: default; }
  .text-size output { min-width: 3.2em; text-align: center; font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  /* Infobulle des commits : celle du navigateur, minuscule et coupée en lignes étroites, se lit mal. Ici à la taille
     du texte de la page, chaque ligne d'un tenant tant que l'écran est assez large. */
  .tip {
    position: fixed; z-index: 30; pointer-events: none; box-sizing: border-box;
    width: max-content; max-width: calc(100vw - 1rem); padding: 0.4rem 0.65rem;
    font-size: 1rem; line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere;
    color: var(--text); background: var(--surface); border: 1px solid var(--border-strong); border-radius: 0.45rem;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.18);
  }
  .tip[hidden] { display: none; }
  /* En-tête de fichier collé sous celui de la page, que le sien (stickyFileHeaders) passerait dessous. */
  .d2h-file-header { position: sticky; top: var(--header-height, 0); z-index: 2; }
</style>

<body>
<header>
  <h1 id="title"></h1>
  <span class="branches" id="branches"></span>
  <div class="controls">
    <div class="format" role="group" id="format">
      <button type="button" data-format="side-by-side" id="side-by-side"></button>
      <button type="button" data-format="line-by-line" id="line-by-line"></button>
    </div>
    <div class="text-size" role="group" id="text-size">
      <button type="button" data-text-step="-1">A−</button>
      <output id="text-scale"></output>
      <button type="button" data-text-step="1">A+</button>
    </div>
    <button type="button" class="toggle" id="notes-toggle" aria-pressed="false"></button>
    <div class="notes-nav off" id="notes-nav">
      <button type="button" data-note-step="-1">‹</button>
      <output id="note-position"></output>
      <button type="button" data-note-step="1">›</button>
    </div>
    <a class="toggle" id="comments-link" target="_blank" data-tab="comments"></a>
    <a id="gitlab" target="_blank" rel="noopener" hidden></a>
    <button type="button" class="toggle" id="close-tab" data-close-tab></button>
  </div>
  <div class="partial-diff" id="partial-diff" role="status" hidden>
    <span id="partial-diff-text"></span>
    <button type="button" id="partial-diff-clear"></button>
  </div>
</header>
<main id="diff"><p class="message" id="loading"></p></main>

<script>
  const FORMAT_KEY = "mr-dashboard.diffFormat";
  const DASHBOARD_TEXT_SCALE_KEY = "mr-dashboard.textScale";
  const TEXT_SCALE_KEY = "mr-dashboard.diffTextRatio";
  const COMMITS_SHARE_KEY = "mr-dashboard.diffCommitsShare";
  const NOTES_KEY = "mr-dashboard.diffNotes";
  const FILE_FILTERS_KEY = "mr-dashboard.diffFileFilters";
  const TEXT_SCALES = [0.8, 0.9, 1, 1.1, 1.25, 1.5, 1.75, 2, 2.5, 3];
  const DEFAULT_TEXT_SCALE = 1.25;
  const TEXTS = {
    fr: {
      title: p => `Diff de !${p.iid}`,
      branches: p => `<code>${p.branch}</code> comparée à <code>${p.target}</code>, depuis leur point de divergence`,
      mergedBranches: p => `<code>${p.branch}</code> telle que mergée dans <code>${p.target}</code>`,
      sideBySide: "Côte à côte",
      lineByLine: "Ligne à ligne",
      textSize: "Taille du texte du diff, par rapport à celle du dashboard ; sans toucher au zoom du navigateur ni donc au dashboard",
      smaller: "Texte plus petit",
      larger: "Texte plus grand",
      gitlab: "Ouvrir dans GitLab",
      close: "✕ Fermer",
      closeTitle: "Fermer cet onglet",
      closeRefused: "Le navigateur refuse de fermer un onglet qu'il n'a pas ouvert depuis le dashboard : Ctrl+W",
      loading: "Calcul du diff sur le dépôt local…",
      empty: "Aucune différence avec la branche cible.",
      failed: p => `Diff impossible : ${p}`,
      invalid: "Lien incomplet : il manque la branche ou sa cible.",
      commits: n => `${n} commit${n > 1 ? "s" : ""}`,
      all: "Tout",
      allTitle: "Tout le diff de la MR, depuis le point où elle part de sa cible",
      hint: "Clic : un commit · Maj+clic : jusqu'à ce commit",
      splitTitle: "Glisser pour répartir la hauteur entre commits et fichiers · double-clic : répartition par défaut",

      newNote: p => p.first === p.last ? `New diff note, line ${p.last}` : `New diff note, lines ${p.first} to ${p.last}`,

      openInGitlab: "GitLab",

  const params = new URLSearchParams(location.search);
  const lang = params.get("lang") in TEXTS ? params.get("lang")
    : (navigator.language || "").toLowerCase().startsWith("fr") ? "fr" : "en";
  const texts = TEXTS[lang];
  const mr = {
    iid: params.get("iid") ?? "",
    title: params.get("title") ?? "",
    branch: params.get("branch") ?? "",
    target: params.get("target") ?? "",
    url: params.get("url") ?? "",
    // MR mergée : son dernier commit et son merge commit, la branche source ayant pu disparaître.
    head: params.get("head") ?? "",
    merge: params.get("merge") ?? "",
  };
  MrTabs.claim("diff", mr.iid);
  let diffText = null;
  // Commits de la MR, du plus ancien au plus récent ; plage affichée en indices, null pour tout le diff.
  let commits = null;
  let commitsError = null;
  let range = null;
  let anchor = null;
  // Pushs de la MR, d'après ses versions GitLab : [premier, dernier] indice de commit et date.
  let pushes = [];
  // Dernier commit lu à l'ouverture de la page, pas à chaque plage affichée : sinon les nouveaux
  // cesseraient de l'être dès le premier coup d'œil. -1 : rien de lu, ou un commit qui n'est plus dans la MR.
  let seenAtOpen = -1;
  let loadSeq = 0;
  // Discussions de diff GitLab, chargées au premier affichage des commentaires ; null : pas encore.
  let discussions = null;
  // HTML des notes rendu par GitLab, par identifiant de note ; une note absente se lit en texte.
  let notesHtml = new Map();
  let gitlabWeb = "";
  let discussionsError = null;
  // Dernière version GitLab de la MR : la position d'une note encore valable est recalée sur son dernier
  // commit à chaque push, celle d'une note obsolète reste sur un commit plus ancien. Une nouvelle note
  // s'y positionne.
  let latestVersion = null;
  // Lignes à commenter : leur tableau (un côté en côte à côte), la ligne cliquée puis celle de Maj+clic,
  // et l'éditeur ouvert sous la dernière.
  let selection = null;
  // Fil de commentaire courant de la navigation ‹ ›, en indice dans l'ordre du diff ; -1 : aucun encore.
  let currentNote = -1;
  // Filtre des fichiers, gardé d'un rendu du diff à l'autre (format, plage de commits, notes).
  const fileFilter = { text: "", exclude: false };
  // Vide le filtre du diff affiché ; null tant qu'aucune liste de fichiers n'est dessinée.
  let clearFileFilter = null;
  // Hauteur des fils placés dans le diff : la ligne vide d'en face la suit (fil replié, réponse ouverte…).
  let notesObserver = null;

  function escapeHtml(text) {
    return String(text).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  }

  function readFormat() {
    try {
      return localStorage.getItem(FORMAT_KEY) === "line-by-line" ? "line-by-line" : "side-by-side";
    } catch (ignored) {
      return "side-by-side";
    }
  }

  function saveFormat(format) {
    try {
      localStorage.setItem(FORMAT_KEY, format);
    } catch (ignored) { /* stockage indisponible : le format n'est pas retenu */ }
  }

  function readTextScale() {
    try {
      const scale = Number(localStorage.getItem(TEXT_SCALE_KEY));
      return TEXT_SCALES.includes(scale) ? scale : DEFAULT_TEXT_SCALE;
    } catch (ignored) {
      return DEFAULT_TEXT_SCALE;
    }
  }

  function applyTextScale(scale) {
    document.documentElement.style.setProperty("--diff-ratio", scale);
    document.getElementById("text-scale").textContent = `${Math.round(scale * 100)} %`;
    for (const button of document.querySelectorAll("[data-text-step]")) {
      const next = TEXT_SCALES.indexOf(scale) + Number(button.dataset.textStep);
      button.disabled = next < 0 || next >= TEXT_SCALES.length;
    }
    document.documentElement.style.setProperty("--header-height", `${document.querySelector("header").offsetHeight}px`);
  }

  function changeTextScale(step) {
    const scale = TEXT_SCALES[TEXT_SCALES.indexOf(readTextScale()) + step];
    if (scale === undefined) return;
    try {
      localStorage.setItem(TEXT_SCALE_KEY, String(scale));
    } catch (ignored) { /* stockage indisponible : la taille vaut pour cet onglet seulement */ }
    applyTextScale(scale);
  }

  function showMessage(text, error) {
    document.getElementById("diff").innerHTML = `<p class="message${error ? " error" : ""}">${escapeHtml(text)}</p>`;
  }

  function render() {
    const format = readFormat();
    for (const button of document.querySelectorAll("[data-format]")) {
      button.setAttribute("aria-pressed", String(button.dataset.format === format));
    }
    if (diffText === null) return;
    selection = null;
    const main = document.getElementById("diff");
    const listScroll = document.getElementById("commit-list")?.scrollTop ?? null;
    main.innerHTML = `<aside id="side"><section id="commits" hidden></section><div id="split" role="separator" aria-orientation="horizontal" title="${escapeHtml(texts.splitTitle)}"></div><div id="files"></div></aside><div id="diff-files"></div>`;
    main.classList.add("with-files");
    clearFileFilter = null;
    showPartialDiff(null);
    renderCommits(listScroll);
    const container = document.getElementById("diff-files");
    if (!diffText.trim()) {
      container.innerHTML = `<p class="message">${escapeHtml(range ? texts.emptyRange : texts.empty)}</p>`;
      return;
    }
    const ui = new Diff2HtmlUI(
      container,
      diffText,
      {
        outputFormat: format,
        drawFileList: true,
        fileListToggle: false,
        fileContentToggle: true,
        matching: "lines",
        synchronisedScroll: true,
        stickyFileHeaders: false,
        highlight: true,
        colorScheme: document.documentElement.dataset.theme === "dark" ? "dark" : "light",
      }
    );
    ui.draw();
    ui.highlightCode();
    showFileList(container);
    if (readNotesEnabled()) placeNotes(container);
    container.classList.toggle("can-comment", canComment());
  }

  // La liste dessinée par diff2html passe dans le panneau ; chaque fichier y montre son nom, puis son répertoire.
  function showFileList(container) {
    const list = container.querySelector(".d2h-file-list-wrapper");
    if (!list) return;
    document.getElementById("files").append(list);
    const lines = new Map();
    for (const link of list.querySelectorAll("a.d2h-file-name")) {
      const path = link.textContent.trim();
      const cut = path.lastIndexOf("/") + 1;
      link.title = path;
      link.innerHTML = `<span class="file-base">${escapeHtml(path.slice(cut))}</span>`
        + (cut ? `<span class="file-dir">${escapeHtml(path.slice(0, cut))}</span>` : "");
      lines.set(link.getAttribute("href").slice(1), link.closest(".d2h-file-list-line"));
    }
    addFileFilter(list, lines);
    followCurrentFile(container, lines);
  }

  // Champ de filtre à côté du titre de la liste : n'affiche, ou cache, que les fichiers dont le chemin correspond.
  function addFileFilter(list, lines) {
    const title = list.querySelector(".d2h-file-list-title");
    if (!title) return;
    const box = document.createElement("span");
    box.className = "file-filter";
    box.innerHTML = `<input type="search" spellcheck="false" list="file-filters" placeholder="${escapeHtml(texts.filterPlaceholder)}" title="${escapeHtml(texts.filterTitle)}">`
      + `<datalist id="file-filters"></datalist><button type="button" title="${escapeHtml(texts.filterModeTitle)}"></button>`;
    title.after(box);
    const input = box.querySelector("input");
    const suggestions = box.querySelector("datalist");
    const suggest = () => {
      suggestions.innerHTML = rememberedFilters().map(f => `<option value="${escapeHtml(f.text)}"`
        + `${f.exclude ? ` label="${escapeHtml(texts.filterExcluded)}"` : ""}></option>`).join("");
    };
    // Un filtre compte comme utilisé une fois validé (Entrée, sortie du champ, choix d'une suggestion),
    // pas à chaque frappe : un début de saisie ne doit pas être retenu.
    const remember = () => {
      rememberFilter(fileFilter);
      suggest();
    };
    const mode = box.querySelector("button");
    const apply = () => {
      mode.textContent = fileFilter.exclude ? texts.filterExclude : texts.filterInclude;
      mode.setAttribute("aria-pressed", String(fileFilter.exclude));
      applyFileFilter(title, lines);
    };
    // Les fils navigables changent avec le filtre : la navigation ‹ › repart du premier.
    const change = () => {
      currentNote = -1;
      apply();
      renderNotesNav();
    };
    clearFileFilter = () => {
      input.value = fileFilter.text = "";
      change();
    };
    input.value = fileFilter.text;
    input.addEventListener("input", event => {
      fileFilter.text = input.value;
      // Suggestion choisie dans la liste : elle revient avec son mode.
      const picked = !(event instanceof InputEvent) || event.inputType === "insertReplacementText";
      const known = picked && rememberedFilters().find(f => f.text === input.value);
      if (known) fileFilter.exclude = known.exclude;
      change();
      if (known) remember();
    });
    input.addEventListener("change", remember);
    input.addEventListener("keydown", event => {
      if (event.key !== "Escape" || !input.value) return;
      event.stopPropagation();
      clearFileFilter();
    });
    mode.addEventListener("click", () => {
      fileFilter.exclude = !fileFilter.exclude;
      change();
      remember();
    });
    suggest();
    apply();
  }

  // Filtres déjà utilisés, du plus au moins susceptible de resservir : chaque usage compte, les récents
  // davantage. Un filtre d'un seul usage reste proposé le jour même puis disparaît ; un filtre fréquent
  // survit à quelques jours sans usage. Le même principe que la barre d'adresse des navigateurs.
  const FILTER_SUGGESTIONS = 8;
  const FILTERS_KEPT = 30;
  const HOUR_MS = 3600000;

  function filterScore(entry, now) {
    const age = now - entry.last;
    const recency = age < HOUR_MS ? 4 : age < 24 * HOUR_MS ? 2 : age < 7 * 24 * HOUR_MS ? 0.5 : 0.25;
    return entry.count * recency;
  }

  function readFilterHistory() {
    try {
      const saved = JSON.parse(localStorage.getItem(FILE_FILTERS_KEY));
      return Array.isArray(saved) ? saved.filter(e => typeof e?.text === "string" && Number.isFinite(e.count) && Number.isFinite(e.last)) : [];
    } catch (ignored) {
      return [];
    }
  }

  function rememberedFilters() {
    const now = Date.now();
    return readFilterHistory()
      .map(entry => ({ ...entry, score: filterScore(entry, now) }))
      .filter(entry => entry.score >= 1)
      .sort((a, b) => b.score - a.score || b.last - a.last)
      .slice(0, FILTER_SUGGESTIONS);
  }

  function rememberFilter({ text, exclude }) {
    const value = text.trim();
    if (!fileMatchers(value).length) return;
    const now = Date.now();
    const history = readFilterHistory();
    const entry = history.find(e => e.text === value && !!e.exclude === exclude);
    // Rechoisir le filtre déjà affiché, ou sortir du champ sans l'avoir changé, n'en fait pas un usage de plus.
    if (entry && now - entry.last < 60000) return;
    if (entry) {
      entry.count++;
      entry.last = now;
    } else {
      history.push({ text: value, exclude, count: 1, last: now });
    }
    const kept = history.sort((a, b) => filterScore(b, now) - filterScore(a, now)).slice(0, FILTERS_KEPT);
    try {
      localStorage.setItem(FILE_FILTERS_KEY, JSON.stringify(kept));
    } catch (ignored) { /* stockage indisponible : le filtre n'est pas retenu */ }
  }

  // Un filtre par mot, séparés par des espaces ou des virgules ; * vaut n'importe quels caractères, ailleurs
  // dans le chemin. Sensible à la casse dès qu'il contient une majuscule, insensible sinon.
  function fileMatchers(text) {
    return text.trim().split(/[\s,]+/).filter(Boolean).map(term => new RegExp(
      term.split("*").map(part => part.replace(/[.+?^${}()|[\]\\]/g, "\\$&")).join(".*"),
      /\p{Lu}/u.test(term) ? "u" : "iu"
    ));
  }

  function applyFileFilter(title, lines) {
    const matchers = fileMatchers(fileFilter.text);
    let shown = 0;
    for (const [id, line] of lines) {
      const path = line.querySelector("a.d2h-file-name").title;
      const visible = !matchers.length || matchers.some(m => m.test(path)) !== fileFilter.exclude;
      line.hidden = !visible;
      const wrapper = document.getElementById(id);
      if (wrapper) wrapper.hidden = !visible;
      if (visible) shown++;
    }
    title.textContent = title.textContent.replace(/\(.*\)/, `(${matchers.length ? `${shown}/` : ""}${lines.size})`);
    title.parentElement.querySelector(".file-filter input")?.classList.toggle("active", !!matchers.length);
    showPartialDiff(matchers.length && shown < lines.size ? { shown, total: lines.size, filter: fileFilter.text.trim(), exclude: fileFilter.exclude } : null);
  }

  // Bandeau de l'en-tête : le diff affiché n'est pas toute la MR. L'en-tête change de hauteur, que suivent
  // les en-têtes de fichier collés dessous.
  function showPartialDiff(partial) {
    const banner = document.getElementById("partial-diff");
    if (banner.hidden === !partial && !partial) return;
    banner.hidden = !partial;
    if (partial) document.getElementById("partial-diff-text").textContent = texts.partialDiff(partial);
    document.documentElement.style.setProperty("--header-height", `${document.querySelector("header").offsetHeight}px`);
  }

  // Le fichier en haut de l'écran est surligné dans la liste, que le panneau garde en vue.
  function followCurrentFile(container, lines) {
    const visible = new Set();
    let current = null;
    const observer = new IntersectionObserver(entries => {
      for (const entry of entries) {
        if (entry.isIntersecting) visible.add(entry.target);
        else visible.delete(entry.target);
      }
      const top = [...visible].sort((a, b) => a.getBoundingClientRect().top - b.getBoundingClientRect().top)[0];
      const line = top && lines.get(top.id);
      if (!line || line === current) return;
      current?.classList.remove("current");
      line.classList.add("current");
      line.scrollIntoView({ block: "nearest" });
      current = line;
    }, { rootMargin: `-${document.querySelector("header").offsetHeight}px 0px 0px 0px` });
    for (const file of container.querySelectorAll(".d2h-file-wrapper")) observer.observe(file);
  }

  function renderCommits(listScroll) {
    const section = document.getElementById("commits");
    if (commitsError) {
      section.hidden = false;
      section.innerHTML = `<div class="commits-warning">${escapeHtml(texts.commitsFailed(commitsError))}</div>`;
      return;
    }
    if (!commits?.length) return;
    section.hidden = false;
    const selected = i => range && i >= range[0] && i <= range[1];
    const pushStarts = new Map(pushes.map((push, k) => [push.first, k]));
    const items = commits.map((c, i) => {
      const classes = [selected(i) ? "selected" : "", c.merge ? "merge" : "", seenAtOpen >= 0 && i > seenAtOpen ? "new" : ""]
        .filter(Boolean).join(" ");
      const author = Avatars.gitlabName(c.author, c.email ?? "");
      const tooltip = `${c.sha.slice(0, 8)} · ${author} · ${formatDateTime(c.date)}\n${c.title}${c.merge ? `\n${texts.mergeCommit}` : ""}`;
      const push = pushes[pushStarts.get(i)];
      const separator = push
        ? `<li class="push" data-push="${pushStarts.get(i)}" data-tip="${escapeHtml(texts.pushTitle)}">${escapeHtml(texts.push({
          date: formatDateTime(push.date),
          count: push.last - push.first + 1,
        }))}</li>`
        : "";
      return `${separator}<li data-index="${i}"${classes ? ` class="${classes}"` : ""} data-tip="${escapeHtml(tooltip)}">`
        + `<span class="n">${i + 1}</span>`
        + `<span class="avatar" style="--avatar-color:${Avatars.color(author)}" aria-hidden="true">${escapeHtml(Avatars.initials(author))}</span>`
        + `<span class="t">${c.merge ? "⑂ " : ""}${escapeHtml(c.title)}</span>`
        + `<span class="a">${escapeHtml(age(c.date))}</span></li>`;
    }).join("");
    const warning = range && commits.slice(range[0], range[1] + 1).some(c => c.merge)
      ? `<div class="commits-warning">${escapeHtml(texts.mergeWarning)}</div>` : "";
    section.innerHTML = `<div class="commits-head"><strong>${escapeHtml(texts.commits(commits.length))}</strong>`
      + (seenAtOpen >= 0 && seenAtOpen < commits.length - 1
        ? `<button type="button" data-range="new" aria-pressed="${!!range && range[0] === seenAtOpen + 1 && range[1] === commits.length - 1}" title="${escapeHtml(texts.sinceSeenTitle)}">${escapeHtml(texts.sinceSeen(commits.length - 1 - seenAtOpen))}</button>`
        : "")
      + (pushes.length > 1 ? `<button type="button" data-push="${pushes.length - 1}" aria-pressed="${isPush(pushes.length - 1)}" title="${escapeHtml(texts.lastPushTitle)}">${escapeHtml(texts.lastPush)}</button>` : "")
      + `<button type="button" data-range="all" aria-pressed="${!range}" title="${escapeHtml(texts.allTitle)}">${escapeHtml(texts.all)}</button></div>`
      + `<div class="commits-hint">${escapeHtml(texts.hint)}</div>${warning}<ol id="commit-list">${items}</ol>`;
    const list = document.getElementById("commit-list");
    if (listScroll !== null) list.scrollTop = listScroll;
    else list.scrollTop = list.scrollHeight;
    applyCommitsShare(readCommitsShare());
  }

  function readCommitsShare() {
    try {
      const share = Number(localStorage.getItem(COMMITS_SHARE_KEY));
      return share > 0 && share < 1 ? share : null;
    } catch (ignored) {
      return null;
    }
  }

  function saveCommitsShare(share) {
    try {
      if (share === null) localStorage.removeItem(COMMITS_SHARE_KEY);
      else localStorage.setItem(COMMITS_SHARE_KEY, String(share));
    } catch (ignored) { /* stockage indisponible : la répartition n'est pas retenue */ }
  }

  // Part de la hauteur du panneau donnée aux commits ; null : hauteur naturelle, plafonnée par la feuille de style.
  function applyCommitsShare(share) {
    const section = document.getElementById("commits");
    if (!section) return;
    section.style.height = share === null ? "" : `${share * 100}%`;
    section.style.maxHeight = share === null ? "" : "none";
    section.style.flexShrink = share === null ? "" : "0";
  }

  document.addEventListener("pointerdown", event => {
    const split = event.target.closest?.("#split");
    if (!split || event.button !== 0) return;
    event.preventDefault();
    const side = document.getElementById("side");
    const section = document.getElementById("commits");
    const startY = event.clientY;
    const startHeight = section.getBoundingClientRect().height;
    const minHeight = 48;
    const maxHeight = side.clientHeight - split.offsetHeight - 96;
    let share = null;
    split.setPointerCapture(event.pointerId);
    split.classList.add("dragging");
    const move = moveEvent => {
      const height = Math.min(Math.max(startHeight + moveEvent.clientY - startY, minHeight), maxHeight);
      share = height / side.clientHeight;
      applyCommitsShare(share);
    };
    const end = () => {
      split.removeEventListener("pointermove", move);
      split.classList.remove("dragging");
      if (share !== null) saveCommitsShare(share);
    };
    split.addEventListener("pointermove", move);
    split.addEventListener("pointerup", end, { once: true });
    split.addEventListener("pointercancel", end, { once: true });
  });

  document.addEventListener("dblclick", event => {
    if (!event.target.closest?.("#split")) return;
    saveCommitsShare(null);
    applyCommitsShare(null);
  });

  function readEnabled(key) {
    try {
      return localStorage.getItem(key) === "on";
    } catch (ignored) {
      return false;
    }
  }

  function saveEnabled(
    key,
    enabled
  ) {
    try {
      localStorage.setItem(key, enabled ? "on" : "off");
    } catch (ignored) { /* stockage indisponible : le choix n'est pas retenu */ }
  }

  const readNotesEnabled = () => readEnabled(NOTES_KEY);

  // Libellés fixes, pour ne pas décaler les commandes voisines ; les nombres passent dans l'infobulle.
  function renderNotesToggle() {
    const notes = document.getElementById("notes-toggle");
    notes.setAttribute("aria-pressed", String(readNotesEnabled()));
    notes.textContent = texts.notes;
    notes.title = discussions ? `${texts.notesTitle} — ${texts.notesCount(discussions.length)}` : texts.notesTitle;
  }

  // Toutes les pages : GitLab en sert 100 au plus par appel.
  async function loadDiscussions() {
    const project = await gitlabProject();
    const all = [];
    for (let page = 1, pages = 1; page <= pages; page++) {
      const response = await fetch(`gitlab/projects/${project}/merge_requests/${mr.iid}/discussions?per_page=100&page=${page}`);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      pages = Number(response.headers.get("X-Total-Pages")) || 1;
      all.push(...await response.json());
    }
    return all;
  }

  // Rendu GitLab des notes, que l'API REST ne donne pas : sans lui, les notes restent lisibles en texte.
  async function loadNotesHtml() {
    const { gitlabProject: path, gitlabWeb: web } = await config();
    gitlabWeb = web;
    const notes = await GitlabNotes.allNodes(async after => (await GitlabNotes.graphql(`{
      project(fullPath: ${JSON.stringify(path)}) { mergeRequest(iid: ${JSON.stringify(String(mr.iid))}) {
        notes(first: 100${after ? `, after: ${JSON.stringify(after)}` : ""}) { pageInfo { hasNextPage endCursor } nodes { id bodyHtml } }
      } }
    }`)).project.mergeRequest.notes);
    return new Map(notes.map(n => [GitlabNotes.noteId(n.id), n.bodyHtml]));
  }

  async function ensureDiscussions() {
    if (discussions !== null || discussionsError !== null) return;
    document.getElementById("diff-files")
      ?.insertAdjacentHTML("afterbegin", `<p class="notes-status" id="notes-status">${escapeHtml(texts.notesLoading)}</p>`);
    try {
      const [all, html] = await Promise.all([loadDiscussions(), loadNotesHtml().catch(() => new Map())]);
      discussions = all.filter(d => d.notes[0]?.type === "DiffNote" && d.notes[0].position?.position_type === "text");
      notesHtml = html;
    } catch (error) {
      discussionsError = error.message;
    }
    renderNotesToggle();
  }

  async function showNotes() {
    renderNotesToggle();
    await ensureDiscussions();
    render();
  }

  // Fils placés dans le diff, dans l'ordre de lecture ; ceux de l'encart « hors du diff » n'en sont pas.
  // Ceux d'un fichier caché par le filtre n'en sont pas non plus.
  const placedNotes = () => [...document.querySelectorAll("#diff-files tr.note-row .note-thread")]
    .filter(note => !note.closest(".d2h-file-wrapper")?.hidden);

  function renderNotesNav() {
    const nav = document.getElementById("notes-nav");
    const count = placedNotes().length;
    nav.classList.toggle("off", !readNotesEnabled());
    const [previous, next] = nav.querySelectorAll("[data-note-step]");
    previous.title = texts.previousNote;
    next.title = texts.nextNote;
    previous.disabled = currentNote <= 0;
    next.disabled = currentNote >= count - 1;
    document.getElementById("note-position").textContent = `${currentNote < 0 ? "–" : currentNote + 1} / ${count}`;
    document.getElementById("note-position").title = texts.placedNotes(count);
  }

  function goToNote(step) {
    const notes = placedNotes();
    if (!notes.length) return;
    currentNote = Math.min(Math.max(currentNote + step, 0), notes.length - 1);
    notes.forEach((note, i) => note.classList.toggle("current", i === currentNote));
    notes[currentNote].open = true;
    notes[currentNote].scrollIntoView({ block: "start" });
    renderNotesNav();
  }

  // Côté et lignes d'une note : le nouveau fichier quand elle porte sur une ligne ajoutée ou inchangée,
  // l'ancien quand elle porte sur une ligne supprimée. Plusieurs lignes : de la première à celle commentée.
  function notePlace(position) {
    const side = position.new_line != null ? "new" : "old";
    const last = side === "new" ? position.new_line : position.old_line;
    const start = position.line_range?.start;
    const first = (side === "new" ? start?.new_line : start?.old_line) ?? last;
    return { side, first: Math.min(first, last), last, path: side === "new" ? position.new_path : position.old_path };
  }

  // Le côté droit montre le dernier commit dans la vue complète ou une plage qui finit au dernier commit ;
  // le côté gauche, le point de départ de la MR dans la vue complète seulement.
  function sideShowsMrEnds(side) {
    if (!range) return true;
    return side === "new" && !!commits && range[1] === commits.length - 1;
  }

  function threadHtml(discussion, where) {
    const [first, ...replies] = discussion.notes.filter(n => !n.system);
    if (!first) return "";
    const resolvable = discussion.notes.some(n => n.resolvable);
    const resolved = resolvable && discussion.notes.every(n => !n.resolvable || n.resolved);
    const state = resolved ? "resolved" : resolvable ? "unresolved" : "";
    const label = texts.lines(notePlace(first.position));
    const link = /^https:\/\//.test(mr.url)
      ? `<a href="${escapeHtml(`${mr.url}#note_${first.id}`)}" target="_blank" rel="noopener">${escapeHtml(texts.openInGitlab)}</a>` : "";
    const note = n => `<div class="note"><div class="note-meta"><strong>${escapeHtml(n.author?.name ?? "?")}</strong> · `
      + `<span title="${escapeHtml(formatDateTime(n.created_at))}">${escapeHtml(age(n.created_at))}</span></div>`
      + (notesHtml.has(n.id)
        ? `<div class="gl-body">${GitlabNotes.render(notesHtml.get(n.id), gitlabWeb)}</div></div>`
        : `<div class="note-body">${markdown(n.body)}</div></div>`);
    return `<details class="note-thread${state ? ` ${state}` : ""}" data-discussion="${escapeHtml(discussion.id)}"${resolved ? "" : " open"}>`
      + `<summary>${state ? `<span class="badge">${escapeHtml(texts[state])}</span>` : ""}`
      + `<span>${escapeHtml(label)}${replies.length ? ` · ${escapeHtml(texts.replies(replies.length))}` : ""}</span>${link}</summary>`
      + (where ? `<div class="note-where">${escapeHtml(where)}</div>` : "")
      + [first, ...replies].map(note).join("") + GitlabNotes.threadActionsHtml({ resolvable, resolved }, lang) + `</details>`;
  }

  // Le strict nécessaire du markdown GitLab pour lire une note dont GitLab n'a pas donné le rendu : blocs
  // de code, code en ligne, gras.
  // Sur le texte déjà échappé, donc sans HTML venu de la note.
  function markdown(body) {
    return escapeHtml(body).split(/```[^\n]*\n?/).map((part, i) => i % 2
      ? `<pre><code>${part.replace(/\n$/, "")}</code></pre>`
      : part.replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>"))
      .join("");
  }

  // Chemin d'un fichier tel que diff2html l'affiche, renommage « dir/{ancien → nouveau} » compris.
  function wrapperPaths(wrapper) {
    const name = wrapper.querySelector(".d2h-file-header .d2h-file-name")?.textContent.trim() ?? "";
    if (!name.includes("→")) return [name];
    const braces = name.match(/^(.*)\{(.*) → (.*)\}(.*)$/);
    if (braces) return [braces[1] + braces[2] + braces[4], braces[1] + braces[3] + braces[4]].map(p => p.replace("//", "/"));
    return name.split(" → ");
  }

  // Lignes d'un côté d'un fichier, par numéro : le côté gauche ou droit en côte à côte, la colonne
  // ancienne ou nouvelle en ligne à ligne.
  function rowsByLine(wrapper, side) {
    const rows = new Map();
    const sides = wrapper.querySelectorAll(".d2h-file-side-diff");
    if (sides.length === 2) {
      for (const td of sides[side === "new" ? 1 : 0].querySelectorAll("td.d2h-code-side-linenumber")) {
        const n = Number(td.textContent.trim());
        if (n) rows.set(n, td.parentElement);
      }
    } else {
      for (const div of wrapper.querySelectorAll(side === "new" ? ".line-num2" : ".line-num1")) {
        const n = Number(div.textContent.trim());
        if (n) rows.set(n, div.closest("tr"));
      }
    }
    return rows;
  }

  // Ligne de note sous celle commentée ; en côte à côte, une ligne vide de même hauteur en face garde
  // les deux colonnes alignées.
  function insertNoteRow(row, html) {
    const noteRow = document.createElement("tr");
    noteRow.className = "note-row";
    noteRow.innerHTML = `<td colspan="2">${html}</td>`;
    row.after(noteRow);
    const sideDiff = row.closest(".d2h-file-side-diff");
    if (!sideDiff) return null;
    const sides = [...sideDiff.parentElement.querySelectorAll(".d2h-file-side-diff")];
    const other = sides.find(s => s !== sideDiff);
    const index = [...row.parentElement.children].indexOf(row);
    const facing = other?.querySelector("tbody")?.children[index];
    if (!facing) return null;
    const spacer = document.createElement("tr");
    spacer.className = "note-row note-spacer";
    spacer.innerHTML = '<td colspan="2"></td>';
    facing.after(spacer);
    return { noteRow, spacer };
  }

  function alignSpacers(pairs) {
    const heights = pairs.map(p => p.noteRow.offsetHeight);
    pairs.forEach((p, i) => { p.spacer.firstElementChild.style.height = `${heights[i]}px`; });
  }

  function placeNotes(container) {
    document.getElementById("notes-status")?.remove();
    if (discussionsError) {
      container.insertAdjacentHTML("afterbegin", `<p class="message error">${escapeHtml(texts.notesFailed(discussionsError))}</p>`);
      return;
    }
    if (!discussions) return;
    const wrappers = new Map();
    for (const wrapper of container.querySelectorAll(".d2h-file-wrapper")) {
      for (const path of wrapperPaths(wrapper)) wrappers.set(path, wrapper);
    }
    const rowCache = new Map();
    const rows = (wrapper, side) => {
      const key = `${wrapper.id}:${side}`;
      if (!rowCache.has(key)) rowCache.set(key, rowsByLine(wrapper, side));
      return rowCache.get(key);
    };
    const elsewhere = [];
    const pairs = [];
    const perFile = new Map();
    for (const discussion of discussions) {
      const position = discussion.notes[0].position;
      const place = notePlace(position);
      const where = place.path;
      if (latestVersion && position.head_sha !== latestVersion.head_commit_sha) {
        elsewhere.push(threadHtml(discussion, `${where} — ${texts.outdated}`));
        continue;
      }
      if (!sideShowsMrEnds(place.side)) {
        elsewhere.push(threadHtml(discussion, `${where} — ${texts.outOfRange}`));
        continue;
      }
      const wrapper = wrappers.get(place.path);
      const lineRows = wrapper && rows(wrapper, place.side);
      const row = lineRows?.get(place.last);
      if (!row) {
        elsewhere.push(threadHtml(discussion, `${where} — ${texts.notShown}`));
        continue;
      }
      for (let n = place.first; n <= place.last; n++) lineRows.get(n)?.classList.add("note-line");
      const pair = insertNoteRow(row, threadHtml(discussion));
      if (pair) pairs.push(pair);
      perFile.set(wrapper.id, (perFile.get(wrapper.id) ?? 0) + 1);
    }
    // Un fil tient dans la partie visible de sa colonne, même quand des lignes longues l'élargissent.
    const column = container.querySelector(".d2h-file-side-diff, .d2h-file-diff");
    if (column) container.style.setProperty("--note-column", `${column.clientWidth}px`);
    alignSpacers(pairs);
    notesObserver?.disconnect();
    notesObserver = new ResizeObserver(() => alignSpacers(pairs));
    pairs.forEach(pair => notesObserver.observe(pair.noteRow));
    for (const [id, count] of perFile) {
      document.querySelector(`#files a.d2h-file-name[href="#${CSS.escape(id)}"] .file-base`)
        ?.insertAdjacentHTML("beforeend", `<span class="file-notes">💬 ${count}</span>`);
    }
    if (elsewhere.length) {
      container.insertAdjacentHTML("afterbegin", `<details class="notes-elsewhere"><summary>${escapeHtml(texts.notesElsewhere(elsewhere.length))}</summary>${elsewhere.join("")}</details>`);
    }
    currentNote = -1;
    renderNotesNav();
  }

  // Fil relu dans GitLab après une réponse ou une résolution, et réaffiché à sa place.
  async function refreshThread(id) {
    const project = await gitlabProject();
    const [response, html] = await Promise.all([
      fetch(`gitlab/projects/${project}/merge_requests/${mr.iid}/discussions/${id}`),
      loadNotesHtml().catch(() => notesHtml),
    ]);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const discussion = await response.json();
    notesHtml = html;
    discussions = discussions.map(d => d.id === id ? discussion : d);
    const thread = document.querySelector(`#diff-files [data-discussion="${CSS.escape(id)}"]`);
    if (!thread) return;
    const current = thread.classList.contains("current");
    thread.outerHTML = threadHtml(discussion, thread.querySelector(".note-where")?.textContent);
    if (current) document.querySelector(`#diff-files [data-discussion="${CSS.escape(id)}"]`)?.classList.add("current");
  }

  // Une note se pose sur le diff que GitLab connaît : celui de sa dernière version, que la page montre
  // en entier, sans plage de commits, quand le clone local est à jour.
  function canComment() {
    return readNotesEnabled() && discussions !== null && !range && !mr.merge && !!latestVersion
      && commits?.at(-1)?.sha === latestVersion.head_commit_sha;
  }

  // Numéros d'une ligne du diff : l'ancien pour une ligne supprimée, le nouveau pour une ligne ajoutée,
  // les deux pour une ligne inchangée ; type au sens de GitLab, « new » pour une ligne ajoutée, sinon « old ».
  function lineOf(row) {
    const number = (r, selector) => Number(r?.querySelector(selector)?.textContent.trim()) || null;
    const sideDiff = row.closest(".d2h-file-side-diff");
    const cell = row.querySelector(sideDiff ? "td.d2h-code-side-linenumber" : "td.d2h-code-linenumber");
    if (!cell) return null;
    let old;
    let current;
    if (sideDiff) {
      const index = [...row.parentElement.children].indexOf(row);
      const [left, right] = [...sideDiff.parentElement.querySelectorAll(".d2h-file-side-diff tbody")].map(t => t.children[index]);
      old = number(left, "td.d2h-code-side-linenumber");
      current = number(right, "td.d2h-code-side-linenumber");
    } else {
      old = number(row, ".line-num1");
      current = number(row, ".line-num2");
    }
    if (cell.classList.contains("d2h-ins")) return current && { old: null, new: current, type: "new" };
    if (cell.classList.contains("d2h-del")) return old && { old, new: null, type: "old" };
    if (cell.classList.contains("d2h-cntx")) return old && current && { old, new: current, type: "old" };
    return null;
  }

  function selectedRows() {
    const rows = [...selection.tbody.children];
    const [from, to] = [rows.indexOf(selection.anchor), rows.indexOf(selection.end)].sort((a, b) => a - b);
    return rows.slice(from, to + 1).filter(row => lineOf(row));
  }

  function selectLine(row, extend) {
    if (!canComment() || !lineOf(row)) return;
    const draft = selection?.editor?.noteRow.querySelector("textarea").value ?? "";
    if (extend && selection?.tbody === row.parentElement) selection.end = row;
    else {
      closeEditor();
      selection = { tbody: row.parentElement, anchor: row, end: row };
    }
    openEditor(draft);
  }

  function closeEditor() {
    if (!selection) return;
    for (const row of selection.tbody.querySelectorAll("tr.note-selected")) row.classList.remove("note-selected");
    selection.editor?.noteRow.remove();
    selection.editor?.spacer?.remove();
    selection.editor?.observer.disconnect();
    selection = null;
  }

  function openEditor(draft) {
    for (const row of selection.tbody.querySelectorAll("tr.note-selected")) row.classList.remove("note-selected");
    selection.editor?.noteRow.remove();
    selection.editor?.spacer?.remove();
    selection.editor?.observer.disconnect();
    const rows = selectedRows();
    rows.forEach(row => row.classList.add("note-selected"));
    const [first, last] = [lineOf(rows[0]), lineOf(rows.at(-1))];
    const side = last.new ? "new" : "old";
    const label = texts.newNote({ first: first[side] ?? first.new ?? first.old, last: last[side] });
    const pair = insertNoteRow(
      rows.at(-1),
      `<form class="note-editor"><div class="note-meta">${escapeHtml(label)}</div>`
      + `<textarea placeholder="${escapeHtml(texts.notePlaceholder)}"></textarea>`
      + `<div class="note-editor-actions"><span class="note-editor-error"></span>`
      + `<button type="button" data-editor-cancel>${escapeHtml(texts.cancelNote)}</button>`
      + `<button type="submit">${escapeHtml(texts.publishNote)}</button></div></form>`
    );
    const noteRow = pair?.noteRow ?? rows.at(-1).nextElementSibling;
    // Le champ grandit à la saisie : la ligne vide d'en face suit.
    const observer = new ResizeObserver(() => {
      if (pair) pair.spacer.firstElementChild.style.height = `${noteRow.offsetHeight}px`;
    });
    observer.observe(noteRow);
    selection.editor = { noteRow, spacer: pair?.spacer, observer };
    const textarea = noteRow.querySelector("textarea");
    textarea.value = draft;
    textarea.focus();
  }

  async function sha1(text) {
    const digest = await crypto.subtle.digest("SHA-1", new TextEncoder().encode(text));
    return [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2, "0")).join("");
  }

  // Position au format de l'API GitLab, sur la dernière version de la MR ; une plage désigne ses deux
  // extrémités par leur line_code, empreinte du chemin suivie des deux numéros, 0 pour celui qui manque.
  async function notePosition(rows) {
    const paths = wrapperPaths(rows[0].closest(".d2h-file-wrapper"));
    const [first, last] = [lineOf(rows[0]), lineOf(rows.at(-1))];
    const position = {
      base_sha: latestVersion.base_commit_sha,
      start_sha: latestVersion.start_commit_sha,
      head_sha: latestVersion.head_commit_sha,
      old_path: paths[0],
      new_path: paths.at(-1),
      old_line: last.old,
      new_line: last.new,
    };
    if (rows.length === 1) return position;
    const hash = await sha1(position.new_path);
    const end = line => ({ line_code: `${hash}_${line.old ?? 0}_${line.new ?? 0}`, type: line.type, old_line: line.old, new_line: line.new });
    return { ...position, line_range: { start: end(first), end: end(last) } };
  }

  async function publishNote(form) {
    const body = form.querySelector("textarea").value;
    if (!body.trim()) return;
    const current = selection;
    const rows = selectedRows();
    const error = form.querySelector(".note-editor-error");
    const buttons = form.querySelectorAll("button, textarea");
    buttons.forEach(b => { b.disabled = true; });
    error.textContent = texts.publishing;
    try {
      const response = await fetch("gitlab/discussion", {
        method: "POST",
        headers: { "X-MR-Dashboard": "1", "Content-Type": "application/json" },
        body: JSON.stringify({ iid: Number(mr.iid), body, position: await notePosition(rows) }),
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(result.message ?? result.error ?? `HTTP ${response.status}`);
      discussions.push(result);
      rows.forEach(row => row.classList.replace("note-selected", "note-line"));
      current.editor.noteRow.firstElementChild.innerHTML = threadHtml(result);
      if (selection === current) selection = null;
      renderNotesToggle();
      renderNotesNav();
    } catch (failure) {
      buttons.forEach(b => { b.disabled = false; });
      error.textContent = texts.publishFailed(Array.isArray(failure.message) ? failure.message.join(", ") : failure.message);
    }
  }

  const seenKey = () => `mr-dashboard.diffSeen.${mr.iid}`;

  function readSeen() {
    try {
      return commits.findIndex(c => c.sha === localStorage.getItem(seenKey()));
    } catch (ignored) {
      return -1;
    }
  }

  // Retient le commit le plus récent affiché, sans jamais reculer : relire un vieux commit ne rend pas
  // les suivants nouveaux.
  function markSeen() {
    if (!commits?.length) return;
    const shown = range ? range[1] : commits.length - 1;
    if (shown <= readSeen()) return;
    try {
      localStorage.setItem(seenKey(), commits[shown].sha);
    } catch (ignored) { /* stockage indisponible : rien n'est retenu */ }
  }

  const isPush = k => !!range && range[0] === pushes[k].first && range[1] === pushes[k].last;

  // Chaque version GitLab de la MR finit par le commit poussé en dernier : les commits jusqu'à lui,
  // depuis le push précédent, sont arrivés ensemble. Une version d'avant un rebase ne correspond à
  // aucun commit et se fond dans la suivante. Sans GitLab, pas de groupes : la liste reste utilisable.
  let configPromise = null;
  function config() {
    configPromise ??= fetch("config").then(r => r.json());
    return configPromise;
  }
  const gitlabProject = () => config().then(c => encodeURIComponent(c.gitlabProject));

  async function loadPushes() {
    try {
      const project = await gitlabProject();
      const versions = JSON.parse(await fetchText(`gitlab/projects/${project}/merge_requests/${mr.iid}/versions`));
      const heads = new Map(versions.map(v => [v.head_commit_sha, v.created_at]));
      latestVersion = versions.reduce((a, b) => (a && a.created_at > b.created_at ? a : b), null);
      let first = 0;
      const found = [];
      commits.forEach((c, i) => {
        if (!heads.has(c.sha)) return;
        found.push({ first, last: i, date: heads.get(c.sha) });
        first = i + 1;
      });
      if (found.length && first < commits.length) found.push({ first, last: commits.length - 1, date: commits.at(-1).date });
      pushes = found;
    } catch (ignored) {
      pushes = [];
    }
  }

  // « 3 h », « 2 j » : de quoi situer un commit dans la vie de la MR.
  function age(iso) {
    const minutes = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));
    if (minutes < 60) return `${minutes} min`;
    if (minutes < 48 * 60) return `${Math.round(minutes / 60)} h`;
    return `${Math.round(minutes / 1440)} ${lang === "fr" ? "j" : "d"}`;
  }

  function renderRangeLabel() {
    const label = document.getElementById("range");
    label.textContent = range && commits
      ? ` — ${texts.range({ first: range[0] + 1, last: range[1] + 1, total: commits.length })}`
      : "";
  }

  // Plage dans l'adresse : un rechargement ou un lien partagé rouvre la même.
  function writeRangeToUrl() {
    const url = new URL(location.href);
    if (range) {
      url.searchParams.set("first", commits[range[0]].sha);
      url.searchParams.set("last", commits[range[1]].sha);
    } else {
      url.searchParams.delete("first");
      url.searchParams.delete("last");
    }
    history.replaceState(null, "", url);
  }

  function selectRange(next) {
    range = next;
    writeRangeToUrl();
    renderRangeLabel();
    loadDiff();
  }

  function renderHeader() {
    document.documentElement.lang = lang;
    const title = mr.title ? `!${mr.iid} ${mr.title}` : texts.title(mr);
    document.title = title;
    document.getElementById("title").textContent = title;
    const branches = mr.merge ? texts.mergedBranches : texts.branches;
    document.getElementById("branches").innerHTML = branches({ branch: escapeHtml(mr.branch), target: escapeHtml(mr.target) })
      + '<span id="range"></span>';
    document.getElementById("side-by-side").textContent = texts.sideBySide;
    document.getElementById("line-by-line").textContent = texts.lineByLine;
    document.getElementById("text-size").title = texts.textSize;
    const [smaller, larger] = document.querySelectorAll("[data-text-step]");
    smaller.setAttribute("aria-label", texts.smaller);
    larger.setAttribute("aria-label", texts.larger);
    const comments = document.getElementById("comments-link");
    comments.textContent = texts.comments;
    comments.title = texts.commentsTitle;
    comments.href = `comments.html?${new URLSearchParams({ iid: mr.iid, lang })}`;
    comments.dataset.iid = mr.iid;
    const close = document.getElementById("close-tab");
    close.textContent = texts.close;
    close.title = texts.closeTitle;
    close.dataset.closeRefused = texts.closeRefused;
    const showAll = document.getElementById("partial-diff-clear");
    showAll.textContent = texts.showAllFiles;
    showAll.addEventListener("click", () => clearFileFilter?.());
    const gitlab = document.getElementById("gitlab");
    if (/^https:\/\//.test(mr.url)) {
      gitlab.href = `${mr.url}/diffs`;
      gitlab.textContent = texts.gitlab;
      gitlab.hidden = false;
    }
    document.getElementById("loading").textContent = texts.loading;
    applyTextScale(readTextScale());
  }

  function mrQuery() {
    return new URLSearchParams(mr.merge
      ? { iid: mr.iid, head: mr.head, merge: mr.merge, target: mr.target }
      : { branch: mr.branch, target: mr.target });
  }

  async function fetchText(url) {
    const response = await fetch(url);
    if (!response.ok) {
      const body = await response.json().catch(() => ({}));
      throw new Error(body.message || `HTTP ${response.status}`);
    }
    return response.text();
  }

  async function load() {
    if (!mr.branch || !mr.target) {
      showMessage(texts.invalid, true);
      return;
    }
    try {
      commits = JSON.parse(await fetchText(`git/commits?${mrQuery()}`));
    } catch (error) {
      commitsError = error.message;
    }
    const first = params.get("first");
    const last = params.get("last");
    const shas = commits?.map(c => c.sha) ?? [];
    if (first && last && shas.includes(first) && shas.indexOf(first) <= shas.indexOf(last)) {
      range = [shas.indexOf(first), shas.indexOf(last)];
      anchor = range[0];
    }
    renderRangeLabel();
    if (commits?.length) {
      seenAtOpen = readSeen();
      await loadPushes();
    }
    if (readNotesEnabled()) await ensureDiscussions();
    await loadDiff();
  }

  async function loadDiff() {
    const seq = ++loadSeq;
    const query = mrQuery();
    if (range) {
      query.set("first", commits[range[0]].sha);
      query.set("last", commits[range[1]].sha);
    }
    let text;
    try {
      text = await fetchText(`git/diff?${query}`);
    } catch (error) {
      if (seq === loadSeq) showMessage(texts.failed(error.message), true);
      return;
    }
    if (seq !== loadSeq) return;
    diffText = text;
    render();
    markSeen();
  }

  // Infobulle des éléments [data-tip], après le même court délai que celle du navigateur ; tout défilement,
  // clic ou sortie de l'élément la ferme.
  const tip = Object.assign(document.createElement("div"), { className: "tip", hidden: true });
  tip.setAttribute("role", "tooltip");
  document.body.append(tip);
  let tipOwner = null;
  let tipTimer = 0;

  function hideTip() {
    clearTimeout(tipTimer);
    tipOwner = null;
    tip.hidden = true;
  }

  function showTip(owner) {
    tip.textContent = owner.dataset.tip;
    tip.hidden = false;
    const box = owner.getBoundingClientRect();
    const below = box.bottom + 4;
    tip.style.top = `${below + tip.offsetHeight > innerHeight ? box.top - tip.offsetHeight - 4 : below}px`;
    tip.style.left = `${Math.max(4, Math.min(box.left, innerWidth - tip.offsetWidth - 4))}px`;
  }

  document.addEventListener("mouseover", e => {
    const owner = e.target.closest("[data-tip]");
    if (owner === tipOwner) return;
    hideTip();
    if (!owner) return;
    tipOwner = owner;
    tipTimer = setTimeout(() => showTip(owner), 500);
  });
  document.addEventListener("mousedown", hideTip);
  document.addEventListener("scroll", hideTip, true);
  document.documentElement.addEventListener("mouseleave", hideTip);

  document.getElementById("diff").addEventListener("click", e => {
    const lineNumber = e.target.closest("#diff-files td.d2h-code-side-linenumber, #diff-files td.d2h-code-linenumber");
    if (lineNumber) {
      if (e.shiftKey) getSelection()?.removeAllRanges();
      selectLine(lineNumber.parentElement, e.shiftKey);
      return;
    }
    if (e.target.closest("[data-editor-cancel]")) {
      closeEditor();
      return;
    }
    if (e.target.closest("[data-range='new']")) {
      anchor = seenAtOpen + 1;
      selectRange([seenAtOpen + 1, commits.length - 1]);
      return;
    }
    if (e.target.closest("[data-range='all']")) {
      anchor = null;
      selectRange(null);
      return;
    }
    const push = e.target.closest("[data-push]");
    if (push) {
      const { first, last } = pushes[Number(push.dataset.push)];
      anchor = first;
      selectRange([first, last]);
      return;
    }
    const item = e.target.closest("#commit-list li[data-index]");
    if (!item) return;
    const index = Number(item.dataset.index);
    if (e.shiftKey && anchor !== null) {
      selectRange([Math.min(anchor, index), Math.max(anchor, index)]);
    } else {
      anchor = index;
      selectRange([index, index]);
    }
  });

  GitlabNotes.handleThreads(document.getElementById("diff"), { iid: mr.iid, lang, refresh: refreshThread });
  document.getElementById("diff").addEventListener("submit", e => {
    if (!e.target.matches(".note-editor")) return;
    e.preventDefault();
    publishNote(e.target);
  });
  document.getElementById("diff").addEventListener("keydown", e => {
    const form = e.target.closest?.(".note-editor");
    if (!form) return;
    if (e.key === "Escape") closeEditor();
    else if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) form.requestSubmit();
  });
  document.getElementById("format").addEventListener("click", e => {
    const button = e.target.closest("[data-format]");
    if (!button) return;
    saveFormat(button.dataset.format);
    render();
  });
  document.getElementById("text-size").addEventListener("click", e => {
    const button = e.target.closest("[data-text-step]");
    if (button) changeTextScale(Number(button.dataset.textStep));
  });
  // A− / A+ du dashboard, ou de la page dans un autre onglet : appliqués aussitôt.
  addEventListener("storage", e => {
    if (e.key === DASHBOARD_TEXT_SCALE_KEY) {
      if (e.newValue) document.documentElement.style.setProperty("--text-scale", e.newValue);
      else document.documentElement.style.removeProperty("--text-scale");
    }
    if (e.key === DASHBOARD_TEXT_SCALE_KEY || e.key === TEXT_SCALE_KEY) applyTextScale(readTextScale());
  });
  document.getElementById("notes-toggle").addEventListener("click", () => {
    const enabled = !readNotesEnabled();
    saveEnabled(NOTES_KEY, enabled);
    if (enabled) showNotes();
    else {
      currentNote = -1;
      renderNotesToggle();
      render();
      renderNotesNav();
    }
  });
  document.getElementById("notes-nav").addEventListener("click", e => {
    const button = e.target.closest("[data-note-step]");
    if (button) goToNote(Number(button.dataset.noteStep));
  });
  renderHeader();
  renderNotesToggle();
  load();
</script>
</body>
</html>
